些特点，即表示移动、变化等。这个句子中的“标记出来”有明显的变化的意义。","id":"q0470","cat":"choice","section":"应用练习","bookPage":167,"key":"yingyong-4-选择恰当的词语填空-8"},{"lesson":4,"num":9,"sub":"选择恰当的词语填空","stem":"在这次事故中，有20人＿＿＿夺去了生命，家属希望有关部门做出解释。","word":null,"options":{"A":"让","B":"把","C":"叫","D":"被"},"answer":"D","analysis":"与第(4)、(5)题相同，只有“被”符合被动句的要求。一定要记住，在汉语的实际应用中，介词的后边都应该有名词性的宾语，只有“被”是例外。","id":"q0471","cat":"choice","section":"应用练习","bookPage":167,"key":"yingyong-4-选择恰当的词语填空-9"},{"lesson":4,"num":10,"sub":"选择恰当的词语填空","stem":"我的录音笔不见了，原来＿＿＿大卫拿去用了。","word":null,"options":{"A":"让","B":"把","C":"为","D":"由"},"answer":"A","analysis":"“让”在这个句子中是“被”的意思，表示被动。口语中也多用作“叫”。这不能选择“把”，因为，全句的主语是“录音笔”，而“拿”“录音笔”的是“大","id":"q0472","cat":"choice","section":"应用练习","bookPage":167,"key":"yingyong-4-选择恰当的词语填空-10"},{"lesson":5,"num":1,"sub":"在下列句子中的空格处填上适当的补语","stem":"他不一会儿就把书柜里的书摆＿＿＿了。","answers":["他不一会儿就把书柜里的书摆好了。","他不一会儿就把书柜里的书摆整齐了。","他不一会儿就把书柜里的书摆完了。"],"analysis":"“把”字句中的动词应该有结果补语等成分，“摆”的结果可以有很多，我们这里选择的几个词语都是比较适合与“摆”搭配的词语。","id":"q0473","cat":"fill","section":"应用练习","bookPage":170,"key":"yingyong-5-在下列句子中的空格处填上适当的补语-1"},{"lesson":5,"num":2,"sub":"在下列句子中的空格处填上适当的补语","stem":"把这次考试的要求讲＿＿＿、讲，大家才能做","answers":["把这次考试的要求讲清楚、讲明白，大家才能做好。","把这次考试的要求讲仔细、讲完全，大家才能做对。"],"analysis":"“讲”的结果一般应该是“清楚、明白、完全”等词语，而“做”的结果除了“好、对”以外，还可以用“出来、正确”等。","id":"q0474","cat":"fill","section":"应用练习","bookPage":171,"key":"yingyong-5-在下列句子中的空格处填上适当的补语-2"},{"lesson":5,"num":3,"sub":"在下列句子中的空格处填上适当的补语","stem":"刚下过雨，路上不小心摔＿＿＿了。","answers":["刚下过雨，路上不小心摔倒了。","刚下过雨，路上不小心摔伤了。","刚下过雨，路上不小心摔坏了。"],"analysis":"“摔”的结果还可以用“死、掉、碎”等，但是不符合这个句子的意思，因此不能选用。","id":"q0475","cat":"fill","section":"应用练习","bookPage":171,"key":"yingyong-5-在下列句子中的空格处填上适当的补语-3"},{"lesson":5,"num":4,"sub":"在下列句子中的空格处填上适当的补语","stem":"是老刘去火车站把小张接＿＿＿的。","answers":["是老刘去火车站把小张接回来的。","是老刘去火车站把小张接走的。","是老刘去火车站把小张接回去的。"],"analysis":"“接”的补语也可以有很多，但我们提供的都是比较常用的，也比较容易理解。这里如果用“到、受、收”就错了。","id":"q0476","cat":"fill","section":"应用练习","bookPage":171,"key":"yingyong-5-在下列句子中的空格处填上适当的补语-4"},{"lesson":5,"num":5,"sub":"在下列句子中的空格处填上适当的补语","stem":"他转＿＿＿身子＿＿＿，一步步地向我走","answers":["他转过身子来，一步步地向我走来。","可个    他转回身子来，一步步地向我走过来。"],"analysis":"因为句子的后半部分告诉我们的是“向我走”，因此，前边一定是“转过/回…来”，也正因为是“向我……”，后边必须是“走来、走过来”。必须注意，汉语趋向补语中“…来”是面向说话者的动作。","id":"q0477","cat":"fill","section":"应用练习","bookPage":171,"key":"yingyong-5-在下列句子中的空格处填上适当的补语-5"},{"lesson":5,"num":6,"sub":"在下列句子中的空格处填上适当的补语","stem":"开学刚刚三个星期，他就交了几个好朋友。","answers":["开学刚刚三个星期，他就交上了几个好朋友。"],"analysis":"“上”做结果补语表示动作产生了某种结果，相同用法的还有“爱上、喜欢上、恋上”等。","id":"q0478","cat":"fill","section":"应用练习","bookPage":171,"key":"yingyong-5-在下列句子中的空格处填上适当的补语-6"},{"lesson":5,"num":7,"sub":"在下列句子中的空格处填上适当的补语","stem":"我的手机号码这么长，你记＿＿＿吗？","answers":["我的手机号码这么长，你记得住吗？","我的手机号码这么长，你记住了吗？","我的手机号码这么长，你记得清楚吗？","我的手机号码这么长，你记得下来吗？"],"analysis":"无论是结果补语还是可能补语，“记”的补语一般都是“住、清楚、下来”等，还可以是表示处所的词语，如“在本子上、在纸上”等。","id":"q0479","cat":"fill","section":"应用练习","bookPage":171,"key":"yingyong-5-在下列句子中的空格处填上适当的补语-7"},{"lesson":5,"num":8,"sub":"在下列句子中的空格处填上适当的补语","stem":"你连路都走，能跟我们爬香山吗？","answers":["你连路都走不动，能跟我们爬香山吗？","你连路都走不了，能跟我们爬香山吗？"],"analysis":"“走不动、走不了”的意思比较接近，都可以是“不能走”，这也正好是说话者怀疑“你能跟我们爬香山”的原因。","id":"q0480","cat":"fill","section":"应用练习","bookPage":171,"key":"yingyong-5-在下列句子中的空格处填上适当的补语-8"},{"lesson":5,"num":9,"sub":"在下列句子中的空格处填上适当的补语","stem":"会议室太小了，坐这么多人。","answers":["会议室太小了，坐不下这么多人。","会议室太小了，坐不了这么多人。"],"analysis":"“坐不下、坐不了”都表示“不能容纳”，也就是地方小的意思。","id":"q0481","cat":"fill","section":"应用练习","bookPage":172,"key":"yingyong-5-在下列句子中的空格处填上适当的补语-9"},{"lesson":5,"num":10,"sub":"在下列句子中的空格处填上适当的补语","stem":"她眼睛不好，坐在教室后边看＿＿＿","answers":["她眼睛不好，坐在教室后边看不清楚。"],"analysis":"有人可能会用“看不见”，但最好是“看不清楚”。因为“看不见”有两种可能：一是眼睛真的坏了；二是根本就不存在东西。但句子的实际情况是“眼睛不好”，而且确实存在东西可看，只是“看不清楚”。请仔细加以体会。","id":"q0482","cat":"fill","section":"应用练习","bookPage":172,"key":"yingyong-5-在下列句子中的空格处填上适当的补语-10"},{"lesson":5,"num":1,"sub":"给词语选择恰当的位置","stem":"外边下雨了，A快B进C来D吧。","word":"屋里","options":null,"answer":"C","analysis":"在趋向补语中动词如果带有处所宾语，这个宾语应该放在表示趋向的“来、去”之前，这一条一定不能忘！不少学习者喜欢把“屋里”放在D处，错！","id":"q0483","cat":"pos","section":"应用练习","bookPage":172,"key":"yingyong-5-给词语选择恰当的位置-1"},{"lesson":5,"num":2,"sub":"给词语选择恰当的位置","stem":"伴随着优美的旋律，各国运动员A阔步B走C了体育场D。","word":"进","options":null,"answer":"C","analysis":"“进”是“走”的结果和趋向，当然应该紧跟“走”。应该注意的是，这个句子中没有出现“来、去”，因此，可能会有学习者把“进”放在句尾，即“体育场”后，这是错误的。","id":"q0484","cat":"pos","section":"应用练习","bookPage":172,"key":"yingyong-5-给词语选择恰当的位置-2"},{"lesson":5,"num":3,"sub":"给词语选择恰当的位置","stem":"等A他取B了钱跑C商店的时候，商店早就已经关D门了。","word":"到","options":null,"answer":"C","analysis":"从语法上说，句子中A、B两个位置都可以用“到”，但是，C的前后分别是“跑”和“商店”，而这两个词语之间必须有一个介词，也就是说，C是必须用“到”的地方。","id":"q0485","cat":"pos","section":"应用练习","bookPage":172,"key":"yingyong-5-给词语选择恰当的位置-3"},{"lesson":5,"num":4,"sub":"给词语选择恰当的位置","stem":"我们大家都看见张老师A走B进C教室D了。","word":"去","options":null,"answer":"D","analysis":"“教室”是表示处所的宾语，在趋向补语中，只能放在“来、去”之前，也就是说，在带有趋向补语的句子中，表示趋向的词语“来、去”只能放在处所宾语之后。因此，D是唯一正确的选择。","id":"q0486","cat":"pos","section":"应用练习","bookPage":172,"key":"yingyong-5-给词语选择恰当的位置-4"},{"lesson":5,"num":5,"sub":"给词语选择恰当的位置","stem":"自从离开家乡A以后，我已经有十来年B没回C家乡D了。","word":"来","options":null,"answer":"D","analysis":"和上一个句子一样，“来”在句子中只能放在处所词语之后。应该特别注意“回来家乡、进去教室、下去楼”等错误的用法。","id":"q0487","cat":"pos","section":"应用练习","bookPage":172,"key":"yingyong-5-给词语选择恰当的位置-5"},{"lesson":5,"num":6,"sub":"给词语选择恰当的位置","stem":"我是亲眼A看见他们一起走B进C图书馆D的。","word":"去","options":null,"answer":"D","analysis":"还需要再重复一次：个“来、去”在趋向补语中，如果动词有处所宾语，必须用在宾语之后。","id":"q0488","cat":"pos","section":"应用练习","bookPage":173,"key":"yingyong-5-给词语选择恰当的位置-6"},{"lesson":5,"num":7,"sub":"给词语选择恰当的位置","stem":"不久他就看A了一个比他B大十岁的女人并跟C她结D了婚。","word":"上","options":null,"answer":"A","analysis":"“看上、爱上”等都是表示动作结果的动补结构。“跟上”、“结上婚”在句子中都不是正确的用法。","id":"q0489","cat":"pos","section":"应用练习","bookPage":173,"key":"yingyong-5-给词语选择恰当的位置-7"},{"lesson":5,"num":8,"sub":"给词语选择恰当的位置","stem":"我A哪知道B他竟然C会做D这种可笑又可气的事啊。","word":"出","options":null,"answer":"D","analysis":"“出”等于“出来”，在句子中作补语，一般只能放在动词之后，而“知道”这个比较特殊的动词是不能加任何补语的。正确答案当然只能是D。","id":"q0490","cat":"pos","section":"应用练习","bookPage":173,"key":"yingyong-5-给词语选择恰当的位置-8"},{"lesson":5,"num":9,"sub":"给词语选择恰当的位置","stem":"有人说国产空调A过B关，买C回来没几天就不能用了，可我的已经D用了三四年了。","word":"不","options":null,"answer":"A","analysis":"“过关”是动宾关系，“不”不能插入其中；“买回来”是一种结果，与后边的内容搭配恰当，也不能插入“不”；“已经用了三四年”与前边“不能用”对比出现，“不”当然不可能插入其中。因此，“不”唯一可以用的地方就是“A”一一因为“不过关”，所以才有“不能用”。","id":"q0491","cat":"pos","section":"应用练习","bookPage":173,"key":"yingyong-5-给词语选择恰当的位置-9"},{"lesson":5,"num":10,"sub":"给词语选择恰当的位置","stem":"这孩子学习A路子不错，只要考B上，就是将来读C博士我也供D他。","word":"得","options":null,"answer":"B","analysis":"“学校”与“路子”之间如果用，也应该用“的”，而不是“得”；“读博士、供他”都是动宾关系，不需要“得”。正确答案是“B”，可能补语，强调“考上”的可能。","id":"q0492","cat":"pos","section":"应用练习","bookPage":173,"key":"yingyong-5-给词语选择恰当的位置-10"},{"lesson":5,"num":1,"sub":"选择恰当的词语填空","stem":"董事长早上突然生病住进了医院，下午的股东会没有＿＿＿。","word":null,"options":{"A":"开好","B":"开成","C":"成功","D":"开完"},"answer":"B","analysis":"“开好、开完”都表示“股东会”已经进行了，只是进行得不顺利。但是，实际上是“董事长”没有来，“没有开成”就是“没有开”。","id":"q0493","cat":"choice","section":"应用练习","bookPage":173,"key":"yingyong-5-选择恰当的词语填空-1"},{"lesson":5,"num":2,"sub":"选择恰当的词语填空","stem":"记得小时候有一次买本子回来，妈妈硬让我把多找的钱＿＿＿。","word":null,"options":{"A":"给商店还回去","B":"还回给商店去","C":"还给商店回去","D":"回去给商店还"},"answer":"A","analysis":"同样是复合趋向补语，但是处所宾语已经由介词“给”提到了动词之前，因此，正确答案只能是A。句子中的“买本子回来”与本课介绍的复合趋向补语不一样，这里只是一个连动句，即“买本子”以后“回家来”。","id":"q0494","cat":"choice","section":"应用练习","bookPage":174,"key":"yingyong-5-选择恰当的词语填空-2"},{"lesson":5,"num":3,"sub":"选择恰当的词语填空","stem":"俗话说得好，“便宜没好货”，你那些2元店买的东西＿＿＿。","word":null,"options":{"A":"不好了","B":"好不了","C":"好得了","D":"得好了"},"answer":"B","analysis":"“好不了”是“不可能好”，最符合句子的意思。","id":"q0495","cat":"choice","section":"应用练习","bookPage":174,"key":"yingyong-5-选择恰当的词语填空-3"},{"lesson":5,"num":4,"sub":"选择恰当的词语填空","stem":"她才刚刚十几岁，一个人肯定照顾＿＿＿这么多的孩子。","word":null,"options":{"A":"不过","B":"不了","C":"不及","D":"不得"},"answer":"B","analysis":"“不了”是“不能”的意思，“照顾不了”就是“不能照顾”。“不过”如果是“不过来”也可以用，但事实上不是这样。","id":"q0496","cat":"choice","section":"应用练习","bookPage":174,"key":"yingyong-5-选择恰当的词语填空-4"},{"lesson":5,"num":5,"sub":"选择恰当的词语填空","stem":"有些中老年人的思想早就＿＿＿时代的发展了，应该尽快更新观念。","word":null,"options":{"A":"不跟上","B":"跟不上","C":"跟得不上","D":"不跟得上"},"answer":"B","analysis":"可能补语的形式是“动+得/不+动/形”，因此，B是正确答案。","id":"q0497","cat":"choice","section":"应用练习","bookPage":174,"key":"yingyong-5-选择恰当的词语填空-5"},{"lesson":5,"num":6,"sub":"选择恰当的词语填空","stem":"“忠言逆耳利于行”，你不能谁的话都听不＿＿＿。","word":null,"options":{"A":"起来","B":"下来","C":"进来","D":"进去"},"answer":"D","analysis":"声音是从外到内，因此应该用“进去”。有人喜欢用“进来”，这是不对的，因为你不可能在你自己的耳朵里边啊！","id":"q0498","cat":"choice","section":"应用练习","bookPage":174,"key":"yingyong-5-选择恰当的词语填空-6"},{"lesson":5,"num":7,"sub":"选择恰当的词语填空","stem":"近几年工资是增加了不少，但普通家庭还是＿＿＿轿车。","word":null,"options":{"A":"买得起","B":"买不起","C":"买得来","D":"买不来"},"answer":"B","analysis":"“买不起”表示没有能力购买，符合句子意思。句中“是”有“虽然”或“尽管”的意思，即“增加是增加”，“还是”与之搭配，即结果不变。","id":"q0499","cat":"choice","section":"应用练习","bookPage":174,"key":"yingyong-5-选择恰当的词语填空-7"},{"lesson":5,"num":8,"sub":"选择恰当的词语填空","stem":"时间太紧张了，我们准备得也不够充分，这项任务恐怕＿＿＿。","word":null,"options":{"A":"不完成","B":"完不成","C":"完没成","D":"没完成"},"answer":"B","analysis":"“完不成”是“不能完成”的意思，是汉语口语中常见的一种表达形式。其他形式不符合可能补语的要求。","id":"q0500","cat":"choice","section":"应用练习","bookPage":174,"key":"yingyong-5-选择恰当的词语填空-8"},{"lesson":5,"num":9,"sub":"选择恰当的词语填空","stem":"你给我的这本书那么厚，一个月恐怕＿＿＿。","word":null,"options":{"A":"不翻译完","B":"译不完","C":"翻译完","D":"翻不译完"},"answer":"B","analysis":"“书”太厚，“一个月”的时间不可能翻译完，因此，“翻译不完”或“译不完”才是最正确的可能补语表达形式。其他形式都不正确。","id":"q0501","cat":"choice","section":"应用练习","bookPage":175,"key":"yingyong-5-选择恰当的词语填空-9"},{"lesson":5,"num":10,"sub":"选择恰当的词语填空","stem":"要带的东西太多了，光靠我一个人可＿＿＿。","word":null,"options":{"A":"拿得动","B":"拿起来","C":"拿不了","D":"拿不起来"},"answer":"C","analysis":"“东西太多”的结果应该是“拿不了”，因为“拿不了”有“拿不完”","id":"q0502","cat":"choice","section":"应用练习","bookPage":175,"key":"yingyong-5-选择恰当的词语填空-10"},{"lesson":6,"num":1,"sub":"把下列所给的成分合并成程度补语或介宾补语的句子","stem":"玛丽打扫房间房间干干净净","answers":["玛丽把房间打扫得干干净净的。","玛丽的房间打扫得干干净净的。"],"analysis":"这个句子用“把”字句或一般的句子形式都能够表达相同的意思。应该注意变换句子的形式来加强语言表达的效果。","id":"q0503","cat":"rewrite","section":"应用练习","bookPage":178,"key":"yingyong-6-把下列所给的成分合并成程度补语或介宾补语的句子-1"},{"lesson":6,"num":2,"sub":"把下列所给的成分合并成程度补语或介宾补语的句子","stem":"我着急吃不下饭，睡不好觉","answers":["我急得吃不下饭，睡不好觉。"],"analysis":"“吃不下饭，睡不好觉”是“着急”的程度，但在组成一个句子时，用“急”就可以了，因为“着急”是动宾结构，后面不能跟“得”。","id":"q0504","cat":"rewrite","section":"应用练习","bookPage":178,"key":"yingyong-6-把下列所给的成分合并成程度补语或介宾补语的句子-2"},{"lesson":6,"num":3,"sub":"把下列所给的成分合并成程度补语或介宾补语的句子","stem":"他喜欢踢足球他满头大汗","answers":["他踢足球踢得满头大汗。"],"analysis":"按照汉语语法的要求，如果动词有宾语又带补语时，一般可以用重复动词的方式来加上程度补语。这个句子不能说成“他踢足球得满头大汗”。注意“得”在句子中的位置。","id":"q0505","cat":"rewrite","section":"应用练习","bookPage":179,"key":"yingyong-6-把下列所给的成分合并成程度补语或介宾补语的句子-3"},{"lesson":6,"num":4,"sub":"把下列所给的成分合并成程度补语或介宾补语的句子","stem":"她高兴地叫着向妈妈怀里扑去","answers":["她高兴地叫着扑向妈妈的怀里。","她高兴地叫着扑到妈妈的怀里。"],"analysis":"介宾词组“向妈妈怀里”既可以做“扑”的状语，也可以做补语。","id":"q0506","cat":"rewrite","section":"应用练习","bookPage":179,"key":"yingyong-6-把下列所给的成分合并成程度补语或介宾补语的句子-4"},{"lesson":6,"num":5,"sub":"把下列所给的成分合并成程度补语或介宾补语的句子","stem":"他在候机室里坐着。他在等飞机","answers":["他坐在候机室里等飞机。"],"analysis":"同样，“在候机室里”可以做“坐”的状语，也可以做补语。","id":"q0507","cat":"rewrite","section":"应用练习","bookPage":179,"key":"yingyong-6-把下列所给的成分合并成程度补语或介宾补语的句子-5"},{"lesson":6,"num":1,"sub":"给词语选择恰当的位置","stem":"A湖南境内的张家界风景区，B以水清、石秀、林深C闻名D世。","word":"于","options":null,"answer":"D","analysis":"“于”是一个比较特殊的介词，一般情况下用在动词或形容词之后，然后跟时间词、处所词或表示其他事物的词语。句子中“闻名于世”已经成了固定搭配的词语，应该注意汉语中这样的四字格。请参考本教材下册第十三课相应的介绍。","id":"q0508","cat":"pos","section":"应用练习","bookPage":179,"key":"yingyong-6-给词语选择恰当的位置-1"},{"lesson":6,"num":2,"sub":"给词语选择恰当的位置","stem":"这批A进口水果全部B产C澳洲，口感特别好，D营养价值也非常丰富。","word":"自","options":null,"answer":"C","analysis":"“自”是一个用法比较灵活的介词，既可以用在动词之前，也可以用在动词之后。我们还将在介绍介词时专门进行讲解。参考下册第一课。","id":"q0509","cat":"pos","section":"应用练习","bookPage":179,"key":"yingyong-6-给词语选择恰当的位置-2"},{"lesson":6,"num":3,"sub":"给词语选择恰当的位置","stem":"他已经A把自己的照相机B借C几位好朋友D了。","word":"给","options":null,"answer":"C","analysis":"由“给”组成的介宾补语应该放在动词之后，句子中的四个位置只有C符合这个标准，其他都不合适。另外，“给”后一般只跟表示“人”的词语。","id":"q0510","cat":"pos","section":"应用练习","bookPage":179,"key":"yingyong-6-给词语选择恰当的位置-3"},{"lesson":6,"num":4,"sub":"给词语选择恰当的位置","stem":"他A妈妈昨天从广东B寄C他D一台进口的数码相机。","word":"给","options":null,"answer":"C","analysis":"注意“给”的宾语应该是表示“人”的词语，但是句子中A的位置上不能放“给”，否则句子会显得十分不流畅，而且“寄”与“他”之间必须有一个词语才能使句子成立。C是最恰当的选择。","id":"q0511","cat":"pos","section":"应用练习","bookPage":179,"key":"yingyong-6-给词语选择恰当的位置-4"},{"lesson":6,"num":5,"sub":"给词语选择恰当的位置","stem":"他放学A回到家以后，B把书包放C椅子上就D跑出去了。","word":"在","options":null,"answer":"C","analysis":"介词“在”的宾语应该是名词性成分，可以是处所，也可以是时间。符合这样的条件的只有C。","id":"q0512","cat":"pos","section":"应用练习","bookPage":179,"key":"yingyong-6-给词语选择恰当的位置-5"},{"lesson":6,"num":1,"sub":"选择恰当的词语填空","stem":"张先生30年前远渡重洋就读＿＿＿美国哈佛大学，最近回到国内发展了。","word":null,"options":{"A":"自","B":"在","C":"从","D":"于"},"answer":"D","analysis":"A、C常常表示动作的起点，不符合句子的意思和语法要求。“在”虽然意思合适，但在书面语中，只有D的“于”最恰当。","id":"q0513","cat":"choice","section":"应用练习","bookPage":180,"key":"yingyong-6-选择恰当的词语填空-1"},{"lesson":6,"num":2,"sub":"选择恰当的词语填空","stem":"你说的笑话太有意思了，笑得我们都＿＿＿了。","word":null,"options":{"A":"一点儿肚子疼","B":"一点儿疼肚子","C":"有点儿疼肚子","D":"肚子有点儿疼"},"answer":"D","analysis":"“有点儿”的后边常常跟比较不如意的事情，而“一点儿”则没有这个要求。但是“有点儿疼肚子”不是汉语的表达方式，因为“疼”不能带宾语。“有点儿肚子疼”或“肚子有点儿疼”才是汉语正确的表达方式。关于“一点儿、有点儿”的具体分析，我们将在下册介绍。中其他国家，呈现出旺盛的势头。","id":"q0514","cat":"choice","section":"应用练习","bookPage":180,"key":"yingyong-6-选择恰当的词语填空-2"},{"lesson":6,"num":3,"sub":"选择恰当的词语填空","stem":"三十几年来中国的发展速度远远高中二其他国家，呈现出旺盛的势头。","word":null,"options":{"A":"起","B":"比","C":"于","D":"多"},"answer":"C","analysis":"“高于…”的意思就是“比……高”，但句子中只能用“于”而不能用“比”，“比”只能用在形容词之前。参考第九课“比较句分析”。","id":"q0515","cat":"choice","section":"应用练习","bookPage":180,"key":"yingyong-6-选择恰当的词语填空-3"},{"lesson":6,"num":4,"sub":"选择恰当的词语填空","stem":"海尔彩电除满足国内需求外，还＿＿＿美国、日本、德国、法国等数十个国家。","word":null,"options":{"A":"销售","B":"卖往","C":"销往","D":"售往"},"answer":"C","analysis":"C尽管“卖往、售往”与“销往”的意思一样，但在书面语中，只能用“销往”，不能选择其他词语。A.从来 B.来从C.来自 D.来往A是副词，B在汉语中找不到这样的用法，D虽是动词，但后边不能跟表示国一样，但它既可以用在动词之前，也可以用在动词之后，“从…”只能用在动词之前。","id":"q0516","cat":"choice","section":"应用练习","bookPage":180,"key":"yingyong-6-选择恰当的词语填空-4"},{"lesson":6,"num":5,"sub":"选择恰当的词语填空","stem":"参加巴黎“利比亚之友”国际会议的有 ＿＿＿40多个国家和地区的代表团。","word":null,"options":{"A":"从来","B":"来从","C":"来自","D":"来往"},"answer":"C","analysis":"A是副词，B在汉语中找不到这样的用法，D虽是动词，但后边不能跟表示国家或地区的处所词语。正确的答案只能是“来自”。“自……”虽然与“从…”的意思一样，但它既可以用在动词之前，也可以用在动词之后，“从··只能用在动词之前。","id":"q0517","cat":"choice","section":"应用练习","bookPage":180,"key":"yingyong-6-选择恰当的词语填空-5"},{"lesson":6,"num":6,"sub":"选择恰当的词语填空","stem":"我已经学了三个月书法了，你看这毛笔字我＿＿＿。","word":null,"options":{"A":"写得好看写得不好看","B":"写得好看不好看","C":"写得好看写不好看","D":"写得好看和不好看"},"answer":"B","analysis":"程度补语的正反疑问形式应该是“动+得+A不A”。其他几个备选短语都不符合格式上的要求。","id":"q0518","cat":"choice","section":"应用练习","bookPage":181,"key":"yingyong-6-选择恰当的词语填空-6"},{"lesson":6,"num":7,"sub":"选择恰当的词语填空","stem":"这种新的建筑技术好就好＿＿＿经济实用而又简单易行上。","word":null,"options":{"A":"像","B":"比","C":"在","D":"是"},"answer":"C","analysis":"介宾结构“在…上”做补语强调某一方面。本教材下册第一课还会对“在…上中下”进行介绍。“好像、好比”只是干扰成分。","id":"q0519","cat":"choice","section":"应用练习","bookPage":181,"key":"yingyong-6-选择恰当的词语填空-7"},{"lesson":6,"num":8,"sub":"选择恰当的词语填空","stem":"从妈妈的微笑中，女儿看到了她发＿＿＿内心的喜悦。","word":null,"options":{"A":"从","B":"在","C":"自","D":"现"},"answer":"C","analysis":"“自”组成的介宾结构做补语，强调动作的起点；“从”一般用在动词之前，“在”只说明动作的处所，“现”只是一个干扰性的词语。","id":"q0520","cat":"choice","section":"应用练习","bookPage":181,"key":"yingyong-6-选择恰当的词语填空-8"},{"lesson":6,"num":9,"sub":"选择恰当的词语填空","stem":"教练不会把运动场上没有用的东西教＿＿＿你们，好好练吧！","word":null,"options":{"A":"为","B":"受","C":"向","D":"给"},"answer":"D","analysis":"“给”同样是一个比较特殊的介词，它不仅可以用在动词前边，而且也可以用在动词后边构成介宾结构做补语。","id":"q0521","cat":"choice","section":"应用练习","bookPage":181,"key":"yingyong-6-选择恰当的词语填空-9"},{"lesson":6,"num":10,"sub":"选择恰当的词语填空","stem":"你们快看，王平高兴得简直＿＿＿合不拢嘴了。","word":null,"options":{"A":"也","B":"还","C":"都","D":"就"},"answer":"C","analysis":"“都”做副词，在这个句子中表示“高兴”的程度，可以解释为“已经”。","id":"q0522","cat":"choice","section":"应用练习","bookPage":181,"key":"yingyong-6-选择恰当的词语填空-10"},{"lesson":7,"num":1,"sub":"用时量补语、动量补语或数量补语完成句子","stem":"这酒不错，你们喝 试试。","answers":["这酒不错，你们喝一下儿试试。","这酒不错，你们喝一口试试。"],"analysis":"“喝一下儿”是动量补语，“喝一口”中的“一口”可以看作名量词，也可以看作动量词，都不影响句子意思的理解。","id":"q0523","cat":"expand","section":"应用练习","bookPage":184,"key":"yingyong-7-用时量补语、动量补语或数量补语完成句子-1"},{"lesson":7,"num":2,"sub":"用时量补语、动量补语或数量补语完成句子","stem":"我的自行车钥匙不见了，小李帮我找了 也没有找到。","answers":["我的自行车钥匙不见了，小李帮我找了半天也没有找到。","我的自行车钥匙不见了，小李帮我找了很长时间也没有找到。"],"analysis":"这个句子还可以写出很多时量补语，但这里只简单列出两个供同学们参考。你也可以试着多写几个句子。卧。","id":"q0524","cat":"expand","section":"应用练习","bookPage":184,"key":"yingyong-7-用时量补语、动量补语或数量补语完成句子-2"},{"lesson":7,"num":3,"sub":"用时量补语、动量补语或数量补语完成句子","stem":"昨天的雪真大，连续下了","answers":["昨天的雪真大，连续下了三四个小时。","昨天的雪真大，连续下了几个钟头。"],"analysis":"时量补语应该是表示时段的时间词语，如果用“五点、九点”等表示时点的词语就错了。","id":"q0525","cat":"expand","section":"应用练习","bookPage":184,"key":"yingyong-7-用时量补语、动量补语或数量补语完成句子-3"},{"lesson":7,"num":4,"sub":"用时量补语、动量补语或数量补语完成句子","stem":"我和你是同龄人，不过我的生日比你大","answers":["我和你是同龄人，不过我的生日比你大多了。","我和你是同龄人，不过我的生日比你大一点儿。","我和你是同龄人，不过我的生日比你大两个月。","我和你是同龄人，不过我的生日比你大三天。"],"analysis":"数量补语既可以是比较模糊的词语，如“一点儿、一些、多了、得多”等，也可以是比较确定的数量词语。","id":"q0526","cat":"expand","section":"应用练习","bookPage":184,"key":"yingyong-7-用时量补语、动量补语或数量补语完成句子-4"},{"lesson":7,"num":5,"sub":"用时量补语、动量补语或数量补语完成句子","stem":"这首歌我们只学了 就记住了。","answers":["这首歌我们只学了一遍就记住了。","这首歌我们只学了几分钟就记住了。"],"analysis":"动量补语和时量补语都可以清楚地表达这个句子的意思。","id":"q0527","cat":"expand","section":"应用练习","bookPage":185,"key":"yingyong-7-用时量补语、动量补语或数量补语完成句子-5"},{"lesson":7,"num":6,"sub":"用时量补语、动量补语或数量补语完成句子","stem":"请你们在这儿等我 ，我马上就回来。","answers":["请你们在这儿等我一会儿，我马上就回来。","请你们在这儿等我一下儿，我马上就回来。","请你们在这儿等我几分钟，我马上就回来。"],"analysis":"由于句子后边有“马上”这个副词，前边的时量补语不能是比较长的时间，因此，用“一会儿、一下儿、几分钟”是最恰当的。","id":"q0528","cat":"expand","section":"应用练习","bookPage":185,"key":"yingyong-7-用时量补语、动量补语或数量补语完成句子-6"},{"lesson":7,"num":7,"sub":"用时量补语、动量补语或数量补语完成句子","stem":"这双鞋漂亮是漂亮，可对我来说还是贵了","answers":["这双鞋漂亮是漂亮，可对我来说还是贵了一点儿。","这双鞋漂亮是漂亮，可对我来说还是贵了一些。"],"analysis":"“一点儿、一些”都是比较模糊的数量，用在这个句子里十分合适。不能用非常确定的数量来完成这个句子。","id":"q0529","cat":"expand","section":"应用练习","bookPage":185,"key":"yingyong-7-用时量补语、动量补语或数量补语完成句子-7"},{"lesson":7,"num":8,"sub":"用时量补语、动量补语或数量补语完成句子","stem":"为了看《碟3》，我已经去排了 队，总算买到票了。","answers":["为了看《碟3》，我已经去排了几次队，总算买到票了。","为了看《碟3》，我已经去排了好几次队，总算买到票了。"],"analysis":"这个句子的动量补语也可以是“两次、三次”等确定的次数。","id":"q0530","cat":"expand","section":"应用练习","bookPage":185,"key":"yingyong-7-用时量补语、动量补语或数量补语完成句子-8"},{"lesson":7,"num":9,"sub":"用时量补语、动量补语或数量补语完成句子","stem":"就这么薄的一本书，你竟然看了","answers":["就这么薄的一本书，你竟然看了一个星期？","就这么薄的一本书，你竟然看了三四天？"],"analysis":"如果你想强调时间更长，还可以用“一个月、半年”等词语。","id":"q0531","cat":"expand","section":"应用练习","bookPage":185,"key":"yingyong-7-用时量补语、动量补语或数量补语完成句子-9"},{"lesson":7,"num":10,"sub":"用时量补语、动量补语或数量补语完成句子","stem":"中国的人口比我们国家多","answers":["中国的人口比我们国家多得多。","中国的人口比我们国家多多了。"],"analysis":"中国是世界上人口最多的国家，跟任何一个国家比，都可以用“多得多、多多了”这样的句子形式。当然，你也可以用具体数量词语，如“十亿、十二亿”等等。","id":"q0532","cat":"expand","section":"应用练习","bookPage":185,"key":"yingyong-7-用时量补语、动量补语或数量补语完成句子-10"},{"lesson":7,"num":1,"sub":"给词语选择恰当的位置","stem":"我可以告诉你，A我们班一共B有10C个D欧洲人。","word":"来","options":null,"answer":"C","analysis":"“来”只能放在“十、百、千、万”等表示整体数量的词语之后，表示大概的数量。不能放在其他位置。","id":"q0533","cat":"pos","section":"应用练习","bookPage":185,"key":"yingyong-7-给词语选择恰当的位置-1"},{"lesson":7,"num":2,"sub":"给词语选择恰当的位置","stem":"A如果B在这里住C，房租当然D可以便宜一点儿。","word":"一年","options":null,"answer":"C","analysis":"“一年”是表示时段的词语，在句子中一般做时量补语，应该放在动词之后。其他位置不符合汉语语法的要求。","id":"q0534","cat":"pos","section":"应用练习","bookPage":186,"key":"yingyong-7-给词语选择恰当的位置-2"},{"lesson":7,"num":3,"sub":"给词语选择恰当的位置","stem":"偶尔弄到一点乌龙茶极品，拿来招待客人A，B总要C心疼D。","word":"好半天","options":null,"answer":"D","analysis":"“好半天”就是很长时间，在句子中作“心疼”的补语。A的位置不可以用“好半天”，因为“客人”是名词宾语，它的后边不能加时量补语。","id":"q0535","cat":"pos","section":"应用练习","bookPage":186,"key":"yingyong-7-给词语选择恰当的位置-3"},{"lesson":7,"num":4,"sub":"给词语选择恰当的位置","stem":"离开家乡A以后，我有十年B没回C家乡D了。","word":"来","options":null,"answer":"D","analysis":"“回来”带处所宾语时，宾语必须放在“来”之前。“回来家乡”是错误的搭配。“十年来”在句子中也不符合语法要求，如果是“十来年”则可以。其他位置都是错误的。","id":"q0536","cat":"pos","section":"应用练习","bookPage":186,"key":"yingyong-7-给词语选择恰当的位置-4"},{"lesson":7,"num":5,"sub":"给词语选择恰当的位置","stem":"阿里去哪儿了？玛丽A来这儿B找了C他D了。","word":"三次","options":null,"answer":"D","analysis":"必须注意动词带时量补语和动量补语同时又带代词宾语时，宾语与补语的位置问题。记住：代词宾语应该在时量补语和动量补语之前。","id":"q0537","cat":"pos","section":"应用练习","bookPage":186,"key":"yingyong-7-给词语选择恰当的位置-5"},{"lesson":7,"num":6,"sub":"给词语选择恰当的位置","stem":"这次到东北去，刚好A住了三B个C月D。","word":"来","options":null,"answer":"C","analysis":"“来”在表示大概的数量时，如果这个数量是“十、百、千、万”等，“来”应该紧跟其后，然后是量词，如“十来年”、“二百来个”、“一千来双”等；如果这个数量是零数，“来”则应该放在量词之后，如“三个来月”、“五斤来重”、“两个来小时”。","id":"q0538","cat":"pos","section":"应用练习","bookPage":186,"key":"yingyong-7-给词语选择恰当的位置-6"},{"lesson":7,"num":7,"sub":"给词语选择恰当的位置","stem":"昨天我们三个A人才花了60B块钱就吃C了一顿D非常丰盛的饭菜。","word":"多","options":null,"answer":"B","analysis":"“多”与“来”的用法基本一样。但是应该注意的是，“十多块钱”与“十块多钱”是不一样的。还应该特别注意的是，不管是“多”还是“来”，不可分的事物不能把“来”或“多”放在量词之后，如“三个多人”、“十个来人”等都是错误的。","id":"q0539","cat":"pos","section":"应用练习","bookPage":186,"key":"yingyong-7-给词语选择恰当的位置-7"},{"lesson":7,"num":8,"sub":"给词语选择恰当的位置","stem":"你们是在说王刚和李娜吧？A他们B已经C结婚D了。","word":"好几年","options":null,"answer":"D","analysis":"“好几年”做“结婚”的时量补语。需要注意的是，有的学生习惯把“好几年”放在“结婚”之前做状语，这样就错了！汉语表示时段的词语如“一个小时、两天、三年”等一般只能做补语，做状语时一般是在否定句里。表示时点的词语如“三点、今天、去年”等常常做状语。还应该注意的是“结婚”是一个表示不可持续的动作的离合动词，时量补语只能放其后。","id":"q0540","cat":"pos","section":"应用练习","bookPage":186,"key":"yingyong-7-给词语选择恰当的位置-8"},{"lesson":7,"num":9,"sub":"给词语选择恰当的位置","stem":"你们怎么才回来A？大家已经在这儿B等了C你们D了。","word":"一个多小时","options":null,"answer":"D","analysis":"“一个多小时”应该放在“你们”之后，因为“你们”是代词，必须注意，时量补语一般紧跟动词，但是，如果动词的宾语是代词，时量补语应该放在代词之后。有的学生喜欢把所有的时间词都放在动词之前，即“好几年结婚”、“一个多小时等你们”，应该注意汉语的状语与补语的区别。","id":"q0541","cat":"pos","section":"应用练习","bookPage":187,"key":"yingyong-7-给词语选择恰当的位置-9"},{"lesson":7,"num":10,"sub":"给词语选择恰当的位置","stem":"他A给大家B说了C这件事情发生D的经过。","word":"一遍","options":null,"answer":"C","analysis":"和时量补语一样，动量补语一般也紧跟在动词后面。","id":"q0542","cat":"pos","section":"应用练习","bookPage":187,"key":"yingyong-7-给词语选择恰当的位置-10"},{"lesson":7,"num":1,"sub":"选择恰当的词语填空","stem":"爷爷奶奶陪着我们姐妹俩在这儿读书，我们已经在这儿＿＿＿。","word":null,"options":{"A":"住了五六年","B":"住了五六年了","C":"五六年住了","D":"五六年了住了"},"answer":"B","analysis":"A的“住了五六年”很可能是指以前的事情，而B的“住了五六年了”是指从五六年以前一直住到现在，这恰好与句子中的“已经”互相搭配。C、D都是错误的语序，因为表示时段的词语在句子中一般只做补语。","id":"q0543","cat":"choice","section":"应用练习","bookPage":187,"key":"yingyong-7-选择恰当的词语填空-1"},{"lesson":7,"num":2,"sub":"选择恰当的词语填空","stem":"来美国以前，我只在国内进修了＿＿＿英语，因此，刚到这里我是既聋又哑。","word":null,"options":{"A":"三个月半","B":"三个半月","C":"三半个月","D":"三月半个"},"answer":"B","analysis":"“三个半月”的意思是“三个月再加上半个月”，是汉语最正确的表达方法，其他几种搭配都不符合汉语表达要求。","id":"q0544","cat":"choice","section":"应用练习","bookPage":187,"key":"yingyong-7-选择恰当的词语填空-2"},{"lesson":7,"num":3,"sub":"选择恰当的词语填空","stem":"事件已经＿＿＿快十个月了，但人们心理上的阴影怎么也抹不去。","word":null,"options":{"A":"来","B":"过来","C":"走","D":"过去"},"answer":"D","analysis":"C时间只能离我们而去，即“过去”，而“来、走、过来”都不能用于表示时间的句子。A.一点 B.一顿C.一阵 D一次“一阵”可以表示比较短而快的时间，如“一阵风、一阵雨”，也可以表示比较长甚至很长的时间，如“年轻时我在北京生活过一阵”。上面句子中的“一阵”表示的是比较长的时间，句子后边的“终于”也说明了这一点。其他几个词“一点”表示数量；“一次”只是动量，不说明时间的长短；“一顿”则常常与“吃饭、挨打、吵架”相关联。","id":"q0545","cat":"choice","section":"应用练习","bookPage":187,"key":"yingyong-7-选择恰当的词语填空-3"},{"lesson":7,"num":4,"sub":"选择恰当的词语填空","stem":"马明认真地端详了＿＿＿。","word":null,"options":{"A":"一点","B":"一顿","C":"一阵","D":"一次"},"answer":"C","analysis":"“一阵”可以表示比较短而快的时间，如“一阵风、一阵雨”，也可以表示比较长甚至很长的时间，如“年轻时我在北京生活过一阵”。上面句子中的“一阵”表示的是比较长的时间，句子后边的“终于”也说明了这一点。其他几个词“一点”表示数量；“一次”只是动量，不说明时间的长短；“一顿”则常常与“吃饭、挨打、吵架”相关联。","id":"q0546","cat":"choice","section":"应用练习","bookPage":187,"key":"yingyong-7-选择恰当的词语填空-4"},{"lesson":7,"num":5,"sub":"选择恰当的词语填空","stem":"三十年以前我上大学入学的那天，妈妈只给了我＿＿＿块钱。","word":null,"options":{"A":"多","B":"几","C":"来","D":"一些"},"answer":"B","analysis":"“多、来、一些”虽然可以表示大概的数量，但是不能单独用在量词之前，只有“几”可以直接与量词组合，表示从1到9的数量，特别强调数量少。","id":"q0547","cat":"choice","section":"应用练习","bookPage":188,"key":"yingyong-7-选择恰当的词语填空-5"},{"lesson":7,"num":6,"sub":"选择恰当的词语填空","stem":"昨天晚上回来得太晚了，我一共＿＿＿。","word":null,"options":{"A":"只睡觉了两个小时","B":"只两个小时睡觉了","C":"两个小时只睡觉了","D":"只睡了两个小时觉"},"answer":"D","analysis":"“睡觉”是表示可持续的动作的离合动词，带时量补语时，应该分开用。","id":"q0548","cat":"choice","section":"应用练习","bookPage":188,"key":"yingyong-7-选择恰当的词语填空-6"},{"lesson":7,"num":7,"sub":"选择恰当的词语填空","stem":"昨天我什么地方也没有去，把自己关在屋子里＿＿＿。","word":null,"options":{"A":"看整一天书了","B":"看了一整天书","C":"一整天看了书","D":"看书了一整天"},"answer":"B","analysis":"“看书”是动宾结构，时量补语“一整天”应该跟在动词“看”的后面。“了”作为动态助词与“看”不能分开，应该紧跟动词。","id":"q0549","cat":"choice","section":"应用练习","bookPage":188,"key":"yingyong-7-选择恰当的词语填空-7"},{"lesson":7,"num":8,"sub":"选择恰当的词语填空","stem":"上午的考试只进行了＿＿＿，但看起来同学们并不怎么轻松。","word":null,"options":{"A":"一个小时半","B":"半一个小时","C":"一个半小时","D":"一半个小时"},"answer":"C","analysis":"“一个半小时”等于“一个小时”与“半个小时”之和，其他均不能表示这个意思。“一个小时半”是不符合汉语表达习惯和要求的。","id":"q0550","cat":"choice","section":"应用练习","bookPage":188,"key":"yingyong-7-选择恰当的词语填空-8"},{"lesson":7,"num":9,"sub":"选择恰当的词语填空","stem":"经理先生，您说的话我没有听懂，请您再解释＿＿＿可以吗？","word":null,"options":{"A":"一会儿","B":"一下儿","C":"一趟","D":"一遍"},"answer":"B","analysis":"汉语中双音节动词重叠的形式一般应该是“ABAB”、“AB一下儿”“AB了一下儿”，如“复习复习”“复习一下儿”“复习了一下儿”。“一遍”强调动作从开始到结束的整个过程，在这里不合适。","id":"q0551","cat":"choice","section":"应用练习","bookPage":188,"key":"yingyong-7-选择恰当的词语填空-9"},{"lesson":7,"num":10,"sub":"选择恰当的词语填空","stem":"到中国以前，我只在国内学习了＿＿＿振出＿＿＿汉语，因此，刚到这里时我什么也听不懂。","word":null,"options":{"A":"两个月半","B":"两个半月","C":"两半个月","D":"两月半个"},"answer":"B","analysis":"和“一个半小时”一样，“两个半月”是唯一正确的答案。应该注意汉语数量词语的这种表达方式。公无不来从味5底干不来从联5自","id":"q0552","cat":"choice","section":"应用练习","bookPage":188,"key":"yingyong-7-选择恰当的词语填空-10"},{"lesson":8,"num":1,"sub":"完成下列兼语句、连动句和存现句","stem":"教学楼门口有人","answers":["教学楼门口有人找你。","教学楼门口有人等着你呢。","教学楼门口有人正在大喊大叫。"],"analysis":"由“有”构成的兼语句，可以在“人”的后边写出很多动宾形式从而组成新的句子，因为“人”可能做出任何事情。你可以再试试。","id":"q0553","cat":"expand","section":"应用练习","bookPage":192,"key":"yingyong-8-完成下列兼语句、连动句和存现句-1"},{"lesson":8,"num":2,"sub":"完成下列兼语句、连动句和存现句","stem":"你怎么总是叫","answers":["你怎么总是叫我跟你去这儿去那儿？","你怎么总是叫别人帮你做作业？","你怎么总是叫他们来咱们房间玩儿？"],"analysis":"同样，“叫”的后边也可以组织出许多句子形式构成新的兼语句。但是，应该注意，如果你做出“你怎么总是叫小偷偷啊？”这样的句子就错了，因为这是一个被动句。","id":"q0554","cat":"expand","section":"应用练习","bookPage":193,"key":"yingyong-8-完成下列兼语句、连动句和存现句-2"},{"lesson":8,"num":3,"sub":"完成下列兼语句、连动句和存现句","stem":"车厢里","answers":["车厢里挤满了人。","车厢里坐着很多人。","车厢里没有几个人。"],"analysis":"应该注意存现句的句子形式，即方位处所词语+动词+存在的事物。","id":"q0555","cat":"expand","section":"应用练习","bookPage":193,"key":"yingyong-8-完成下列兼语句、连动句和存现句-3"},{"lesson":8,"num":4,"sub":"完成下列兼语句、连动句和存现句","stem":"顾客们一大早就来到国美商店","answers":["顾客们一大早就来到国美商店排队购买降价彩电。","顾客们一大早就来到国美商店等着购买新进的商品。","顾客们一大早就来到国美商店等着退货。"],"analysis":"这是个非常典型的连动句，即来哪儿做什么。当然“顾客们来商店”要做的事主要是购买商品，但也许会出现第三个句子的情况。","id":"q0556","cat":"expand","section":"应用练习","bookPage":193,"key":"yingyong-8-完成下列兼语句、连动句和存现句-4"},{"lesson":8,"num":5,"sub":"完成下列兼语句、连动句和存现句","stem":"宿舍管理员不 12点以后","answers":["宿舍管理员不让学生12点以后回宿舍。","宿舍管理员不允许学生们12点以后进出宿舍楼。"],"analysis":"这个句子如果不认真思考，是很不容易回答出来的。也许你没有遇到过这样的事情，但在生活中它却实实在在地存在着。","id":"q0557","cat":"expand","section":"应用练习","bookPage":193,"key":"yingyong-8-完成下列兼语句、连动句和存现句-5"},{"lesson":8,"num":6,"sub":"完成下列兼语句、连动句和存现句","stem":"我们去参观的农民家的院子里","answers":["我们去参观的农民家的院子里堆着很多粮食。","我们去参观的农民家的院子里放着两辆小汽车。","我们去参观的农民家的院子里种着好几棵苹果树。"],"analysis":"存现句的动词和宾语可以随意写出很多，只要符合句子的意思就可以。应该注意的是句子中的动词后一般要加上“着”。","id":"q0558","cat":"expand","section":"应用练习","bookPage":193,"key":"yingyong-8-完成下列兼语句、连动句和存现句-6"},{"lesson":8,"num":1,"sub":"给词语选择恰当的位置","stem":"我们A应该先B看书C，然后骑车去D玩儿。","word":"到图书馆","options":null,"answer":"B","analysis":"连动句中第一个动作常常与处所有关，第二个动作是第一个动作的目的，因此，“看书”当然应该跟“到图书馆”联系在一起。","id":"q0559","cat":"pos","section":"应用练习","bookPage":193,"key":"yingyong-8-给词语选择恰当的位置-1"},{"lesson":8,"num":2,"sub":"给词语选择恰当的位置","stem":"南方人的习惯是喝A汤再吃B饭，北方人的习惯则是先吃饭C后喝汤D。","word":"完","options":null,"answer":"A","analysis":"“完”在句中一般都用在动词后做结果补语，因此只有A、B两处符合要求，但按照连动句的要求，又只有A是最恰当的位置。","id":"q0560","cat":"pos","section":"应用练习","bookPage":193,"key":"yingyong-8-给词语选择恰当的位置-2"},{"lesson":8,"num":3,"sub":"给词语选择恰当的位置","stem":"我A妹妹告诉B他明天早上六点半C来学校集合D上车。","word":"让","options":null,"answer":"A","analysis":"“让”字前后都应该有与人有关的名词或代词，那么，只有A符合要求。","id":"q0561","cat":"pos","section":"应用练习","bookPage":194,"key":"yingyong-8-给词语选择恰当的位置-3"},{"lesson":8,"num":4,"sub":"给词语选择恰当的位置","stem":"真没想到，A这么一件容易的事B却C我D伤了那么长时间的脑筋。","word":"让","options":null,"answer":"C","analysis":"兼语句的动词前同样可以有副词做状语，但“让”的前后应该有表示事、物的名词或代词，这是不能改变的。","id":"q0562","cat":"pos","section":"应用练习","bookPage":194,"key":"yingyong-8-给词语选择恰当的位置-4"},{"lesson":8,"num":5,"sub":"给词语选择恰当的位置","stem":"这件已经过去很长时间的往事，A我B心里一直C十分D内疚。令 A","word":"令","options":null,"answer":"A","analysis":"兼语句中“令、使”等词语前多为一件事，美后边应该有表示人的词语。","id":"q0563","cat":"pos","section":"应用练习","bookPage":194,"key":"yingyong-8-给词语选择恰当的位置-5"},{"lesson":8,"num":6,"sub":"给词语选择恰当的位置","stem":"屋子里的东西A很整齐，墙上贴着几幅照片B，桌子上C两本书D。","word":"放着","options":null,"answer":"C","analysis":"存现句的格式是“处所词语+动词+事物名词”，因此，句中唯一合适的位置是C，其他位置都不符合要求，","id":"q0564","cat":"pos","section":"应用练习","bookPage":194,"key":"yingyong-8-给词语选择恰当的位置-6"},{"lesson":8,"num":7,"sub":"给词语选择恰当的位置","stem":"会场布置得十分讲究，前面A是B一簇簇鲜花，主席台上C大会主持人的D讲话稿。","word":"摆着","options":null,"answer":"C","analysis":"按照存现句格式的要求，C是最恰当的位置。","id":"q0565","cat":"pos","section":"应用练习","bookPage":194,"key":"yingyong-8-给词语选择恰当的位置-7"},{"lesson":8,"num":8,"sub":"给词语选择恰当的位置","stem":"A那是一次B我C终生D难忘的旅行。","word":"令","options":null,"answer":"B","analysis":"在兼语句中，“令”后边跟的一般应该是人或与人有关的词语，因此，看到“令”，首先应该在句子中找与人有关的词语。","id":"q0566","cat":"pos","section":"应用练习","bookPage":194,"key":"yingyong-8-给词语选择恰当的位置-8"},{"lesson":8,"num":9,"sub":"给词语选择恰当的位置","stem":"请把这个条儿A转交安娜，B她看了以后C给我D写个条儿。","word":"让","options":null,"answer":"B","analysis":"与“令”相同，“让”在兼语句中也用在与人有关的词语之前。即使有“国家、单位”一类的词语，它们其实也多表示的是人。","id":"q0567","cat":"pos","section":"应用练习","bookPage":194,"key":"yingyong-8-给词语选择恰当的位置-9"},{"lesson":8,"num":10,"sub":"给词语选择恰当的位置","stem":"A昨天晚上我突然接B了她从大洋C彼岸打来D的国际长途。","word":"到","options":null,"answer":"B","analysis":"“接到电话”是最正确的动宾搭配。其他位置都不能清楚地表达意思。","id":"q0568","cat":"pos","section":"应用练习","bookPage":194,"key":"yingyong-8-给词语选择恰当的位置-10"},{"lesson":8,"num":1,"sub":"选择恰当的词语填空","stem":"张教授已经搬到外面的小区里去住了，要不我带您＿＿＿。","word":null,"options":{"A":"找他到他家去","B":"到他家去找他","C":"去找到他家","D":"找去到他家"},"answer":"B","analysis":"连动句的语序十分重要，不能随意调换。只有“到他家去”才能“找他”，换过来则不符合汉语语序，也不符合连动句的要求。","id":"q0569","cat":"choice","section":"应用练习","bookPage":195,"key":"yingyong-8-选择恰当的词语填空-1"},{"lesson":8,"num":2,"sub":"选择恰当的词语填空","stem":"近几年北京郊区修建了多座滑雪场，”＿＿＿人们在紧张的工作之余到大自然中去休闲娱乐。","word":null,"options":{"A":"给","B":"让","C":"把","D":"派"},"answer":"B","analysis":"“修建滑雪场”的目的是“让人们去休闲”。“派”的主语常常跟“国家、上级、领导、公司”等有关。","id":"q0570","cat":"choice","section":"应用练习","bookPage":195,"key":"yingyong-8-选择恰当的词语填空-2"},{"lesson":8,"num":3,"sub":"选择恰当的词语填空","stem":"金融危机后进口关税降低了，这样，既让国外厂商获得了一定的利益，也＿＿＿消费者得到了实惠。","word":null,"options":{"A":"使","B":"为","C":"给","D":"向"},"answer":"A","analysis":"“降低进口关税”是“让国外厂商获利”和“使消费者得到实惠”的根本。“既……也…”复句中前后分句要求相同的格式，因此，前边用了“既让…”，后边跟“也使…·”就容易理解了。","id":"q0571","cat":"choice","section":"应用练习","bookPage":195,"key":"yingyong-8-选择恰当的词语填空-3"},{"lesson":8,"num":4,"sub":"选择恰当的词语填空","stem":"大幅度降低进口关税，国外厂商从中获得了利益，同时也＿＿＿广大国内消费者带来了真正的实惠。","word":"广大国内消费者带","options":{"A":"使","B":"让","C":"给","D":"向"},"answer":"C","analysis":"“使、让”意思和用法相同，不能选其中的任何一个。“给”是最恰当的选择。应该注意的是，这个句子表面上与前一个句子相同，但实际上内部结构不一样。“得到了实惠”与“带来了实惠”决定了用“使、让”还是“给”。","id":"q0572","cat":"choice","section":"应用练习","bookPage":195,"key":"yingyong-8-选择恰当的词语填空-4"},{"lesson":8,"num":5,"sub":"选择恰当的词语填空","stem":"那些不遵守交通规则的骑车人，常常＿＿＿司机师傅们感到头疼。","word":null,"options":{"A":"给","B":"令","C":"请","D":"派"},"answer":"B","analysis":"B、C、D都可以用在兼语句中，但是它们所表示的意思却有很大的区别，“请”常常表示客气，“派”有命令的味道，而与事情和自已的心里感觉有关的常常用“使、令”。B是唯一恰当的答案。","id":"q0573","cat":"choice","section":"应用练习","bookPage":195,"key":"yingyong-8-选择恰当的词语填空-5"},{"lesson":8,"num":6,"sub":"选择恰当的词语填空","stem":"＿＿＿你告诉刘明老师一声，明天到我办公室来一下儿。","word":null,"options":{"A":"让","B":"派","C":"叫","D":"请"},"answer":"D","analysis":"这个题，如果只从语法上看，四个备选项都是正确的。但是，我们看一个句","id":"q0574","cat":"choice","section":"应用练习","bookPage":195,"key":"yingyong-8-选择恰当的词语填空-6"},{"lesson":9,"num":1,"sub":"根据句子内容填空","stem":"北京公园的门票＿＿＿我们国家便宜多少。","answers":["北京公园的门票不比我们国家便宜多少。","北京公园的门票没比我们国家便宜多少。"],"analysis":"看到句子中的“多少”以后，总会有人想到用疑问句，即“北京公园的门票比我们国家便宜多少？”其实，这个句子是想考察你对一般比较句的否定形式的掌握情况。“多少”在句子中只是一个虚数。","id":"q0575","cat":"fill","section":"应用练习","bookPage":199,"key":"yingyong-9-根据句子内容填空-1"},{"lesson":9,"num":2,"sub":"根据句子内容填空","stem":"这个小姑娘她妈妈聪明、漂亮。","answers":["这个小姑娘跟她妈妈一样聪明、漂亮。","这个小姑娘和她妈妈一样聪明、漂亮。","这个小姑娘像她妈妈一样聪明、漂亮。","这个小姑娘没有她妈妈那么聪明、漂亮。干一丁这学同寸学同文学价"],"analysis":"汉语表示比较的词语不少，但固定搭配的格式似乎只有“跟·一样”由于“跟、和、与、同”的意义和用法比较接近，因此，其他三个词语也可以用在这个格式中，“像”与“一样”的搭配也是比较常见的。最后一个句子用的是否定的形式，一般来说，这样的句子不符合汉语的表达习惯，就是说，我们不会去说一个小姑娘不漂亮。这个句子语法上是没有任何问题的。","id":"q0576","cat":"fill","section":"应用练习","bookPage":199,"key":"yingyong-9-根据句子内容填空-2"},{"lesson":9,"num":3,"sub":"根据句子内容填空","stem":"我学汉语的时间＿＿＿他长，但是＿＿＿他说得流利。","answers":["我学汉语的时间比他长得多，但是没有他说得流利。","我学汉语的时间比他长很多，但是不如他说得流利。","我学汉语的时间比他长一些，但是没有他说得流利。","我学汉语的时间比他长多了，但是不如他说得流利。","我学汉语的时间比他长半年，但是没有他说得流利。"],"analysis":"“A比B+形容词”的比较句中，形容词之前不能加“很、非常、最、特别”等一类程度副词，但在形容词之后可以加“一些、一点儿、得多、多了、很多”等词语，也可以加比较确定的数量补语，如“半年、三个月”等。好吗？”“你有我这么喜欢唱歌吗？”","id":"q0577","cat":"fill","section":"应用练习","bookPage":200,"key":"yingyong-9-根据句子内容填空-3"},{"lesson":9,"num":4,"sub":"根据句子内容填空","stem":"在爱情问题上，你显得＿＿＿有经验。","answers":["在爱情问题上，你显得很有经验。","在爱情问题上，你显得十分有经验。","在爱情问题上，你显得非常有经验。","在爱情问题上，你显得比我有经验。"],"analysis":"汉语中的动词除表示心理活动的动词之外，一般的动词是不能受程度副词修饰的，“有”是一个比较特殊的动词，由“有”组成的动宾结构常常可以被程度副词修饰，如“有意思、有兴趣、有主意、有能力、有才能、有把握、有理想、有抱负”等，这或许是因为它们带有了形容词的意味。也正因为如此，含有“有”的动宾结构才可以用在比较句中。","id":"q0578","cat":"fill","section":"应用练习","bookPage":200,"key":"yingyong-9-根据句子内容填空-4"},{"lesson":9,"num":5,"sub":"根据句子内容填空","stem":"在市场经济中，我觉得学交往＿＿＿学知识＿＿＿难。","answers":["在市场经济中，我觉得学交往比学知识还难。","在市场经济中，我觉得学交往比学知识更难。","在市场经济中，我觉得学交往比学知识还要难。"],"analysis":"在“A比B+形容词”格式中不能使用“很、非常、最”等程度副词，但是，可以使用“更、还”这两个副词。","id":"q0579","cat":"fill","section":"应用练习","bookPage":200,"key":"yingyong-9-根据句子内容填空-5"},{"lesson":9,"num":6,"sub":"根据句子内容填空","stem":"要说做饭，我还山本呢。","answers":["要说做饭，我还不如山本呢。"],"analysis":"“A不如B+(形容词)”与“A没有B+形容词”的格式所表达的比较意义基本相同，但是，用“不如”时可以不用形容词，用“没有”必须使用形容词。这一点同学们应该牢牢记住。","id":"q0580","cat":"fill","section":"应用练习","bookPage":200,"key":"yingyong-9-根据句子内容填空-6"},{"lesson":9,"num":7,"sub":"根据句子内容填空","stem":"他我们差，他为什么不能跟我们一起去呢？","answers":["他不比我们差，他为什么不能跟我们一起去呢？"],"analysis":"根据句子的意思，应该使用比较句的否定形式，如果使用肯定形式，句子前后的意思就出现矛盾了。还应该知道的是，“他不比我们差”的意思可能是“他跟我们一样好”，也可能是“他比我们好”。","id":"q0581","cat":"fill","section":"应用练习","bookPage":200,"key":"yingyong-9-根据句子内容填空-7"},{"lesson":9,"num":8,"sub":"根据句子内容填空","stem":"我们那儿的春天，没有北京大的风。的街副零舍","answers":["我们那儿的春天，没有北京这么大的风。"],"analysis":"根据句子的前半部分，可以知道说话者应该在北京，因此，应该在空格处填上“这么”。汉语中“这么”常常表示说话者所在的位置或离说话的时间比较近的时间；“那么”则常常表示相反的意思。","id":"q0582","cat":"fill","section":"应用练习","bookPage":201,"key":"yingyong-9-根据句子内容填空-8"},{"lesson":9,"num":9,"sub":"根据句子内容填空","stem":"在讨价还价方面，你可没有小刘精明。","answers":["在讨价还价方面，你可没有小刘那么精明。"],"analysis":"“你”是说话者的对方，应该在说话者面前，而“小刘”应该不在面前，属于比较远的位置。因此，在“精明”前用“那么”。","id":"q0583","cat":"fill","section":"应用练习","bookPage":201,"key":"yingyong-9-根据句子内容填空-9"},{"lesson":9,"num":10,"sub":"根据句子内容填空","stem":"现在我们班的同学比上学期多了","answers":["现在我们班的同学比上学期多了几个。","现在我们班的同学比上学期多了一些。","现在我们班的同学比上学期多了三个。","现在我们班的同学比上学期多了不少。"],"analysis":"比较句中比较的结果(即数量补语)可以是确定的，也可以是比较模糊的词语，这要根据不同的语言环境来决定。","id":"q0584","cat":"fill","section":"应用练习","bookPage":201,"key":"yingyong-9-根据句子内容填空-10"},{"lesson":9,"num":1,"sub":"用所给的词语改写句子","stem":"这个电影没有什么意思，那个电影非常有意思。","answers":["那个电影比这个电影有意思。"],"analysis":"比较句“A比B+形容词”的意思是“A+形容词”。这个句子如果被改写成“这个电影不比那个电影有意思”就改变了原句的意思。注意，改写句子只是改变句子的形式，而不能改变句子的意思。","id":"q0585","cat":"rewrite","section":"应用练习","bookPage":201,"key":"yingyong-9-用所给的词语改写句子-1"},{"lesson":9,"num":2,"sub":"用所给的词语改写句子","stem":"这辆汽车真漂亮，那辆汽车也不错。","answers":["那辆汽车跟这辆一样漂亮。"],"analysis":"比较句中如果A、B是相同的事物，常常可以省略后边的中心语，以避免重复。这个句子如果说成“这辆汽车跟那辆一样漂亮”，虽然意思上基本相同，但是，句子的重心就发生了某些变化，与原句不太一样了。","id":"q0586","cat":"rewrite","section":"应用练习","bookPage":201,"key":"yingyong-9-用所给的词语改写句子-2"},{"lesson":9,"num":3,"sub":"用所给的词语改写句子","stem":"这个城市经济发展相当快，那个城市经济发展比较慢。(不如)","answers":["那个城市的经济不如这个城市发展快。","那个城市不如这个城市的经济发展快。"],"analysis":"“A不如B+形容词”的意思是“B+形容词”，因此，一定要注意句子前后顺序的安排，否则就会写出错误的句子。","id":"q0587","cat":"rewrite","section":"应用练习","bookPage":201,"key":"yingyong-9-用所给的词语改写句子-3"},{"lesson":9,"num":4,"sub":"用所给的词语改写句子","stem":"张老师以前常常住院，现在几乎不打针不吃药了。 (没有)","answers":["张老师身体以前没有现在好。要味发的","张老师身体以前没有现在这么好。服不十出"],"analysis":"可能有的学生会写出这样的句子：“张老师身体现在没有以前差。”这就错了，因为汉语的比较句中，一般用比较积极意义的词语做比较的差别。","id":"q0588","cat":"rewrite","section":"应用练习","bookPage":201,"key":"yingyong-9-用所给的词语改写句子-4"},{"lesson":9,"num":5,"sub":"用所给的词语改写句子","stem":"临街的宿舍比较吵，可我们的宿舍下边也有个小饭馆啊！ (不比)","answers":["我们的宿舍不比临街的宿舍安静。"],"analysis":"改写后的句子的意思与原句相同，都是说“我们的宿舍不安静”，甚至“比临街的宿舍还要吵”。","id":"q0589","cat":"rewrite","section":"应用练习","bookPage":202,"key":"yingyong-9-用所给的词语改写句子-5"},{"lesson":9,"num":1,"sub":"选择恰当的词语填空","stem":"现在的孩子吃的、穿的、用的＿＿＿我们那个时候完全不一样了。","word":null,"options":{"A":"有","B":"比","C":"像","D":"跟"},"answer":"D","analysis":"A、B不能用在这个句子中，C的“像”只能跟“一样”搭配，构成“像…一样”，而不能用“像…·不一样”。只有D的“跟”才可以构成“跟…一样不一样”。","id":"q0590","cat":"choice","section":"应用练习","bookPage":202,"key":"yingyong-9-选择恰当的词语填空-1"},{"lesson":9,"num":2,"sub":"选择恰当的词语填空","stem":"李龙总是喜欢开夜车，因此每天早上也比我起得晚＿＿＿。","word":null,"options":{"A":"多","B":"得多","C":"太多了","D":"太多"},"answer":"B","analysis":"A、C、D都不能用在比较句中，正确答案只能是“晚得多”。","id":"q0591","cat":"choice","section":"应用练习","bookPage":202,"key":"yingyong-9-选择恰当的词语填空-2"},{"lesson":9,"num":3,"sub":"选择恰当的词语填空","stem":"我们都知道，日韩同学学习汉语特别是汉字比欧美同学＿＿＿。","word":null,"options":{"A":"非常容易","B":"容易得多","C":"一点容易","D":"很多容易"},"answer":"B","analysis":"在比较句中的形容词之前不能使用“非常、一点”，“很多”更不能用在形容词前，只能用在名词之前。正确答案是B。","id":"q0592","cat":"choice","section":"应用练习","bookPage":202,"key":"yingyong-9-选择恰当的词语填空-3"},{"lesson":9,"num":4,"sub":"选择恰当的词语填空","stem":"我觉得在北京生活＿＿＿在别的大城市差。","word":null,"options":{"A":"不如","B":"不比","C":"跟","D":"有"},"answer":"B","analysis":"用A的“不如”不符合比较句的一般要求，即比较句中的差别应该是比较积极意义的词语。C、D不符合语法的要求。市“不比”既符合语法要求，意思上也比较合适。","id":"q0593","cat":"choice","section":"应用练习","bookPage":202,"key":"yingyong-9-选择恰当的词语填空-4"},{"lesson":9,"num":5,"sub":"选择恰当的词语填空","stem":"天坛里边的古松古柏，哪一棵的直径都得＿＿＿七八十公分那么粗。","word":null,"options":{"A":"是","B":"有","C":"在","D":"得"},"answer":"B","analysis":"应该记住“有”字比较句的格式和要求，即“A有B+这么/那么+差别”。","id":"q0594","cat":"choice","section":"应用练习","bookPage":202,"key":"yingyong-9-选择恰当的词语填空-5"},{"lesson":9,"num":6,"sub":"选择恰当的词语填空","stem":"把千家万户的电脑连接起来就＿＿＿一张大网，所以通过电脑了解世界叫上网。","word":null,"options":{"A":"有","B":"比","C":"像","D":"跟回文"},"answer":"C","analysis":"用“网”来比喻电脑网络是最形象的，“像”是最好的比喻词。如果用“跟”，后边一定要有“一样”与它搭配。","id":"q0595","cat":"choice","section":"应用练习","bookPage":203,"key":"yingyong-9-选择恰当的词语填空-6"},{"lesson":9,"num":7,"sub":"选择恰当的词语填空","stem":"约翰才学了半年多汉语，不过他说得比木村＿＿＿要好。","word":null,"options":{"A":"还","B":"太","C":"不","D":"很"},"answer":"A","analysis":"在比较句中，比较的差别之前不能使用表示程度和否定的副词，只能用“还”或“更”。","id":"q0596","cat":"choice","section":"应用练习","bookPage":203,"key":"yingyong-9-选择恰当的词语填空-7"},{"lesson":9,"num":8,"sub":"选择恰当的词语填空","stem":"尽管我英语说得比他好一点儿，可日语说得＿＿＿他。","word":null,"options":{"A":"没有","B":"好多","C":"不比","D":"不如"},"answer":"D","analysis":"在比较句中，只有“A比如B”这个格式之后可以不加任何成分，而“A没有B”或“A不比B”等格式之后都应该有相应的表示差别的成分。","id":"q0597","cat":"choice","section":"应用练习","bookPage":203,"key":"yingyong-9-选择恰当的词语填空-8"},{"lesson":9,"num":9,"sub":"选择恰当的词语填空","stem":"南京的夏天＿＿＿北京热多了，咱们还是去东北玩儿吧。","word":null,"options":{"A":"像","B":"差","C":"比","D":"跟"},"answer":"C","analysis":"“像…·似的”与“跟……一样”是比较固定的格式，“差”在这里不能用，因为它只能在比较句中用做比较的差别。“比”是唯一正确的答案。","id":"q0598","cat":"choice","section":"应用练习","bookPage":203,"key":"yingyong-9-选择恰当的词语填空-9"},{"lesson":9,"num":10,"sub":"选择恰当的词语填空","stem":"今天你说的＿＿＿昨天说的好多了！继续努力。","word":null,"options":{"A":"比","B":"如","C":"像","D":"没"},"answer":"A","analysis":"“得多、多了、一点、一些”等常常用在“比”字句中表示差别的词语之后补","id":"q0599","cat":"choice","section":"应用练习","bookPage":203,"key":"yingyong-9-选择恰当的词语填空-10"},{"lesson":10,"num":1,"sub":"把下列句子改成反问句","stem":"你既然知道今天有雨，就应该带上雨伞。","answers":["你既然知道今天有雨，为什么不带上雨伞呢？","你既然知道今天有雨，怎么不带上雨伞呢？","你不是知道今天有雨吗？为什么不带上雨伞？"],"analysis":"同学们知道，反问句的否定形式可以表达肯定的意思，而且所表达的意思更加明确。前后两个分句都用反问句的形式，更加突出强调作用。","id":"q0600","cat":"rewrite","section":"应用练习","bookPage":207,"key":"yingyong-10-把下列句子改成反问句-1"},{"lesson":10,"num":2,"sub":"把下列句子改成反问句","stem":"我已经告诉了你，你却说不知道。","answers":["我已经告诉了你，你为什么说不知道呢？年瞪案来","我已经告诉了你，你怎么说不知道呢？","我不是已经告诉你了吗？你为什么还说不知道？"],"analysis":"与第一个句子的解释完全相同，应该注意反问句的正确使用。","id":"q0601","cat":"rewrite","section":"应用练习","bookPage":207,"key":"yingyong-10-把下列句子改成反问句-2"},{"lesson":10,"num":3,"sub":"把下列句子改成反问句","stem":"同学们都已经睡觉了，你们别再大声吵了。","answers":["同学们都已经睡觉了，你们还大声吵什么？","同学们都已经睡觉了，你们怎么还大声吵？"],"analysis":"疑问代词除了表示一般疑问的意思以外，构成反问句时具有突出的强调作用。应该注意学会使用。","id":"q0602","cat":"rewrite","section":"应用练习","bookPage":207,"key":"yingyong-10-把下列句子改成反问句-3"},{"lesson":10,"num":4,"sub":"把下列句子改成反问句","stem":"我根本就不清楚今天发生的事情。","answers":["我怎么知道今天发生的事情？","我哪儿知道今天发生的事情！","我凭什么要知道今天发生的事情？"],"analysis":"一般句子是肯定句时，改成反问句一定要用否定形式，而如果一般句子是否定的形式，改成反问句时应该用肯定的形式。","id":"q0603","cat":"rewrite","section":"应用练习","bookPage":207,"key":"yingyong-10-把下列句子改成反问句-4"},{"lesson":10,"num":5,"sub":"把下列句子改成反问句","stem":"自行车找到了，你不用那么着急。","answers":["自行车找到了，你还着什么急？","自行车找到了，你还着急干什么？"],"analysis":"“着急”可以看作是离合词或动宾结构，因此可以把“什么”插入其中；也可以看作是一个形容词，所以“干什么”也可以跟在它的后边。两个句子的意思是完全一样的。","id":"q0604","cat":"rewrite","section":"应用练习","bookPage":207,"key":"yingyong-10-把下列句子改成反问句-5"},{"lesson":10,"num":6,"sub":"把下列句子改成反问句","stem":"我刚来这里，没有人认识我。人遵鞋筛心什","answers":["我刚来这里，谁认识我！","我刚来这里，怎么会有人认识我！","我刚来这里，哪儿会有人认识我？"],"analysis":"“怎么、哪儿”在反问句中常常表示相同的意思，用法也基本一样。","id":"q0605","cat":"rewrite","section":"应用练习","bookPage":207,"key":"yingyong-10-把下列句子改成反问句-6"},{"lesson":10,"num":7,"sub":"把下列句子改成反问句","stem":"他连自行车都不会骑，更不用说开汽车了。","answers":["他连自行车都不会骑，怎么会开汽车呢？","他连自行车都不会骑，哪儿会开汽车呀！"],"analysis":"请参考上面几个句子的简单分析。","id":"q0606","cat":"rewrite","section":"应用练习","bookPage":207,"key":"yingyong-10-把下列句子改成反问句-7"},{"lesson":10,"num":8,"sub":"把下列句子改成反问句","stem":"你本来说跟我们一起去颐和园，现在又说不去了。","answers":["你不是说跟我们一起去颐和园吗？现在怎么又说不去了？"],"analysis":"这个句子的前一分句属于反问句的形式，后边只是询问不去的原因。","id":"q0607","cat":"rewrite","section":"应用练习","bookPage":208,"key":"yingyong-10-把下列句子改成反问句-8"},{"lesson":10,"num":1,"sub":"用疑问代词填空","stem":"都知道我们班的王老师和你们班的张老师是夫妻。","answers":["谁都知道我们班的王老师和你们班的张老师是夫妻。天！"],"analysis":"“谁”在这里表示的是任何人，是疑问代词的引申意义。这个地方不能用其他疑问代词。","id":"q0608","cat":"fill","section":"应用练习","bookPage":208,"key":"yingyong-10-用疑问代词填空-1"},{"lesson":10,"num":2,"sub":"用疑问代词填空","stem":"你们＿＿＿时候来我家我都非常欢迎。","answers":["你们什么时候来我家我都非常欢迎。"],"analysis":"“什么”可以用在表示时间、处所、人物等词语之前，表示任何时间，任何处所，任何人，任何事物等。其他疑问代词没有这么多的用法。","id":"q0609","cat":"fill","section":"应用练习","bookPage":208,"key":"yingyong-10-用疑问代词填空-2"},{"lesson":10,"num":3,"sub":"用疑问代词填空","stem":"他第一次来北京，都想去看看。","answers":["他第一次来北京，哪儿都想去看看。"],"analysis":"同样，这个句子中只能用“哪儿”填空，因为“去看看”的是北京的地方，而不会是人或东西等。","id":"q0610","cat":"fill","section":"应用练习","bookPage":208,"key":"yingyong-10-用疑问代词填空-3"},{"lesson":10,"num":4,"sub":"用疑问代词填空","stem":"种好吃就可以买种。","answers":["哪种好吃就可以买哪种。"],"analysis":"量词之前能够用的疑问代词应该是“哪”，尽管“几、多少”也可以用在这个句子中，但是意思上不合适，语气上也不舒服。","id":"q0611","cat":"fill","section":"应用练习","bookPage":208,"key":"yingyong-10-用疑问代词填空-4"},{"lesson":10,"num":5,"sub":"用疑问代词填空","stem":"大家喜欢＿＿＿去就＿＿＿去，不用考虑那么多。[的坐贫天","answers":["大家喜欢怎么去就怎么去，不用考虑那么多。"],"analysis":"有的同学可能会填上“什么”，因为你只看到了“喜欢”，其实，后边的“去”才是最重要的信息。动词之前的疑问代词一般用“怎么”，名词之前的疑问代词多用“什么”。—一起去就跟一起去吧。","id":"q0612","cat":"fill","section":"应用练习","bookPage":208,"key":"yingyong-10-用疑问代词填空-5"},{"lesson":10,"num":6,"sub":"用疑问代词填空","stem":"你想跟一起去就跟一起去吧。","answers":["你想跟谁一起去就跟谁一起去吧。"],"analysis":"介词“跟”的宾语一般应该是表示人的词语，当然应该使用“谁”。","id":"q0613","cat":"fill","section":"应用练习","bookPage":208,"key":"yingyong-10-用疑问代词填空-6"},{"lesson":10,"num":7,"sub":"用疑问代词填空","stem":"你爸爸肯定又在路上看见新鲜事儿了。","answers":["你爸爸肯定又在路上看见什么新鲜事儿了。"],"analysis":"“新鲜事”是名词性词语，它的前边应该使用“什么”。这里的“什么”表示的是比较虚的意思，即不确定的意思。","id":"q0614","cat":"fill","section":"应用练习","bookPage":208,"key":"yingyong-10-用疑问代词填空-7"},{"lesson":10,"num":8,"sub":"用疑问代词填空","stem":"你要是喜欢个手机就告诉我，我给你买。","answers":["你要是喜欢哪个手机就告诉我，我给你买。"],"analysis":"量词之前的疑问代词应该用“哪”。当然，这个句子中的“哪”也可以用“几、多少”来代替，语法上没有错误，但是不合情理，所以不可以！","id":"q0615","cat":"fill","section":"应用练习","bookPage":208,"key":"yingyong-10-用疑问代词填空-8"},{"lesson":10,"num":9,"sub":"用疑问代词填空","stem":"你们愿意花人钱就花直钱，老板给你们出。","answers":["你们愿意花多少钱就花多少钱，老板给你们出。"],"analysis":"“花钱”一定跟数量有关，但是表示数量的“几”没有这样的用法，只能选择“多少”。","id":"q0616","cat":"fill","section":"应用练习","bookPage":209,"key":"yingyong-10-用疑问代词填空-9"},{"lesson":10,"num":10,"sub":"用疑问代词填空","stem":"小李不知道了，今天又迟到了。","answers":["小李不知道怎么了，今天又迟到了。"],"analysis":"这里的“怎么”表示的是说不清楚的原因，即疑问代词的虚指的用法。不能用“为什么”，因为句尾的“了”不能与“为什么”搭配。","id":"q0617","cat":"fill","section":"应用练习","bookPage":209,"key":"yingyong-10-用疑问代词填空-10"},{"lesson":10,"num":1,"sub":"给词语选择恰当的位置","stem":"既然答应了我们就应该去A做，B你们C能说了话D不算数呢？","word":"怎么","options":null,"answer":"C","analysis":"“怎么…呢”是比较固定的反问句形式，“怎么”要用在主语之后，动词之前。A处不可以用“怎么”，因为“去做”是连动句，中间不能插入其他修饰性成分。","id":"q0618","cat":"pos","section":"应用练习","bookPage":209,"key":"yingyong-10-给词语选择恰当的位置-1"},{"lesson":10,"num":2,"sub":"给词语选择恰当的位置","stem":"那是我们学校A新来的校长，B昨天刚跟大家见过C面，D都认识他。","word":"谁","options":null,"answer":"D","analysis":"“谁”是任何人的意思，在句中应该作“认识他”的主语，所以，D是最恰当的位置。","id":"q0619","cat":"pos","section":"应用练习","bookPage":209,"key":"yingyong-10-给词语选择恰当的位置-2"},{"lesson":10,"num":3,"sub":"给词语选择恰当的位置","stem":"你叔叔这个A人，一定是在B市场上又遇到了C人，聊D起来了。","word":"什么","options":null,"answer":"C","analysis":"一般情况下，“什么”后面应该跟名词。句中“什么”是虚指，即不确定的人。A、B处都不可以插入“什么”，因为“这个人”和“在市场上”都是比较确定的形式。","id":"q0620","cat":"pos","section":"应用练习","bookPage":209,"key":"yingyong-10-给词语选择恰当的位置-3"},{"lesson":10,"num":4,"sub":"给词语选择恰当的位置","stem":"最近A几天我B正好没C工作，咱们可以D好好儿地去玩一玩儿。","word":"什么","options":null,"answer":"C","analysis":"“没什么工作”是没有工作或工作不多的意思。“什么”用在名词前。","id":"q0621","cat":"pos","section":"应用练习","bookPage":209,"key":"yingyong-10-给词语选择恰当的位置-4"},{"lesson":10,"num":5,"sub":"给词语选择恰当的位置","stem":"他们一直A想去西部B像青海、甘肃C比较落后的地方D考察一下。","word":"等","options":null,"answer":"C","analysis":"“等”用在表示列举的词语后是列举未尽的意思，与“什么的”相同。","id":"q0622","cat":"pos","section":"应用练习","bookPage":209,"key":"yingyong-10-给词语选择恰当的位置-5"},{"lesson":10,"num":6,"sub":"给词语选择恰当的位置","stem":"谁能说清楚A他父亲B是C一个D人？","word":"怎样","options":null,"answer":"C","analysis":"“怎样”一般用在动词之前，在这个句子中，动词“是”之前不能用“怎样”。有的学生会把“怎样”放在“人”之前，这就错了，如果“怎样”在“人”前，应该加“的”，或者把“怎样”换成“什么”才可以直接用在“人”前。正确答案只能是C。","id":"q0623","cat":"pos","section":"应用练习","bookPage":209,"key":"yingyong-10-给词语选择恰当的位置-6"},{"lesson":10,"num":7,"sub":"给词语选择恰当的位置","stem":"重要的不是A学了多少，而是B把C学过的内容全都D记住。","word":"怎样","options":null,"answer":"B","analysis":"“怎样”应该位于动词之前，但句子中的三个动词之前都不可以加“怎样”，因为，句子的重心在后边的分句，即“把学过的内容全部都记住”，而“怎样记住学过的内容”才是句子所要表达的重中之重。因此，“怎样”在“把”之前才是最佳的选择。","id":"q0624","cat":"pos","section":"应用练习","bookPage":210,"key":"yingyong-10-给词语选择恰当的位置-7"},{"lesson":10,"num":8,"sub":"给词语选择恰当的位置","stem":"这是A他应该做的，B你C这么大大地D称赞他一番呢？","word":"何必","options":null,"answer":"C","analysis":"“何必”应该用在表示反问的句子中，而且应该用在主语之后谓语之前，因此，C是最好的位置。应该注意，D不能用其他词语，因为按照汉语语法的要求，“地”与动词谓语之间一般不能加其他成分。","id":"q0625","cat":"pos","section":"应用练习","bookPage":210,"key":"yingyong-10-给词语选择恰当的位置-8"},{"lesson":10,"num":9,"sub":"给词语选择恰当的位置","stem":"其实，我们A俩根本就B也C不D认识谁！","word":"谁","options":null,"answer":"B","analysis":"都无法满足这样的要求。","id":"q0626","cat":"pos","section":"应用练习","bookPage":210,"key":"yingyong-10-给词语选择恰当的位置-9"},{"lesson":10,"num":10,"sub":"给词语选择恰当的位置","stem":"你难道A认为B这句话C有些D可笑吗？","word":"不","options":null,"answer":"A","analysis":"这个句子是典型的反问句形式，即“难道……吗？”“不”在句子中的位能是A。当然，如果“可笑”之前没有“有些”，D也可以用“不”，但是，因为有了“有些”，“可笑”之前就不能再用“不”了。","id":"q0627","cat":"pos","section":"应用练习","bookPage":210,"key":"yingyong-10-给词语选择恰当的位置-10"},{"lesson":10,"num":1,"sub":"选择恰当的词语填空","stem":"对于你们的批评和意见，我们没＿＿＿可说的。","word":null,"options":{"A":"什么","B":"怎么","C":"这么","D":"那么"},"answer":"A","analysis":"句子中“可说的”是“的”字结构，即名词的性质。“怎么”一般用在动词之前；“这么、那么”后应该是形容词。只有“什么”才用在名词之前。","id":"q0628","cat":"choice","section":"应用练习","bookPage":210,"key":"yingyong-10-选择恰当的词语填空-1"},{"lesson":10,"num":2,"sub":"选择恰当的词语填空","stem":"入世以后大幅度降低进口关税，＿＿＿会对民族企业造成什么影响吗？","word":null,"options":{"A":"难道","B":"究竞","C":"到底","D":"怎么"},"answer":"A","analysis":"“难道…吗？”是固定的反问句的形式。“到底究竟怎么……呢？”也是比较固定的疑问句形式。","id":"q0629","cat":"choice","section":"应用练习","bookPage":210,"key":"yingyong-10-选择恰当的词语填空-2"},{"lesson":10,"num":3,"sub":"选择恰当的词语填空","stem":"最近我身体不舒服，＿＿＿也不想去，你们自己去吧，不用管我了。","word":null,"options":{"A":"什么","B":"谁","C":"哪儿","D":"多少"},"answer":"C","analysis":"“不想去”的当然是地方，用“哪儿”是最恰当的选择。","id":"q0630","cat":"choice","section":"应用练习","bookPage":211,"key":"yingyong-10-选择恰当的词语填空-3"},{"lesson":10,"num":4,"sub":"选择恰当的词语填空","stem":"他一句话也不说，光拿俩手在那儿比画，我＿＿＿知道是什么意思！","word":null,"options":{"A":"什么","B":"哪儿","C":"多少","D":"才能"},"answer":"B","analysis":"“知道”之前应该用“怎么”，而我们知道，在疑问代词中，“哪儿”的一个用法与“怎么”基本上是一样的。“才能”在这里没有任何意义。","id":"q0631","cat":"choice","section":"应用练习","bookPage":211,"key":"yingyong-10-选择恰当的词语填空-4"},{"lesson":10,"num":5,"sub":"选择恰当的词语填空","stem":"我们刚从乡下进城的时候，＿＿＿都不认识，只能靠一张嘴去到处求人。","word":null,"options":{"A":"什么","B":"怎么","C":"谁","D":"哪"},"answer":"C","analysis":"“认识”的可以是人，也可以是地方。在疑问代词中直接表示人只有“谁”，直接表示地方的是“哪儿”。在这个句子中没有“哪儿”的意思，四个备选答案中也没有“哪儿”这个词语。因此，“谁”是唯一正确的选择。其实，句子后面的“求人”也已经告诉我们正确的答案了。","id":"q0632","cat":"choice","section":"应用练习","bookPage":211,"key":"yingyong-10-选择恰当的词语填空-5"},{"lesson":10,"num":6,"sub":"选择恰当的词语填空","stem":"看你们把我想的，我＿＿＿说过那种伤天害理的话呀！","word":null,"options":{"A":"多会儿","B":"什么","C":"多么","D":"谁的"},"answer":"A","analysis":"“多会儿”是“什么时候”的意思。“多么”后应该跟形容词，“什么、谁的”后应该跟名词。","id":"q0633","cat":"choice","section":"应用练习","bookPage":211,"key":"yingyong-10-选择恰当的词语填空-6"},{"lesson":10,"num":7,"sub":"选择恰当的词语填空","stem":"时代不同了，男人能做的事情，＿＿＿我们女人就不能做吗？","word":null,"options":{"A":"为什么","B":"难怪","C":"难道","D":"怎么"},"answer":"C","analysis":"“难道……吗”是比较固定的搭配。“为什么/怎么…呢”同样是比较固定的搭配。“难怪”不用在反问句中，我们将在下册介绍。","id":"q0634","cat":"choice","section":"应用练习","bookPage":211,"key":"yingyong-10-选择恰当的词语填空-7"},{"lesson":10,"num":8,"sub":"选择恰当的词语填空","stem":"这是大家送给你的，你想＿＿＿吃就吃，没人会说什么。","word":null,"options":{"A":"…·谁…","B":"怎么……怎么.·","C":"什么·.…什么…","D":"多.….··多…··"},"answer":"B","analysis":"“怎么”后跟动词。“什么、多少”后跟名词，“谁”的后边可以跟动词，但在这个句子中不合适，可以用“你想让谁吃就让谁吃”。因此，“怎么”是正确答案。","id":"q0635","cat":"choice","section":"应用练习","bookPage":211,"key":"yingyong-10-选择恰当的词语填空-8"},{"lesson":10,"num":9,"sub":"选择恰当的词语填空","stem":"这个电影的广告吹得很响，实际上＿＿＿好看，演到一半观众就都走了。","word":null,"options":{"A":"怎么没","B":"不怎么","C":"怎么不","D":"没怎么"},"answer":"B","analysis":"，“不怎么忙”是不忙，“不怎么好”是不好，“不“不怎么”有否定的意思，怎么喜欢”当然是不喜欢，“不怎么好看”就是不好看。","id":"q0636","cat":"choice","section":"应用练习","bookPage":211,"key":"yingyong-10-选择恰当的词语填空-9"},{"lesson":10,"num":10,"sub":"选择恰当的词语填空","stem":"祥林嫂＿＿＿也弄不明白，自己已经捐了门槛命运还是那么不好！","word":null,"options":{"A":"什么","B":"怎么","C":"哪儿","D":"谁"},"answer":"B","analysis":"“怎么”在这里是“无论如何”的意思。其他词语都不合适。","id":"q0637","cat":"choice","section":"应用练习","bookPage":212,"key":"yingyong-10-选择恰当的词语填空-10"},{"lesson":10,"num":11,"sub":"选择恰当的词语填空","stem":"我被汽车撞昏以后就＿＿＿都不知道了，醒来已经躺在医院里边了。","word":null,"options":{"A":"什么","B":"怎么","C":"哪儿","D":"多少"},"answer":"A","analysis":"“什么”是名词性的词语，除了后边跟名词性成分外，本身也可以作主语或宾语。“什么”在这里是“任何事情”的意思。","id":"q0638","cat":"choice","section":"应用练习","bookPage":212,"key":"yingyong-10-选择恰当的词语填空-11"},{"lesson":10,"num":12,"sub":"选择恰当的词语填空","stem":"发生这样的问题，怎么能由我一个人来承担＿＿＿。","word":null,"options":{"A":"啊","B":"嘛","C":"呢","D":"吗"},"answer":"C","analysis":"“怎么…呢”是比较固定的搭配形式。","id":"q0639","cat":"choice","section":"应用练习","bookPage":212,"key":"yingyong-10-选择恰当的词语填空-12"},{"lesson":10,"num":13,"sub":"选择恰当的词语填空","stem":"他们不就是想多得到一些报酬 ？＿＿＿给他们就是了！","word":null,"options":{"A":"吧","B":"吗","C":"呢","D":"啊"},"answer":"B","analysis":"“不是…….吗”或“不…吗”同样是比较固定的搭配形式，中间一般插入动词性的成分，也可以是名词性词语。","id":"q0640","cat":"choice","section":"应用练习","bookPage":212,"key":"yingyong-10-选择恰当的词语填空-13"},{"lesson":10,"num":14,"sub":"选择恰当的词语填空","stem":"他肯定是在路上遇到了＿＿＿人，不然的话早就该回来了。","word":null,"options":{"A":"什么","B":"怎么","C":"哪儿","D":"多少"},"answer":"A","analysis":"“什么人”在第3题的第(3)小题中已经介绍过，可以回过头去看看。","id":"q0641","cat":"choice","section":"应用练习","bookPage":212,"key":"yingyong-10-选择恰当的词语填空-14"},{"lesson":10,"num":15,"sub":"选择恰当的词语填空","stem":"以后你喜欢去＿＿＿就去＿＿＿，我不会再多嘴了。","word":null,"options":{"A":"什么…什么","B":"怎么…怎么","C":"哪儿…哪儿","D":"多少…多少"},"answer":"C","analysis":"“去”的后边应该跟动作词语或处所词语，“哪儿”是唯一正确的选择。","id":"q0642","cat":"choice","section":"应用练习","bookPage":212,"key":"yingyong-10-选择恰当的词语填空-15"},{"lesson":11,"num":1,"sub":"分别用“起来、下来、下去、出来、过来、过去”填空","stem":"风停了，雨住了，大海也平静了","answers":["风停了，雨住了，大海也平静了下来。"],"analysis":"“下来”的引申用法有声音、光亮、情绪等由高到低、由强变弱等的意义，如“安静下来、暗下来、冷静下来、低下来”等。","id":"q0643","cat":"fill","section":"应用练习","bookPage":2
