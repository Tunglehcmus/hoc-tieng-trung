key":"bingju-2--15"},{"lesson":3,"num":1,"stem":"他是不老师，他是学生。","analysis":"很多外语中“是”的否定形式是在“是”后加否定词语，但汉语的否定形式只能是在动词之前加否定词语，这一点一定要记住。正确的句子应该是：","corrections":["他不是老师，他是学生。","他不是老师，是学生。"],"extra":[],"id":"q0210","cat":"bingju","section":"病句分析","bookPage":155,"key":"bingju-3--1"},{"lesson":3,"num":2,"stem":"我们的宿舍是礼堂的后边。","analysis":"在汉语表示存现的句子中，用“是”来表示的常常是比较确定的事物，它的形式应该是：处所词语+是+事物名词。上边句子的形式正好相反。正确的句子应该是：","corrections":["礼堂后边是我们的宿舍。","我们的宿舍在礼堂后边。"],"extra":[],"id":"q0211","cat":"bingju","section":"病句分析","bookPage":155,"key":"bingju-3--2"},{"lesson":3,"num":3,"stem":"我们是坐飞机去海南岛旅行了。","analysis":"句子中“坐飞机”是“去海南岛旅行”的方式，而为了强调这个方式，就应该用“是…的”结构，而不应该用“了”。不少学生为了清楚地表达“去海南岛旅行”是过去发生的事情，往往在句尾用“了”与前边的“是”搭配，当然这是还没有弄懂“是…·的”格式的语法功能的结果。应该明确，汉语中没有“是…了”这个格式。正确的句子应该是：","corrections":["我们是坐飞机去海南岛旅行的。","他们坐飞机去海南岛旅行了。"],"extra":[],"id":"q0212","cat":"bingju","section":"病句分析","bookPage":155,"key":"bingju-3--3"},{"lesson":3,"num":4,"stem":"是昨天上午欢迎代表团的大会举行的。","analysis":"这个句子同样是“是……的”格式的问题。在使用这个格式时，同学们一定要弄清楚句子中你想要强调什么，是时间、地点、方式还是目的、用途、归类等等。这个句子显然应该是强调时间。正确的句子应该是：","corrections":["欢迎代表团的大会是昨天上午举行的。","是昨天上午举行的欢迎代表团的大会。"],"extra":[],"id":"q0213","cat":"bingju","section":"病句分析","bookPage":155,"key":"bingju-3--4"},{"lesson":3,"num":5,"stem":"刚才给我看病的那个医生没是他。","analysis":"汉语对“是”的否定只能用“不”，不能用“没”；相反，对“有”的否定则只能用“没”而不能用“不”。因此，正确的句子应该是：","corrections":["刚才给我看病的那个医生不是他。","他不是刚才给我看病的那个医生。"],"extra":[],"id":"q0214","cat":"bingju","section":"病句分析","bookPage":155,"key":"bingju-3--5"},{"lesson":3,"num":6,"stem":"你们坐飞机是不是去上海？","analysis":"“是不是”在句子中的位置一般有三个，即主语之前，主语后谓语前，句子之后，相应地，它们所强调的重点当然也有所不同，即主语、动作和全句。但是有一点应该说明的是，“是不是”在主语后谓语前时，如果谓语有时间、地点、方式状语时，“是不是”一般应该放在状语之前，即强调状语。因此，这个句子最正确的说法应该是：","corrections":["你们是不是坐飞机去上海？","你们坐飞机去上海是不是？","是不是你们坐飞机去上海？"],"extra":[],"id":"q0215","cat":"bingju","section":"病句分析","bookPage":156,"key":"bingju-3--6"},{"lesson":3,"num":7,"stem":"今天是冷的，不过比昨天暖和多了。","analysis":"“是…·的”格式强调的一般是动作发生的时间、地点、方式或动作的目的等等，而句子中的“冷”不在“是··的”强调之列。汉语中的“是”这个词本身也可以起强调作用，还可以组成“A是A”的格式来表达比较特殊的效果。正确的句子应该是：","corrections":["今天是冷，不过比昨天暖和多了。","今天冷是冷，不过比昨天暖和多了。"],"extra":[],"id":"q0216","cat":"bingju","section":"病句分析","bookPage":156,"key":"bingju-3--7"},{"lesson":3,"num":8,"stem":"对不起，我不能跟你们一起去，今天我不有时间。","analysis":"第(5)题我们已经分析过了：“是”的否定形式只能是“不是”；“有”的否定形式则应该是“没有”。正确的句子应该是：","corrections":["对不起，我不能跟你们一起去，今天我没有时间。"],"extra":[],"id":"q0217","cat":"bingju","section":"病句分析","bookPage":156,"key":"bingju-3--8"},{"lesson":3,"num":9,"stem":"刚才我有开会了，所以来晚了。","analysis":"句子中的“开会”本身就是动宾结构，可以直接做谓语。但是，有些学生却把“开会”当作名词，一定要在前边加上一个动词，这就造成了错误。也许有的学生受港台语言的影响，出现“有下雨、有开车、有说话”等病句。正确的句子应该是：","corrections":["刚才我开会了，所以来晚了。","刚才我有会，所以来晚了。"],"extra":[],"id":"q0218","cat":"bingju","section":"病句分析","bookPage":156,"key":"bingju-3--9"},{"lesson":3,"num":10,"stem":"晚上我们一起去吃饭，你有时间没有吗？","analysis":"汉语的疑问句有不同的形式，一般情况下，疑问句(1)与其他的疑问形式不能混用，否则就是错误的句子。“.……吗？”是一种疑问句的形式，“有没有、有……没有？”是另一种疑问句的形式，不能把这两个句子形式混在一起。正确的句子应该是：","corrections":["晚上我们一起去吃饭，你有没有时间？","晚上我们一起去吃饭，你有时间没有？","晚上我们一起去吃饭，你有时间吗？"],"extra":[],"id":"q0219","cat":"bingju","section":"病句分析","bookPage":156,"key":"bingju-3--10"},{"lesson":3,"num":11,"stem":"这个材料对你们很帮助吧？","analysis":"“帮助”既可以做动词，也可以做名词，但都不能受程度副词“很、最、十分、非常”等修饰。句子中在“帮助”前加上“有”就可以解决这个问题了。因为“有”加名词可以受程度副词的修饰，表示评价，比如“很有意思、最有研究、非常有办法、十分有经验”等。正确的句子应该是：","corrections":["这个材料对你们很有帮助吧？","这个材料对你们有帮助吧？"],"extra":[],"id":"q0220","cat":"bingju","section":"病句分析","bookPage":156,"key":"bingju-3--11"},{"lesson":3,"num":12,"stem":"这位老奶奶有三个儿子军人。","analysis":"“有”可以用在兼语句中，它的宾语后一定要有另外的动词。这个句子就是缺少了必要的动词。正确的句子应该是：","corrections":["这位老奶奶有三个儿子是军人。","这位老奶奶有三个儿子当兵。","这位老奶奶有三个当兵的儿子。"],"extra":[],"id":"q0221","cat":"bingju","section":"病句分析","bookPage":157,"key":"bingju-3--12"},{"lesson":3,"num":13,"stem":"我具有一双意大利的皮鞋。","analysis":"“具有”的宾语应该是含有抽象意义的词语，如“特点、特色、风格、意义、理想”等。句子中的“具有”应该用“有”，因为“有”的宾语既可以是具体的事物，也可以是抽象的词语。另外，句子中“意大利”与“皮鞋”之间可以不用“的”。正确的句子应该是：","corrections":["我有一双意大利皮鞋。"],"extra":[],"id":"q0222","cat":"bingju","section":"病句分析","bookPage":157,"key":"bingju-3--13"},{"lesson":3,"num":14,"stem":"我们班拥有八个国家的同学。","analysis":"“拥有”对宾语的要求同样有一定的限制，一般应该是比较抽象而又重要或重大的事物，或者是数量比较多的某一类事物，如“力量、权力、几十所著名学校、·平方公里的土地”等。句子中的“同学”不具备这样的特点，因此不能用“拥有”。正确的句子应该是：","corrections":["我们班有八个国家的同学。"],"extra":[],"id":"q0223","cat":"bingju","section":"病句分析","bookPage":157,"key":"bingju-3--14"},{"lesson":3,"num":15,"stem":"听到这个消息，我心里是说不出的高兴。","analysis":"句子中的“是”应该换成“有”。因为“是”一般表示判断，而“有”表示存在。听到好消息心里高兴是一种很好的状态，应该属于存在类，因此只能用“有”。正确的句子应该是：","corrections":["听到这个消息，我心里有说不出的高兴。","听到这个消息，我心里很高兴。"],"extra":[],"id":"q0224","cat":"bingju","section":"病句分析","bookPage":157,"key":"bingju-3--15"},{"lesson":4,"num":1,"stem":"我们要出发了，你应该把自己的东西收拾。","analysis":"按照汉语语法的要求，在“把”字句中，动词必须有后续成分，不能只是一个动词。句子中“收拾”之后应该用补语来补充说明“收拾”的结果。正确的句子应该是：","corrections":["我们要出发了，你应该把自己的东西收拾好。","我们要出发了，你应该把自己的东西收拾收拾。","我们要出发了，你应该把自己的东西收拾一下。"],"extra":[],"id":"q0225","cat":"bingju","section":"病句分析","bookPage":161,"key":"bingju-4--1"},{"lesson":4,"num":2,"stem":"到了夜里一点，我才把老师留的作业完了。","analysis":"“把”字句是汉语中一种比较特殊的句子形式，它对句子中主要动词的要求比较严格，就是说，并不是任何一个动词都可以直接做“把”字句的主要动词。句子中的“完”在“把”字句中一般只能做补语。类似的词语还有“坏、碎、破、死、掉、丢”等。另外，句子中用了“才”，表示完成作业的时间晚，因此，后边一般不应该再有“了”与之搭配。关于“才”我们将在下册介绍。正确的句子应该是：","corrections":["到了夜里一点，我才把老师留的作业做完。","到了夜里一点，我才做完老师留的作业。"],"extra":[],"id":"q0226","cat":"bingju","section":"病句分析","bookPage":161,"key":"bingju-4--2"},{"lesson":4,"num":3,"stem":"对不起，我把你的衣服脏了。","analysis":"跟上边的句子一样，形容词不能在“把”字句中做主要动词用，形容词在“把”字句中一般只做动词的结果补语。句子中“脏”的前边应该加上另外的动词。像“对、错、干净、清楚、明白”等形容词常常出现在学生的“把”字句中做主要动词一，当然是错误的。正确的句子应该是：","corrections":["对不起，我把你的衣服弄脏了。","对不起，我把你的衣服搞脏了。","对不起，我把你的衣服穿脏了。"],"extra":[],"id":"q0227","cat":"bingju","section":"病句分析","bookPage":161,"key":"bingju-4--3"},{"lesson":4,"num":4,"stem":"我打算把这本书成为英文。","analysis":"“成为”在“把”字句中同样应该做主要动词的补语，而不能单独充当主要成正确的句子应该是：","corrections":["我打算把这本书译成英文。","我打算把这本书翻译成英文。","我打算把这本书翻译成为英文。"],"extra":[],"id":"q0228","cat":"bingju","section":"病句分析","bookPage":161,"key":"bingju-4--4"},{"lesson":4,"num":5,"stem":"按照规定，你们都不能把照相机进里边去。","analysis":"“照相机”自己不能“进里边去”，一定是通过“你们”的某个动作而产生结果。但是，句子中恰恰缺少了这个应该出现的动作，而且，“进去”也恰恰应该做某动词的趋向补语。只要补足谓语成分就可以了。应该注意的是，汉语中表示趋向的动词如“来、去、进去、进来、出去、出来、上去、上来、下去、下来、过去、过来”等一一不能直接用在“把”字句中，应该跟在主要的谓语动词之后来表达意思。正确的句子该是：按照规定，你们不能把照相机带进里边去。按照规定，你们不能把照相机拿进里边去。按照规定，你们不能把照相机带进去。老师把我们的态度注意了一下。这个句子中的“注意”以及“知道、懂、以为、见、相信、同意、喜欢、希望、觉得”等动词，大都表示认知、意愿、心理感受，不能在“把”字句中使用。为什会出现这种情况呢？我们知道，“把”字句中的动词一般应该是动作性比较强的动词，应该能够让句子中的宾语发生位置上的移动或状态上的变化。正确的句子应该是：","corrections":["老师注意了一下我们的态度。","老师观察了一下我们的态度。","老师对我们的态度有所注意。"],"extra":[],"id":"q0229","cat":"bingju","section":"病句分析","bookPage":162,"key":"bingju-4--5"},{"lesson":4,"num":6,"stem":"老师把我们的态度注意了一下。","analysis":"这个句子中的“注意”以及“知道、懂、以为、见、相信、同意、喜欢、望、觉得”等动词，大都表示认知、意愿、心理感受，不能在“把”字句中使用。为什会出现这种情况呢？我们知道，“把”字句中的动词一般应该是动作性比较强的动词，应该能够让句子中的宾语发生位置上的移动或状态上的变化。正确的句子应该是：","corrections":["老师注意了一下我们的态度。","老师观察了一下我们的态度。","老师对我们的态度有所注意。"],"extra":[],"id":"q0230","cat":"bingju","section":"病句分析","bookPage":162,"key":"bingju-4--6"},{"lesson":4,"num":7,"stem":"你把我同学见面了没有？","analysis":"这个句子中的“见面”是离合动词，同学们知道，汉语离合动词本身多是由“动”和“名”组合而成的，也就是说，离合动词本身已经包含了动宾的关系，因此它们一般不能再带宾语。而“把”字句中“把”的宾语恰恰应该是动词的宾语，这样，离合动词和动宾词组如“见面、毕业、结婚、吃饭、睡觉、散步”自然就不能整体用在“把”字句中了。正确的句子应该是：","corrections":["你跟我同学见面了没有？","你见我同学的面了没有？","你见到我同学了没有？"],"extra":["你把饭吃了没有？","咱们还是把婚结了吧。"],"id":"q0231","cat":"bingju","section":"病句分析","bookPage":162,"key":"bingju-4--7"},{"lesson":4,"num":8,"stem":"我把这次旅行的安排没有告诉旅行社。","analysis":"在“把”字句中，具有否定意义的副词“不、没、没有、别、未、不要、从不、从没”等只能放在“把”字的前边，不能放在谓语动词的前边。这一点一定要牢牢记住。正确的句子应该是：","corrections":["我没有把这次旅行的安排告诉旅行社。"],"extra":["他从没把这件事告诉过别人。","你们不要把书放在教室里。","你不把作业做完不能出去玩儿。"],"id":"q0232","cat":"bingju","section":"病句分析","bookPage":162,"key":"bingju-4--8"},{"lesson":4,"num":9,"stem":"你们把书和本子应该放在前边。","analysis":"与否定副词一样，在“把”字句中，能愿动词如“应该、可以、必须、要、想、能、会”等，也应该放在“把”的前边。另外，时间词语在“把”字句中一般也应该用在“把”字之前。正确的句子应该是：","corrections":["你们应该把书和本子放在前边。"],"extra":["我想把这几件衣服洗一洗。","他要把车开到门口去，行吗？","你明天早上7：30把门打开。","我一个晚上就把这本小说看完了。"],"id":"q0233","cat":"bingju","section":"病句分析","bookPage":162,"key":"bingju-4--9"},{"lesson":4,"num":10,"stem":"今天的作业被做完了。","analysis":"汉语的被动句有两种，一是意义上的被动句，即不用“被、让、叫”的被动句；二是有标志的被动句，就是使用“被、让、叫”的被动句。这个句子是不需要用“被”字的，因此，删除“被”即可。正确的句子应该是：","corrections":["今天的作业做完了。"],"extra":[],"id":"q0234","cat":"bingju","section":"病句分析","bookPage":163,"key":"bingju-4--10"},{"lesson":4,"num":11,"stem":"睡了一会儿，她突然被奇怪的声音醒了。","analysis":"与“把”字句的要求几乎一样，“被”字句中的动词也应该能够带宾语，而这个宾语一般应该是句子的主语。上面这个句子中的“醒”不具备带宾语的功能，当然不能直接用做谓语动词，只能做动词的补语。类似的词语还有“掉、破、坏、死、倒”等。正确的句子应该是：","corrections":["睡了一会儿，她突然被奇怪的声音惊醒了。","睡了一会儿，她突然被奇怪的声音吵醒了。","睡了一会儿，她突然被奇怪的声音弄醒了。"],"extra":[],"id":"q0235","cat":"bingju","section":"病句分析","bookPage":163,"key":"bingju-4--11"},{"lesson":4,"num":12,"stem":"昨天我们出去玩儿的时候，没想到被下雨了。","analysis":"被动句的主语一般应该是句子中动词的宾语(即动作的受事)，因此，在一般的被动句中，动词后常常出现的应该是补语，而不是宾语。也就是说，离合式动词或动宾词组一般不能整体用在被动句中。那么，这个句子中的“下雨”整体出现，显然是错的。正确的句子应该是：","corrections":["昨天我们出去玩的时候，没想到被雨淋了。","昨天我们出去玩的时候，没想到突然下雨了。"],"extra":[],"id":"q0236","cat":"bingju","section":"病句分析","bookPage":163,"key":"bingju-4--12"},{"lesson":4,"num":13,"stem":"我们被领导讲了学校的情况。","analysis":"这个句子不具备被动句应有的条件，同样不能使用被动句。为什么这样说呢？因为句子中的主语“我们”与谓语动词“讲”之间根本不存在动与宾或受动关系，而且“讲”本身又带有自己的宾语“学校的情况”。因此，这个句子根本就不应该使用“被”字。正确的句子应该是：","corrections":["领导给我们介绍了学校的情况。","领导给我们讲了学校的情况。","领导把学习的情况给我们讲了讲。"],"extra":[],"id":"q0237","cat":"bingju","section":"病句分析","bookPage":163,"key":"bingju-4--13"},{"lesson":4,"num":14,"stem":"他的宿舍只有星期天才被干净。","analysis":"句子中的形容词“干净”在被动句中与在“把”字句中的要求是一样的，只能做动词的补语，而不能直接做谓语成分。正确的句子应该是：","corrections":["他的宿舍只有星期天才被打扫干净。","他的宿舍只有星期天才会干净。","他的宿舍只有星期天才干净。"],"extra":[],"id":"q0238","cat":"bingju","section":"病句分析","bookPage":163,"key":"bingju-4--14"},{"lesson":4,"num":15,"stem":"我的作业没有做完，难免被老师的批评。","analysis":"在被动句中，“被”及宾语之后必须有动词，句子中的“批评”本来是动词，但在它前边加上“的”以后，它的词性就改变了，变成了动名词，当然也就不符合被动句的要求了。如果保留句子中的“的”，就应该把“被”换成“受”，因为“受”是动词，符合句子的语法要求。正确的句子应该是：","corrections":["我的作业没有做完，难免受老师的批评。","我的作业没有做完，难免被老师批评。"],"extra":[],"id":"q0239","cat":"bingju","section":"病句分析","bookPage":164,"key":"bingju-4--15"},{"lesson":5,"num":1,"stem":"北京的火车站里人真多，我从来没有看那么多人。","analysis":"汉语中的很多单音节动词，一般情况下只表示一个动作，而不表示结果。这个句子中的“看”就只表示简单的动作，而整个句子的意思应该是在北京火车站里“看到”或“看见”那么多人，表示的是“看”的结果。因此，必须注意汉语结果补语的表达形式，即“动+补”。正确的句子应该是：","corrections":["北京的火车站里人真多，我从来没有看见那么多人。","北京的火车站里人真多，我从来没有看到过那么多人。","北京的火车站里人真多，我从来没有看见过那么多人。"],"extra":[],"id":"q0240","cat":"bingju","section":"病句分析","bookPage":168,"key":"bingju-5--1"},{"lesson":5,"num":2,"stem":"妈妈听孩子的话，心里很高兴。","analysis":"同样，“听”也只表示一个简单的动作，而不能清楚地表示动作的结果。但是句子中妈妈“心里很高兴”是因为“听了孩子的话”或“听到孩子的话”。当然，汉语的“听话”还有一个比较特殊的意思，即按照说话人的意思去做，但一般情况下应该是“孩子”听话。可见，这个句子中的“听”用的是一般的意思而不是“听话”的意思。因此，只有给“听”加上结果补语，才能清楚地表达句子的意思。正确的句子应该是：","corrections":["妈妈听了孩子的话，心里很高兴。","妈妈听见孩子的话，心里很高兴。","妈妈听到孩子的话，心里很高兴。"],"extra":[],"id":"q0241","cat":"bingju","section":"病句分析","bookPage":168,"key":"bingju-5--2"},{"lesson":5,"num":3,"stem":"他一说这句话，就把箱子搬走了。","analysis":"“说话”同样只表示一般的动作，而句子中使用了“一……就……”的格式，按照这个固定格式的要求，前一个动作必须是有结果的，后一个动作紧跟着发生。因此，“说”应该补上结果补语“完”才符合汉语语法的要求。关于“一…就…”的用法可以参考第十四课“复句分析”。正确的句子应该是：","corrections":["他一说完这句话，就把箱子搬走了。","他说完话就把箱子搬走了。"],"extra":[],"id":"q0242","cat":"bingju","section":"病句分析","bookPage":168,"key":"bingju-5--3"},{"lesson":5,"num":4,"stem":"我每天晚上都是复习旧课完再预习新课。","analysis":"在第二课我们介绍“了、着、过”时曾经说过，按照汉语语法的要求，汉语句子中无论是动态助词还是各种补语，通常都应该紧跟在动词之后，而不能放在宾语的后面。这个句子中的结果补语“完”用在宾语“旧课”之后是错误的。正确的句子应该是：","corrections":["我每天晚上都是复习完旧课再预习新课。"],"extra":[],"id":"q0243","cat":"bingju","section":"病句分析","bookPage":168,"key":"bingju-5--4"},{"lesson":5,"num":5,"stem":"他不吃完饭就去找朋友了。","analysis":"汉语的结果补语，一般情况下都表示动作在过去发生并且已经有了结果，因此，对带有结果补语的句子加以否定时，通常应该用“没、没有”，而不能用“不”。当然，特殊的情况除外，如“不说完不能走”、“不学好汉语不回国”等。句子中的“出去找朋友”的动作都已经发生了，“吃饭”当然是指过去的动作，对它的否定，应该用“没”。正确的句子应该是：","corrections":["他没吃完饭就去找朋友了。"],"extra":[],"id":"q0244","cat":"bingju","section":"病句分析","bookPage":169,"key":"bingju-5--5"},{"lesson":5,"num":6,"stem":"两年以后我还会回来北京。","analysis":"按照汉语语法的要求，句子中动词带宾语同时又带趋向补语时，宾语如果是处所词语，必须放在趋向补语的“来、去”之前。这个句子中的“北京”就应该放在“回”与“来”之间。正确的句子应该是：","corrections":["两年以后我还会回北京来。"],"extra":[],"id":"q0245","cat":"bingju","section":"病句分析","bookPage":169,"key":"bingju-5--6"},{"lesson":5,"num":7,"stem":"上课已经20分钟了，他才走进来教室。","analysis":"“教室”同样应该放在“进”与“来”之间。正确的句子应该是：","corrections":["上课已经20分钟了，他才走进教室来。"],"extra":[],"id":"q0246","cat":"bingju","section":"病句分析","bookPage":169,"key":"bingju-5--7"},{"lesson":5,"num":8,"stem":"我把水果买来在回家的路上。","analysis":"这个句子的错误不只一处，第一，不应该用“把”字句。一般情况下，这样简单的句子不需要用“把”字来处置宾语。第二，“在回家的路上”应该做状语而不是做补语，因为“买”已经带有“来”做补语了。另外，水果”只是普通名词宾语，它在动词与趋向补语中的位置比较灵活。正确的句子应该是：","corrections":["在回家的路上我买了一些水果来。","在回家的路上我买来了一些水果。","我在回家的路上买来一些水果。"],"extra":[],"id":"q0247","cat":"bingju","section":"病句分析","bookPage":169,"key":"bingju-5--8"},{"lesson":5,"num":9,"stem":"联欢会给我们带欢乐来了。","analysis":"这个句子中的宾语“欢乐”属于抽象性的词语，只能放在补语之后，这也是汉语语法的要求。应该注意的是，这个句子在书面语中，为了加强表达效果，也可以使用“把”字句。正确的句子应该是：","corrections":["联欢会给我们带来了欢乐。","联欢会把欢乐带给了我们。"],"extra":[],"id":"q0248","cat":"bingju","section":"病句分析","bookPage":169,"key":"bingju-5--9"},{"lesson":5,"num":10,"stem":"她把书包放下在旁边。","analysis":"句子中“放下”和“放在旁边”都表示动作的结果，但是意义却有所不同。具体说就是：“放下”是向下的动作，而“放在旁边”则强调具体的位置。这两个补语不能同时出现。正确的句子应该是：","corrections":["她把书包放下。","她把书包放在旁边。"],"extra":[],"id":"q0249","cat":"bingju","section":"病句分析","bookPage":169,"key":"bingju-5--10"},{"lesson":5,"num":11,"stem":"我那年考不上大学，心里非常难过。","analysis":"句子中“考大学”是“那年”的事情，按照汉语习惯，“那年”肯定是以前的某一年。而汉语的可能补语一般表示动作的可能发生或可能结束，基本上是还没有实现的动作。因此，“考不上大学”在句子中就不能清楚地表达意思。应该用结果补语的否定形式。正确的句子应该是：","corrections":["我那年没考上大学，心里非常难过。","那年我没考上大学，心里非常难过。"],"extra":[],"id":"q0250","cat":"bingju","section":"病句分析","bookPage":169,"key":"bingju-5--11"},{"lesson":5,"num":12,"stem":"秀珍找对象的条件太高，所以她不找到男朋友。","analysis":"句子中的“找到”是表示结果的动补关系，既然是已经有结果了，否定形式不能用“不”，而应该用“没”。当然，如果我们把“找朋友”这件事往长远了分析，也可以用可能补语的形式。正确的句子应该是：","corrections":["秀珍找对象的条件太高，所以她没找到男朋友。","秀珍找对象的条件太高，所以她找不到男朋友。"],"extra":[],"id":"q0251","cat":"bingju","section":"病句分析","bookPage":170,"key":"bingju-5--12"},{"lesson":5,"num":13,"stem":"这课的语法比较难，不好好复习就掌不握。","analysis":"“掌握”与“学习、锻炼、运动”等词语一样，是联合动词，不是离合动词，也不是动补结构或动宾词组，因此，两个字是不能分开用的。这样的词语的可能补语的形式也有比较常用的格式。正确的句子应该是：","corrections":["这课的语法比较难，不好好复习就不能掌握。","这课的语法比较难，不好好复习就掌握不了。"],"extra":[],"id":"q0252","cat":"bingju","section":"病句分析","bookPage":170,"key":"bingju-5--13"},{"lesson":5,"num":14,"stem":"我们一定要把这些问题解决得好。","analysis":"汉语的“把”字句中要求比较确定的动作或动作结果，因为它是要对句子中的宾语加以明确的处置；而可能补语表示的却是动作的某种可能性。把这两种句子混在一起，当然不可能清楚地表达句子的意思。另外，从语气上说，前边用了“一定要”，表示了坚定的决心，后边就不应该是表示可能的补语形式了。正确的句子应该是：","corrections":["我们一定要把这些问题解决好。","这些问题我们一定解决得好。","我们一定能把这些问题解决得很好。"],"extra":[],"id":"q0253","cat":"bingju","section":"病句分析","bookPage":170,"key":"bingju-5--14"},{"lesson":5,"num":15,"stem":"过了一个小时以后我才买得到了几张票。","analysis":"“买得到”表示的是“买到”的可能性，而“买到”是“买”的结果。根据这个句子的前后成分，我们能够清楚地知道，“票”已经买到了。因此，不应该用可能补语。另外，句子中使用了“才”，一般就不再用“了”。正确的句子应该是：","corrections":["过了一个小时以后我才买到几张票。","过了一个小时以后，我终于买到了几张票。"],"extra":[],"id":"q0254","cat":"bingju","section":"病句分析","bookPage":170,"key":"bingju-5--15"},{"lesson":6,"num":1,"stem":"听说北京一刮风天气就会变很冷。","analysis":"句子中的“很冷”是“变”的结果或程度，如果想强调结果，用一个“冷”就可以了；如果想强调程度，就应该在“很冷”前加上“得”，这是语法的要求。正确的句子应该是：","corrections":["听说北京一刮风天气就会变冷。","听说北京一刮风天气就会变得很冷。"],"extra":[],"id":"q0255","cat":"bingju","section":"病句分析","bookPage":176,"key":"bingju-6--1"},{"lesson":6,"num":2,"stem":"我们班老师上课开头得很有意思。","analysis":"“开头”是动宾形式，按照语法要求，动宾式的词语是不能再带宾语和补语的，这样的词语如果有补语，也不能放在动宾的“宾”之后，可以重复动词，然后放在动词之后。这个句子修改起来并不十分容易，改变一下句子形式是最有效的办法。可以参考下面三个句子：","corrections":["我们班老师上课，开头很有意思。","我们班老师上课开头讲得很有意思。","我们班老师上课，头儿开得很有意思。"],"extra":[],"id":"q0256","cat":"bingju","section":"病句分析","bookPage":176,"key":"bingju-6--2"},{"lesson":6,"num":3,"stem":"下次作业我一定要写得清楚。","analysis":"这个句子与第五课第14个句子基本相同，都是错在“一定要”后面加上可能补语的形式。其实，“一定要”常常是在表示说话者的决心，后面跟的一般应该是结果补语或程度补语。正确的句子应该是：","corrections":["下次作业我一定要写清楚。","下次作业我一定要写得很清楚。"],"extra":[],"id":"q0257","cat":"bingju","section":"病句分析","bookPage":176,"key":"bingju-6--3"},{"lesson":6,"num":4,"stem":"她来到教室以后，我们班里的气氛变了很热闹。","analysis":"动词与程度补语之间唯一的标志是“得”，句子中用“了”显然是错的。如果句子一定要用“了”，就应该把“了”放在句尾，同时去掉“很”。正确的句子应该是：","corrections":["她来到教室以后，我们班里的气氛变得很热闹。","她来到教室以后，我们班里的气氛变热闹了。","她来到教室以后，我们班里的气氛热闹起来了。"],"extra":[],"id":"q0258","cat":"bingju","section":"病句分析","bookPage":176,"key":"bingju-6--4"},{"lesson":6,"num":5,"stem":"你的鞋破着很厉害，应该换换了。","analysis":"与“了”一样，“着”同样不能用在动词与程度补语之间，应该把“着”换成“得”。正确的句子应该是：","corrections":["你的鞋破得很厉害，应该换换了。"],"extra":[],"id":"q0259","cat":"bingju","section":"病句分析","bookPage":176,"key":"bingju-6--5"},{"lesson":6,"num":6,"stem":"听说你们班张老师病得很。","analysis":"“很”一般在形容词谓语前做状语，有时也可以跟“得”构成“得很”，显然后做形容词谓语的补语，表示程度高。但句子中的“病”只能做名词或动词，因此，“得很”不能跟在“病”的后面。正确的句子应该是：","corrections":["听说你们班张老师病得很厉害。","听说你们班张老师病得很重。","听说你们班张老师的病重得很。"],"extra":[],"id":"q0260","cat":"bingju","section":"病句分析","bookPage":177,"key":"bingju-6--6"},{"lesson":6,"num":7,"stem":"他的英语不说得很流利。","analysis":"一般程度补语的否定形式应该是“动词+得+不+形容词”，即否定的应该是表示程度的补语成分，而不应该是动词。正确的句子应该是：","corrections":["他的英语说得不很流利。","他说英语说得不很流利。"],"extra":[],"id":"q0261","cat":"bingju","section":"病句分析","bookPage":177,"key":"bingju-6--7"},{"lesson":6,"num":8,"stem":"他踢足球踢得很好极了。","analysis":"“很好”和“好极了”都表示“好”的程度相当高，用其中的一个就足以达到表达效果了，两种形式用在一起则使句子显得罗嗦。正确的句子应该是：","corrections":["他踢足球踢得很好。","他踢足球踢得好极了。"],"extra":[],"id":"q0262","cat":"bingju","section":"病句分析","bookPage":177,"key":"bingju-6--8"},{"lesson":6,"num":9,"stem":"我把我的衣服放在洗衣机。","analysis":"由“在”组成的介宾词组中的“宾”，一般应该是表示时间或处所的词语。“洗衣机”只是物，不表示处所。应该用“在…里”确切地表示处所。正确的句子应该是：","corrections":["我把我的衣服放在洗衣机里。","我把我的衣服放在洗衣机里了。"],"extra":[],"id":"q0263","cat":"bingju","section":"病句分析","bookPage":177,"key":"bingju-6--9"},{"lesson":6,"num":10,"stem":"中国是十三亿人口住在的地方。","analysis":"这是不少日本同学容易出现的病句，特别是“住在”这个词，按照汉语的语法要求，“在”的后边一定要有处所词语，否则不能清楚地表示意思。这个句子应该进行比较大的调整，请参考下面的句子：","corrections":["中国是拥有十三亿人口的国家。","中国有十三亿人口。","世界上有十三亿人口住在中国。","中国是十三亿人口生活的地方。"],"extra":[],"id":"q0264","cat":"bingju","section":"病句分析","bookPage":177,"key":"bingju-6--10"},{"lesson":6,"num":11,"stem":"我们都是一起来从同一个城市。","analysis":"由“从”组成的介宾词组在句子中只能做状语，即用在动词之前。句子中的“从”如果换成“自”就没有这些问题了。正确的句子应该是：","corrections":["我们都是从同一个城市来的。","我们都来自同一个城市。","我们是从同一个城市一起来的。"],"extra":[],"id":"q0265","cat":"bingju","section":"病句分析","bookPage":177,"key":"bingju-6--11"},{"lesson":6,"num":12,"stem":"老师对我们非常热情，一直到楼下送我们。","analysis":"“一直到楼下送我们”的语序混乱，表义不清楚。汉语中“到机场送朋友”与“送朋友到机场”的意思不一样；同样，“到楼下送我们”和“送我们到楼下”的意思也有明显的区别。句子中加上“一直”应该表示“送”的动作没有停顿，因此，正确的句子应该是：","corrections":["老师对我们非常热情，一直送我们到楼下。","老师对我们非常热情，一直把我们送到楼下。","老师对我们非常热情，把我们一直送到楼下。"],"extra":[],"id":"q0266","cat":"bingju","section":"病句分析","bookPage":177,"key":"bingju-6--12"},{"lesson":6,"num":13,"stem":"我们要在这里到明年七月一直学习。","analysis":"这个句子同样有“一直”，强调“学习”的不间断。那么，“学习”的后边就应该有时间词语补充说明“学习”到什么时候。又是语序出现了问题。正确的句子应该是：","corrections":["我们要在这里一直学习到明年七月。","我们一直要在这里学习到明年七月。"],"extra":[],"id":"q0267","cat":"bingju","section":"病句分析","bookPage":178,"key":"bingju-6--13"},{"lesson":6,"num":14,"stem":"我们学习的课程相当二年级的水平。","analysis":"这个句子的意思应该是：我们是一年级的学生，但是我们学习的课程跟二年级的水平差不多。而句子中缺少了一个与“跟”相当的词语，汉语中在“相当”的后面常常用“于”，句子里恰恰少了这个字。具体说就是句子里应该用介宾词组做补语。正确的句子应该是：","corrections":["我们学习的课程相当于二年级的水平。","我们学习的课程跟二年级的水平相当。"],"extra":[],"id":"q0268","cat":"bingju","section":"病句分析","bookPage":178,"key":"bingju-6--14"},{"lesson":6,"num":15,"stem":"大家都知道吸烟有害对健康。","analysis":"汉语的介宾词组在句子中既可以做状语，也可以做补语。但是，多数介宾词组只能做状语。这个句子中由“对”组成的介宾词组一般应该在动词之前做状语，而句子中却处在了补语的位置上。如果去掉“对”或把“对”换成“于”，问题就不存在了。正确的句子应该是：","corrections":["大家都知道吸烟对健康有害。","大家都知道吸烟有害健康。","大家都知道吸烟有害于健康。"],"extra":[],"id":"q0269","cat":"bingju","section":"病句分析","bookPage":178,"key":"bingju-6--15"},{"lesson":7,"num":1,"stem":"来北京以前，我在我们国家学习汉语三年。放在宾语“汉语”之后。有的同学还喜欢把“三年”放在“学习”之前做状语，同样不符合汉语语法的要求。汉语中表示时段的时间词语在句子中一般做补语，做状语时句子应该是否定的形式。表示时点的时间词语才可以做状语，如“6点起床”、“8点上课”等。正确的句子应该是：来北京以前，我在我们国家学习了三年汉语。来北京以前，我在国内学习过三年汉语。","analysis":"句子中的“三年”应该做“学习”的时量补语，只能放在“学习”之后，不能放在宾语“汉语”之后。有的同学还喜欢把“三年”放在“学习”之前做状语，同样不符合汉语语法的要求。汉语中表示时段的时间词语在句子中一般做补语，做状语时句子应该是否定的形式。表示时点的时间词语才可以做状语，如“6点起床”、“8点上课”等。正确的句子应该是：","corrections":["来北京以前，我在我们国家学习了三年汉语。","来北京以前，我在国内学习过三年汉语。"],"extra":[],"id":"q0270","cat":"bingju","section":"病句分析","bookPage":182,"key":"bingju-7--1"},{"lesson":7,"num":2,"stem":"在上个星期的联欢会上，我们表演了节目十五分钟。","analysis":"“十五分钟”同样要放在动词“表演”之后，而不能放在宾语“节目”之后，这是时量补语与宾语的位置关系。正确的句子应该是：","corrections":["在上个星期的联欢会上，我们表演了十五分钟节目。"],"extra":[],"id":"q0271","cat":"bingju","section":"病句分析","bookPage":182,"key":"bingju-7--2"},{"lesson":7,"num":3,"stem":"她一个人在宿舍里流泪了一个晚上。","analysis":"动态助词“了”和时量补语“一个晚上”都应该紧跟动词“流”，尽管“流泪”结合得比较紧，但它仍是动宾的形式，在句子中有补语时必须分开使用。正确的句子应该是：","corrections":["她一个人在宿舍里流了一个晚上泪。","她一个人在宿舍里哭了一个晚上。"],"extra":[],"id":"q0272","cat":"bingju","section":"病句分析","bookPage":182,"key":"bingju-7--3"},{"lesson":7,"num":4,"stem":"我来中国以前学过太极拳三个月。","analysis":"这个句子与第(1)题的错误完全相同。“三个月”必须放在动词“学”之后。正确的句子应该的：","corrections":["我来中国以前学过三个月太极拳。"],"extra":[],"id":"q0273","cat":"bingju","section":"病句分析","bookPage":182,"key":"bingju-7--4"},{"lesson":7,"num":5,"stem":"电话响着很长时间，他竟然没有醒来。","analysis":"按照汉语表达上的要求，持续的动作或状态一般不能用具体的时间来说明。句子中“响着”是正在持续的动作或状态，后边的“很长时间”不能清楚地表达语义。正确的句子应该是：","corrections":["电话响着，他竟然没有醒来。","电话不停地响着，他竟然没有醒来。","电话响了很长时间，他竟然没有醒来。"],"extra":[],"id":"q0274","cat":"bingju","section":"病句分析","bookPage":182,"key":"bingju-7--5"},{"lesson":7,"num":6,"stem":"我们俩几个小时谈话以后就分手了。","analysis":"这个句子中的“几个小时”是表示时段的时间词语，在肯定句中不能做状语，只能做补语。如果考虑到“几个小时”的时间比较长，句子中的“就”也可以改用“才”。正确的句子应该是：","corrections":["我们俩谈了几个小时话以后就分手了。","我们俩谈了几个小时的话才分手。"],"extra":[],"id":"q0275","cat":"bingju","section":"病句分析","bookPage":183,"key":"bingju-7--6"},{"lesson":7,"num":7,"stem":"我看了十天你借给我的那本中文小说，才看完。","analysis":"这个句子中的宾语“你借给我的那本中文小说”比较长，如果放在宾语的位置上容易使句子的意思表达不清楚，而且与后边的“才看完”的衔接也存在问题。这样的句子，宾语常常可以提到句首。正确的句子应该是：","corrections":["你借给我的那本中文小说我看了十天才看完。"],"extra":[],"id":"q0276","cat":"bingju","section":"病句分析","bookPage":183,"key":"bingju-7--7"},{"lesson":7,"num":8,"stem":"来中国后我已经去两次过长城。","analysis":"动态助词“了、着、过”与谓语动词的关系比时量补语、动量补语要紧密得多，因此，句子中的“过”应该紧跟动词“去”。另外，在前边的分析中我们说过，句子有“已经”时，相应地要在后边出现“了”，否则句子好像还没有说完。正确的句子应该是：","corrections":["来中国后我已经去过两次长城了。","来中国后我去过两次长城。"],"extra":[],"id":"q0277","cat":"bingju","section":"病句分析","bookPage":183,"key":"bingju-7--8"},{"lesson":7,"num":9,"stem":"小王，你帮我排队一下儿，我很快就回来。","analysis":"“排队”在一些语言中可能只是一个词，但在汉语中它是一个动宾词组，是可分的。因此，“一下儿”应该紧跟“排”，将“队”放在宾语的位置上。正确的句子应该是：","corrections":["小王，你帮我排一下儿队，我很快就回来。"],"extra":[],"id":"q0278","cat":"bingju","section":"病句分析","bookPage":183,"key":"bingju-7--9"},{"lesson":7,"num":10,"stem":"他来找过三次你了，你都不在。","analysis":"“你”虽然在句子中也是宾语，但是，它是代词宾语，而按照汉语语法的要求，在句子中的动词带代词宾语同时又有时量补语或动量补语时，宾语一定要放在补语之前。正确的句子应该是：","corrections":["他来找过你三次了，你都不在。了姓资牵小，工限不跟附幸行言的岁"],"extra":[],"id":"q0279","cat":"bingju","section":"病句分析","bookPage":183,"key":"bingju-7--10"},{"lesson":7,"num":11,"stem":"我朋友每星期一次来我房间。","analysis":"动量补语“一次”应该放在动词“来”的后边。但是，这个句子比较特别，“一次”的位置似乎比较灵活。参考下面的句子：","corrections":["我朋友每星期来一次我的房间。","我朋友每星期来我房间一次。","我朋友每星期到我房间来一次。果眼，影屏"],"extra":[],"id":"q0280","cat":"bingju","section":"病句分析","bookPage":183,"key":"bingju-7--11"},{"lesson":7,"num":12,"stem":"我姐姐三岁比我大。","analysis":"数量补语一般用在比较句当中，它的格式应该是“A比B+形容词+补语”。这个句子中的“三岁”是比较后的差别，因此，当然应该放在句尾。正确的句子应该是：","corrections":["我姐姐比我大三岁。    京一大府羽日主阳","我比我姐姐小三岁。    月个两大府出日主的#世不人铺同最府味资"],"extra":[],"id":"q0281","cat":"bingju","section":"病句分析","bookPage":183,"key":"bingju-7--12"},{"lesson":7,"num":13,"stem":"你的书比我的书一些多。","analysis":"数量补语有时是明确而具体的，有时又是比较模糊的，但是它们的位置是固定的，即在句尾。这个句子中的“一些”也不例外。正确的句子应该是：","corrections":["你的书比我的书多一些。"],"extra":[],"id":"q0282","cat":"bingju","section":"病句分析","bookPage":184,"key":"bingju-7--13"},{"lesson":7,"num":14,"stem":"我们班多你们班六个学生。","analysis":"这是不少学生容易说出或写出的错句。句子缺少“比”字，也就造成“多”的位置使用错误。正确的句子应该是：","corrections":["我们班比你们班多六个学生。"],"extra":[],"id":"q0283","cat":"bingju","section":"病句分析","bookPage":184,"key":"bingju-7--14"},{"lesson":7,"num":15,"stem":"我比你们来得早一个月。完下”","analysis":"这个句子中的错误不只是数量补语使用方面的问题，还有“早”的位置问题。一般来说，比较句中很少出现普通动词，即使出现，也应该有相应的形容词与之配合。那么，这个形容词到底作状语还是作补语，要看具体的语言环境。参考下面的句子：","corrections":["我比你们来得早。","我比你们早来一个月。","我比你们早来了一个月。"],"extra":[],"id":"q0284","cat":"bingju","section":"病句分析","bookPage":184,"key":"bingju-7--15"},{"lesson":8,"num":1,"stem":"山本叫我在操场不等她。","analysis":"在兼语句中，否定副词和能愿动词等应该放在第一个动词之前，不能放在第二个动词之前。正确的句子应该是：","corrections":["山本不叫我在操场等她。","山本没叫我在操场等她。"],"extra":[],"id":"q0285","cat":"bingju","section":"病句分析","bookPage":190,"key":"bingju-8--1"},{"lesson":8,"num":2,"stem":"老师短时间里就让我们能说简单的汉语。","analysis":"能愿动词“能”应该修饰具有使令意义的动词“让”，意思是“老师”具备某种能力。正确的句子应该是：","corrections":["老师短时间里就能让我们说简单的汉语。"],"extra":[],"id":"q0286","cat":"bingju","section":"病句分析","bookPage":190,"key":"bingju-8--2"},{"lesson":8,"num":3,"stem":"新老师请了同学们介绍一下自己的情况。","analysis":"在兼语句和连动句中，“了、着、过”一般只放在第二个动词之后，不放在第一个动词之后。句子中的“了”应该后移，也可以干脆不用这个“了”。正确的句子应该是：","corrections":["新老师请同学们介绍了一下儿自己的情况。","新老师请同学们介绍一下儿自己的情况。"],"extra":[],"id":"q0287","cat":"bingju","section":"病句分析","bookPage":190,"key":"bingju-8--3"},{"lesson":8,"num":4,"stem":"王老师请我叫您去参加讨论会。","analysis":"在兼语句里经常使用的第一个动词“请、让、叫、使、令、派”中，“请”尽管具有客气的意思，但常常是下级对上级、学生对老师、子女对父母、年少者对年长者说话时使用，虽然反过来也表示同样的意思，但在转述老师的话时应该有所改变。句子中的“请”与“叫”只要调换一下位置就可以了。正确的句子应该是：","corrections":["王老师叫我请您去参加讨论会。","王老师让我请您去参加讨论会。"],"extra":[],"id":"q0288","cat":"bingju","section":"病句分析","bookPage":190,"key":"bingju-8--4"},{"lesson":8,"num":5,"stem":"他只会使人做这做那，自己从来不干。","analysis":"在兼语句中，“使”的主语一般可以是人、事、物，宾语一般是人，其后的动词一般不应该是表示动作的动词，而多是“满意、理解、生气、吃惊、想起、感觉”等与心理活动有关的词语。句子中的“做这做那”属于具体的动作，不符合“使”字的要求。正确的句子应该是：","corrections":["他只会叫人做这做那，自己却从来不干。","他只会让人做这做那，自己却从来不干。","他只知道让人干这干那，自己却从来不干。","他只知道命令人干这干那，自己却从来不干。"],"extra":[],"id":"q0289","cat":"bingju","section":"病句分析","bookPage":190,"key":"bingju-8--5"},{"lesson":8,"num":6,"stem":"我常常去去图书馆看书学习。","analysis":"“去图书馆”与“看书学习”是两个连续的动作，而且后一个动作是前一个动作的目的。“去图书馆”应该是比较正式的事情，不能用“去去图书馆”这样随意的形式来表示。汉语中动词的重叠常表示轻松随意的事情，而“去图书馆看书”则是比较严肃的事情。在连动句中，只有后一个动词可以有重叠的形式。正确的句子应该是：","corrections":["我常常去图书馆看书学习。","我常去图书馆看书学习。","我常去图书馆看看书，学习学习。"],"extra":[],"id":"q0290","cat":"bingju","section":"病句分析","bookPage":191,"key":"bingju-8--6"},{"lesson":8,"num":7,"stem":"同学们选了我班长。","analysis":"这是一个兼语句，但是因为丢掉了兼语后的动词，因此，使这个句子不能清楚地表达意思。正确的句子应该是：","corrections":["同学们选我当班长。","同学们选我做班长。","同学们选我为班长。"],"extra":[],"id":"q0291","cat":"bingju","section":"病句分析","bookPage":191,"key":"bingju-8--7"},{"lesson":8,"num":8,"stem":"每当见到朋友的时候，他总是有很多事告诉。","analysis":"这个句子中“告诉”的对象没有说清楚，也就好像句子没有说完整。应该补足句子中“告诉”的宾语。正确的句子应该是：","corrections":["每当见到朋友的时候，他总是有很多事告诉大家。","每当见到朋友的时候，他总是有很多事跟朋友们说。。"],"extra":[],"id":"q0292","cat":"bingju","section":"病句分析","bookPage":191,"key":"bingju-8--8"},{"lesson":8,"num":9,"stem":"我两年以前来过中国学习汉语。","analysis":"在第二课中我们已经分析过了，“了、过”一般不能用在连动句的第一个动词之后，只能用在连动句的第二个动词之后。正确的句子应该是：","corrections":["我两年以前来中国学习过汉语。","我两年以前来中国学过汉语，进武要谢都题","我两年前来过中国，那时也是学习汉语。"],"extra":[],"id":"q0293","cat":"bingju","section":"病句分析","bookPage":191,"key":"bingju-8--9"},{"lesson":8,"num":10,"stem":"很多旅游者来这儿开着汽车。","analysis":"这是很多同学容易出现的错误。他们把母语的语法照搬到汉语中来，才有这样的句子。应该注意的是，句子中“开着汽车”是“来这儿”的方式，必须放在“来这儿”之前。正确的句子应该是：","corrections":["案答参区日","很多旅游者开着汽车来这儿。","很多旅游者开着汽车来这儿玩儿。"],"extra":[],"id":"q0294","cat":"bingju","section":"病句分析","bookPage":191,"key":"bingju-8--10"},{"lesson":8,"num":11,"stem":"在天安门广场上人山人海的。","analysis":"存现句的主语一般应该是表示处所的词语，但汉语表示处所的词语做主语时有这样一个特点，即一般不用“在”这个介词。如“教室里有很多人”，“桌子上放着几本书”，“墙上挂着两张世界地图”，“楼下停着几辆名牌汽车”等等。因此，句子中的“在天安门广场上”应该去掉“在”，否则只能做状语。正确的句子应该是：","corrections":["天安门广场上人山人海的。","天安门广场上有很多人。"],"extra":[],"id":"q0295","cat":"bingju","section":"病句分析","bookPage":191,"key":"bingju-8--11"},{"lesson":8,"num":12,"stem":"树后边走出这个人来。","analysis":"存现句中的宾语一般应该是不确定的，因此，宾语前的定语一般应该用“一个、几辆、两张、一群、三本”等数量词语，而不会用“这个、那个、这张、那本”等指定代词。句子中的“这个人”不符合存现句的要求。正确的句子应该是：","corrections":["树后边走出一个人来。","树后边走出来一个人。"],"extra":[],"id":"q0296","cat":"bingju","section":"病句分析","bookPage":192,"key":"bingju-8--12"},{"lesson":8,"num":13,"stem":"椅子上放在几个同学的书。","analysis":"“在”这个介词要求它的后续成分是时间词语，或者是处所词语，不应该是人或事物性的词语。另外，由“在”组成的表示存在的句子中，学“在”的前边应该是表示事物的词语，后边则应该是表示处所的词语。这个句子则是把几个不同的句子形式混合在了一起。正确的句子应该是：","corrections":["椅子上放着几个同学的书。","那几个同学的书放在椅子上。","那几个同学的书在椅子上。","那几个同学的书在椅子上放着。"],"extra":[],"id":"q0297","cat":"bingju","section":"病句分析","bookPage":192,"key":"bingju-8--13"},{"lesson":8,"num":14,"stem":"玛丽的箱子里放着了一些衣服。","analysis":"这个句子同样是把不应该用在一起的“着”与“了”混在了一起，其实，把它们分开用就可以了。正确的句子应该是：","corrections":["玛丽的箱子里放着一些衣服。","玛丽的箱子里放了一些衣服。","玛丽的箱子里有一些衣服。"],"extra":[],"id":"q0298","cat":"bingju","section":"病句分析","bookPage":192,"key":"bingju-8--14"},{"lesson":8,"num":15,"stem":"在昨天学校门口发生了一起交通事故。","analysis":"与表示处所的词语一样，汉语中表示时间的词语用在句首时一般也不会用介词“在”，如“早上又下雨了”，“去年我们一起来北京”，“八点我有课”，“上个月我去了一次上海”，“2003年有非常重要的事情要发生”等。句子中的“在”是多余的。正确的句子应该是：","corrections":["昨天学校门口发生了一起交通事故。","学校门口昨天发生了一起交通事故。"],"extra":[],"id":"q0299","cat":"bingju","section":"病句分析","bookPage":192,"key":"bingju-8--15"},{"lesson":9,"num":1,"stem":"我们那儿教汉语的方法比中国不一样。","analysis":"汉语的比较句有几种形式，“A比B”的后边必须跟比较的差别，即表示差别的形容词语；“A跟B一样”的后边同样也应该有表示比较的差别的形容词，有时也可以省略。但是，无论如何，这两种形式不能混用。句子中的错误恰恰是把这两种形式混在了一起。正确的句子应该是：","corrections":["我们那儿教汉语的方法比中国好。","我们那儿教汉语的方法比中国差。","我们那儿教汉语的方法跟中国不一样。"],"extra":[],"id":"q0300","cat":"bingju","section":"病句分析","bookPage":197,"key":"bingju-9--1"},{"lesson":9,"num":2,"stem":"那位老师教课的方法比别的老师不同。","analysis":"这个句子跟上一个句子的错误是相同的，只是“一样”换成了“同”。正确的句子应该是：","corrections":["那位老师教课的方法比别的老师好。","那位老师教课的方法比别的老师差。","那位老师教课的方法跟别的老师不一样。","那位老师教课的方法跟别的老师不同。"],"extra":[],"id":"q0301","cat":"bingju","section":"病句分析","bookPage":197,"key":"bingju-9--2"},{"lesson":9,"num":3,"stem":"他们的房间比我们的非常小。","analysis":"按照汉语比较句的语法要求，在“A比B”的比较句中，比较的结果即差别之前不能再用表示程度的副词，如“很、非常、十分、太、最、特别”等，只能用“更、还”这两个词语。这个句子错就错在这里。正确的句子应该是：","corrections":["他们的房间比我们的小。","他们的房间比我们的小多了。","他们的房间比我们的小得多。","他们的房间比我们的小很多。"],"extra":[],"id":"q0302","cat":"bingju","section":"病句分析","bookPage":197,"key":"bingju-9--3"},{"lesson":9,"num":4,"stem":"在北京买衣服比在我们国家太便宜。","analysis":"这个句子的错误与上一个句子完全相同。正确的句子应该是：","corrections":["在北京买衣服比在我们国家买便宜。","在北京买衣服比在我们国家买便宜多了。","在北京买衣服比在我们国家买便宜得多。","在北京买衣服比在我们国家买便宜很多。"],"extra":[],"id":"q0303","cat":"bingju","section":"病句分析","bookPage":197,"key":"bingju-9--4"},{"lesson":9,"num":5,"stem":"我的汉语水平比其他同学不高。","analysis":"“A比B”的否定形式应该把“不”放在“比”字之前，不能放在表示比较的差别词语即形容词之前，即“A不比B+差别”。正确的句子应该是：","corrections":["我的汉语水平不比其他同学高。","我的汉语水平比其他同学低。","我的汉语水平跟其他同学一样。"],"extra":[],"id":"q0304","cat":"bingju","section":"病句分析","bookPage":197,"key":"bingju-9--5"},{"lesson":9,"num":6,"stem":"他只有星期天才收拾屋子，那时候他的屋子比谁的干净。","analysis":"句子中的“谁”是“任何人”的意思，按照语法的要求，这时候，在谓语前应该加“都”与“谁”呼应。句子中就缺少了“都”这个词语。关于“疑问代词”的用法，我们将在下一课介绍。正确的句子应该是：","corrections":["他只有星期天才收拾屋子，那时候他的屋子比谁的都干净。"],"extra":[],"id":"q0305","cat":"bingju","section":"病句分析","bookPage":198,"key":"bingju-9--6"},{"lesson":9,"num":7,"stem":"这本书的内容不跟那本书一样。8 仓而不是在“跟”之前，尽管在口语中有人这样用。正确的句子应该是：这本书的内容跟那本书不一样。","analysis":"汉语比较句中“A跟B一样”的否定形式应该是在“一样”前加否定词语，而不是在“跟”之前，尽管在口语中有人这样用。正确的句子应该是：","corrections":["这本书的内容跟那本书不一样。"],"extra":[],"id":"q0306","cat":"bingju","section":"病句分析","bookPage":198,"key":"bingju-9--7"},{"lesson":9,"num":8,"stem":"那部电影不如这部电影那么有意思。","analysis":"在汉语的比较句中，一定要弄清楚每个句子的确切的意思。如果把比较句进行简单的拆分，“A比B+形容词”的比较句，其实意思就是“A+形容词”，如“我比你大”，意思是“我大”；“A不如/没有B+形容词”的比较句，真正的意思应该是“B+形容词”，如“我不如/没有你大”，意思是“你大”。那么，上面的句子的意思就应该是“这部电影有意思”。既然如此，“有意思”前就应该用“这么”而不是“那么”。因为“这么”常常说离我们近的时间或事物，“那么”则常常说离我们比较远的时间或事物。正确的句子应该是：","corrections":["那部电影不如这部电影这么有意思。","那部电影没有这部电影这么有意思。"],"extra":[],"id":"q0307","cat":"bingju","section":"病句分析","bookPage":198,"key":"bingju-9--8"},{"lesson":9,"num":9,"stem":"我哥哥身体没有你哥哥那么高。","analysis":"用“有、没有”表示比较的句子中，在比较的差别之前应该有“这么、那么”等词语。一般情况下，不管是人物、处所、时间还是其他什么成分，离说话者近时用“这么”，反之用“那么”。这个句子的问题不是比较的词语，而是比较的主体，“身体”应该用“个子”或“身高”，因为“身体”只能说好、坏，“个子”才是高、矮。正确的句子应该是：","corrections":["我哥哥的个子没有你哥哥那么高。","我哥哥没有你哥哥那么高。"],"extra":[],"id":"q0308","cat":"bingju","section":"病句分析","bookPage":198,"key":"bingju-9--9"},{"lesson":9,"num":10,"stem":"我写的汉字不如他写的好看得多。","analysis":"在“比”字句中，比较的差别之后可以有补充成分，但是，用“没有、不如”表示比较的句子中，表示差别的词语后一般不能再带补语，在差别词语前可以用“这么、那么”。正确的句子应该是：","corrections":["我写的汉字不如他写的好看。","我写的汉字没有他写的那么好看。"],"extra":[],"id":"q0309","cat":"bingju","section":"病句分析","bookPage":198,"key":"bingju-9--10"},{"lesson":9,"num":11,"stem":"我们学校女同学比男同学一千人多了。","analysis":"比较句的形容词后可以带数量补语，因此，句子中的“一千人”可以放在“多”的后边做数量补语。正确的句子应该是：","corrections":["我们学校女同学比男同学多了一千人。","我们学校女同学比男同学多一千人。"],"extra":[],"id":"q0310","cat":"bingju","section":"病句分析","bookPage":198,"key":"bingju-9--11"},{"lesson":9,"num":12,"stem":"我要买一件毛衣跟你的这件颜色一样。","analysis":"“跟一样”在句子中既可以做谓语，也可以做定语。在这个句子中，“跟你这件颜色一样”就应该在“毛衣”前做定语。正确的句子应该是：","corrections":["我要买一件跟你这件颜色一样的毛衣。"],"extra":[],"id":"q0311","cat":"bingju","section":"病句分析","bookPage":199,"key":"bingju-9--12"},{"lesson":9,"num":13,"stem":"这个教室有那个教室很大。","analysis":"“有”在比较句中一般表示疑问，否则我们常常用“没有”。而且，在用“有、没有”的比较句中，一般不能用“很、非常、十分”等表示程度的副词。正确的句子应该是：","corrections":["那个教室没有这个教室大。","这个教室比那个教室大得多。","这个教室有那个教室大吗？"],"extra":[],"id":"q0312","cat":"bingju","section":"病句分析","bookPage":199,"key":"bingju-9--13"},{"lesson":9,"num":14,"stem":"弟弟像妹妹那么不爱玩儿。","analysis":"“像…(一样)”与“跟…一样”的用法基本相同，但不同之处是，“像”还可以做动词，同样表示比较。这个句子如果想表示“弟弟、妹妹”一样，都“不爱玩儿”，就应该用“跟…·一样”；如果只是其中的某个人“不爱玩儿”，可以用“像”正确的句子应该是：","corrections":["弟弟跟妹妹一样不爱玩儿。","弟弟不像妹妹那么爱玩儿。"],"extra":[],"id":"q0313","cat":"bingju","section":"病句分析","bookPage":199,"key":"bingju-9--14"},{"lesson":9,"num":15,"stem":"已经春天了，天气一天比一天不冷了。","analysis":"汉语用“一+量词+比+一+量词”表示比较时，后边的形容词一般不能用否定的形式。正确的句子应该是：","corrections":["已经春天了，天气一天比一天暖和了。"],"extra":[],"id":"q0314","cat":"bingju","section":"病句分析","bookPage":199,"key":"bingju-9--15"},{"lesson":10,"num":1,"stem":"难道你不相信我吧？","analysis":"汉语的反问句中有一些比较固定的格式，就是说，有些特定的词语是应该互相搭配着使用的。比如“难道…….吗”、“不是…….吗”、“为什么……呢”、“怎么…呢”、“何必……呢”、“何况…·呢”等等。这个句子中的“难道”就不能与语气词“吧”搭配使用。正确的句子应该是：","corrections":["难道你不相信我吗？","你难道不相信我吗？"],"extra":[],"id":"q0315","cat":"bingju","section":"病句分析","bookPage":204,"key":"bingju-10--1"},{"lesson":10,"num":2,"stem":"你把这些东西不是称一称吗？","analysis":"这个句子中的“不是”与“吗”的搭配没有错，但是位置上存在问题。“不是”一般应该放在主语后谓语前，在“把”字句中，“不是”应该放在“把”字前。另外，这个句子中还应该适当补足其他词语，以便使句子说得更加准确，意思表达得更加清楚。正确的句子应该是：","corrections":["你不是要把这些东西称一称吗？","你不是想把这些东西称一称吗？","你不是把这些东西称了称吗？","你不是把这些东西称过了吗？"],"extra":[],"id":"q0316","cat":"bingju","section":"病句分析","bookPage":204,"key":"bingju-10--2"},{"lesson":10,"num":3,"stem":"我怎么能找到他的家了？","analysis":"这个句子有两方面应该注意：第一，“怎么…·呢”是比较固定的搭配形式，不应该用“了”与“怎么”搭配；第二，句子中“能找到他的家”应该是还没有实现的动作，当然不应该使用“了”。可以参考下面几个句子：","corrections":["我怎么能找到他的家呢？","你是怎么找到他的家的？","你怎么找到他的家去了？"],"extra":[],"id":"q0317","cat":"bingju","section":"病句分析","bookPage":204,"key":"bingju-10--3"},{"lesson":10,"num":4,"stem":"你没告诉我，我哪儿知道这件事了？","analysis":"由“哪儿”构成的反问句与“怎么”的用法基本相同，因此，这个句子正确的说法应该是：","corrections":["你没告诉我，我哪儿能知道这件事？","你没告诉我，我怎么能知道这件事？","你没告诉我，我怎么会知道这件事呢？"],"extra":[],"id":"q0318","cat":"bingju","section":"病句分析","bookPage":204,"key":"bingju-10--4"},{"lesson":10,"num":5,"stem":"谁都不赞成呢？","analysis":"这个句子如果想说成反问句，就不能用“都”；如果想说成强调句则不能用析” “呢”。正确的句子应该是：","corrections":["谁能不赞成呢？","谁都不赞成！"],"extra":[],"id":"q0319","cat":"bingju","section":"病句分析","bookPage":205,"key":"bingju-10--5"},{"lesson":10,"num":6,"stem":"谁在学习上有困难，老师就谁帮助。","analysis":"汉语疑问代词的特殊用法中，疑问代词的特指形式应该是“疑问代词··就…·疑问代词”。前后两个疑问代词应该是相同的，而且位置上有一定的要求。“谁”既可以做主语，也可以做宾语，因此，句子中的后一个“谁”应该在宾语的位置上。正确的句子应该是：","corrections":["是应该互相","谁在学习上有困难，老师就帮助谁。","八另：你喜欢谁就跟谁一起去玩儿。","与语气词","馆    谁有时间谁就可以跟我们一起去。","谁的困难大，老师就帮助谁。","你想找谁就可以找谁。"],"extra":[],"id":"q0320","cat":"bingju","section":"病句分析","bookPage":205,"key":"bingju-10--6"},{"lesson":10,"num":7,"stem":"哪个问题没有讨论完，我们就讨论什么问题。","analysis":"疑问代词表示特指时，前后两个疑问代词应该是相同的，这个句子中前面用的题。“不是“哪个”，后面却用了“什么”，显然不符合汉语语法的要求。正确的句子应该是：","corrections":["哪个问题没有讨论完，我们就讨论哪个问题。","得更加清","什么问题没有讨论完，我们就讨论什么问题。","哪个没有讨论完，我们就讨论哪个。","什么没有讨论完，我们就讨论什么。"],"extra":[],"id":"q0321","cat":"bingju","section":"病句分析","bookPage":205,"key":"bingju-10--7"},{"lesson":10,"num":8,"stem":"你什么时候方便，什么时候就我来看你。","analysis":"“就”是副词，应该用在主语“我”的后面，而不能放在主语的前面。另外，“什么时候”表示的是时间，在句子中既可以位于主语之前，也可以位于主语之后，但前后最好应该一致。正确的句子应该是：","corrections":["你什么时候方便，我就什么时候来看你。","实现的动","你什么时候方便，我就什么时候去看你。","什么时候你方便，什么时候我就去看你。","什么时候你方便，什么时候我就来看你。"],"extra":[],"id":"q0322","cat":"bingju","section":"病句分析","bookPage":205,"key":"bingju-10--8"},{"lesson":10,"num":9,"stem":"你说怎么，我就说怎么。","analysis":"汉语中，“怎么”一般应该用在动词之前，而“什么”则常常用在动词之后，名词之前。正确的句子应该是：","corrections":["子正确的","你怎么说，我就怎么说。","你说什么，我就说什么。","你怎么说，我就怎么做。","你说什么，我就做什么。"],"extra":[],"id":"q0323","cat":"bingju","section":"病句分析","bookPage":205,"key":"bingju-10--9"},{"lesson":10,"num":10,"stem":"哪儿有意思，哪儿我们就去玩儿。","analysis":"疑问代词“哪儿”一般表示处所，在句子中如果有“去、到、来”等动词时，一般应该放在它们的后面。句子中的第二个“哪儿”必须放在“去”的后面。正确的句子应该是：","corrections":["哪儿有意思，我们就去哪儿玩儿。","哪儿有意思，我们就去哪儿。"],"extra":[],"id":"q0324","cat":"bingju","section":"病句分析","bookPage":205,"key":"bingju-10--10"},{"lesson":10,"num":11,"stem":"包子啊，饺子啊，面条啊，什么的我都喜欢吃。","analysis":"“什么”表示列举时，既可以在所列举的事物之前，也可以在所列举的事物之后，它们的形式一般应该是：“什么A啊，B啊，C啊，D啊…”或“A、B、C、D什么的”。这个句子恰恰是把两种形式混用在了一起。正确的句子应该是：","corrections":["什么包子啊，饺子啊，面条啊，我都喜欢吃。","包子、饺子、面条什么的，我都喜欢吃。"],"extra":[],"id":"q0325","cat":"bingju","section":"病句分析","bookPage":206,"key":"bingju-10--11"},{"lesson":10,"num":12,"stem":"外边正在下雨，你何必不出去玩儿呢？","analysis":"如果“外边正在下雨”，那么就不应该“出去玩儿”，但是“何必不出去玩儿呢”的意思是“应该出去玩儿”，可见与前边不能搭配上。把“不”去掉或换成“要”就可以了。正确的句子应该是：","corrections":["外边正在下雨，你何必出去玩儿呢？","外边正在下雨，你何必要出去玩儿呢？","外边正在下雨，你何必非要出去玩儿呢？","外边正在下雨，你何必一定要出去玩儿呢？"],"extra":[],"id":"q0326","cat":"bingju","section":"病句分析","bookPage":206,"key":"bingju-10--12"},{"lesson":10,"num":13,"stem":"这些问题我们都不明白，何况老师帮助我们呢？","analysis":"在反问句中，“何况”多表示比较起来更进一层的意思，即多含有比较的意思。句子中“我们都不明白”的结果应该是“请老师帮助我们”，而“何况”表示的却是“老师帮助我们还不如我们自己呢”的意思，当然不合适。正确的句子应该是：","corrections":["这些问题我们都不明白，为什么不请老师帮助我们呢？","这些问题我们都不明白，何必不请老师帮助我们呢？","这些问题老师帮助我们都弄不明白，何况我们自己呢？","这些问题我们都不明白，何况你们呢？"],"extra":[],"id":"q0327","cat":"bingju","section":"病句分析","bookPage":206,"key":"bingju-10--13"},{"lesson":10,"num":14,"stem":"到了我家，你们喜欢什么吃就什么吃，不用客气！","analysis":"“什么”一般应该用在动词之后，因为“什么”常常代替的是事物。正确的句子应该是：","corrections":["到了我家，你们喜欢吃什么就吃什么。","到了我家，你们喜欢怎么吃就怎么吃。"],"extra":[],"id":"q0328","cat":"bingju","section":"病句分析","bookPage":206,"key":"bingju-10--14"},{"lesson":10,"num":15,"stem":"今天的电影我觉得不什么样！理想”或“不好”的意思。正确的句子应该是：今天的电影我觉得不怎么样。今天的电影我觉得没什么意思。","analysis":"句子中的“不什么样”没有确切的意思，只有“不怎么样”才表示的是“不很理想”或“不好”的意思。正确的句子应该是：","corrections":["今天的电影我觉得不怎么样。","今天的电影我觉得没什么意思。"],"extra":[],"id":"q0329","cat":"bingju","section":"病句分析","bookPage":206,"key":"bingju-10--15"},{"lesson":11,"num":1,"stem":"回到宿舍，我就把今天的报看起来。","analysis":"按照汉语的习惯，并不是每个句子都一定要用“把”字句。“看报”只是一般的生活小事，况且句子中的“看报”还没有结果，根本没有必要用“把”字句，如果用“把”字句，应该在动词后加结果补语。正确的句子应该是：","corrections":["回到宿舍，我就看起今天的报来。来店西范","回到宿舍，我就看起报来。","回到宿舍，我很快就把今天的报看完了。"],"extra":[],"id":"q0330","cat":"bingju","section":"病句分析","bookPage":213,"key":"bingju-11--1"},{"lesson":11,"num":2,"stem":"听说这次我考了九十多分，我的心里非常高兴起来。","analysis":"“起来”的引申用法表示的是动作的开始并继续。句子中的“高兴”后边加上“起来”以后，指的是一种情绪的变化，这时“高兴”已经具备了动词的性质，因此，就不应该用“非常”来修饰了，如果用“非常”，就不能再用“起来”。正确的句子应该是：","corrections":["听说这次我考了九十多分，我的心里非常高兴。","听说这次我考了九十多分，我立刻就高兴起来了。"],"extra":[],"id":"q0331","cat":"bingju","section":"病句分析","bookPage":213,"key":"bingju-11--2"},{"lesson":11,"num":3,"stem":"新老师刚走进教室，我们就鼓掌起来。“掌”应该位于补语之后。正确的句子应该是：新老师刚走进教室，我们就鼓起掌来。新老师走进教室以后，我们鼓了半天掌。","analysis":"“起来”做补语必须紧跟动词，而句子中的“鼓掌”是离合动词，有补语时，“掌”应该位于补语之后。正确的句子应该是：","corrections":["新老师刚走进教室，我们就鼓起掌来。","新老师走进教室以后，我们鼓了半天掌。"],"extra":[],"id":"q0332","cat":"bingju","section":"病句分析","bookPage":213,"key":"bingju-11--3"},{"lesson":11,"num":4,"stem":"给妈妈打完电话，我就把作业做下去。","analysis":"这个句子有两种错误：第一，完全可以不用“把”字句；第二，表示某一个动作继续进行时不一定总用“.··下去”。正确的句子应该是：","corrections":["给妈妈打完电话，我就接着做作业。","给妈妈打完电话，我就继续做作业。"],"extra":[],"id":"q0333","cat":"bingju","section":"病句分析","bookPage":213,"key":"bingju-11--4"},{"lesson":11,"num":5,"stem":"老师一起完头，我们就一起唱了下去。","analysis":"“起头”这个离合动词表示的是一件事情的开始，如“唱歌、朗读、说话、表演”等，而“下去”表示的是一个动作在原来的基础上继续进行。句子中的“唱”在“老师起头”之前并没有进行着，因此也就不应该用“下去”，而应该用表示开始并继续的“起来”。正确的句子应该是：","corrections":["老师一起完头，我们就一起唱了起来。","老师一起完头，我们就开始唱了起来。"],"extra":[],"id":"q0334","cat":"bingju","section":"病句分析","bookPage":213,"key":"bingju-11--5"},{"lesson":11,"num":6,"stem":"你们说的话我都听懂了，但是我写不来。","analysis":"句子中的“写不来”到底表示的是什么意思不清楚，如果根据前边的句子推断，可以用“写不下来”或“写不出来”，也可以用“记不下来”来修改。因此，可以参考下面的句子：","corrections":["你们说的话我都听懂了，但是我写不出来。","你们说的话我都听懂了，但是我写不下来。","你们说的话我都听懂了，但是我记不下来。"],"extra":[],"id":"q0335","cat":"bingju","section":"病句分析","bookPage":214,"key":"bingju-11--6"},{"lesson":11,"num":7,"stem":"桌子上的东西太乱了，你包上来这些东西吧。正确的句子应该是：桌子上的东西太乱了，你包起来这些东西吧。桌子上的东西太乱了，你把这些东西包起来吧。","analysis":"“包上来”中的“上来”同样不能清楚地表达意思，而复合趋向补语“起来”的引申用法中，有“把分散的事物加以集中或收集”的意思，正好符合这个句子的意思。正确的句子应该是：","corrections":["桌子上的东西太乱了，你包起来这些东西吧。","桌子上的东西太乱了，你把这些东西包起来吧。"],"extra":[],"id":"q0336","cat":"bingju","section":"病句分析","bookPage":214,"key":"bingju-11--7"},{"lesson":11,"num":8,"stem":"你怎么把汽车停起来了？","analysis":"“汽车停”的结果不应该是“起来”，而应该是“下来”，因为在“下来”的引申用法中，有一个正是“事物通过某个动作停于某处”的意思。正确的句子应该是：","corrections":["你怎么把汽车停下来了？"],"extra":[],"id":"q0337","cat":"bingju","section":"病句分析","bookPage":214,"key":"bingju-11--8"},{"lesson":11,"num":9,"stem":"真对不起，我想不出来你的名字了。才合适。正确的句子应该是：真对不起，我想不起来你的名字了。真对不起，我想不起来你叫什么名字了。真对不起，我想不起来你是谁了。","analysis":"汉语趋向动词“出来”的引申用法包括“从无到有”和“辨认清楚”两种意思，但被遗忘的名字应该想办法“招回记忆”。因此，句子中的“出来”应该用“起来”才合适。正确的句子应该是：","corrections":["真对不起，我想不起来你的名字了。","真对不起，我想不起来你叫什么名字了。","真对不起，我想不起来你是谁了。"],"extra":[],"id":"q0338","cat":"bingju","section":"病句分析","bookPage":214,"key":"bingju-11--9"},{"lesson":11,"num":10,"stem":"哥哥在他脸上喷了一口冷水，他一下子醒起来了。","analysis":"句子中的“他”一定是因为某种原因昏迷过去了，也就是说，处在不正常的状态。汉语中表示从不正常的状态回到正常的状态应该用“过来”，反之则用“过去”，“起来”没有这样的意思和用法。正确的句子应该是：","corrections":["哥哥在他脸上喷了一口冷水，他一下子就醒过来了。","哥哥在他脸上喷了一口冷水，他一下子就醒了过来。"],"extra":[],"id":"q0339","cat":"bingju","section":"病句分析","bookPage":214,"key":"bingju-11--10"},{"lesson":11,"num":11,"stem":"雨过天晴，这会儿外边又亮下来了。","analysis":"趋向补语的引申用法中，“下来”除了有“事物通过某动作停在某处”外，还可以表示“由明到暗”等的变化过程。但句子中“雨过天晴”应该是由暗到明的变化过程，因此就不能使用“下来”，而应该用“起来”，因为，“起来”既可以表示某个动作或状态的开始并继续，也可以表示“由暗到明”等的变化过程。正确的句子应该是：","corrections":["雨过天晴，这会儿外边又亮起来了。"],"extra":[],"id":"q0340","cat":"bingju","section":"病句分析","bookPage":214,"key":"bingju-11--11"},{"lesson":11,"num":12,"stem":"老师让我们在试卷上写出来自己的名字。","analysis":"“在试卷上写”的结果应该是“下来”，而不应该是“出来”。因为“下来”才表示你的名字留在试卷上。正确的句子应该是：","corrections":["老师让我们在试卷上写下来自己的名字。","老师让我们在试卷上把自己的名字写下来。","老师让我们把自己的名字在试卷上写下来。"],"extra":[],"id":"q0341","cat":"bingju","section":"病句分析","bookPage":214,"key":"bingju-11--12"},{"lesson":11,"num":13,"stem":"刚才是我糊涂，现在我终于明白上来了。","analysis":"与第(10)题的“醒”一样，“明白”也是从不正常的状态回到正常的状态，这样，就不应该用“上来、起来、出来”等词语，只能用“过来”。正确的句子应该是：","corrections":["刚才是我糊涂，现在我终于明白过来了。","刚才是我糊涂，现在我终于明白了。"],"extra":[],"id":"q0342","cat":"bingju","section":"病句分析","bookPage":215,"key":"bingju-11--13"},{"lesson":11,"num":14,"stem":"这种鞋穿出来好看，可是做出来很不容易。","analysis":"“穿出来”和“做出来”似乎都可以表达一定的意思，但在这个句子里却不能明确地表达说话者想表达的意思。应该换成“起来”，因为只有“起来”才能够表达“穿的时候”和“做的时候”的意思。注意，“起来”这时常常对比着使用。正确的句子应该是：","corrections":["这种鞋穿起来好看，可是做起来很不容易。"],"extra":[],"id":"q0343","cat":"bingju","section":"病句分析","bookPage":215,"key":"bingju-11--14"},{"lesson":11,"num":15,"stem":"你们能猜过来这是谁的衣服吗？","analysis":"“猜”的结果应该是给出比较正确的答案，即辨认清楚。因此，只有用“出来”做补语，才能明确表达这样的意思，“过来”不具备这样的作用。正确的句子应该是：","corrections":["你们能猜出来这是谁的衣服吗？","你们猜得出来这是谁的衣服吗？"],"extra":[],"id":"q0344","cat":"bingju","section":"病句分析","bookPage":215,"key":"bingju-11--15"},{"lesson":12,"num":1,"stem":"我发现很多老师晚饭后都喜欢在学校里散步散步。","analysis":"汉语动词的重叠形式有几种，一般双音节动词应该是“ABAB”，但离合动词的重叠形式应该是“AAB”。句子中的“散步”是比较典型的离合动词，因此，“散步散步”的形式是错误的。正确的句子应该是：","corrections":["我发现很多老师晚饭后都喜欢在学校里散散步。","我发现很多老师晚饭后都喜欢在学校里散一散步。"],"extra":[],"id":"q0345","cat":"bingju","section":"病句分析","bookPage":220,"key":"bingju-12--1"},{"lesson":12,"num":2,"stem":"我喜欢和女朋友坐在公园的湖边聊聊天天。","analysis":"汉语动词的重叠形式除了“ABAB”与“AAB”形式以外，也有一些可以用“AABB”的形式，如“来来回回、跑跑颠颠、打打闹闹、说说笑笑”等，但是，与“散步”一样，“聊天”也是离合式动词，既不可以用“ABAB”的形式，也不能用“AABB”的形式，只能是“AAB”的形式。当然，还可以有其他的形式表示相同的意思。参考下面的句子：","corrections":["我喜欢和女朋友坐在公园里聊聊天。","我喜欢和女朋友坐在公园里聊会儿天。","我喜欢和女朋友坐在公园里聊天。"],"extra":[],"id":"q0346","cat":"bingju","section":"病句分析","bookPage":220,"key":"bingju-12--2"},{"lesson":12,"num":3,"stem":"下面我要讲讲的事情是在去年10月发生的。","analysis":"按照汉语语法的要求，动词做定语时，一般情况下是不能重叠的。我们可以说“看看书，听听音乐，洗洗衣服，吃吃饭”，但不能说“看看的书，听听的音乐，洗洗的衣服，吃吃的饭”，因为前者是动宾结构，后者是偏正结构。正确的句子应该是：","corrections":["下面我要讲的事情是在去年10月发生的。","下面我要讲讲去年10月发生的一件事情。"],"extra":[],"id":"q0347","cat":"bingju","section":"病句分析","bookPage":220,"key":"bingju-12--3"},{"lesson":12,"num":4,"stem":"她哭一哭着说了她家里发生的事情。","analysis":"与上一题的错误几乎一样，汉语中表示伴随动作的动词状语一般也不能使用重叠的形式。我们只能说“站着讲课，坐着听课，躺着看电视，笑着说话”，不能说“站站着讲课，坐坐着听课，躺一躺着看电视，笑一笑着说话”。汉语中的“笑笑说，笑了笑说；想想说，想了想说”等形式属于连动句，不在本课所讲的范围。上面的句子应该改成：","corrections":["她哭着说了她家里发生的事情。","她哭了一会儿才说了她家里发生的事情。"],"extra":[],"id":"q0348","cat":"bingju","section":"病句分析","bookPage":220,"key":"bingju-12--4"},{"lesson":12,"num":5,"stem":"我想请老师把这课的语法讲讲明白。","analysis":"汉语动词重叠以后多表示动作的时间短、轻松或尝试等意义，常常没有明确的结果或结论，而动词加结果补语则表示的是动作的结果，因此，把这两种形式混在一起，既不能清楚地表达意思，也不符合汉语的要求。当然，有些南方人口语里的“讲讲清楚，洗洗干净，看看明白”等，只能属于汉语方言的一种表达形式，不符合汉语普通话的语法要求。上面的句子应该是：","corrections":["我想请老师把这课的语法讲明白。","我想请老师把这课语法讲明白。","我想请老师把这课语法讲一讲。"],"extra":[],"id":"q0349","cat":"bingju","section":"病句分析","bookPage":221,"key":"bingju-12--5"},{"lesson":12,"num":6,"stem":"回国以后我先在家里休息休息了几天，然后才去工作。","analysis":"动词重叠后所表示的时间长短是不确定的。但是，动词带时量补语以后表示的多是比较确定的时间，因此这两种形式同样不能混在一起用。正确的句子应该是：","corrections":["回国以后我先在家休息了几天，然后才去工作。","回国以后我先在家休息了一下，然后才去工作。","回国以后我先在家休息休息，然后再去工作。"],"extra":[],"id":"q0350","cat":"bingju","section":"病句分析","bookPage":221,"key":"bingju-12--6"},{"lesson":12,"num":7,"stem":"请把你的词典借给我用用一下。实，选择其中的一个就足以表达清楚意思了。正确的句子应该是：请把你的词典借给我用用。请把你的词典借给我用一下。","analysis":"这个句子中“用用一下”是“用用”和“用一下”两种重叠形式的混用，其实，选择其中的一个就足以表达清楚意思了。正确的句子应该是：","corrections":["请把你的词典借给我用用。","请把你的词典借给我用一下。”"],"extra":[],"id":"q0351","cat":"bingju","section":"病句分析","bookPage":221,"key":"bingju-12--7"},{"lesson":12,"num":8,"stem":"现在我们正在讨论讨论一个问题。","analysis":"一般正在进行的动作持续的时间是不能确定的，当然也就不能用表示时间短的重叠形式来表达。如果不用“正在”可以表示马上要做的事情，也就可以使用动词重叠的形式。正确的句子应该是：","corrections":["现在我们正在讨论一个问题。","现在我们讨论讨论这个问题。","现在我们讨论讨论另一个问题。"],"extra":[],"id":"q0352","cat":"bingju","section":"病句分析","bookPage":221,"key":"bingju-12--8"},{"lesson":12,"num":9,"stem":"同学们很高高兴兴地走出教室去了。","analysis":"汉语中形容词的重叠形式本身已经含有了程度高的意思，因此，不能再用程度副词修饰这个重叠的形容词。正确的句子应该是：","corrections":["同学们高高兴兴地走出教室去了。","同学们很高兴地走出教室去了。","同学们高兴地走出了教室。"],"extra":[],"id":"q0353","cat":"bingju","section":"病句分析","bookPage":221,"key":"bingju-12--9"},{"lesson":12,"num":10,"stem":"我的房间收拾得干干净净极了。","analysis":"与第(9)题一样，“干干净净”已经是“很干净、非常干净、干净极了”的意思，就没有必要再重复，否则就是错句。正确的句子应该是：","corrections":["我的房间收拾得干干净净的。","我的房间收拾得干净极了。    上街大阳京","我的房间收拾得非常干净。"],"extra":[],"id":"q0354","cat":"bingju","section":"病句分析","bookPage":221,"key":"bingju-12--10"},{"lesson":12,"num":11,"stem":"昨天又有大刮风，大下雨。","analysis":"汉语单音节形容词可以修饰名词，也可以修饰动词，但由于形容词本身的性质，使它们在修饰名词或动词时有着简单的分工。比如，“多、少，快、慢”常常修饰动词，而“新、旧，高、低”则常常修饰名词。“大、小既可以修饰名词，也可以修饰动词，如“大房间、小教室，大树、小苗；大吃大喝，大吹大擂，小吵小闹”等。。干这个句子中的“大刮风，大下雨”不符合汉语的表达习惯，应该用“刮大风，下大雨”。正确的句子应该是：","corrections":["昨天又刮大风，下大雨了。","明天又要刮大风下大雨。"],"extra":[],"id":"q0355","cat":"bingju","section":"病句分析","bookPage":222,"key":"bingju-12--11"},{"lesson":12,"num":12,"stem":"经过一段时间的治疗，王老师终于健康了身体。","analysis":"汉语形容词的语法功能是可以做定语、状语、补语，也可以做谓语等。应该注意的是，形容词做谓语是不能带宾语的。句子中的“健康”带了宾语“身体”，不符合汉语语法要求。正确的句子应该是：","corrections":["经过一段时间的治疗，王老师的病终于好了。然不意木    回","经过一段时间的治疗，王老师终于恢复了健康。然，总原木家","经过一段时间的治疗，王老师的身体终于健康了。"],"extra":[],"id":"q0356","cat":"bingju","section":"病句分析","bookPage":222,"key":"bingju-12--12"},{"lesson":12,"num":13,"stem":"在北京的一年中，我经验了很多事情。","analysis":"汉语的名词可以做谓语，一般应该用在表示年龄、籍贯、日期等的句子里，称作名词谓语句。但是，和形容词一样，名词做谓语不能带宾语。句子中的“经验”是名词，既不能做谓语，也根本不可以带宾语。可以用“经历”来替换它。正确的句子应该是：","corrections":["在北京的一年中，我经历了很多事情。","在北京的一年中，我积累了很多经验。","在北京的一年中，我从各种事情中获得了很多经验。"],"extra":[],"id":"q0357","cat":"bingju","section":"病句分析","bookPage":222,"key":"bingju-12--13"},{"lesson":12,"num":14,"stem":"服务员对客人很热情，很友谊。","analysis":"汉语的副词一般是用来修饰动词或形容词的，不能修饰名词。个别的例子如“不人不鬼”等，只能算作特殊的情况。在有些作品中也出现过“很中国”一类的用法，也只能算是临时的借用，同样不符合汉语的使用规范。出句子中的“友谊”是名词，不应该用“很”来修饰，应该用“友好”来替换“友谊”。正确的句子应该是：","corrections":["服务员对客人很热情，很友好。"],"extra":[],"id":"q0358","cat":"bingju","section":"病句分析","bookPage":222,"key":"bingju-12--14"},{"lesson":12,"num":15,"stem":"现在，北京的大街上好像每个人人都用手机。","analysis":"汉语中名词的重叠所表示的意思是强调它的普遍性，即“每一个”。句子中在“人人”又加上了“每个”，造成了意思上的重复，形成了错误的句子。去掉“每个”或一个“人”意思就清楚了。正确的句子应该是：","corrections":["现在，北京的大街上好像每个人都用手机。","现在，北京的大街上好像人人都用手机。","现在，北京的大街上好像人人都有手机。"],"extra":[],"id":"q0359","cat":"bingju","section":"病句分析","bookPage":222,"key":"bingju-12--15"},{"lesson":13,"num":1,"stem":"今天下午2点，请同学们在体育馆前边集合。","analysis":"汉语数词“二”单独用在量词或名词之前时，按照汉语语法要求，一般情况下应该用“两”来表示，如“两个、两张、两本、两天、两年、两国”等等。个别表示度量衡的量词前“二、两”通用，如“两斤、二斤，两尺、二尺”等。“二”只有在表示顺序时才用“二”。句子中的“二点”应该用“两点”。正确的句子应该是：","corrections":["今天下午两点，请同学们在体育馆前边集合。"],"extra":[],"id":"q0360","cat":"bingju","section":"病句分析","bookPage":230,"key":"bingju-13--1"},{"lesson":13,"num":2,"stem":"我们那个小城市只有一百三十千人口。","analysis":"不少西方语言里没有“万、亿”这两个数词，因此，有的学生在学习中不会用“万、亿”。句子中的“一百三十千”，按照汉语的表达方式应该是“十三万”。正确的句子应该是：","corrections":["我们那个小城市只有十三万人口。"],"extra":[],"id":"q0361","cat":"bingju","section":"病句分析","bookPage":230,"key":"bingju-13--2"},{"lesson":13,"num":3,"stem":"这课的生词我已经写了九十遍了。","analysis":"汉语可以用相邻的两个数字表示大概的数量，如“两三个，四五天，八九本，十四五斤，一百二三十人”等。但是，“九”和“十”虽然也是相邻的两个数词，却不能用在一起表示大概的数量，因为无论从视觉还是从听觉的角度，都会让人觉得是“90”，造成理解上的错误。句子中所犯的正是这类错误。正确的句子应该是：","corrections":["这课的生词我已经写了八九遍了。","这课的生词我已经写了十来遍了。","这课的生词我已经写了快十遍了。"],"extra":[],"id":"q0362","cat":"bingju","section":"病句分析","bookPage":230,"key":"bingju-13--3"},{"lesson":13,"num":4,"stem":"听老师说，今年参加HSK考试的有三千个多人。","analysis":"汉语中“多”这个词与数量词搭配以后可以表示概数。应该注意的是：①“多”在表示不可分的事物时，必须紧跟在“十、百、千、万”等数词之后，然后再跟量词，如：“十多个人，一百多本书，三千多只羊，两万多封信”，如果说成“十个多人，一百本多书，三千只多羊，两万封多信”就错了，因为“人、书、羊、信”都是不可分的事物。②同样，“三多个人，十四多本书，六多只羊，四十五多封信”与“三个多人，十四本多书，六只多羊，四十五封多信”都不能表达确切的意思。③但是，汉语中不少名词是可以有零数形式的，即表示可分的事物，因此在数量词语与“多”搭配使用时，形式也比较灵活。如：“十多块钱，十块多钱，三块多钱；一百多斤苹果，一百斤多苹果，五斤多苹果；二十多个星期，二十个多星期，两个多星期”等。句子中的“三千个多人”的用法显然是错误的。正确的句子应该是：","corrections":["听老师说，今年参加HSK考试的有三千多个人。","听老师说，今年参加HSK考试的有三千多人。"],"extra":[],"id":"q0363","cat":"bingju","section":"病句分析","bookPage":230,"key":"bingju-13--4"},{"lesson":13,"num":5,"stem":"为什么你第一天、二天没有来上课？","analysis":"“二”在表示顺序时，即使在量词前也要用“二”，而不能用“两”。如“二班、二层、二年级”等。但句子中的“第一天、二天”的用法显然不符合汉语的表达习惯和语法要求。正确的句子应该是：","corrections":["为什么你第一、二天没有来上课？","为什么你第一天、第二天没有来上课？","为什么你前两天没有来上课？"],"extra":[],"id":"q0364","cat":"bingju","section":"病句分析","bookPage":231,"key":"bingju-13--5"},{"lesson":13,"num":6,"stem":"我在我们国家学了一半年汉语。","analysis":"汉语中“半”这个词同样是一个比较特殊的词语，它在与数量词搭配表示时间或数量时，一般应该放在量词之后，如“一个半小时，两个半星期，三碗半米饭”等。在与表示时间的“年、天”等词语搭配时，应该放在它们的后边，如“一天半，两年半”等，因为，“年、天”既是名词，同时也可以做量词。正确的句子应该是：","corrections":["我在我们国家学了一年半汉语。","我在我们国家学过一年半汉语。"],"extra":[],"id":"q0365","cat":"bingju","section":"病句分析","bookPage":231,"key":"bingju-13--6"},{"lesson":13,"num":7,"stem":"我喝了两个杯牛奶，他喝了三个杯啤酒。","analysis":"句子中的“杯”既可以做名词，也可以做量词，因此，在语言表达中就没有必要再在它的前边加上其他量词。正确的句子应该是：","corrections":["我喝了两杯牛奶，他喝了三杯啤酒。"],"extra":[],"id":"q0366","cat":"bingju","section":"病句分析","bookPage":231,"key":"bingju-13--7"},{"lesson":13,"num":8,"stem":"这个本子里有他天天的日记。","analysis":"“日记”，从词语意义上说，当然应该是每天写的，因此在句子中就没有必要用“天天”来加以修饰。另外，“天天”可以看作是名词的重叠形式，也可以看作是量词的重叠形式，其实意思就是“每天、每一天”。但是，按照汉语的表达习惯，“天天”在句子中多做状语，而“每天”则既可以做状语，也可以做定语。正确的句子应该是：","corrections":["这个本子里有他的日记。","这个本子里有他每天的日记。"],"extra":[],"id":"q0367","cat":"bingju","section":"病句分析","bookPage":231,"key":"bingju-13--8"},{"lesson":13,"num":9,"stem":"他认真地跟着老师写一笔一笔。","analysis":"数量词重叠以后可以做补语，也可以做状语，应该根据句子的表达内容而定。这个句子中的“一笔一笔”应该是“写”的状态，即“怎么写”，而不是“写”的结果，即“写得怎么样”。正确的句子应该是：","corrections":["他认真地跟着老师一笔一笔地写。","他跟着老师一笔一笔地写。","他跟着老师一笔笔地写着。"],"extra":[],"id":"q0368","cat":"bingju","section":"病句分析","bookPage":231,"key":"bingju-13--9"},{"lesson":13,"num":10,"stem":"小汽车一辆地通过这里。","analysis":"数量词的重叠表示的是数量多，而句子中只用了一个“一辆”，不能清楚地表达句子所要表达的真正的意思。正确的句子应该是：","corrections":["小汽车一辆一辆地通过这里。","小汽车一辆辆地通过这里。    人个季千三的加H"],"extra":[],"id":"q0369","cat":"bingju","section":"病句分析","bookPage":231,"key":"bingju-13--10"},{"lesson":13,"num":11,"stem":"会场里响起了一场场的欢呼声。","analysis":"“场”作量词所修饰的名词常常应该与“场地、时间”有关，如“表演、节目、京剧、电影、杂技，比赛、球赛、运动会，考试、考验，雨、雪、风”等，也可以是比较抽象的词语，如“误会、矛盾、风波”等。单句子中的“欢呼声”不具备这样的特点，因此，不能用“场”这个量词。用来修饰声音的量词应该用“阵”，如“一阵雷声，一阵枪炮声，一阵飞机的轰鸣声”等。正确的句子应该是：","corrections":["会场里响起了一阵阵的欢呼声。"],"extra":[],"id":"q0370","cat":"bingju","section":"病句分析","bookPage":232,"key":"bingju-13--11"},{"lesson":13,"num":12,"stem":"商场里的都件件衣服很漂亮。","analysis":"汉语中有这样一种格式一一“每··都……”。句子中量词“件”重叠以后表示的正是“每”的意思，因此，“都”应该用在后面的谓语之前，而不应该用在“件件”前面。正确的句子应该是：","corrections":["商场里件件衣服都很漂亮。","商场里的衣服件件都很漂亮。","商场里的每一件衣服都很漂亮。","商场里的衣服每一件都很漂亮。"],"extra":[],"id":"q0371","cat":"bingju","section":"病句分析","bookPage":232,"key":"bingju-13--12"},{"lesson":13,"num":13,"stem":"这些照片有的张照得好，有的张照得不好。","analysis":"“有的”是代词，后面可以跟名词，也可以什么都不跟，但一定不能跟量词。与“有的”意思比较接近的“有些”则可以跟量词。参考下面的句子：","corrections":["这些照片有的照得好，有的照得不好。","这些照片有些照得好，有些照得不好。","这些照片有些照得好，有些照得不好。"],"extra":[],"id":"q0372","cat":"bingju","section":"病句分析","bookPage":232,"key":"bingju-13--13"},{"lesson":13,"num":14,"stem":"听朋友说，《风云2》这片电影很有意思。与时间有关应该用“场”；而如果从“电影”本身来说，应该用“部”。正确的句子应该是：听朋友说，《风云2》这部电影很有意思。","analysis":"“电影”的量词不能用“片”，因为“片”所修饰的名词多包含面积大或小的意思，如“一片云，一片海，一片树叶，一片面包”等。“电影”如果从观看的角度说，与时间有关应该用“场”；而如果从“电影”本身来说，应该用“部”。正确的句子应该是：","corrections":["听朋友说，《风云2》这部电影很有意思。"],"extra":[],"id":"q0373","cat":"bingju","section":"病句分析","bookPage":232,"key":"bingju-13--14"},{"lesson":13,"num":15,"stem":"通过这两个失败，我真正懂得了认真的重要。","analysis":"“个”是名量词，但“失败”是“没有成功”的意思，动词性比较强，因此，修饰“失败”的量词应该是“次”。正确的句子应该是：","corrections":["通过这两次失败，我真正懂得了认真的重要。"],"extra":[],"id":"q0374","cat":"bingju","section":"病句分析","bookPage":232,"key":"bingju-13--15"},{"lesson":1,"num":1,"sub":"扩写句子(注意“的、地、得”的使用)","stem":"她是女孩儿。 (美丽动人 位富有青春活力)","answers":["她是位富有青春活力、美丽动人的女孩儿。","她是位富有青春活力的美丽动人的女孩儿。"],"analysis":"汉语“一十量词”在口语中常常可以省略 是动词性词语，应该放在形容词“美丽动人”之前。按照定语的语序，量词“位”应该离宾语“女孩儿”最远。","id":"q0375","cat":"expand","section":"应用练习","bookPage":142,"key":"yingyong-1-扩写句子(注意“的、地、得”的使用)-1"},{"lesson":1,"num":2,"sub":"扩写句子(注意“的、地、得”的使用)","stem":"我讲过了。 (跟大家已经把你的意见认真)","answers":["我已经把你的意见跟大家认真地讲过了。","我已经跟大家把你的意见认真地讲过了。","我把你的意见已经跟大家认真地讲过了。","我把你的意见跟大家已经认真地讲过了。"],"analysis":"副词“已经”在修饰动词时，如果动词前有介宾词组做状语，一般可以放在介宾之前，也可以放在介宾之后。形容词“认真”应该离动词最近。两个介宾词组的顺序可以调换，不影响句子意思。","id":"q0376","cat":"expand","section":"应用练习","bookPage":142,"key":"yingyong-1-扩写句子(注意“的、地、得”的使用)-2"},{"lesson":1,"num":3,"sub":"扩写句子(注意“的、地、得”的使用)","stem":"我们举行了晚会。(在快乐酒吧生日热热闹闹昨天晚上为迈克)","answers":["我们昨天晚上在快乐酒吧为迈克热热闹闹地举行了生日晚会。","昨天晚上我们在快乐酒吧为迈克热热闹闹地举行了生日晚会。","昨天晚上我们在快乐酒吧为迈克举行了热热闹闹的生日晚会。"],"analysis":"汉语句子中的时间词语既可以放在主语之前，也可以放在主语之后谓语之前，而且，做状语的时间、地点和方式的顺序一般不能轻易改变。“热热闹闹”可以做状语，也可以用作定语。","id":"q0377","cat":"expand","section":"应用练习","bookPage":143,"key":"yingyong-1-扩写句子(注意“的、地、得”的使用)-3"},{"lesson":1,"num":4,"sub":"扩写句子(注意“的、地、得”的使用)","stem":"中国是国家。 (具有悠久历史一个和灿烂文化)","answers":["中国是一个具有悠久历史和灿烂文化的国家。"],"analysis":"“悠久历史和灿烂文化”做“具有”的宾语并构成动宾结构再做“国家”的定语。注意：动宾结构做定语时，名词前应该用“的”。","id":"q0378","cat":"expand","section":"应用练习","bookPage":143,"key":"yingyong-1-扩写句子(注意“的、地、得”的使用)-4"},{"lesson":1,"num":5,"sub":"扩写句子(注意“的、地、得”的使用)","stem":"他忘了吃饭。(忙最近几天考试准备为都)","answers":["他最近几天为准备考试忙得都忘了吃饭。","他最近几天为准备考试都忙得忘了吃饭。","最近几天他为准备考试忙得都忘了吃饭。"],"analysis":"这个句子里的“都”有特别强调的意义，不是一般的“都”，即不强调范围，而是强调“忙”的程度。“都”的位置也十分重要，注意它们的用法。","id":"q0379","cat":"expand","section":"应用练习","bookPage":143,"key":"yingyong-1-扩写句子(注意“的、地、得”的使用)-5"},{"lesson":1,"num":1,"sub":"给词语选择恰当的位置","stem":"电影A画面上是一个B十分美丽C小山村D。","word":"的","options":null,"answer":"C","analysis":"“的”应该放在名词前，但是A前后都是名词，可以不用“的”，而“小山村”前是由副词与形容词组合成的修饰语，因此，C是最合适的位置。还要注意的是，有的学习者喜欢把“的”放在句尾D的位置，这是错误的。","id":"q0380","cat":"pos","section":"应用练习","bookPage":143,"key":"yingyong-1-给词语选择恰当的位置-1"},{"lesson":1,"num":2,"sub":"给词语选择恰当的位置","stem":"我A昨天新买B那本C语法D书不见了。","word":"的","options":null,"answer":"B","analysis":"“新买”是动词性词语，做“那本语法书”的定语时必须加“的”，其他位置可以。“语法”与“书”之间不用“的”。","id":"q0381","cat":"pos","section":"应用练习","bookPage":143,"key":"yingyong-1-给词语选择恰当的位置-2"},{"lesson":1,"num":3,"sub":"给词语选择恰当的位置","stem":"你们知道A吗？他B就是我C中学老师D，现在他也做学生了。","word":"的","options":null,"answer":"C","analysis":"“我”与“中学老师”之间应该用“的”不少同学喜欢把“的”放在D其实是错误的。可以参考第三课中“是…的”句的分析。","id":"q0382","cat":"pos","section":"应用练习","bookPage":143,"key":"yingyong-1-给词语选择恰当的位置-3"},{"lesson":1,"num":4,"sub":"给词语选择恰当的位置","stem":"赵大夫是我A大学B时代最好C朋友D。","word":"的","options":null,"answer":"C","analysis":"形容词前加副词以后做定语必须加“的”，所以，C是最恰当的位置。","id":"q0383","cat":"pos","section":"应用练习","bookPage":143,"key":"yingyong-1-给词语选择恰当的位置-4"},{"lesson":1,"num":5,"sub":"给词语选择恰当的位置","stem":"由中国电影家A协会主办B大众电影C金鸡奖D颁奖仪式已于昨晚在长春举行。","word":"的","options":null,"answer":"B","analysis":"“中国电影家协会”是一个专有名词，中间不能加“的”。C、D前后都是名词，同样不用“的”，而“主办”是动词，做定语必须在后面加“的”。","id":"q0384","cat":"pos","section":"应用练习","bookPage":144,"key":"yingyong-1-给词语选择恰当的位置-5"},{"lesson":1,"num":6,"sub":"给词语选择恰当的位置","stem":"我特别喜欢A你送给我B那本书C，我会D永远珍藏它。","word":"的","options":null,"answer":"B","analysis":"“你送给我”做“那本书”的定语，“的”应该放在B处。记住：动词或小句子做定语都要加“的”。","id":"q0385","cat":"pos","section":"应用练习","bookPage":144,"key":"yingyong-1-给词语选择恰当的位置-6"},{"lesson":1,"num":7,"sub":"给词语选择恰当的位置","stem":"随着A社会B发展，人民的生活水平C会越来越D好。","word":"的","options":null,"answer":"B","analysis":"“随着”是介词，它的后面应该跟名词性词语，而“发展”是动词，“的”是使“发展”名词化的标志，因此，B是最好的位置。","id":"q0386","cat":"pos","section":"应用练习","bookPage":144,"key":"yingyong-1-给词语选择恰当的位置-7"},{"lesson":1,"num":8,"sub":"给词语选择恰当的位置","stem":"我们买了A不少B人民文学出版社C出版的D书。","word":"关于历史的","options":null,"answer":"D","analysis":"介宾结构“关于历史的”做“书”的定语。","id":"q0387","cat":"pos","section":"应用练习","bookPage":144,"key":"yingyong-1-给词语选择恰当的位置-8"},{"lesson":1,"num":9,"sub":"给词语选择恰当的位置","stem":"当我双手接A过录取通知书时，我激动B真C不知道说D什么好了！","word":"得","options":null,"answer":"B","analysis":"“得”应该放在句中主要动词“激动”与补语之间，B的位置最恰当。有人喜欢把“得”放在A处，而“接过”本身就已经构成了动作与结果的关系，加上“得”反而使关系混乱，不能明确表示意思。","id":"q0388","cat":"pos","section":"应用练习","bookPage":144,"key":"yingyong-1-给词语选择恰当的位置-9"},{"lesson":1,"num":10,"sub":"给词语选择恰当的位置","stem":"刚刚A走出教室，就见B张平笑呵呵C向我们D跑来。","word":"地","options":null,"answer":"C","analysis":"介宾结构“向我们”做“跑来”的状语不用“地”。","id":"q0389","cat":"pos","section":"应用练习","bookPage":144,"key":"yingyong-1-给词语选择恰当的位置-10"},{"lesson":1,"num":1,"sub":"选择恰当的词语填空","stem":"听了爱德华说自己的眼睛、鼻子、嘴巴都很漂亮，新娘的脸＿＿＿的。","word":null,"options":{"A":"红通通","B":"通红红","C":"通通红红","D":"通红通红"},"answer":"D","analysis":"舒服服”等，但有些形容词重叠的形式却是“ABAB”，如“通红通红”、：“漆黑漆黑”、“雪白雪白”等。形容词重叠后常常在后面加上“的”。因此，答案只能是D。关于形容词重叠的内容，请参考第十二课中的相关介绍。","id":"q0390","cat":"choice","section":"应用练习","bookPage":144,"key":"yingyong-1-选择恰当的词语填空-1"},{"lesson":1,"num":2,"sub":"选择恰当的词语填空","stem":"孩子躺在病床上，发着高烧，打了一针以后不知不觉＿＿＿目＿＿＿睡着了。","word":null,"options":{"A":"的","B":"地","C":"得","D":"着"},"answer":"B","analysis":"“不知不觉”是动词性词语，它与谓语“睡着”之间只能用“地”。","id":"q0391","cat":"choice","section":"应用练习","bookPage":145,"key":"yingyong-1-选择恰当的词语填空-2"},{"lesson":1,"num":3,"sub":"选择恰当的词语填空","stem":"我认为，他们对中国书法比你感兴趣关多。","word":null,"options":{"A":"的","B":"地","C":"得","D":"着"},"answer":"C","analysis":"“多”是“感兴趣”的补语，因此，它们中间应该用“得”。","id":"q0392","cat":"choice","section":"应用练习","bookPage":145,"key":"yingyong-1-选择恰当的词语填空-3"},{"lesson":1,"num":4,"sub":"选择恰当的词语填空","stem":"根据有关部门所做＿＿＿统计，2011年底北京市的汽车保有量已超过500万辆。","word":null,"options":{"A":"的","B":"地","C":"得","D":"过"},"answer":"A","analysis":"介词“根据”后出现动词“统计”，在“统计”前加上名词的标志“的”是理所当然的。另外，“所+动词+的+名词”也是应该掌握的一个重要形式。","id":"q0393","cat":"choice","section":"应用练习","bookPage":145,"key":"yingyong-1-选择恰当的词语填空-4"},{"lesson":1,"num":5,"sub":"选择恰当的词语填空","stem":"唉，你这条裙子真是与众不同，可以告诉我在哪个商场买＿＿＿吗？","word":null,"options":{"A":"的","B":"了","C":"地","D":"过"},"answer":"A","analysis":"这是“是…·的”格式在口语中的表现形式，即常常省略“是”。句子中的“是…的”格式强调动作发生的处所，即“是在哪个商场买的”。","id":"q0394","cat":"choice","section":"应用练习","bookPage":145,"key":"yingyong-1-选择恰当的词语填空-5"},{"lesson":1,"num":6,"sub":"选择恰当的词语填空","stem":"你们是什么时候来＿＿＿北京语言大学？","word":null,"options":{"A":"了","B":"的","C":"地","D":"着"},"answer":"B","analysis":"同样是“是…的”结构，强调时间。其他词语都不合适。应该特别注意的是，这里一定不能用“了”。","id":"q0395","cat":"choice","section":"应用练习","bookPage":145,"key":"yingyong-1-选择恰当的词语填空-6"},{"lesson":1,"num":7,"sub":"选择恰当的词语填空","stem":"我是上个月跟朋友一起来北京＿＿＿。","word":null,"options":{"A":"了","B":"过","C":"的","D":"吧"},"answer":"C","analysis":"记住“是…·的”结构的用法。具体内容我们将在第三课中介绍。","id":"q0396","cat":"choice","section":"应用练习","bookPage":145,"key":"yingyong-1-选择恰当的词语填空-7"},{"lesson":1,"num":8,"sub":"选择恰当的词语填空","stem":"他们最近正准备参加年终评审，忙＿＿＿不得了。","word":null,"options":{"A":"得","B":"的","C":"地","D":"着"},"answer":"A","analysis":"“得”一般用在动词或形容词之后，其后是补语。其他词语不合适。","id":"q0397","cat":"choice","section":"应用练习","bookPage":145,"key":"yingyong-1-选择恰当的词语填空-8"},{"lesson":1,"num":9,"sub":"选择恰当的词语填空","stem":"今天的《北京晚报》报道了今晨前门发生＿＿＿一起交通事故。","word":null,"options":{"A":"着","B":"的","C":"了","D":"没"},"answer":"B","analysis":"“报道”的宾语是“事故”，而“发生”是“事故”的定语，按照汉语语法的要求，动词做定语时，后边应该加“的”。","id":"q0398","cat":"choice","section":"应用练习","bookPage":146,"key":"yingyong-1-选择恰当的词语填空-9"},{"lesson":1,"num":10,"sub":"选择恰当的词语填空","stem":"为了避免类似事故＿＿＿发生，有关部门对本地区的交通秩序做了调整。","word":null,"options":{"A":"又","B":"还","C":"也","D":"的"},"answer":"D","analysis":"“又、还、也”三个副词都可以修饰动词“发生”，但在这个句子中，只有用","id":"q0399","cat":"choice","section":"应用练习","bookPage":146,"key":"yingyong-1-选择恰当的词语填空-10"},{"lesson":2,"num":1,"sub":"选词填空","stem":"几年以前我也曾经有这样的经历。(了、着、过)","answers":["几年以前我也曾经有过这样的经历。"],"analysis":"记住，句子中有“曾经”的时候，后边的动词后一般应该加“过”。","id":"q0400","cat":"fill","section":"应用练习","bookPage":150,"key":"yingyong-2-选词填空-1"},{"lesson":2,"num":2,"sub":"选词填空","stem":"听完她的故事，我们大家都激动得流下眼泪。(了、着、过)","answers":["听完她的故事，我们大家都激动得流下了眼泪。"],"analysis":"“流眼泪”是已经发生了的事情，当然应该用“了”。","id":"q0401","cat":"fill","section":"应用练习","bookPage":150,"key":"yingyong-2-选词填空-2"},{"lesson":2,"num":3,"sub":"选词填空","stem":"几个月来，我一直在努力地学习。(了、着、过)","answers":["几个月来，我一直在努力地学习着。"],"analysis":"“学习”这个动作从几个月以前一直持续到今天，并且还会继续下去，因此，“着”是唯一正确的选择。“……来”是到目前、今天的意思。","id":"q0402","cat":"fill","section":"应用练习","bookPage":150,"key":"yingyong-2-选词填空-3"},{"lesson":2,"num":4,"sub":"选词填空","stem":"为了上辅导班，我已经去_好几次_。(了、着、过)","answers":["为了上辅导班，我已经去过好几次了。","为了上辅导班，我已经去了好几次了。"],"analysis":"一般句子有“已经”这个词语时，句尾常常应该有“了”与之搭配，句中动词后可以用“过”或“了”。","id":"q0403","cat":"fill","section":"应用练习","bookPage":150,"key":"yingyong-2-选词填空-4"},{"lesson":2,"num":5,"sub":"选词填空","stem":"我好像记得老师给我们讲 这个问题。(了、着、过)","answers":["我好像记得老师给我们讲过这个问题。"],"analysis":"“记得”的事情，应该是以往的经历，“过”是最正确的答案。还应该知道，“记住”常常是说现在或以后的事情。","id":"q0404","cat":"fill","section":"应用练习","bookPage":150,"key":"yingyong-2-选词填空-5"},{"lesson":2,"num":1,"sub":"根据句子的内容，用所给的词语改写句子","stem":"孩子们一边唱歌，一边挥舞手中的彩绸。","answers":["孩子们一边唱着歌，一边挥舞着手中的彩绸。"],"analysis":"句子中“唱歌”与“挥舞彩绸”是正在同时进行的两个动作，“着”应该紧跟在两个动作中的动词之后。","id":"q0405","cat":"rewrite","section":"应用练习","bookPage":150,"key":"yingyong-2-根据句子的内容，用所给的词语改写句子-1"},{"lesson":2,"num":2,"sub":"根据句子的内容，用所给的词语改写句子","stem":"外面刮大风，你们不要出去了。 (着、呢)","answers":["外面刮着大风呢，你们不要出去了。"],"analysis":"“着、呢”可以分别表示动作的正在进行，也可以组成“着呢”跟在动词后表示动作的正在进行。“刮风”是动宾结构，因此“刮着大风呢”是最好的用法。有人喜欢把“呢”放在整个句子的最后，没有意义，是错误的。","id":"q0406","cat":"rewrite","section":"应用练习","bookPage":150,"key":"yingyong-2-根据句子的内容，用所给的词语改写句子-2"},{"lesson":2,"num":3,"sub":"根据句子的内容，用所给的词语改写句子","stem":"吃完午饭，他就跟朋友去颐和园了。","answers":["吃完了午饭，他就跟朋友去颐和园了。","吃完午饭，他就跟朋友去了颐和园了。"],"analysis":"“了”可以放在句子中的两个位置，都能够表达相同的意思。有人说“吃完”已经表示的是动作的完成，还能加“了”吗？回答是“可以”！","id":"q0407","cat":"rewrite","section":"应用练习","bookPage":151,"key":"yingyong-2-根据句子的内容，用所给的词语改写句子-3"},{"lesson":2,"num":4,"sub":"根据句子的内容，用所给的词语改写句子","stem":"我去西单图书大厦买几本汉英对照的小说。(昨天、了)","answers":["昨天我去西单图书大厦买了几本汉英对照的小说。","我昨天去西单图书大厦买了几本汉英对照的小说。"],"analysis":"时间词可以在主语前或后，“了”应该位于动词之后。","id":"q0408","cat":"rewrite","section":"应用练习","bookPage":151,"key":"yingyong-2-根据句子的内容，用所给的词语改写句子-4"},{"lesson":2,"num":5,"sub":"根据句子的内容，用所给的词语改写句子","stem":"我去哈尔滨看冰灯。 (去年、过)","answers":["去年我去哈尔滨看过冰灯。","我去年去哈尔滨看过冰灯。"],"analysis":"应该注意时间词语和“过”的位置。记住，动态助词“过、着、了”一般应该放在动词之后。","id":"q0409","cat":"rewrite","section":"应用练习","bookPage":151,"key":"yingyong-2-根据句子的内容，用所给的词语改写句子-5"},{"lesson":2,"num":1,"sub":"给词语选择恰当的位置","stem":"我送A给他一条漂亮的领带B，他愉快地C接受D。","word":"了","options":null,"answer":"D","analysis":"“了”在句中的位置只有两个，句尾或动词后。“送”与“给”之间不能加“了”，因为动词与介宾补语关系紧密，如“放在、坐在、递给、开往”等，不能分开。正确位置只能是D，表示动作的过去和完成。应该注意的是，有人喜欢把“了”放在B处，但无论从语法上还是从语气上都不合适，请参考本课第一部分“知识讲解”的内容。","id":"q0410","cat":"pos","section":"应用练习","bookPage":151,"key":"yingyong-2-给词语选择恰当的位置-1"},{"lesson":2,"num":2,"sub":"给词语选择恰当的位置","stem":"我们回学校以后，他就骑A上车到B朋友家C聊天去D。","word":"了","options":null,"answer":"D","analysis":"“了”同样应该放在句尾。A、B同样都不合适，首先“骑”与“上”之间不能加“了”，因为动词与结果补语之间一般不能加其他成分。“到”与“朋友家”之间似乎可以加“了”，但句尾没有“了”会使整个句子的语气不完整。注意：“了”具有完句的作用。","id":"q0411","cat":"pos","section":"应用练习","bookPage":151,"key":"yingyong-2-给词语选择恰当的位置-2"},{"lesson":2,"num":3,"sub":"给词语选择恰当的位置","stem":"今天工作很紧张A，我想吃B午饭C就去D办公室。","word":"了","options":null,"answer":"B","analysis":"“动词+了…·就…”是一个固定的形式，表示前后紧密相连的两个动作。D处不能加“了”，因为这个动作还没有发生。有的同学喜欢把“了”放在A处，请注意，一般情况下，形容词后不加“了”，表示变化时除外。","id":"q0412","cat":"pos","section":"应用练习","bookPage":151,"key":"yingyong-2-给词语选择恰当的位置-3"},{"lesson":2,"num":4,"sub":"给词语选择恰当的位置","stem":"怎么咱们刚出A来B就下C雨D，还是先回去吧。","word":"了","options":null,"answer":"D","analysis":"这个句子中的“了”应该放在句尾，表示变化。C同样不合适。","id":"q0413","cat":"pos","section":"应用练习","bookPage":152,"key":"yingyong-2-给词语选择恰当的位置-4"},{"lesson":2,"num":5,"sub":"给词语选择恰当的位置","stem":"我刚从图书馆借A来B一本《三国演义》C，下个月才还D，你看吧。","word":"了","options":null,"answer":"B","analysis":"“了”用在动词后，宾语前一般应该有数量词语，因此，B是最恰当的位置。有人喜欢在“还”后加“了”，但应该注意“还”前边的“才”，望“才”常常表示动作发生得晚或慢，它后边的动词一般不加“了”。对于“才、就”，本教材将在下册第三课“副词分析”中进行具体分析。","id":"q0414","cat":"pos","section":"应用练习","bookPage":152,"key":"yingyong-2-给词语选择恰当的位置-5"},{"lesson":2,"num":6,"sub":"给词语选择恰当的位置","stem":"外面下那么大的雨A，看来B今天他们是来C不D了，别等了。","word":"了","options":null,"answer":"D","analysis":"“了”在句中应该读“liao”，是可能补语。A处同样不能用“了”，如果前边没有“那么大的”，则可以用“了”。","id":"q0415","cat":"pos","section":"应用练习","bookPage":152,"key":"yingyong-2-给词语选择恰当的位置-6"},{"lesson":2,"num":7,"sub":"给词语选择恰当的位置","stem":"他正跳A舞B，忽然看C到台下有D一个人向他招手。","word":"着","options":null,"answer":"A","analysis":"“着”表示动作的持续进行，在句中与“正”搭配。“看”、“到”之间是动补关系，不能加“了”，“有”后一般不用“了”。","id":"q0416","cat":"pos","section":"应用练习","bookPage":152,"key":"yingyong-2-给词语选择恰当的位置-7"},{"lesson":2,"num":8,"sub":"给词语选择恰当的位置","stem":"从小到A大我一直习惯B在床上躺C看D书，眼晴仍然很好。","word":"着","options":null,"answer":"C","analysis":"“躺着”是“看书”的方式，这是“着”的一项语法功能。","id":"q0417","cat":"pos","section":"应用练习","bookPage":152,"key":"yingyong-2-给词语选择恰当的位置-8"},{"lesson":2,"num":9,"sub":"给词语选择恰当的位置","stem":"听A到爱德华的夸奖B，新娘红C脸不好意思地低D下了头。","word":"着","options":null,"answer":"C","analysis":"“红着脸”是“低下了头”的伴随状况，，“红”在句中用做动词。","id":"q0418","cat":"pos","section":"应用练习","bookPage":152,"key":"yingyong-2-给词语选择恰当的位置-9"},{"lesson":2,"num":10,"sub":"给词语选择恰当的位置","stem":"张先生酷爱A幽默，在他短暂的一生中创作B许多脍炙人口的相声和戏剧作品C，其中深受人们喜爱D的是《屏中梦》。","word":"过","options":null,"answer":"B","analysis":"“过”用在动词后，表示动作的曾经发生，句中只有B符合这一语法要求。","id":"q0419","cat":"pos","section":"应用练习","bookPage":152,"key":"yingyong-2-给词语选择恰当的位置-10"},{"lesson":2,"num":1,"sub":"选择恰当的词语填空","stem":"校长就在办公室里，您自己进去跟他＿＿＿吧。","word":null,"options":{"A":"讲了","B":"讲了讲","C":"讲讲了","D":"讲一讲"},"answer":"D","analysis":"首先应该判断句中“讲”这个动作是否发生了，如果判断对了，答案自然就有了。因为A、B、C中都有“了”，表示动作已经发生，而句中的动作却是没有发生的。另外，单音节动词的重叠形式一般是“VV”、“V一V”、“V了V”、“V了一V”，如“看看”“看一看”、“看了看”、“看了一看”。动词重叠的内容，请参考本书第十二课。","id":"q0420","cat":"choice","section":"应用练习","bookPage":152,"key":"yingyong-2-选择恰当的词语填空-1"},{"lesson":2,"num":2,"sub":"选择恰当的词语填空","stem":"来北京以后，我还从没去＿＿＿长城，也不知道故宫是什么样子。","word":null,"options":{"A":"了","B":"过","C":"着","D":"得"},"answer":"B","analysis":"动词前有“从没”时，动词后边一般应该用“过”。","id":"q0421","cat":"choice","section":"应用练习","bookPage":153,"key":"yingyong-2-选择恰当的词语填空-2"},{"lesson":2,"num":3,"sub":"选择恰当的词语填空","stem":"上大学的时候，我经常想这样一个问题，人活一究竞是为了什么？","word":null,"options":{"A":"过","B":"着","C":"了","D":"完"},"answer":"B","analysis":"“活着”是指生命的持续，而“了、过、完”都有结束的意思，当然不合适。","id":"q0422","cat":"choice","section":"应用练习","bookPage":153,"key":"yingyong-2-选择恰当的词语填空-3"},{"lesson":2,"num":4,"sub":"选择恰当的词语填空","stem":"很多少数民族的舞蹈都特别吸引人，演员们在跳舞的同时，嘴里还唱＿＿＿优美的歌曲。","word":null,"options":{"A":"过","B":"着","C":"了","D":"得"},"answer":"B","analysis":"“跳舞”和“唱歌”是伴随的动作，因此，“着”是最恰当的答案。","id":"q0423","cat":"choice","section":"应用练习","bookPage":153,"key":"yingyong-2-选择恰当的词语填空-4"},{"lesson":2,"num":5,"sub":"选择恰当的词语填空","stem":"我的词典和书都在桌上放＿＿＿，你自己去拿吧。","word":null,"options":{"A":"了","B":"着","C":"呢","D":"吧"},"answer":"B","analysis":"句子表示的是动作或状态的持续，因此，“着”是最恰当的答案。","id":"q0424","cat":"choice","section":"应用练习","bookPage":153,"key":"yingyong-2-选择恰当的词语填空-5"},{"lesson":2,"num":6,"sub":"选择恰当的词语填空","stem":"凡是你说＿＿＿的话，我们都会认真地记在心里。你就放心吧！","word":null,"options":{"A":"了","B":"着","C":"过","D":"地"},"answer":"C","analysis":"“说过的话”就是以往所说的话，其他词语不能表达同样的意思。","id":"q0425","cat":"choice","section":"应用练习","bookPage":153,"key":"yingyong-2-选择恰当的词语填空-6"},{"lesson":2,"num":7,"sub":"选择恰当的词语填空","stem":"那个穿＿＿＿白裙子的就是木村小姐。","word":null,"options":{"A":"了","B":"上","C":"着","D":"过"},"answer":"C","analysis":"动态助词“着”表示的是动作的进行或状态的持续，句子中“穿着白裙子”是一种持续的状态，“了、过”都不能表达这样的意思。“上”用在动词之后只能表示动作的结果或趋向，在句子中不合适。","id":"q0426","cat":"choice","section":"应用练习","bookPage":153,"key":"yingyong-2-选择恰当的词语填空-7"},{"lesson":2,"num":8,"sub":"选择恰当的词语填空","stem":"木村小姐正在树下站＿＿＿跟一个朋友说话呢。","word":null,"options":{"A":"着","B":"立","C":"住","D":"了    光因"},"answer":"A","analysis":"“说话”的伴随状态是“在树下站着”，而表示动作的伴随状态是“着”这个动态助词的一项语法功能。“站立、站住”只表示动作或动作的结果。","id":"q0427","cat":"choice","section":"应用练习","bookPage":154,"key":"yingyong-2-选择恰当的词语填空-8"},{"lesson":2,"num":9,"sub":"选择恰当的词语填空","stem":"雨下得越来越大了，我不去 (S)","word":null,"options":{"A":"吧","B":"了","C":"呢","D":"的"},"answer":"B","analysis":"“了”的几种语法功能之中，有一项是表示“变化”的，句子中的“不去了”恰恰是这种语法功能。应该注意的是，除了表示变化的“了”以外，其他用“了”的句子中不能出现否定副词“没、不”等。说：“我错了。”","id":"q0428","cat":"choice","section":"应用练习","bookPage":154,"key":"yingyong-2-选择恰当的词语填空-9"},{"lesson":2,"num":10,"sub":"选择恰当的词语填空","stem":"听了妈妈的话，他哭＿＿＿说：“我错了。”","word":null,"options":{"A":"了","B":"一会儿","C":"一下儿","D":"着"},"answer":"D","analysis":"同第(8)题一样，“说”的伴随状态是“哭着”。其他词语都不合适。","id":"q0429","cat":"choice","section":"应用练习","bookPage":154,"key":"yingyong-2-选择恰当的词语填空-10"},{"lesson":3,"num":1,"sub":"把下面的句子改写成“是…的”句","stem":"男朋友给我寄来一个非常漂亮的生日礼物。","answers":["是男朋友给我寄来的这个非常漂亮的生日礼物。","这个非常漂亮的生日礼物是男朋友给我寄来的。"],"analysis":"“是…的”在这个句子中只能强调主语，如果把“是”、“的”放在其他位置，都不能构成“是··的”句式。还应该注意的是，用“是·的”强调句式时，句子中的主语或宾语应该是确定的。","id":"q0430","cat":"rewrite","section":"应用练习","bookPage":157,"key":"yingyong-3-把下面的句子改写成“是···的”句-1"},{"lesson":3,"num":2,"sub":"把下面的句子改写成“是…的”句","stem":"我在广州遇见了一位老朋友。","answers":["我是在广州遇见的这位老朋友。","我是在广州遇见这位老朋友的。"],"analysis":"“是…的”结构一般情况下可以强调时间、地点、方式、目的、来源归类、主语等，这个句子中，可以用“是·的”强调地点，即“遇见老朋友”的处所。必须注意，在一般句子中不确定的宾语，在“是…的”句中应该是确定的；一般句子中用“了”的，应该改用“的”。","id":"q0431","cat":"rewrite","section":"应用练习","bookPage":157,"key":"yingyong-3-把下面的句子改写成“是···的”句-2"},{"lesson":3,"num":3,"sub":"把下面的句子改写成“是…的”句","stem":"这些钱买书，那些钱买衣服。","answers":["这些钱是买书的，那些钱是买衣服的。"],"analysis":"这个句子不能改成“这些是买书的钱，那些是买衣服的钱”。因为这样改就成了一般的“是”字句，即判断句。而判断句中没有“是、的”之后句子就不成立了一一这些买书钱，那些买衣服钱。","id":"q0432","cat":"rewrite","section":"应用练习","bookPage":158,"key":"yingyong-3-把下面的句子改写成“是·的”句-3"},{"lesson":3,"num":4,"sub":"把下面的句子改写成“是…的”句","stem":"我和几个好朋友一起坐火车去三峡游览了。","answers":["我是和几个好朋友一起坐火车去三峡游览的。","我和几个好朋友是坐火车去三峡游览的。"],"analysis":"“是…的”格式强调的就是动作的时间、地点、方式等，而这个句子中“和朋友、坐火车”恰恰就是“去三峡游览”的方式。","id":"q0433","cat":"rewrite","section":"应用练习","bookPage":158,"key":"yingyong-3-把下面的句子改写成“是·的”句-4"},{"lesson":3,"num":5,"sub":"把下面的句子改写成“是…的”句","stem":"2010年7月，我从北京语言大学毕业。","answers":["我是2010年7月从北京语言大学毕业的。","2010年7月，我是从北京语言大学毕业的。"],"analysis":"这个句子中既有时间“2010年7月”，又有处所“从北京语言大学”，如果强调的重点不同，句子中个别词语的安排就应该不一样。","id":"q0434","cat":"rewrite","section":"应用练习","bookPage":158,"key":"yingyong-3-把下面的句子改写成“是···的”句-5"},{"lesson":3,"num":1,"sub":"给词语选择恰当的位置","stem":"A孩子们听课时B那么安静，老师的每一句话C都D吸引着他们。","word":"是","options":null,"answer":"B","analysis":"“是”在句中起强调作用，轻读。有人喜欢把“是”放在D处，构成“都是”，但这样的话应该有名词宾语。","id":"q0435","cat":"pos","section":"应用练习","bookPage":158,"key":"yingyong-3-给词语选择恰当的位置-1"},{"lesson":3,"num":2,"sub":"给词语选择恰当的位置","stem":"别看他A不认识几个字，B事他都C想管，一管准D会出乱子。","word":"是","options":null,"answer":"B","analysis":"“是”在这个句子里可以是“任何”的意思，表示“全无例外”。","id":"q0436","cat":"pos","section":"应用练习","bookPage":158,"key":"yingyong-3-给词语选择恰当的位置-2"},{"lesson":3,"num":3,"sub":"给词语选择恰当的位置","stem":"他们A前年9月B从各国C陆续来的北京，现在已经差不多D两年了。","word":"是","options":null,"answer":"A","analysis":"这是典型的“是··的”格式，强调时间、地点和方式。不能放在B、C处，只能选择A。也就是说，在一个句子中既有时间、地点，又有方式状语时，“是”应该放在最前面。","id":"q0437","cat":"pos","section":"应用练习","bookPage":158,"key":"yingyong-3-给词语选择恰当的位置-3"},{"lesson":3,"num":4,"sub":"给词语选择恰当的位置","stem":"A王强猛冲上去，从B车轮下C把小孩子D救出来的。","word":"是","options":null,"answer":"A","analysis":"强调主语，因此应该放在A处。其他几个地方都不合适。","id":"q0438","cat":"pos","section":"应用练习","bookPage":158,"key":"yingyong-3-给词语选择恰当的位置-4"},{"lesson":3,"num":5,"sub":"给词语选择恰当的位置","stem":"病人非常A危险，我们B应该先C救人再D考虑钱的问题？","word":"是不是","options":null,"answer":"B","analysis":"“是不是”在句中有三个位置，即句首、主谓之间和句尾，只有B符合语法要求。","id":"q0439","cat":"pos","section":"应用练习","bookPage":159,"key":"yingyong-3-给词语选择恰当的位置-5"},{"lesson":3,"num":6,"sub":"给词语选择恰当的位置","stem":"A来中国以后B，你去过C动物园D？","word":"没有","options":null,"answer":"D","analysis":"“没有”在句子中只是一种疑问句的表现形式，即“.…没有？”这种形式也可以表现为“V没V？”","id":"q0440","cat":"pos","section":"应用练习","bookPage":159,"key":"yingyong-3-给词语选择恰当的位置-6"},{"lesson":3,"num":7,"sub":"给词语选择恰当的位置","stem":"蓝天上A飘着白云，B一个蒙古族少女唱着歌，骑着马缓缓地走过去，C此情此景D美极了。","word":"真是","options":null,"answer":"D","analysis":"“真是”在句子中与“极了”一起强调“美”的程度。用在动词之前时，一般强调的是真实的情况，这时也可以只用“真”或“是”。","id":"q0441","cat":"pos","section":"应用练习","bookPage":159,"key":"yingyong-3-给词语选择恰当的位置-7"},{"lesson":3,"num":1,"sub":"选择恰当的词语填空","stem":"你们知道中国人如何过春节＿＿＿吗？","word":null,"options":{"A":"了","B":"的","C":"着","D":"是"},"answer":"B","analysis":"汉语“是…的”格式中的“是”在口语中常常可以省略，但是，“的”必须用。这个句子强调的是“过春节”的方式。","id":"q0442","cat":"choice","section":"应用练习","bookPage":159,"key":"yingyong-3-选择恰当的词语填空-1"},{"lesson":3,"num":2,"sub":"选择恰当的词语填空","stem":"北京公园管理部门所推出的年卡，，＿＿＿方便、实惠等优点，深受老年朋友们的欢迎。","word":null,"options":{"A":"拥有","B":"具有","C":"怀有","D":"占有"},"answer":"B","analysis":"四个备选答案中，只有“具有”符合句子的语法要求，“具有”的宾语常常是“特点、特色、风格、传统、优点、缺点”等带有比较抽象意义的名词。","id":"q0443","cat":"choice","section":"应用练习","bookPage":159,"key":"yingyong-3-选择恰当的词语填空-2"},{"lesson":3,"num":3,"sub":"选择恰当的词语填空","stem":"张老师五岁的小儿子已经 ＿＿＿1.50米那么高了。","word":null,"options":{"A":"比","B":"有","C":"是","D":"在"},"answer":"B","analysis":"“有”可以用来表示比较，而且后边常常带有“这么、那么”一类的词语。这个句子如果用“比”，则不能用“那么”。","id":"q0444","cat":"choice","section":"应用练习","bookPage":159,"key":"yingyong-3-选择恰当的词语填空-3"},{"lesson":3,"num":4,"sub":"选择恰当的词语填空","stem":"那个学校后边＿＿＿一条小河和一座小山。","word":null,"options":{"A":"是","B":"在","C":"有","D":"从"},"answer":"C","analysis":"在表示存在时，“是”的后边应该是比较确定的事物或处所，而“有”的后过则可以是比较模糊或不确定的事物、处所。“在”也可以组成表示存在的句子，但结构与“是、有”相反，参考第八课。正确答案只能是“有”。","id":"q0445","cat":"choice","section":"应用练习","bookPage":159,"key":"yingyong-3-选择恰当的词语填空-4"},{"lesson":3,"num":5,"sub":"选择恰当的词语填空","stem":"什么？十岁就＿＿＿1米7那么高了，干脆把他送到美国NBA去得了。","word":null,"options":{"A":"比","B":"有","C":"如","D":"得"},"answer":"B","analysis":"应该记住比较句中“A有/没有B(这么/那么)adj”的格式，并且应该能够比较灵活地运用。比较句的内容请参考第九课的讲解与分析。","id":"q0446","cat":"choice","section":"应用练习","bookPage":160,"key":"yingyong-3-选择恰当的词语填空-5"},{"lesson":3,"num":6,"sub":"选择恰当的词语填空","stem":"克隆技术不能用来克隆人已被世界各国所接受，这是母庸置疑＿＿＿。","word":null,"options":{"A":"了","B":"啊","C":"吧","D":"的"},"answer":"D","analysis":"“是…的”格式中，可以省略“是”，但不能没有“的”。","id":"q0447","cat":"choice","section":"应用练习","bookPage":160,"key":"yingyong-3-选择恰当的词语填空-6"},{"lesson":4,"num":1,"sub":"把下列句子改写成“把”字句或“被”字句","stem":"因为房间里太热，小刘脱了大衣。","answers":["因为房间里太热，小刘把大衣脱了。"],"analysis":"一般的“主-动-宾”句转换成“把”字句时，主语不用改变，只要用“把”字把宾语提到谓语之前就可以了。应该注意的是，“把”的宾语必须是确定的，其后的动词之后应该有其他后续成分。","id":"q0448","cat":"rewrite","section":"应用练习","bookPage":164,"key":"yingyong-4-把下列句子改写成“把”字句或“被”字句-1"},{"lesson":4,"num":2,"sub":"把下列句子改写成“把”字句或“被”字句","stem":"这几个问题我们终于弄明白了。","answers":["我们终于把这几个问题弄明白了。","这几个问题终于被我们弄明白了。"],"analysis":"这个句子由于可以分别用“我们”和“这几个问题”做主语，因此也就可以改变成“把”字句和“被”字句。改变后的两个句子尽管语法不同，但是意思是完全一样的。注意它们表达上的区别。","id":"q0449","cat":"rewrite","section":"应用练习","bookPage":164,"key":"yingyong-4-把下列句子改写成“把”字句或“被”字句-2"},{"lesson":4,"num":3,"sub":"把下列句子改写成“把”字句或“被”字句","stem":"昨天的大雨把整个校园洗刷得干干净净。","answers":["整个校园被昨天的大雨洗刷得干干净净。！"],"analysis":"一般的“把”字句与“被”字句可以相互转换，意义不会有什么差别。转换的方式就是将主语与宾语的位置加以调换，同时“把”、“被”互换。但必须注意的是，并不是所有的这两种句子都可以转换。","id":"q0450","cat":"rewrite","section":"应用练习","bookPage":164,"key":"yingyong-4-把下列句子改写成“把”字句或“被”字句-3"},{"lesson":4,"num":4,"sub":"把下列句子改写成“把”字句或“被”字句","stem":"我记住了这篇文章的全部内容。","answers":["我把这篇文章的全部内容都记住了。"],"analysis":"这个句子一般不应该转换成“被”字句，即“这篇文章的全部内容都被我记住了”。这样的句子虽然符合汉语语法，但完全不符合汉语的习惯表达方式，简单地说，没有人会这么说。","id":"q0451","cat":"rewrite","section":"应用练习","bookPage":164,"key":"yingyong-4-把下列句子改写成“把”字句或“被”字句-4"},{"lesson":4,"num":5,"sub":"把下列句子改写成“把”字句或“被”字句","stem":"他们拒绝了我的要求。","answers":["我的要求被他们拒绝了。"],"analysis":"与上一个句子一样，这个句子也不能用“把”字句进行转换，即“他们把我的要求拒绝了”。因为那不符合汉语口语的表达习惯。","id":"q0452","cat":"rewrite","section":"应用练习","bookPage":164,"key":"yingyong-4-把下列句子改写成“把”字句或“被”字句-5"},{"lesson":4,"num":1,"sub":"给词语选择恰当的位置","stem":"中国A入世以后，B不少国外大企业都C他们的办公地点D迁往内地。","word":"将","options":null,"answer":"C","analysis":"“将”有两种意义，一个表示“将要、将来”，另一个表示“把”。这里用的是第二个意思。按照“把”字句的要求，C是正确的位置。","id":"q0453","cat":"pos","section":"应用练习","bookPage":165,"key":"yingyong-4-给词语选择恰当的位置-1"},{"lesson":4,"num":2,"sub":"给词语选择恰当的位置","stem":"A慢点儿B吃，C把肚子D弄坏了。","word":"别","options":null,"answer":"C","analysis":"在“把”字句中，否定副词一定要放在“把”字前边。","id":"q0454","cat":"pos","section":"应用练习","bookPage":165,"key":"yingyong-4-给词语选择恰当的位置-2"},{"lesson":4,"num":3,"sub":"给词语选择恰当的位置","stem":"重要的不是A学了多少，而是B把C学过的内容全D都记住。","word":"能不能","options":null,"answer":"B","analysis":"能愿动词也应该放在“把”字前边。","id":"q0455","cat":"pos","section":"应用练习","bookPage":165,"key":"yingyong-4-给词语选择恰当的位置-3"},{"lesson":4,"num":4,"sub":"给词语选择恰当的位置","stem":"今天A我又B批评C了一顿D。","word":"让老师","options":null,"answer":"B","analysis":"被动句的介词及宾语应该在句子中的主要动词之前。","id":"q0456","cat":"pos","section":"应用练习","bookPage":165,"key":"yingyong-4-给词语选择恰当的位置-4"},{"lesson":4,"num":5,"sub":"给词语选择恰当的位置","stem":"A听说这次展销会上B抽样C检查的商品中，有一多半D存在质量问题。","word":"被","options":null,"answer":"B","analysis":"“抽样检查”是一个比较固定的格式，中间一般不插入其他成分。B是唯一恰当的位置。","id":"q0457","cat":"pos","section":"应用练习","bookPage":165,"key":"yingyong-4-给词语选择恰当的位置-5"},{"lesson":4,"num":6,"sub":"给词语选择恰当的位置","stem":"我A想一个小时B把这本小说C看D完吧。","word":"能","options":null,"answer":"B","analysis":"能愿动词放在“把”字之前，这是汉语语法对“把”字句的要求。","id":"q0458","cat":"pos","section":"应用练习","bookPage":165,"key":"yingyong-4-给词语选择恰当的位置-6"},{"lesson":4,"num":7,"sub":"给词语选择恰当的位置","stem":"幸福的时光A转瞬即逝，婚礼B飞机轰鸣声C彻底D打乱。","word":"被","options":null,"answer":"B","analysis":"在被动句中，“被”可以直接用在动词之前，但句子中如果有主动者时，“被”还是要放在这个动作的发出者之前。","id":"q0459","cat":"pos","section":"应用练习","bookPage":165,"key":"yingyong-4-给词语选择恰当的位置-7"},{"lesson":4,"num":8,"sub":"给词语选择恰当的位置","stem":"都下起雨来了，怎么还A把外边的衣服B收C进D来！","word":"不","options":null,"answer":"A","analysis":"“不”和“没、没有、别、未”等一样，都应该放在“把”字之前。","id":"q0460","cat":"pos","section":"应用练习","bookPage":165,"key":"yingyong-4-给词语选择恰当的位置-8"},{"lesson":4,"num":9,"sub":"给词语选择恰当的位置","stem":"刚吸了一口，A我B把烟C摔在地上，D在心里骂自己：“太没出息了！”","word":"就","options":null,"answer":"B","analysis":"在“把”字句中，否定副词和能愿动词应该放在“把”之前，“就”是副词，一般用在动词或形容词之前。在这个句子中，“就”连接的是“吸”和“把烟摔在地上”两个动作，而且强调这两个动作连接得紧密，因此，应该选择B。","id":"q0461","cat":"pos","section":"应用练习","bookPage":165,"key":"yingyong-4-给词语选择恰当的位置-9"},{"lesson":4,"num":10,"sub":"给词语选择恰当的位置","stem":"这几天太忙了，我A还B来得及C把在长城照的照片D发给你。","word":"没","options":null,"answer":"B","analysis":"有的学生可能会选择C，因为否定副词应该在“把”字之前。但是，这个句子要考你的不只是“把”字句，还要考你了解不了解“还没…\"(呢)”这个固定格式。这个格式我们将在下册“特殊词语分析”中介绍。","id":"q0462","cat":"pos","section":"应用练习","bookPage":166,"key":"yingyong-4-给词语选择恰当的位置-10"},{"lesson":4,"num":1,"sub":"选择恰当的词语填空","stem":"侯耀文老师＿＿＿他平凡的一生全部贡献给了相声事业。","word":null,"options":{"A":"向","B":"把","C":"让","D":"使"},"answer":"B","analysis":"“让、使”的用法相同，都可以用在兼语句中，因此，不能选择其中之一。“向”的后边可以是表示方向处所的词语或与人有关的词语，在这个句子中不合适。“把”是正确的答案。","id":"q0463","cat":"choice","section":"应用练习","bookPage":166,"key":"yingyong-4-选择恰当的词语填空-1"},{"lesson":4,"num":2,"sub":"选择恰当的词语填空","stem":"这个意外的消息半在场的人都大吃一惊。","word":null,"options":{"A":"把","B":"使","C":"被","D":"将"},"answer":"B","analysis":"“把、将”的用法相同，选哪一个都不可以。“人吃惊”不是被动的，因此，只有“使”是最恰当的选择。“使、令”前面常常是与事情有关的词语，请参考第八课的兼语句。应该注意的是，在一般的汉语测试中，如果三个备选项目你都很熟悉，而且又都不对，你就应该毫不犹豫地选择剩下的那个。","id":"q0464","cat":"choice","section":"应用练习","bookPage":166,"key":"yingyong-4-选择恰当的词语填空-2"},{"lesson":4,"num":3,"sub":"选择恰当的词语填空","stem":"礼堂里的数千名听众都＿＿＿他那富有激情的讲演深深地吸引住了。","word":null,"options":{"A":"把","B":"为","C":"被","D":"受"},"answer":"C","analysis":"“为、受、被”都可以表示被动，但是“为……所…”是固定的格式，“受”表示被动有比较特殊的格式和词语，这里“被”是最正确的选择。","id":"q0465","cat":"choice","section":"应用练习","bookPage":166,"key":"yingyong-4-选择恰当的词语填空-3"},{"lesson":4,"num":4,"sub":"选择恰当的词语填空","stem":"在那次列车追尾事故中，数十人照季夺去了生命，公司也因此损失惨重。","word":null,"options":{"A":"让","B":"把","C":"叫","D":"被"},"answer":"D","analysis":"“让、叫、被”都表示被动，但只有“被”可以直接用在动词前。还应该注意，“把”的后边也必须出现名词性词语。","id":"q0466","cat":"choice","section":"应用练习","bookPage":166,"key":"yingyong-4-选择恰当的词语填空-4"},{"lesson":4,"num":5,"sub":"选择恰当的词语填空","stem":"著名的体育节目主持人那威先生，＿＿＿公认为中国五子棋之父。","word":null,"options":{"A":"把","B":"被","C":"受","D":"由"},"answer":"B","analysis":"“公认”是动词，它的前边只能用“被”。需要注意的是，“受”的后边也可以直接跟动词，如“受欢迎、受表扬、受批评、受打击”等，但是，“受”后边的动词不能再带其他成分。","id":"q0467","cat":"choice","section":"应用练习","bookPage":167,"key":"yingyong-4-选择恰当的词语填空-5"},{"lesson":4,"num":6,"sub":"选择恰当的词语填空","stem":"世界上各个国家的高等入学考试大都＿＿＿学生课本上学习的内容为基础。","word":null,"options":{"A":"把","B":"用","C":"以","D":"拿"},"answer":"C","analysis":"“以.…·为……”是固定的搭配形式，如果用“把、拿、用”，后边则应该有“当作、作、作为”等来配合。","id":"q0468","cat":"choice","section":"应用练习","bookPage":167,"key":"yingyong-4-选择恰当的词语填空-6"},{"lesson":4,"num":7,"sub":"选择恰当的词语填空","stem":"实行股份制以后，你还跟以前一样，出工不出力，当然要＿＿＿批评。","word":null,"options":{"A":"把","B":"为","C":"叫","D":"受醉百来从站"},"answer":"D","analysis":"“受批评”是最好的答案。如果备选项目中有“被”，也可以选择，但是，这种情况下“被、受”同时出现，不符合一般的测试要求。","id":"q0469","cat":"choice","section":"应用练习","bookPage":167,"key":"yingyong-4-选择恰当的词语填空-7"},{"lesson":4,"num":8,"sub":"选择恰当的词语填空","stem":"读书的时候，应该＿＿＿自己认为比较重要的内容用笔标记出来。","word":null,"options":{"A":"让","B":"在","C":"把","D":"给"},"answer":"C","analysis":"应该注意“把”字句中动词的一
