出来、过来、过去”填空","stem":"这回你算明白＿＿＿了，知道谁好谁坏了吧？","answers":["这回你算明白过来了，知道谁好谁不好了吧？"],"analysis":"“过来”表示的仍是从不好的状态向好的状态转变。","id":"q0651","cat":"fill","section":"应用练习","bookPage":216,"key":"yingyong-11-分别用“起来、下来、下去、出来、过来、过去”填空-9"},{"lesson":11,"num":10,"sub":"分别用“起来、下来、下去、出来、过来、过去”填空","stem":"再这样发展一定会出问题，赶快打住吧！","answers":["再这样发展下去一定会出问题，赶快打住吧！"],"analysis":"“下去”同样表示的是动作或状态的延续。","id":"q0652","cat":"fill","section":"应用练习","bookPage":216,"key":"yingyong-11-分别用“起来、下来、下去、出来、过来、过去”填空-10"},{"lesson":11,"num":1,"sub":"给词语选择恰当的位置","stem":"汽车疾驶A在沙漠上B，整个世界都C好像要燃烧D。","word":"起来","options":null,"answer":"D","analysis":"“起来”应该跟在动词之后，而A的“疾驶”后有“在沙漠上”作补语，不能插入其他成分。D是唯一正确的位置。","id":"q0653","cat":"pos","section":"应用练习","bookPage":216,"key":"yingyong-11-给词语选择恰当的位置-1"},{"lesson":11,"num":2,"sub":"给词语选择恰当的位置","stem":"你们A做的B是小事，但C它将为我们公司D带来长远的影响。","word":"看起来","options":null,"answer":"B","analysis":"“看起来”作为插入语一般用在主语前或主语后谓语前，句子中符合这个条件的只有B和C两个位置。但是从全句的内容看，只有B才最适合用“看起来”，因为“看起来是小事”，其实未必真的是“小事”。","id":"q0654","cat":"pos","section":"应用练习","bookPage":216,"key":"yingyong-11-给词语选择恰当的位置-2"},{"lesson":11,"num":3,"sub":"给词语选择恰当的位置","stem":"我听了A很长时间也B听C出来这D是哪个民族的音乐。","word":"不","options":null,"answer":"C","analysis":"有人可能喜欢选择D，这是错误的！因为“这不是哪个民族的音乐”不能清楚地表达意思，与全句的内容也不搭配。“听不出来”才是正确的答案。必须重视可能补语在汉语实际应用中的作用。","id":"q0655","cat":"pos","section":"应用练习","bookPage":216,"key":"yingyong-11-给词语选择恰当的位置-3"},{"lesson":11,"num":4,"sub":"给词语选择恰当的位置","stem":"人们唱着跳着A，说着笑着B，气氛很快就C活跃D了。","word":"起来","options":null,"answer":"D","analysis":"汉语语法告诉我们，动词加“着”之后一般不能再加其他补语，因此A、B两个位置都不合适。“起来”作为补语应该跟在动词或形容词之后。正确的选择只能是D。","id":"q0656","cat":"pos","section":"应用练习","bookPage":217,"key":"yingyong-11-给词语选择恰当的位置-4"},{"lesson":11,"num":5,"sub":"给词语选择恰当的位置","stem":"同学们上A课记B课堂笔记时应该记C老师板书的内容D。","word":"下来","options":null,"answer":"C","analysis":"“下来”一般用在动词性词语之后，但A、B之后都不能加“下来”，因为它们的前后是两个结合紧密的动宾结构，只有C符合语法要求。","id":"q0657","cat":"pos","section":"应用练习","bookPage":217,"key":"yingyong-11-给词语选择恰当的位置-5"},{"lesson":11,"num":1,"sub":"选择恰当的词语填空","stem":"他们的车还没有到就＿＿＿，我们躲都没地方躲。","word":null,"options":{"A":"下雨起来了","B":"下起雨来了","C":"下了起来雨","D":"雨下起来了"},"answer":"B","analysis":"“起来”作补语时必须紧跟动词，不能放在名词之后，同时，“就”直接修饰动词，因此，只有“下起雨来了”符合语法要求。","id":"q0658","cat":"choice","section":"应用练习","bookPage":217,"key":"yingyong-11-选择恰当的词语填空-1"},{"lesson":11,"num":2,"sub":"选择恰当的词语填空","stem":"你们看，张东刚刚当上经理，就跟咱们摆＿＿＿臭架子＿＿＿了。","word":null,"options":{"A":"起…·","B":"下…去","C":"过…来","D":"上…·"},"answer":"A","analysis":"“摆臭架子”这件事是刚刚开始发生的，因此用“起来”最合适。其他词语都不能表达这个意思。","id":"q0659","cat":"choice","section":"应用练习","bookPage":217,"key":"yingyong-11-选择恰当的词语填空-2"},{"lesson":11,"num":3,"sub":"选择恰当的词语填空","stem":"这次考试看着容易，可一做＿＿＿就不那么容易了，我差点儿没通过。","word":null,"options":{"A":"起来","B":"上来","C":"出来","D":"下来"},"answer":"A","analysis":"“做起来”在这个句子里既可以是“做的时候”的意思，也可以理解为“开始做的时候”的意思，与前边的“看着”相对应。而“做出来”表示的是已经有了结果，不符合句子所要表达的意思。","id":"q0660","cat":"choice","section":"应用练习","bookPage":217,"key":"yingyong-11-选择恰当的词语填空-3"},{"lesson":11,"num":4,"sub":"选择恰当的词语填空","stem":"加入“世贸”以后，中国市场上的进口商品更加丰富＿＿＿了。","word":null,"options":{"A":"出来","B":"上来","C":"起来","D":"过来"},"answer":"C","analysis":"“丰富起来”是开始丰富的意思，也有“越来越丰富”的意思。","id":"q0661","cat":"choice","section":"应用练习","bookPage":217,"key":"yingyong-11-选择恰当的词语填空-4"},{"lesson":11,"num":5,"sub":"选择恰当的词语填空","stem":"我们以前见过面，不过你的名字我一下子＿＿＿了。","word":null,"options":{"A":"想不出来","B":"想不起来","C":"没想出来","D":"没想起来"},"answer":"B","analysis":"来”的常常是“办法”等词语。“没想起来”在句中不合适，因为句尾有“了”就不能用“没”，如果没有句尾的“了”，“没想起来”是可以用的。因此，B是唯一正确的选择。","id":"q0662","cat":"choice","section":"应用练习","bookPage":217,"key":"yingyong-11-选择恰当的词语填空-5"},{"lesson":11,"num":6,"sub":"选择恰当的词语填空","stem":"如果把我一个人放到月球上去，没有空气没有水，我怎么能活＿＿＿呀！","word":null,"options":{"A":"下来","B":"起来","C":"下去","D":"过去"},"answer":"C","analysis":"“活下去”是继续维持自己生命的意思。这里不能用“起来”。","id":"q0663","cat":"choice","section":"应用练习","bookPage":218,"key":"yingyong-11-选择恰当的词语填空-6"},{"lesson":11,"num":7,"sub":"选择恰当的词语填空","stem":"你们看，新郎官这么一打扮，谁还＿＿＿他是谁？","word":null,"options":{"A":"认不出去","B":"认得出去","C":"认不出来","D":"认得出来"},"answer":"D","analysis":"这是一个反问句，说话者想表达的是没有人能知道新郎是谁，因此只能用肯定的形式，D符合句子的意思。","id":"q0664","cat":"choice","section":"应用练习","bookPage":218,"key":"yingyong-11-选择恰当的词语填空-7"},{"lesson":11,"num":8,"sub":"选择恰当的词语填空","stem":"为了纪念咱们结婚30周年，我特意用100克纯金为你打＿＿＿一对手镯。","word":null,"options":{"A":"下来","B":"出来","C":"回来","D":"起来"},"answer":"B","analysis":"从没有这对手镯到有这对手镯，是一个“从无到有”的过程，因此，“出来”是最恰当的答案。","id":"q0665","cat":"choice","section":"应用练习","bookPage":218,"key":"yingyong-11-选择恰当的词语填空-8"},{"lesson":11,"num":9,"sub":"选择恰当的词语填空","stem":"你整整昏迷了三天三夜，现在终于醒＿＿＿了！可把我们急坏了。","word":null,"options":{"A":"上来","B":"起来","C":"过来","D":"过去"},"answer":"C","analysis":"从不正常的状态回到正常的状态，“过来”是最好的选择。","id":"q0666","cat":"choice","section":"应用练习","bookPage":218,"key":"yingyong-11-选择恰当的词语填空-9"},{"lesson":11,"num":10,"sub":"选择恰当的词语填空","stem":"王立昨晚喝了不少酒，刚才醒过来一会儿，这不，又睡＿＿＿了。","word":null,"options":{"A":"下去","B":"下来","C":"过来","D":"过去"},"answer":"D","analysis":"从清醒到昏睡的状态，也就是从正常的状态到不正常的状态，应该用“过去”。这里不能用“下去”，因为这里的“睡”不是一种正常状态。","id":"q0667","cat":"choice","section":"应用练习","bookPage":218,"key":"yingyong-11-选择恰当的词语填空-10"},{"lesson":11,"num":11,"sub":"选择恰当的词语填空","stem":"一到4月，中国北方的天气就暖和)了。","word":null,"options":{"A":"起来","B":"出来","C":"上来","D":"上去"},"answer":"A","analysis":"4月是北方的春天，天气应该开始暖和了。因此，“起来”是最好的答案。其他趋向动词都不能表示这样的意思。","id":"q0668","cat":"choice","section":"应用练习","bookPage":218,"key":"yingyong-11-选择恰当的词语填空-11"},{"lesson":11,"num":12,"sub":"选择恰当的词语填空","stem":"他好容易才想＿＿＿了一个办法，你一定要鼓励他。","word":null,"options":{"A":"出","B":"起","C":"过","D":"住"},"answer":"A","analysis":"“出”与“出来”可以表示相同的意思，即使动作的宾语从无到有，句子中正是这样的意思。“起”与“起来”相同，与“想”搭配，只能表示招回记忆。其他两个词在句子中都不能清楚地表达意思。","id":"q0669","cat":"choice","section":"应用练习","bookPage":219,"key":"yingyong-11-选择恰当的词语填空-12"},{"lesson":11,"num":13,"sub":"选择恰当的词语填空","stem":"他因为偷盗被警察抓＿＿＿了，你千万不能再去找他了。","word":null,"options":{"A":"过来","B":"进来","C":"起来","D":"出来"},"answer":"C","analysis":"“抓起来”指“被收容”的意思，正好与“起来”表示“收集、集中”的意思相吻合。如果用“进来”，说话人应该在警察局工作或同样是被抓的人。但实际不应该是这样。其他词语不能表达清楚正确的意思。","id":"q0670","cat":"choice","section":"应用练习","bookPage":219,"key":"yingyong-11-选择恰当的词语填空-13"},{"lesson":11,"num":14,"sub":"选择恰当的词语填空","stem":"他两腿又细又长，跑＿＿＿像一阵风似的，非常舒展。","word":null,"options":{"A":"过来","B":"出来","C":"起来","D":"回来"},"answer":"C","analysis":"“跑起来”是指跑的时候。“像风似的”是比喻跑的速度快。","id":"q0671","cat":"choice","section":"应用练习","bookPage":219,"key":"yingyong-11-选择恰当的词语填空-14"},{"lesson":11,"num":15,"sub":"选择恰当的词语填空","stem":"音乐一响，几个维吾尔族姑娘就＿＿＿，真美慕她们。","word":null,"options":{"A":"跳舞起来","B":"跳起舞来","C":"跳舞出来","D":"跳出舞来"},"answer":"B","analysis":"“跳舞”是一个动宾结构，与复合趋向补语搭配时，单音节的宾语“舞”","id":"q0672","cat":"choice","section":"应用练习","bookPage":219,"key":"yingyong-11-选择恰当的词语填空-15"},{"lesson":12,"num":1,"sub":"给下列句子填上适当的名词、动词或形容词的重叠形式","stem":"我们学校的食堂＿＿＿都有非常可口的饭菜。","answers":["我们学校的食堂天天都有非常可口的饭菜。"],"analysis":"有人会在“天天”处用“顿顿”，意思没有错，但是，“顿”是量词，不是名词。这里只能用“天天”。当然，如果你用“日日”也可以，但它不符合汉语口语的表达习惯。","id":"q0673","cat":"fill","section":"应用练习","bookPage":223,"key":"yingyong-12-给下列句子填上适当的名词、动词或形容词的重叠形式-1"},{"lesson":12,"num":2,"sub":"给下列句子填上适当的名词、动词或形容词的重叠形式","stem":"请你帮我，我的句子有什么问题没有。","answers":["请你帮我看看，我的句子有什么问题没有。","请你帮我找找，我的句子有什么问题没有。","请你帮我检查检查，我的句子有什么问题没有。","请你帮我听听，我的句子有没有什么问题。"],"analysis":"也许还会有其他的表达形式，但这四个句子是最常用的，都含有检查的意思。","id":"q0674","cat":"fill","section":"应用练习","bookPage":223,"key":"yingyong-12-给下列句子填上适当的名词、动词或形容词的重叠形式-2"},{"lesson":12,"num":3,"sub":"给下列句子填上适当的名词、动词或形容词的重叠形式","stem":"你快把这个好消息告诉她吧，让她也","answers":["你快把这个好消息告诉她吧，让她也高兴高兴。","你快把这个好消息告诉她吧，让她也放放心。"],"analysis":"这个句子中“也”后边不管用形容词还是动词，其实都已经变成动词的重叠形式了。“高兴高兴”是最恰当的答案。如果用“痛快痛快、舒服舒服、快乐快乐”也可以，但是都不如“高兴高兴”表达得清楚。","id":"q0675","cat":"fill","section":"应用练习","bookPage":223,"key":"yingyong-12-给下列句子填上适当的名词、动词或形容词的重叠形式-3"},{"lesson":12,"num":4,"sub":"给下列句子填上适当的名词、动词或形容词的重叠形式","stem":"他的话＿＿＿地感动了我们在座的每一个人。","answers":["他的话深深地感动了我们在座的每一个人。","他的话实实在在地感动了我们在座的每一个人。"],"analysis":"动词前做状语的形容词可以使用重叠的形式，表达的是程度加深的意义。但是应该注意，一般不能在形容词之前加“很、非常”等词语。","id":"q0676","cat":"fill","section":"应用练习","bookPage":223,"key":"yingyong-12-给下列句子填上适当的名词、动词或形容词的重叠形式-4"},{"lesson":12,"num":5,"sub":"给下列句子填上适当的名词、动词或形容词的重叠形式","stem":"我们认真＿＿＿，决定同意你提出来的建议。","answers":["我们认真研究了一下儿，决定同意你提出来的建议。","我们认真讨论了一下儿，决定同意你提出来的建议。","我们认真分析了一下儿，决定同意你提出来的建议。"],"analysis":"我们把动词加“一下儿”也作为动词的重叠形式介绍给同学们，这可能跟你在其他课堂上学的不一样。我们认为，这与动词的一般重叠形式所表达的意思是完全一样的，而且有的语法书也的确认为它们是重叠形式。","id":"q0677","cat":"fill","section":"应用练习","bookPage":223,"key":"yingyong-12-给下列句子填上适当的名词、动词或形容词的重叠形式-5"},{"lesson":12,"num":6,"sub":"给下列句子填上适当的名词、动词或形容词的重叠形式","stem":"尽管他们夫妻都是残疾人，但他们同样＿＿＿地活着。","answers":["尽管他们夫妻都是残疾人，但他们同样健健康康地活着。","尽管他们夫妻都是残疾人，但他们同样快快乐乐地活着。"],"analysis":"“健康、快乐”是这个句子最好的选择形式。当然也可以用“高兴、舒服”等，但是都不如这两个词更能表达出对“残疾人”的敬佩的心情。","id":"q0678","cat":"fill","section":"应用练习","bookPage":223,"key":"yingyong-12-给下列句子填上适当的名词、动词或形容词的重叠形式-6"},{"lesson":12,"num":7,"sub":"给下列句子填上适当的名词、动词或形容词的重叠形式","stem":"朋友给我发来电子邮件说他＿＿＿盼望着我早点回去。","answers":["朋友给我发来电子邮件说他天天盼望着我早点回去。","朋友给我发来电子邮件说他时时刻刻盼望着我早点回去。","朋友给我发来电子邮件说他日日夜夜盼望着我早点回去。"],"analysis":"“天天”是最好的答案。后两个句子显得夸张了一点，但可以理解。","id":"q0679","cat":"fill","section":"应用练习","bookPage":224,"key":"yingyong-12-给下列句子填上适当的名词、动词或形容词的重叠形式-7"},{"lesson":12,"num":8,"sub":"给下列句子填上适当的名词、动词或形容词的重叠形式","stem":"一看你那＿＿＿的样子，我就知道你又有什么好事了。","answers":["一看你那高高兴兴的样子，我就知道你又有什么好事了。","一看你那美滋滋的样子，我就知道你又有什么好事了。"],"analysis":"“高兴”的样子多是指表面，而“美滋滋”的样子则多是指从表面到内心。","id":"q0680","cat":"fill","section":"应用练习","bookPage":224,"key":"yingyong-12-给下列句子填上适当的名词、动词或形容词的重叠形式-8"},{"lesson":12,"num":9,"sub":"给下列句子填上适当的名词、动词或形容词的重叠形式","stem":"我实在没有力气了，咱们再接着往山上爬行吗？","answers":["我实在没有力气了，咱们休息休息再接着往山上爬行吗？","我实在没有力气了，咱们等等再接着往山上爬行吗？"],"analysis":"重叠的动词还可以用“停停、坐坐”等，都能表达相同的意思。","id":"q0681","cat":"fill","section":"应用练习","bookPage":224,"key":"yingyong-12-给下列句子填上适当的名词、动词或形容词的重叠形式-9"},{"lesson":12,"num":10,"sub":"给下列句子填上适当的名词、动词或形容词的重叠形式","stem":"你应该好好，否则会很难通过这次的期末考试。","answers":["你应该好好复习复习，否则会很难通过这次的期末考试。","你应该好好准备准备，否则会很难通过这次的期末考试。"],"analysis":"这里的“复习复习、准备准备”表示的不是时间短，而是强调重复的动作或反复的行为。","id":"q0682","cat":"fill","section":"应用练习","bookPage":224,"key":"yingyong-12-给下列句子填上适当的名词、动词或形容词的重叠形式-10"},{"lesson":12,"num":1,"sub":"给词语选择恰当的位置","stem":"在近十年的创作生活中，A她写B得C最有代表性D。","word":"这部话剧","options":null,"answer":"A","analysis":"有的学习者会错误地把“这部话剧”放在B或C处，这里应该注意的是“得”字，它既不能在名词“话剧”之后，也不能在“话剧”之前，这都是汉语语法的要求，前边已经介绍过，可以参考第一课的内容。A是最合适的位置，在句子中做形式上的主语或是宾语提前。","id":"q0683","cat":"pos","section":"应用练习","bookPage":224,"key":"yingyong-12-给词语选择恰当的位置-1"},{"lesson":12,"num":2,"sub":"给词语选择恰当的位置","stem":"A我国还B处在不发达阶段，人民C生活还D不太富裕。","word":"目前","options":null,"answer":"A","analysis":"时间词做状语，在句子中可以出现在两个位置，即主语之前或主语后谓语前。句子中A是最恰当的位置。","id":"q0684","cat":"pos","section":"应用练习","bookPage":224,"key":"yingyong-12-给词语选择恰当的位置-2"},{"lesson":12,"num":3,"sub":"给词语选择恰当的位置","stem":"2011年是A新世纪来B世界各地C地震、海啸、事故、战争不断的D。","word":"一年","options":null,"answer":"D","analysis":"有的学习者会非常简单地把“一年”放在A的位置上，形成“2011年是一年”的句子形式，但是，这样就错了。这个句子是一个比较长的判断句，“2011年”是什么样的“一年”呢，只有放在句子最后，才能清楚地表达出所要表达的意思。","id":"q0685","cat":"pos","section":"应用练习","bookPage":224,"key":"yingyong-12-给词语选择恰当的位置-3"},{"lesson":12,"num":4,"sub":"给词语选择恰当的位置","stem":"不管书的A印刷质量B多高，C也代替不了D内容的可读性。","word":"其","options":null,"answer":"D","analysis":"“其”是代词，表示“他的、他们的、它的”等，代替前边出现过的事物，在句中作“内容”的定语。正确的位置只能是D。","id":"q0686","cat":"pos","section":"应用练习","bookPage":224,"key":"yingyong-12-给词语选择恰当的位置-4"},{"lesson":12,"num":5,"sub":"给词语选择恰当的位置","stem":"这里的A风整整B三天三夜C，树上连一片叶子都D看不见了。","word":"刮了","options":null,"answer":"B","analysis":"句子中“三天三夜”应该做动词的时量补语，因此，“刮了”当然应该放在句中B的位置上。A和C都是错误的。","id":"q0687","cat":"pos","section":"应用练习","bookPage":225,"key":"yingyong-12-给词语选择恰当的位置-5"},{"lesson":12,"num":6,"sub":"给词语选择恰当的位置","stem":"明天白天A晴转阴，南转北风B(3)4级C5级，傍晚D有雷阵雨。","word":"间","options":null,"answer":"C","analysis":"如果你常常听汉语的天气预报，一定对“间(jidn)”这个词不陌生，这里它是动词，A是错误的位置，C才是唯一正确的位置。","id":"q0688","cat":"pos","section":"应用练习","bookPage":225,"key":"yingyong-12-给词语选择恰当的位置-6"},{"lesson":12,"num":7,"sub":"给词语选择恰当的位置","stem":"要A想身体B健康，C就D坚持锻炼身体。","word":"必须","options":null,"answer":"D","analysis":"“必须”是能愿动词，后边应该直接跟动词，因此，D是唯一恰当的位置。","id":"q0689","cat":"pos","section":"应用练习","bookPage":225,"key":"yingyong-12-给词语选择恰当的位置-7"},{"lesson":12,"num":8,"sub":"给词语选择恰当的位置","stem":"A星期三以前B我C看D完这本小说，你放心吧。","word":"可以","options":null,"answer":"C","analysis":"能愿动词“可以”一般应该放在动词之前，句子中A、B两个位置都不可以，D后的完是“看”的补语，动补之间一般不能插入其他成分。","id":"q0690","cat":"pos","section":"应用练习","bookPage":225,"key":"yingyong-12-给词语选择恰当的位置-8"},{"lesson":12,"num":9,"sub":"给词语选择恰当的位置","stem":"A他还B在这儿，C怎么一转眼D就不见了？刚才 8","word":"刚才","options":null,"answer":"A","analysis":"“刚才”是表示时间的名词，在句子中一般用在句首或主语之后，谓语之前。当表示时间的词语与副词相遇时，时间词在前，副词在后。因此，A是唯一正确的位置。","id":"q0691","cat":"pos","section":"应用练习","bookPage":225,"key":"yingyong-12-给词语选择恰当的位置-9"},{"lesson":12,"num":10,"sub":"给词语选择恰当的位置","stem":"明天A我的朋友B和C我一起去D故宫参观参观。","word":"想","options":null,"answer":"B","analysis":"“想”是能愿动词，一般应该放在动词之前，但当动词之前有介宾状语时，能愿动词一般放在状语之前。","id":"q0692","cat":"pos","section":"应用练习","bookPage":225,"key":"yingyong-12-给词语选择恰当的位置-10"},{"lesson":12,"num":11,"sub":"给词语选择恰当的位置","stem":"前些年，在北京A的大街上，B都C能D看到骑自行车的人。","word":"到处","options":null,"answer":"B","analysis":"“到处”是各个地方的意思，在句子中一般做状语，用在动词之前。如果动词之前还有其他状语时，“到处”一般在其他词语之前。","id":"q0693","cat":"pos","section":"应用练习","bookPage":225,"key":"yingyong-12-给词语选择恰当的位置-11"},{"lesson":12,"num":12,"sub":"给词语选择恰当的位置","stem":"我A早就B好C要把在北京的经历D写成一本书。","word":"想","options":null,"answer":"B","analysis":"句子中“好”是“想”的结果补语，“要把……写成一本书”是“想”的宾语。其他位置不能用“想”。","id":"q0694","cat":"pos","section":"应用练习","bookPage":226,"key":"yingyong-12-给词语选择恰当的位置-12"},{"lesson":12,"num":13,"sub":"给词语选择恰当的位置","stem":"A交通警察蹲在地上B耐心地C小孩子把D鞋带系好。","word":"帮","options":null,"answer":"C","analysis":"句子中“耐心地”后必须有一个动词，而不应该是“小孩子”，因为“地”不直接用在名词之前。C是唯一正确的位置。","id":"q0695","cat":"pos","section":"应用练习","bookPage":226,"key":"yingyong-12-给词语选择恰当的位置-13"},{"lesson":12,"num":14,"sub":"给词语选择恰当的位置","stem":"虎妞一见祥子走进屋，A站起身B来让他C上炕D一起吃饭。","word":"忙","options":null,"answer":"A","analysis":"这里的“忙”是副词，即“连忙、急忙、赶忙”的意思，应该用在动词之前做状语。但是，C不能用“忙”，因为从语气和语法上都不合适。","id":"q0696","cat":"pos","section":"应用练习","bookPage":226,"key":"yingyong-12-给词语选择恰当的位置-14"},{"lesson":12,"num":15,"sub":"给词语选择恰当的位置","stem":"我越A学习B越觉得应该C学习D一些。","word":"多","options":null,"answer":"C","analysis":"单音节形容词“多、少”常常用在动词之前做状语，这与其他形容词有明显的区别。句子中“多”应该用在“学习”之前，类似的用法很多，如“多运动、多锻炼、多读、多说、多看、多听、多写……”","id":"q0697","cat":"pos","section":"应用练习","bookPage":226,"key":"yingyong-12-给词语选择恰当的位置-15"},{"lesson":12,"num":1,"sub":"选择恰当的词语填空","stem":"李教授是＿＿＿哲学的，对中国古典文学同样有很深的研究。","word":null,"options":{"A":"做","B":"搞","C":"弄","D":"进行"},"answer":"B","analysis":"“做”和“搞”的后边都可以跟与职业有关的词语，但是，“做”的后边常常是“教师、医生、记者”等具体职业名词，而“搞”的后边则是“建筑、医疗、教育、哲学”等比较抽象的名词。“弄”不能跟工作有关。","id":"q0698","cat":"choice","section":"应用练习","bookPage":226,"key":"yingyong-12-选择恰当的词语填空-1"},{"lesson":12,"num":2,"sub":"选择恰当的词语填空","stem":"消费者都＿＿＿入关以后进口车会很便宜，其实价格没降多少。","word":null,"options":{"A":"以为","B":"认为","C":"知道","D":"感到"},"answer":"A","analysis":"“以为”和“认为”最大的区别就是认真思考了还是没有认真思考。“以为”的后边是没有经过认真思考而得出的结论，因此常常是错误的，而且后边多有“原来、没想到、其实”等词语与之呼应。","id":"q0699","cat":"choice","section":"应用练习","bookPage":226,"key":"yingyong-12-选择恰当的词语填空-2"},{"lesson":12,"num":3,"sub":"选择恰当的词语填空","stem":"小华父母的个子都不算高，但由于爱好运动，刚刚十二岁的他就已经＿＿＿了近1.75米。","word":null,"options":{"A":"到达","B":"达到","C":"赶上","D":"超过"},"answer":"B","analysis":"B“近1.75米”告诉我们不可能是“超过”；到达”的宾语一般是处所；“赶上”的对象一般应该是人或其他事物；“达到”的宾语既可以是“目的”一类的词语，也可以是数量词语。正确答案当然是B。楼下大爷大妈们扭秧歌的锣鼓点儿，我无论如何也看不下去书了。A.听说 B.听见C.传说 D.据说C、D用法比较接近，“听说”的应该是事情，“听见”的是声音，而“锣鼓点儿”恰好是声音。正确的答案是B。","id":"q0700","cat":"choice","section":"应用练习","bookPage":226,"key":"yingyong-12-选择恰当的词语填空-3"},{"lesson":12,"num":4,"sub":"选择恰当的词语填空","stem":"＿＿＿。","word":null,"options":{"A":"听说","B":"听见","C":"传说","D":"据说"},"answer":"B","analysis":"C、D用法比较接近，“听说”的应该是事情，“听见”的是声音，而“锣鼓点儿”恰好是声音。正确的答案是B。","id":"q0701","cat":"choice","section":"应用练习","bookPage":227,"key":"yingyong-12-选择恰当的词语填空-4"},{"lesson":12,"num":5,"sub":"选择恰当的词语填空","stem":"2010年末，北京市人均可支配资金超过8000美元，，＿＿＿于中等发达国家的水平。","word":null,"options":{"A":"相等","B":"相同","C":"相当","D":"相信"},"answer":"C","analysis":"“相当于”是比较固定的用法，意思是“跟…一样/差不多”。汉语一般不用“相等于”而用“等于”。","id":"q0702","cat":"choice","section":"应用练习","bookPage":227,"key":"yingyong-12-选择恰当的词语填空-5"},{"lesson":12,"num":6,"sub":"选择恰当的词语填空","stem":"10年前，北京在西直门与东直门之间，经中关村、回龙观、望京＿＿＿。了一条城市轻轨铁路。","word":null,"options":{"A":"生产","B":"制造","C":"产生","D":"修建"},"answer":"D","analysis":"“制造、生产”意思相同，常常与工厂有关；“产生”一般是“问题、麻烦”等。“铁路”应该用“修建”。","id":"q0703","cat":"choice","section":"应用练习","bookPage":227,"key":"yingyong-12-选择恰当的词语填空-6"},{"lesson":12,"num":7,"sub":"选择恰当的词语填空","stem":"为了保护首都北京的环境，中国志愿者协会在广大群众中＿＿＿了“捐一棵树，治一亩沙”的活动。","word":null,"options":{"A":"实行","B":"开展","C":"进行","D":"发展"},"answer":"B","analysis":"“开展…·活动”、“进行…·工作”、“实行…·政策、制度”“发展··事业”是比较常见的搭配形式，因此，正确答案是B。","id":"q0704","cat":"choice","section":"应用练习","bookPage":227,"key":"yingyong-12-选择恰当的词语填空-7"},{"lesson":12,"num":8,"sub":"选择恰当的词语填空","stem":"记得我离开时这儿还是个不足两千人的小镇，现在竟然＿＿＿拥有十几万人的小城市了。","word":null,"options":{"A":"变化","B":"变了","C":"改变","D":"变成"},"answer":"D","analysis":"从“小镇”到“小城市”是一个不小的变化，但是“变化”不能带宾语，而且常常用做名词。“变”的宾语则常常是“样子”或“高、矮、胖、瘦”一类的词语，“改变”的宾语常常“计划、方案、想法、主意”等。正确答案当然是“变成”。“变成”的用法是某人、事物、处所等形式上从A发展到了B，本质上还是原来的人、事物、处所等。","id":"q0705","cat":"choice","section":"应用练习","bookPage":227,"key":"yingyong-12-选择恰当的词语填空-8"},{"lesson":12,"num":9,"sub":"选择恰当的词语填空","stem":"改革开放后，来华留学的人数日益增多，截至2011年9月已＿＿＿180万人。","word":null,"options":{"A":"上","B":"是","C":"达","D":"过"},"answer":"C","analysis":"“达”即“达到”。“上、过”意思相同，不能选择其中之一。","id":"q0706","cat":"choice","section":"应用练习","bookPage":228,"key":"yingyong-12-选择恰当的词语填空-9"},{"lesson":12,"num":10,"sub":"选择恰当的词语填空","stem":"咱们整天在各个公司之间＿＿＿的能有什么结果？","word":null,"options":{"A":"跑跑去去","B":"跑去跑去","C":"跑来跑去","D":"跑来跑来"},"answer":"C","analysis":"动词四个备选答案形式中，只有C符合动词的重叠形式。","id":"q0707","cat":"choice","section":"应用练习","bookPage":228,"key":"yingyong-12-选择恰当的词语填空-10"},{"lesson":12,"num":11,"sub":"选择恰当的词语填空","stem":"十五年过去了，夫妇俩想见见亲生骨肉的愿望始终没实现。","word":null,"options":{"A":"要","B":"会","C":"能","D":"可"},"answer":"C","analysis":"四个助动词似乎都可以用在动词之前，但是可以与否定副词“没”搭配的只有“能”一个。正确的选择当然是C。","id":"q0708","cat":"choice","section":"应用练习","bookPage":228,"key":"yingyong-12-选择恰当的词语填空-11"},{"lesson":12,"num":12,"sub":"选择恰当的词语填空","stem":"大雪天还在外边乱跑，看你这双小手冻得＿＿＿的。","word":null,"options":{"A":"冰冰凉","B":"冰冰凉凉","C":"冰凉凉","D":"冰凉冰凉"},"answer":"D","analysis":"汉语一般双音节形容词的重叠形式应该是“AABB”，但是像“冰凉、火热、冰冷、雪白、惨白、黑、漆黑、火红、通红、油绿、昏黄”等形容词的重叠形式则应该是“ABAB”。","id":"q0709","cat":"choice","section":"应用练习","bookPage":228,"key":"yingyong-12-选择恰当的词语填空-12"},{"lesson":12,"num":13,"sub":"选择恰当的词语填空","stem":"今天的厂务会上将＿＿＿我们厂下一个阶段的工作计划和具体发展方向。","word":null,"options":{"A":"确定并研究","B":"研究还确定","C":"研究并确定","D":"确定还研究"},"answer":"C","analysis":"按照正常的工作顺序，一般应该是先“研究”，后“确定”，因此，只有B、C符合顺序。但这两个词语之间应该用连词“并”，不能用副词“还”，因为“并”表示的是连接，而“还”表示的是“另外”。","id":"q0710","cat":"choice","section":"应用练习","bookPage":228,"key":"yingyong-12-选择恰当的词语填空-13"},{"lesson":12,"num":14,"sub":"选择恰当的词语填空","stem":"父母应该尽量＿＿＿孩子的选择，不要过分勉强他们。","word":null,"options":{"A":"尊敬","B":"尊重","C":"保险","D":"保障"},"answer":"B","analysis":"里只是一个干扰性的词语，没有实际意义。“尊重”的既可以是人，更应该是与这个人有关的“权利、自由、利益”以及这个人的意见、态度、选择等。","id":"q0711","cat":"choice","section":"应用练习","bookPage":228,"key":"yingyong-12-选择恰当的词语填空-14"},{"lesson":12,"num":15,"sub":"选择恰当的词语填空","stem":"这是我读大学以来第一次＿＿＿社会，我的心情有点激动与不安。","word":null,"options":{"A":"接近","B":"结交","C":"触动","D":"接触"},"answer":"D","analysis":"“接近”的是比较具体的人或事物，而且多指距离上的概念；“结交”的常常是朋友等词语；“触动”则是一个人的心灵；“社会”是一个比较抽象的词语，应该用","id":"q0712","cat":"choice","section":"应用练习","bookPage":229,"key":"yingyong-12-选择恰当的词语填空-15"},{"lesson":13,"num":1,"sub":"用借用名量词改写下列句子","stem":"今天小张从上到下穿的都是新衣服。","answers":["今天小张穿了一身新衣服。"],"analysis":"","id":"q0713","cat":"rewrite","section":"应用练习","bookPage":233,"key":"yingyong-13-用借用名量词改写下列句子-1"},{"lesson":13,"num":2,"sub":"用借用名量词改写下列句子","stem":"我上去一看，公共汽车里坐满了乘客。","answers":["我上去一看，坐了一汽车乘客。"],"analysis":"","id":"q0714","cat":"rewrite","section":"应用练习","bookPage":233,"key":"yingyong-13-用借用名量词改写下列句子-2"},{"lesson":13,"num":3,"sub":"用借用名量词改写下列句子","stem":"书包里装满了好吃的东西。","answers":["装了一书包好吃的东西。"],"analysis":"","id":"q0715","cat":"rewrite","section":"应用练习","bookPage":233,"key":"yingyong-13-用借用名量词改写下列句子-3"},{"lesson":13,"num":4,"sub":"用借用名量词改写下列句子","stem":"今天玛丽过生日，朋友们送的礼物摆满了她的桌子。","answers":["今天玛丽过生日，摆了一桌子礼物。","今天玛丽过生日，朋友们送的礼物摆了一桌子。"],"analysis":"","id":"q0716","cat":"rewrite","section":"应用练习","bookPage":233,"key":"yingyong-13-用借用名量词改写下列句子-4"},{"lesson":13,"num":5,"sub":"用借用名量词改写下列句子","stem":"你没注意把杯子弄掉了，水撒在了地上。","answers":["你没注意把杯子弄坏了，撒了一地水。"],"analysis":"","id":"q0717","cat":"rewrite","section":"应用练习","bookPage":233,"key":"yingyong-13-用借用名量词改写下列句子-5"},{"lesson":13,"num":6,"sub":"用借用名量词改写下列句子","stem":"书架上都是中国历史方面的书。","answers":["中国历史方面的书摆了一书架。","他有一书架中国历史方面的书。"],"analysis":"","id":"q0718","cat":"rewrite","section":"应用练习","bookPage":233,"key":"yingyong-13-用借用名量词改写下列句子-6"},{"lesson":13,"num":7,"sub":"用借用名量词改写下列句子","stem":"外面下雨了，他的裤腿弄了很多泥。","answers":["外面下雨了，他弄了一裤腿泥。"],"analysis":"","id":"q0719","cat":"rewrite","section":"应用练习","bookPage":233,"key":"yingyong-13-用借用名量词改写下列句子-7"},{"lesson":13,"num":8,"sub":"用借用名量词改写下列句子","stem":"上课的时候，老师在黑板上写满了字。","answers":["上课的时候，老师写了一黑板字。"],"analysis":"","id":"q0720","cat":"rewrite","section":"应用练习","bookPage":233,"key":"yingyong-13-用借用名量词改写下列句子-8"},{"lesson":13,"num":9,"sub":"用借用名量词改写下列句子","stem":"朋友的生日晚会上，你喝了好几瓶啤酒，肚子都撑了。","answers":["朋友的生日晚会上，你喝了一肚子啤酒，撑坏了。"],"analysis":"","id":"q0721","cat":"rewrite","section":"应用练习","bookPage":233,"key":"yingyong-13-用借用名量词改写下列句子-9"},{"lesson":13,"num":10,"sub":"用借用名量词改写下列句子","stem":"昨天是学校的运动会，操场上都是老师和学生。","answers":["昨天是学校的运动会，老师和学生站了一操场。"],"analysis":"上面十个句子中的“身、汽车、书包、桌子、地、书架、裤腿、黑板、肚子、操场”本身都是名词，在改写后的句子中都充当了量词，也就是临时借用的量词。在汉语中这是一种非常普遍的语言现象，在汉语学习中应该引起同学们的重视。","id":"q0722","cat":"rewrite","section":"应用练习","bookPage":233,"key":"yingyong-13-用借用名量词改写下列句子-10"},{"lesson":13,"num":1,"sub":"给词语选择恰当的位置","stem":"十几A年的接触使B我早就明白你是C聪明、活泼而又乐于助人的D人。","word":"个","options":null,"answer":"C","analysis":"“个”是“人”的量词，但是按照汉语的语序，名词前如果有形容词等修饰语时，数量词定语一般离名词比较远，因此，C是唯一正确的位置。","id":"q0723","cat":"pos","section":"应用练习","bookPage":233,"key":"yingyong-13-给词语选择恰当的位置-1"},{"lesson":13,"num":2,"sub":"给词语选择恰当的位置","stem":"中国的艺术家们把A松、竹、梅B统称C为D“岁寒三友”。“一”","word":"三者","options":null,"answer":"B","analysis":"“三者”是对“松、竹、梅”的统括，因此只能放在它们的后面。","id":"q0724","cat":"pos","section":"应用练习","bookPage":233,"key":"yingyong-13-给词语选择恰当的位置-2"},{"lesson":13,"num":3,"sub":"给词语选择恰当的位置","stem":"金花推A门一看，B满满那么C人，就立刻转身往回D走去。","word":"一屋子","options":null,"answer":"C","analysis":"“一屋子”是临时组合成的数量词语，表示数量多，后面应该跟名词，句中只有“人”适合与它搭配。另外，“那么”的语法要求是，后面所跟词语是形容词或表示数量多或少的词语。这两方面都决定了应该选择C。","id":"q0725","cat":"pos","section":"应用练习","bookPage":234,"key":"yingyong-13-给词语选择恰当的位置-3"},{"lesson":13,"num":4,"sub":"给词语选择恰当的位置","stem":"刚才A从图书馆借B来C的那D书你帮我放哪儿了？","word":"几本","options":null,"answer":"D","analysis":"“那”是指示代词，与名词“书”之间应该有量词或数量词，因此，D是唯一恰当的位置。","id":"q0726","cat":"pos","section":"应用练习","bookPage":234,"key":"yingyong-13-给词语选择恰当的位置-4"},{"lesson":13,"num":5,"sub":"给词语选择恰当的位置","stem":"A他B那C白色D运动鞋的鞋底怎么都磨透了？","word":"三双","options":null,"answer":"C","analysis":"“白色”做定语，因此，C是唯一正确的答案，即指示代词与数量词语的搭配关系。参考前边第2题的分析。","id":"q0727","cat":"pos","section":"应用练习","bookPage":234,"key":"yingyong-13-给词语选择恰当的位置-5"},{"lesson":13,"num":6,"sub":"给词语选择恰当的位置","stem":"这A位司机够辛苦的，他每B天工作十C个D小时。","word":"几","options":null,"answer":"C","analysis":"有的同学会选择A，但是，你考虑过后边的“他”吗？如果是“几位司机”，后边就应该用“他们”而不是“他”。","id":"q0728","cat":"pos","section":"应用练习","bookPage":234,"key":"yingyong-13-给词语选择恰当的位置-6"},{"lesson":13,"num":7,"sub":"给词语选择恰当的位置","stem":"我A爬B到了C长城最高的地方D。太美了！","word":"一口气","options":null,"answer":"A","analysis":"“一口气”有两个意思，一是两次呼吸之间的时间，即吸一次气之后中间不再换气，常常修饰“说话、喝酒、游泳”等词语；二是做某一件事情中间不停顿，相当于副词，在句子中一般用在动词之前。","id":"q0729","cat":"pos","section":"应用练习","bookPage":234,"key":"yingyong-13-给词语选择恰当的位置-7"},{"lesson":13,"num":8,"sub":"给词语选择恰当的位置","stem":"这次A到南方去，我们一共B住了三C个D月。","word":"来","options":null,"answer":"D","analysis":"有的同学会选择A，可你是否注意到了“到南方去”的“去”？这样不矛盾吗？“来到……去”是不能搭配的。正确答案应该是D。“三个来月”即三个月左右。","id":"q0730","cat":"pos","section":"应用练习","bookPage":234,"key":"yingyong-13-给词语选择恰当的位置-8"},{"lesson":13,"num":9,"sub":"给词语选择恰当的位置","stem":"王小丽A决定B每星期C跟朋友们一起吃D饭。","word":"一次","options":null,"answer":"D","analysis":"同学们口语中常常会说“每星期一次吃饭”，但这是错误的用法。动量补语“一次”应该放在动词“吃”之后。","id":"q0731","cat":"pos","section":"应用练习","bookPage":234,"key":"yingyong-13-给词语选择恰当的位置-9"},{"lesson":13,"num":10,"sub":"给词语选择恰当的位置","stem":"张经理让A小赵明天早上到B他的公司C取D资料。","word":"一下","options":null,"answer":"D","analysis":"“到公司取一下资料”是最好的汉语表达形式。“取一下资料”与上边句子中的“吃一次饭”有相同的语法含义。还应该注意的是，连动句中，补语和“了、过”等一般应该放在第二个动词之后。","id":"q0732","cat":"pos","section":"应用练习","bookPage":235,"key":"yingyong-13-给词语选择恰当的位置-10"},{"lesson":13,"num":1,"sub":"选择恰当的词语填空","stem":"透过那＿＿＿玻璃窗，你可以清楚地看到远处那美丽的风景。","word":null,"options":{"A":"面","B":"片","C":"条","D":"扇"},"answer":"D","analysis":"很多学习者会选择“面”或“片”作答案，但是，汉语“门、窗”等名词的量词应该是“扇”，这或许跟“门、窗”的开、关与扇扇子的动作相同有关。不信你反复开关几次你的门窗试试，看看像不像扇扇子的动作。","id":"q0733","cat":"choice","section":"应用练习","bookPage":235,"key":"yingyong-13-选择恰当的词语填空-1"},{"lesson":13,"num":2,"sub":"选择恰当的词语填空","stem":"哎呀，你吓了我，＿＿＿进屋前怎么也不敲敲门呢！","word":null,"options":{"A":"一次","B":"一跳","C":"一阵","D":"-下"},"answer":"B","analysis":"当我们遇到令人惊恐的事情时，一般的动作是什么？对了，是“跳起来”，因此，“一跳”是唯一正确的选择。","id":"q0734","cat":"choice","section":"应用练习","bookPage":235,"key":"yingyong-13-选择恰当的词语填空-2"},{"lesson":13,"num":3,"sub":"选择恰当的词语填空","stem":"从巫山上远远望去，长江游轮像一＿＿＿扁舟乘流而下，转眼就不见了。","word":null,"options":{"A":"艘","B":"条","C":"只","D":"叶"},"answer":"D","analysis":"“游轮”的量词应该用“艘”，而句子中需要加量词的不是“游轮”而是“扁舟”，其实，就是“小船”的意思。但是“小船”的量词应该是“条”，而“扁舟”的量词只能是“叶”。想一想，“小船”的样子像不像一片树叶？","id":"q0735","cat":"choice","section":"应用练习","bookPage":235,"key":"yingyong-13-选择恰当的词语填空-3"},{"lesson":13,"num":4,"sub":"选择恰当的词语填空","stem":"昨天我和王亮又去找他了，可他还是那个态度，让我们碰了一＿＿＿灰。","word":null,"options":{"A":"头","B":"鼻子","C":"身","D":"脸"},"answer":"B","analysis":"“碰了一鼻子灰”是汉语的一种习惯表达方法。仔细思考一下应该有道理，“碰”是向前的动作，而“鼻子”在人的头部是最突出的部分，当然应该首先被碰到！","id":"q0736","cat":"choice","section":"应用练习","bookPage":235,"key":"yingyong-13-选择恰当的词语填空-4"},{"lesson":13,"num":5,"sub":"选择恰当的词语填空","stem":"第一次去非洲旅行的情形真是令人难以忘怀，当时要是能学＿＿＿ 句当地的话就更完美了。","word":null,"options":{"A":"一二","B":"二三","C":"一两","D":"二"},"answer":"C","analysis":"汉语中“二”这个数词用在量词前一般应该变成“两”，因此，只有C符合语法上的要求，是唯一正确的答案。","id":"q0737","cat":"choice","section":"应用练习","bookPage":235,"key":"yingyong-13-选择恰当的词语填空-5"},{"lesson":13,"num":6,"sub":"选择恰当的词语填空","stem":"2011年末的这场大雪，是大自然送给我们的一＿＿＿最好的礼物。","word":null,"options":{"A":"只","B":"次","C":"堆","D":"件"},"answer":"D","analysis":"“次”是动量词，不能用在句中；“只、堆”都不符合礼物的性质。用“件”作量词的名词，汉语中有这样三类事物：事情、衣服、礼物。","id":"q0738","cat":"choice","section":"应用练习","bookPage":236,"key":"yingyong-13-选择恰当的词语填空-6"},{"lesson":13,"num":7,"sub":"选择恰当的词语填空","stem":"自行车在这儿摆得好好儿的，突然刮来了一＿＿＿风，这不，全倒了。","word":null,"options":{"A":"阵","B":"回","C":"片","D":"次"},"answer":"A","analysis":"突然出现的事物常常不会长久，因此，备选答案中“阵”最符合这个要求。当然，“阵”在表示自然事物如“风、雨”和声音如“脚步声、歌声”等时，常常是短而快的意思，而如果与动词“住、生活、学习”等搭配时也可能是比较长的时间。，达到了83多万人。","id":"q0739","cat":"choice","section":"应用练习","bookPage":236,"key":"yingyong-13-选择恰当的词语填空-7"},{"lesson":13,"num":8,"sub":"选择恰当的词语填空","stem":"参加2012年春季研究生考试的人数超过历，＿＿＿达到了83多万人。","word":null,"options":{"A":"场","B":"回","C":"届","D":"遍"},"answer":"C","analysis":"同一年入学的学生汉语称为同一“届”，其实，“届”在这里表示的是","id":"q0740","cat":"choice","section":"应用练习","bookPage":236,"key":"yingyong-13-选择恰当的词语填空-8"},{"lesson":13,"num":9,"sub":"选择恰当的词语填空","stem":"山田把幸子的毕业论文乱改了一，弄得她差点儿没有通过答辩。","word":null,"options":{"A":"趟","B":"次","C":"通","D":"顿"},"answer":"C","analysis":"“趟、次”常常与“来、去”用在一起，“顿”常常与“吃、打、骂”用在一起，句子中的主要动词是“改”，“通”是最恰当的答案。“通”在这里与“遍”相同。","id":"q0741","cat":"choice","section":"应用练习","bookPage":236,"key":"yingyong-13-选择恰当的词语填空-9"},{"lesson":13,"num":10,"sub":"选择恰当的词语填空","stem":"桃红柳绿，小桥流水，鸡鸣犬吠，宛如一＿＿＿田园交响诗。","word":null,"options":{"A":"个","B":"曲","C":"首","D":"篇"},"answer":"C","analysis":"汉语“诗”、“词”、“歌”、“曲”的量词应该是“首”，“篇”一般做“文章”等的量词。其他量词不合适。","id":"q0742","cat":"choice","section":"应用练习","bookPage":236,"key":"yingyong-13-选择恰当的词语填空-10"},{"lesson":13,"num":11,"sub":"选择恰当的词语填空","stem":"我耽误了早上7:30的火车，下一＿＿＿去广州的列车几点开？","word":null,"options":{"A":"辆","B":"次","C":"节","D":"回"},"answer":"B","analysis":"汉语中从一个城市到另一个城市的火车、飞机等都按次序排列成不同的序号，因此，在句子中如果出现“班机、列车”时，一般应该用“次”作量词。“节”只是火车整列中的某一部分；“辆”不能作火车的量词。","id":"q0743","cat":"choice","section":"应用练习","bookPage":236,"key":"yingyong-13-选择恰当的词语填空-11"},{"lesson":13,"num":12,"sub":"选择恰当的词语填空","stem":"整个小区只有几一人家入住，物业管理工作无法运转。","word":null,"options":{"A":"个","B":"位","C":"口","D":"户"},"answer":"D","analysis":"A、B、C三个量词都属于个体量词，而句子中的“人家”指的是“家庭”，应该是集体性的，因此只能用“户”。","id":"q0744","cat":"choice","section":"应用练习","bookPage":237,"key":"yingyong-13-选择恰当的词语填空-12"},{"lesson":13,"num":13,"sub":"选择恰当的词语填空","stem":"9月13日的香港《文汇报》上报道了一＿＿＿惊人的消息。","word":null,"options":{"A":"篇","B":"页","C":"条","D":"块"},"answer":"C","analysis":"与“条”这个量词搭配的名词多是比较长的事物，如“江、河、街、道、路、领带、裤带、鞋带”等。“消息”在文字表现方面也是比较长的，所以用“条”这个量词。此外如“新闻、广告、标语”等也用“条”作量词。与“篇”搭配的名词有“文章、作文、课文、报道”等。","id":"q0745","cat":"choice","section":"应用练习","bookPage":237,"key":"yingyong-13-选择恰当的词语填空-13"},{"lesson":13,"num":14,"sub":"选择恰当的词语填空","stem":"多少人都被你骗了，现在谁还相信你这＿＿＿话？赶快离开这儿吧！","word":null,"options":{"A":"句","B":"套","C":"个","D":"口"},"answer":"B","analysis":"骗人的话不会只是一句，肯定是一套一套的，因为“套”表示的是数量比较多的事物，如“一套西服，一套餐具、一套茶具、一套被褥”等。","id":"q0746","cat":"choice","section":"应用练习","bookPage":237,"key":"yingyong-13-选择恰当的词语填空-14"},{"lesson":13,"num":15,"sub":"选择恰当的词语填空","stem":"看着孩子们那一＿＿＿天真的笑脸，我的心里充满了无限的喜悦。","word":null,"options":{"A":"个个","B":"张张","C":"双双","D":"块块"},"answer":"B","analysis":"汉语中量词“张”多表示平面的事物，如“床、桌子、纸、地图”等。“脸”","id":"q0747","cat":"choice","section":"应用练习","bookPage":237,"key":"yingyong-13-选择恰当的词语填空-15"},{"lesson":14,"num":1,"stem":"谈话是我们A日常B生活中C极普通D事情。","word":"的","options":null,"answer":"D","analysis":"“普通”是形容词，它的前面有副词“极”，它们结合修饰“事情”时，后边必须用“的”。“日常生活”是固定词语，中间不能用“的”。句子中如果不用“极”，C处也可以用“的”，但这个句子中，D才是必须用“的”的地方。","id":"q0748","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-1"},{"lesson":14,"num":2,"stem":"公司员工们A都知道B他C工作做D特别认真。","word":"得","options":null,"answer":"D","analysis":"“得”应该用在动词与补语之间，“工作”怎么样？D是最合适的位置。","id":"q0749","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-2"},{"lesson":14,"num":3,"stem":"也许他A现在就正在培养着B一个未来C世界D冠军呢。","word":"的","options":null,"answer":"C","analysis":"“世界冠军”结合得比较紧，中间不能插入其他成分。“未来”是时间词，与名词之间可以加“的”。其他位置都不合适。","id":"q0750","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-3"},{"lesson":14,"num":4,"stem":"虎妞和祥子结A婚B以后，两个人C上D了幸福美满的生活。","word":"过","options":null,"answer":"C","analysis":"A、B处都不能用“过”，前者不合语义，后者不合语法。正确的选择应该是C。这里的“过”是“过节、过年、过生日、过日子”的“过”。","id":"q0751","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-4"},{"lesson":14,"num":5,"stem":"李老师托A你在上海买B的那个东西你给C她买D了没有？","word":"着","options":null,"answer":"D","analysis":"“着”在这个句子中做结果补语，是“到”的意思。如果选择A，“托”就改变了本来的意思，从“委托”变成了“手掌或其他东西向上承受(物体)”，与句子的意思完全不符合。","id":"q0752","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-5"},{"lesson":14,"num":6,"stem":"这件已经过去很长时间的往事，A我B心里一直C十分D 内疚。","word":"令","options":null,"answer":"A","analysis":"兼语句中“令、使”等词语前多为一件事，后边应该有表示人的词语。","id":"q0753","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-6"},{"lesson":14,"num":7,"stem":"下A一场雨B，天气开始C凉快起D来。","word":"了","options":null,"answer":"A","analysis":"“了”是动态助词，应该放在动词之后，而“起来”之间不能插入“了”，“开始”虽是动词，但无论从语法还是从语气上用“了”都不合适。按照动态助词的语法要求，A是最恰当的位置。","id":"q0754","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-7"},{"lesson":14,"num":8,"stem":"他昨天去A商店B，为母亲买C许多药D。","word":"了","options":null,"answer":"C","analysis":"简单地说似乎句子中每个位置都可以用“了”，但按照语法要求，只有“买”与“许多药”之间才必须用这个“了”。","id":"q0755","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-8"},{"lesson":14,"num":9,"stem":"A昨天晚上我突然接B了她从大洋C彼岸打来D的国际长途。","word":"到","options":null,"answer":"B","analysis":"“接到电话”是最正确的动宾搭配。其他位置都不能清楚地表达意思。","id":"q0756","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-9"},{"lesson":14,"num":10,"stem":"明天早上请你A叫B我C，不然我怕睡D过了头。","word":"一声","options":null,"answer":"C","analysis":"当动词的宾语是代词时，动量补语同样应该放在宾语之后。","id":"q0757","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-10"},{"lesson":14,"num":11,"stem":"幸福的时光A转瞬即逝，婚礼B飞机轰鸣声C彻底D打乱。","word":"被","options":null,"answer":"B","analysis":"在被动句中，“被”可以直接用在动词之前，但句子中如果有主动者时，“被”还是要放在这个动作的发出者之前。","id":"q0758","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-11"},{"lesson":14,"num":12,"stem":"她是我A来北京时B认识的第一个人，C成了D我的女朋友。","word":"现在","options":null,"answer":"C","analysis":"时间词“现在”在句子中的位置一般有两个，即主语前或主语后谓语前。句子中的“现在”是与“我来北京时”对比着说的，因此，C是正确的位置。","id":"q0759","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-12"},{"lesson":14,"num":13,"stem":"因为A我B来北京C，所以对这里的交通D很不熟悉。","word":"第一次","options":null,"answer":"B","analysis":"与“一次”不同的是，表示顺序的“第一次”一般应该在动词之前做状语，而不在动词之后做补语。","id":"q0760","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-13"},{"lesson":14,"num":14,"stem":"我看你们两个A都应该B互相作C让步D。","word":"一些","options":null,"answer":"C","analysis":"“让步”是“作”的宾语，因此，数量词语“一些”应该放在名词之前，即C的位置，而不能放在D的位置。当然，如果句子中没有“作”，因为“让步”是动宾关系，“一些”也可以用在“让”与“步”之间，但无论如何也不能放在句子的最后。","id":"q0761","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-14"},{"lesson":14,"num":15,"stem":"如果世界经济A能在一两年内B及时复苏，C我们公司D可能起死回生。","word":"就","options":null,"answer":"D","analysis":"“就”是副词，只能放在主语之后，谓语之前。D是唯一合适的位置。有的同学喜欢把“就”放在C的位置，这是错误的。","id":"q0762","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-15"},{"lesson":14,"num":16,"stem":"大力吃A饭就进B城了，我们也不知道C他什么时候回来D。","word":"了","options":null,"answer":"A","analysis":"“动+了+名+就……”是比较固定的紧缩复句的形式。选择其他的位置都会造成错误。","id":"q0763","cat":"pos","section":"综合测验","bookPage":127,"key":"zonghe-14-position-16"},{"lesson":14,"num":17,"stem":"他们A前年九月B从各国C陆续来的北京，现在已经差不多D两年了。","word":"是","options":null,"answer":"A","analysis":"这是典型的“是…·的”格式，强调时间、地点和方式。不能放在B、C处，只能选择A。也就是说，在一个句子中既有时间、地点，又有方式状语时，“是”应该放在最前面。","id":"q0764","cat":"pos","section":"综合测验","bookPage":128,"key":"zonghe-14-position-17"},{"lesson":14,"num":18,"stem":"这种人，你越不让他A去，B他C要D去。","word":"越","options":null,"answer":"C","analysis":"“越·越…”格式常常只有一个主语，但也可以有前后两个主语。因此，“越”应该放在主语之后。C的位置最合适。","id":"q0765","cat":"pos","section":"综合测验","bookPage":128,"key":"zonghe-14-position-18"},{"lesson":14,"num":19,"stem":"我们先A去调查B调查，等你C回来就把情况D告诉你。","word":"一","options":null,"answer":"C","analysis":"“一…就…”常常连接两个关系密切并且接连发生的动作，因此，C是最好的选择。有的同学喜欢把“一”放在B处，就错了！我们可以说“看一看、听一听、尝一尝”等等，但是双音节动词没有这样的重叠形式。","id":"q0766","cat":"pos","section":"综合测验","bookPage":128,"key":"zonghe-14-position-19"},{"lesson":14,"num":20,"stem":"重要的不是A学了多少，而是B把C学过的内容全D都记住。","word":"能不能","options":null,"answer":"B","analysis":"能愿动词也应该放在“把”字前边。","id":"q0767","cat":"pos","section":"综合测验","bookPage":128,"key":"zonghe-14-position-20"},{"lesson":14,"num":1,"stem":"我们班的老师因为有事没有来，所以今天的口语课没上＿＿＿。","word":null,"options":{"A":"好","B":"完","C":"了","D":"成"},"answer":"D","analysis":"上不合适，即否定的动词后不能加“了”。正确答案只能是“上成”，意思是根本没有上课，因为“老师没有来”。","id":"q0768","cat":"choice","section":"综合测验","bookPage":128,"key":"zonghe-14-choice-1"},{"lesson":14,"num":2,"stem":"从这儿到市中心不太远，坐车的话＿＿＿一小时就到了。听说花两块钱买的足球彩票中了大奖，他高兴得嘴都合不＿＿＿了。","word":null,"options":{"A":"用得了","B":"用不够","C":"用不了","D":"不用完"},"answer":"C","analysis":"是需要的时间比较少。","id":"q0769","cat":"choice","section":"综合测验","bookPage":128,"key":"zonghe-14-choice-2"},{"lesson":14,"num":3,"stem":"听说花两块钱买的足球彩票中了大奖，他高兴得嘴都合不＿＿＿了。","word":null,"options":{"A":"起","B":"下","C":"上","D":"了"},"answer":"C","analysis":"“合上”的意思是指物体的两部分接触、合拢在一起，“嘴都合不上”是“高兴”的程度。其他词语不能表达这个意思。","id":"q0770","cat":"choice","section":"综合测验","bookPage":128,"key":"zonghe-14-choice-3"},{"lesson":14,"num":4,"stem":"今天，就是在最偏僻的山沟里，老百姓也都能看＿＿＿电视了。","word":null,"options":{"A":"过","B":"了","C":"得","D":"上"},"answer":"D","analysis":"“看上电视”是“山沟里”发生的巨大的变化，是非常不容易的事情，而“看得、看过、看了”都没有这个意思。","id":"q0771","cat":"choice","section":"综合测验","bookPage":128,"key":"zonghe-14-choice-4"},{"lesson":14,"num":5,"stem":"时间太紧张了，我们准备得也不够充分，这份报告恐怕＿＿＿。","word":null,"options":{"A":"不写好","B":"好不写","C":"写不好","D":"好写不"},"answer":"C","analysis":"B、D都不是汉语的表达形式，就是说，汉语没有这种表达方法。只有“写不好”才表示“不能写好”的意思，因为“时间紧张，准备不充分”。","id":"q0772","cat":"choice","section":"综合测验","bookPage":128,"key":"zonghe-14-choice-5"},{"lesson":14,"num":6,"stem":"她整容以后，谁也＿＿＿。","word":null,"options":{"A":"认她不出来了","B":"认她出不来了","C":"不认出她来了","D":"认不出她来了"},"answer":"D","analysis":"“出来”做“认”的补语，那么，“认”的宾语“她”应该放在“出”与“来”之间。其他形式都是错误的。","id":"q0773","cat":"choice","section":"综合测验","bookPage":128,"key":"zonghe-14-choice-6"},{"lesson":14,"num":7,"stem":"他告诉过我他的电话号码，可我一时想不＿＿＿了","word":null,"options":{"A":"上来","B":"起来","C":"过来","D":"出来"},"answer":"B","analysis":"“想起来、想得起来、想不起来”都是口语中最常见的形式。应该注意的是“想出来”的意思与“想起来”是不一样的，“想出来”强调的是从无到有的过程，而“想起来”则是把遗忘的事情找回来。","id":"q0774","cat":"choice","section":"综合测验","bookPage":128,"key":"zonghe-14-choice-7"},{"lesson":14,"num":8,"stem":"在美国学习期间，一到周末我们就一起去旅行＿＿＿去逛街。","word":null,"options":{"A":"或许","B":"还是","C":"或者","D":"还要"},"answer":"C","analysis":"A“去旅行”和“去逛街”是不同的周末所选择的活动形式，因此，用“或者最合适。其他词语不能表达这样的意思。教练对练球的小队员们说： ，未来的世界冠军就是你们的。A.下去 B.上来C.上去 D.出来“世界冠军”是未来的事情，因此应该用“下去”，因为只有“下去”才能够表达“未来”的意思。一北京是个很落后的城市呢，没想到她是个现代化的大都市。","id":"q0775","cat":"choice","section":"综合测验","bookPage":128,"key":"zonghe-14-choice-8"},{"lesson":14,"num":9,"stem":"教练对练球的小队员们说：“坚持＿＿＿，未来的世界冠军就是你们的。”","word":null,"options":{"A":"下去","B":"上来","C":"上去","D":"出来"},"answer":"A","analysis":"“世界冠军”是未来的事情，因此应该用“下去”，因为只有“下去”才能够表达“未来”的意思。","id":"q0776","cat":"choice","section":"综合测验","bookPage":128,"key":"zonghe-14-choice-9"},{"lesson":14,"num":10,"stem":"来中国以前我还＿＿＿北京是个很落后的城市呢，没想到她是个现代化的大都市。","word":null,"options":{"A":"觉得","B":"感到","C":"认为","D":"以为"},"answer":"D","analysis":"A、B在汉语中表示的意思基本相同，用法也一样，当然不能选择其中的任何一个。“认为”常常是通过认真思考以后所表达的看法，一般应该是比较正确的，“以为”则常常是没有经过认真思考而发表的意见或看法，这个看法常常是错误的，其后常有“没想到、原来、其实”等词语与之搭配。","id":"q0777","cat":"choice","section":"综合测验","bookPage":128,"key":"zonghe-14-choice-10"},{"lesson":14,"num":11,"stem":"印度尼西亚共有＿＿＿一万三千多个岛屿，被称作“千岛之国”。","word":null,"options":{"A":"很大很小","B":"大大小小","C":"大小大小","D":"大的小的"},"answer":"B","analysis":"“大小”的重叠形式与一般形容词的重叠形式所表达的意思不一样，一般形容词的重叠形式表示的是程度高，而“大小、长短、高低、快慢、胖瘦”等一类词的重叠形式表示的是数量、样式或形式多，因为它们本身已经是名词了。其他几个形式都不符合句子的意思及表达要求。","id":"q0778","cat":"choice","section":"综合测验","bookPage":129,"key":"zonghe-14-choice-11"},{"lesson":14,"num":12,"stem":"中国队要是能够踢进16强，我们非＿＿＿地玩儿个通宵！","word":null,"options":{"A":"热闹热闹","B":"热热闹闹","C":"热闹一热闹","D":"热闹了热闹"},"answer":"B","analysis":"“热闹”的形容词重叠形式应该是“AABB”，而“ABAB”的形式是由形容词转变成了动词，与句子的要求不符。C、D不是正确的重叠形式。","id":"q0779","cat":"choice","section":"综合测验","bookPage":129,"key":"zonghe-14-choice-12"},{"lesson":14,"num":13,"stem":"一摸他的手，＿＿＿的，真把我吓坏了。京泊贝常中 D.冰冰凉","word":null,"options":{"A":"冰凉凉","B":"冰凉冰凉","C":"冰冰凉凉","D":"冰冰凉"},"answer":"B","analysis":"比较特殊的形容词的重叠形式就是“ABAB”。备选答案中如果有“凉冰冰”也可以用。","id":"q0780","cat":"choice","section":"综合测验","bookPage":129,"key":"zonghe-14-choice-13"},{"lesson":14,"num":14,"stem":"我打算先去西安，然后去成都、重庆，＿＿＿一下长江三峡。","word":null,"options":{"A":"旅行","B":"游览","C":"游玩","D":"旅游"},"answer":"B","analysis":"“长江三峡”是已经被列入世界文化遗产的中国风景名胜，许多人都想去那儿看看。“游览”就是看的意思。其他三个词语意义和搭配都不合适，特别应该注意的是，这三个词语不能带宾语。","id":"q0781","cat":"choice","section":"综合测验","bookPage":129,"key":"zonghe-14-choice-14"},{"lesson":14,"num":15,"stem":"为了别人，也为了自己，我们应该牢固＿＿＿法制观念。","word":null,"options":{"A":"学会","B":"意识到","C":"意识","D":"树立"},"answer":"D","analysis":"“学会”的除了知识以外，应该是某种技能，而不是观念；“意识到”应该是某种做法的对或错。与“观念”搭配的动词应该是“树立”。","id":"q0782","cat":"choice","section":"综合测验","bookPage":129,"key":"zonghe-14-choice-15"},{"lesson":14,"num":16,"stem":"明天下午，新世纪饭店将＿＿＿一场国际辩论会。","word":null,"options":{"A":"举行","B":"进行","C":"开始","D":"开展"},"answer":"A","analysis":"“举行”的应该是各种各样的会议；“进行”的宾语不能是名词性词语；)“开展”的是工作、活动等；“开始”的宾语同样应该是动词性词语。","id":"q0783","cat":"choice","section":"综合测验","bookPage":129,"key":"zonghe-14-choice-16"},{"lesson":14,"num":17,"stem":"能否把烟戒掉最能＿＿＿一个人的意志是否坚强。","word":null,"options":{"A":"检查","B":"检验","C":"试验","D":"调查"},"answer":"B","analysis":"“检查”的常是工作、学习、身体一类的词语；“调查”的是问题等事情；“试验”的重心在“试”。对一个人戒烟的意志只能用“检验”，即检查和考验。","id":"q0784","cat":"choice","section":"综合测验","bookPage":129,"key":"zonghe-14-choice-17"},{"lesson":14,"num":18,"stem":"在长安大戏院里，每周都会有几场好戏＿＿＿欣赏，今天晚上是《空城计》。","word":null,"options":{"A":"愿意","B":"可以","C":"会","D":"想"},"answer":"B","analysis":"“可以”是“被允许”的意思，其他词语不能表达这样的意思。","id":"q0785","cat":"choice","section":"综合测验","bookPage":129,"key":"zonghe-14-choice-18"},{"lesson":14,"num":19,"stem":"《青花瓷2》获得了奥斯卡最佳外语片奖，你知道吗？这＿＿＿电影的女主角是我中学的同学。","word":null,"options":{"A":"场","B":"部","C":"次","D":"本盒G"},"answer":"B","analysis":"“场”表示的是与场地和时间有关的事情，如“表演、比赛、演出、风、雨”等。如果说“我看了一场电影”就完全正确了，但是句子是在对《青花瓷2》这部电影中的女主角进行介绍，并不强调“看”，因此不能用“场”。","id":"q0786","cat":"choice","section":"综合测验","bookPage":129,"key":"zonghe-14-choice-19"},{"lesson":14,"num":20,"stem":"传统京剧之所以能够得到外国观众的喜爱，就是因为它是一＿＿＿集音乐、舞蹈、服装和化妆于一身的综合艺术。","word":null,"options":{"A":"组","B":"场","C":"种","D":"个"},"answer":"C","analysis":"有人看到“音乐、舞蹈、服装”后会选择“组”；有人看到“京剧”则会用“场”，但是，这个句子说的是“艺术”，因此应该用“种”。与“种”这个量词搭配的名词非常多，可以说任何事物都可以分成不同的种类，但在具体的语言环境中必须加以认真的分析。","id":"q0787","cat":"choice","section":"综合测验","bookPage":129,"key":"zonghe-14-choice-20"},{"lesson":14,"num":21,"stem":"二十年前朋友结婚，送一＿＿＿枕巾就行了，现在连一台电视也拿不出手。惊人的消息。","word":null,"options":{"A":"双","B":"副","C":"块","D":"对"},"answer":"D","analysis":"按照中国人的传统观念，朋友结婚时送的礼物应该成双，因为我们喜欢“好事成双”。但是，汉语用“双”这个量词的事物多是可以分开的，如“一双手、一双鞋”等，而且没有阴阳的分别；“对”则能够弥补“双”的不足，不但是成双的，而且还常常带有阴阳的成分，如“一对夫妻、一对恋人”等。朋友结婚送的“枕巾”上也常常绘着“一对鸳鸯”。因此，D才是正确答案。","id":"q0788","cat":"choice","section":"综合测验","bookPage":129,"key":"zonghe-14-choice-21"},{"lesson":14,"num":22,"stem":"今天就海内外的各大报纸上都报道了两＿＿＿惊人的消息。","word":null,"options":{"A":"则","B":"篇","C":"页","D":"章"},"answer":"A","analysis":"与“消息”搭配的量词可以用“条、则、个”，其中“则”比较书面化。四个备选答案中只有A是正确的。“篇”常常与“报道、文章”等搭配用。","id":"q0789","cat":"choice","section":"综合测验","bookPage":129,"key":"zonghe-14-choice-22"},{"lesson":14,"num":23,"stem":"老先生的一＿＿＿话，让我异常感动。","word":null,"options":{"A":"批","B":"堆","C":"番","D":"顿"},"answer":"C","analysis":"“番”这个量词表示的是时间比较长，可以用作“事业、工夫、力量、话”等的量词，也可以用做动量词，表示动作的时间。此外，也可以说“一席话”。“批”常常表示比较多的数量，可以指人或物；“堆”常常表示放得比较乱的事物；“顿”除了与“饭”搭配使用外，还常常与动词“打、骂、批评、教训”等搭配做动量补语。","id":"q0790","cat":"choice","section":"综合测验","bookPage":130,"key":"zonghe-14-choice-23"},{"lesson":14,"num":24,"stem":"天太热了，我们一个个都出了一＿＿＿的汗。","word":null,"options":{"A":"桶","B":"筐B","C":"身","D":"盆本不"},"answer":"C","analysis":"“出汗”应该与身体有关，因此口语可以说“一头汗、一脸汗、一身汗”。其他几个词语都是具体的事物名词，都可以盛或装某些东西，因此，与它们搭配的名词都应该是比较具体的事物，如“水、油、饭、苹果、蔬菜”等。","id":"q0791","cat":"choice","section":"综合测验","bookPage":130,"key":"zonghe-14-choice-24"},{"lesson":14,"num":25,"stem":"第三＿＿＿北京国际服装博览会终于开幕了。","word":null,"options":{"A":"次","B":"个","C":"日","D":"周"},"answer":"A","analysis":"“博览会”常常是每年举办一次或几年举办一次，因此，汉语除了用“次”这个量词以外，还常常用“届”做“博览会”(也包括其他的“会”)的量词。其他几个词语都不能表达这样的意思。","id":"q0792","cat":"choice","section":"综合测验","bookPage":130,"key":"zonghe-14-choice-25"},{"lesson":14,"num":26,"stem":"人类应该给动物们留一＿＿＿生路，让它们在地球上继续繁衍生息。","word":null,"options":{"A":"块","B":"个","C":"段","D":"条"},"answer":"D","analysis":"“生路”就是求生的路、生存的路，是比较抽象的路，因此只能用“条”这个量词。如果是具体的路，也可以说“一段路”，但这里“生路”，实际上是指生存的空间。其他词语都不合适。","id":"q0793","cat":"choice","section":"综合测验","bookPage":130,"key":"zonghe-14-choice-26"},{"lesson":14,"num":27,"stem":"我躺在绿油油的草坪上，呼吸着新鲜的空气，＿＿＿脑子里一次次地掠过他的身影。","word":null,"options":{"A":"同样","B":"同时","C":"还","D":"又"},"answer":"B","analysis":"A、C、D都是副词，在句子中一般应该用在谓语之前，而不用在主语之前，因此都不能选择。正确答案当然是B。","id":"q0794","cat":"choice","section":"综合测验","bookPage":130,"key":"zonghe-14-choice-27"},{"lesson":14,"num":28,"stem":"在十名优秀毕业生中，山本排在第一，她后边是约翰，＿＿＿后边是我，我后边还有金水真、竹下等同学。","word":null,"options":{"A":"又","B":"再","C":"第二","D":"下一个"},"answer":"B","analysis":"“第二、下一个”的后边一般应该跟事物名词，而不能跟处所词语；“又”是副词，应该用在谓语之前，句子中的“后边”显然不是谓语。正确答案当然应该是表示顺序的“再”。","id":"q0795","cat":"choice","section":"综合测验","bookPage":130,"key":"zonghe-14-choice-28"},{"lesson":14,"num":29,"stem":"佛教、基督教和伊斯兰教称为世界三大宗教，，＿＿＿佛教产生最早。","word":null,"options":{"A":"却","B":"则","C":"就","D":"而"},"answer":"D","analysis":"“却、则、就”三个副词都不能用在句子中的主语“佛教”之前，只有连词“而”具有这样的语法功能。","id":"q0796","cat":"choice","section":"综合测验","bookPage":130,"key":"zonghe-14-choice-29"},{"lesson":14,"num":30,"stem":"他在家里年龄是最小的，然而饭量＿＿＿是最大的。","word":null,"options":{"A":"却","B":"但","C":"而","D":"更"},"answer":"A","analysis":"按照正常的情况推断，“年龄最小”也应该“饭量最小”，可句子中的后一分句却是“饭量最大”，形成的恰恰是转折关系，而句子中的空又在主语“饭量”之后，因","id":"q0797","cat":"choice","section":"综合测验","bookPage":130,"key":"zonghe-14-choice-30"},{"lesson":15,"num":1,"stem":"我没说A过吃B饭就去C逛商店D。","word":"了","options":null,"answer":"B","analysis":"","id":"q0798","cat":"pos","section":"摸底测验","bookPage":131,"key":"modi-15-position-1"},{"lesson":15,"num":2,"stem":"大约A30B年C以前，D北京的 /* ---- per-person cloud sync (claude.ai artifact: db + user). Falls back to this browser only. ---- */
let syncRef = null, syncOn = false, pushTimer = null, pushing = false, pushAgain = false, lastPushT = 0;
function setSync(state){
  const el = document.getElementById('sync'); if (!el) return;
  const m = {
    local: ['Lưu trên máy này', 'Tiến độ chỉ lưu trong trình duyệt này.'],
    connecting: ['Đang kết nối…', 'Đang tải tiến độ của bạn.'],
    slow: ['Chưa kết nối được', 'Chưa tải được tiến độ đã lưu; kết quả mới vẫn được giữ trên máy này.'],
    synced: ['☁ Đã đồng bộ', 'Tiến độ lưu theo tài khoản của bạn, mở trên máy khác vẫn còn.'],
  }[state];
  el.textContent = m[0]; el.title = m[1]; el.dataset.state = state;
}
function snapshotState(){ return {res: st.res, flags: st.flags, lesson: st.lesson, t: Date.now(), v: 1}; }
function schedulePush(){
  if (!syncOn) return;
  clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 1200);
}
async function pushNow(){
  if (!syncOn || !syncRef) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  const body = snapshotState(); lastPushT = body.t;
  try { await syncRef.set(body); setSync('synced'); }
  catch (e) {
    if (e && e.code === 'unavailable') { setTimeout(pushNow, 2000 + Math.random() * 2000); }
    else { syncOn = false; setSync('local'); }   // no write access (e.g. view-only sharing): keep local only
  }
  pushing = false;
  if (pushAgain) { pushAgain = false; pushNow(); }
}
function mergeRes(a, b){
  const out = Object.assign({}, a);
  for (const k in b) if (!out[k] || (b[k].t || 0) > (out[k].t || 0)) out[k] = b[k];
  return out;
}
function refreshView(){
  topStats();
  if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
  if (S && $('#q')) render(); else if ($('#lessons')) showHome();
}
async function initSync(){
  if (!window.claude || typeof window.claude.use !== 'function') { setSync('local'); return; }
  setSync('connecting');
  let user, db;
  try { [user, db] = await Promise.all([claude.use('user'), claude.use('db')]); } catch (e) {}
  const uid = user ? await user.id() : null;
  if (!db || !uid) { setSync('local'); return; }
  try { syncRef = db.doc('data/users/' + uid + '/progress'); } catch (e) { setSync('local'); return; }
  let first = true;
  const timer = setTimeout(() => { if (first) setSync('slow'); }, 10000);
  syncRef.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    const remote = snap.exists ? snap.data() : null;
    if (first) {
      if (snap.metadata.fromCache) return;
      first = false; clearTimeout(timer); syncOn = true;
      const localCount = Object.keys(st.res).length;
      if (remote) {
        st.res = mergeRes(remote.res || {}, st.res);
        st.flags = Object.assign({}, remote.flags || {}, st.flags);
        if (remote.lesson != null && !localCount) st.lesson = remote.lesson;
      }
      try { localStorage.setItem(STORE, JSON.stringify(st)); } catch (e) {}
      const changed = !remote || Object.keys(st.res).length !== Object.keys(remote.res || {}).length
        || Object.keys(st.flags).length !== Object.keys(remote.flags || {}).length;
      if (changed) pushNow(); else setSync('synced');
      refreshView();
    } else if (remote && (remote.t || 0) > lastPushT) {
      // progress saved from another device of the same person
      st.res = remote.res || {}; st.flags = remote.flags || {};
      try { localStorage.setItem(STORE, JSON.stringify(st)); } catch (e) {}
      refreshView();
    }
  }, () => { clearTimeout(timer); syncOn = false; setSync('local'); });
}

/* ---------------- Search ---------------- */
const SNORM = t => String(t || '').toLowerCase().replace(/[\s，。、！？；：“”‘’（）()《》…·.,!?;:"'\-—_＿]/g, '');
let SIDX = null;
function searchIndex(){
  if (SIDX) return SIDX;
  SIDX = ITEMS.map(o => {
    const q = [o.stem, o.word, o.sub, ...(o.options ? Object.values(o.options) : []), ...(o.tiles || [])].filter(Boolean).join(' | ');
    const a = [...(o.corrections || []), ...(o.answers || []), ...(o.extra || []), o.answer && o.answer.length > 1 ? o.answer : '', o.analysis].filter(Boolean).join(' | ');
    return {o, q: SNORM(q), a: SNORM(a)};
  });
  return SIDX;
}
function runSearch(query){
  const k = SNORM(query);
  if (!k) return [];
  const withAns = unlocked();
  return searchIndex().filter(x => x.q.includes(k) || (withAns && x.a.includes(k))).map(x => x.o);
}
function hl(text, query){
  const chars = [...SNORM(query)].map(c => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!chars.length) return esc(text);
  const re = new RegExp(chars.join('[\\s，。、！？；：“”‘’（）()《》…·.,!?;:"\'\\-—_＿]*'), 'gi');
  let out = '', last = 0, m;
  const t = String(text || '');
  while ((m = re.exec(t)) && m[0].length) { out += esc(t.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>'; last = m.index + m[0].length; }
  return out + esc(t.slice(last));
}
function hitStatus(o){ const r = st.res[o.key]; return !r ? '<span>Chưa làm</span>' : r.ok ? '<span class="st-ok">✓ Đúng</span>' : '<span class="st-bad">✗ Sai</span>'; }
function typeName(o){ return o.set ? setInfo(o.set).vi : (CATS.find(c => c.id === o.cat) || {}).vi; }
function hitHtml(o, query, idx){
  const main = o.cat === 'order' ? o.tiles.join(' / ') : o.stem + (o.word ? `  〔${o.word}〕` : '') + (o.options ? '  ' + 'ABCD'.split('').map(k => `${k}.${o.options[k] || ''}`).join('  ') : '');
  let more = '';
  if (unlocked() && !SNORM(main).includes(SNORM(query))) {
    const ans = [...(o.corrections || []), ...(o.answers || []), o.cat === 'order' ? o.answer : ''].filter(Boolean);
    const inAns = ans.find(a => SNORM(a).includes(SNORM(query)));
    if (inAns) more = `<div class="more"><b>Đáp án</b>${hl(inAns, query)}</div>`;
    else if (o.analysis) {
      const i = SNORM(o.analysis) ? o.analysis.search(new RegExp([...SNORM(query)].map(c => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('.{0,3}'))) : -1;
      const from = Math.max(0, i - 30);

/* --- choose position --- */
function posStem(o, picked, done){

}

    <div class="opts">${'ABCD'.split('').map(k => `<button class="opt ${done && k===o.answer?'ok':''} ${done && k===picked && k!==o.answer?'bad':''}" data-k="${k}" ${done?'disabled':''}>

/* --- word order (连词成句) --- */
let ORD = {key: null, seq: []};
const cjOnly = s => (s || '').replace(/[^一-鿿]/g, '');
function orderSentence(o, seq){ return seq.map(i => o.tiles[i]).join(''); }
function orderMatches(o, seq){
  // A frame tile like 在……上 goes where its first part goes; its second part closes after
  // one or more of the words that follow it. Accept the order if any closing point gives the answer.
  const ans = cjOnly(o.answer);
  const pieces = seq.map(i => o.tiles[i].split(/…+/).map(cjOnly).filter(Boolean));
  const build = (k, open) => {           // k: index in seq; open: closing parts waiting, with words left before closing
    if (k === pieces.length) return [open.length ? null : ''].filter(x => x !== null);
    const p = pieces[k], out = [];
    const tails = [];
    // close any waiting frame after this word (or keep it open)
    const next = (prefix, waiting) => {
      for (const rest of build(k + 1, waiting)) out.push(prefix + rest);
      if (waiting.length) {             // close the innermost frame right here
        const w = waiting[waiting.length - 1];
        for (const rest of build(k + 1, waiting.slice(0, -1))) out.push(prefix + w + rest);
      }
    };
    if (p.length > 1) next(p[0], [...open, p.slice(1).join('')]);
    else next(p[0], open);
    return out;
  };
  if (!pieces.some(p => p.length > 1)) return pieces.map(p => p[0]).join('') === ans;
  return build(0, []).includes(ans);
}
function renderOrder(o, q){
  const r = st.res[o.key];
  const done = !!(r && r.seq);
  if (ORD.key !== o.key) ORD = {key: o.key, seq: done ? r.seq.slice() : []};
  const seq = ORD.seq, full = seq.length === o.tiles.length;
  const slotCls = done ? (r.ok ? 'ok' : 'bad') : '';
  q.innerHTML = metaLine(o) + `
    <div class="lead">Sắp xếp các từ sau thành câu hoàn chỉnh:</div>
    ${o.tiles.some(t => t.includes('…')) ? '<div class="hint" style="margin:0">Ô có dấu …… (như 在……上) là cấu trúc khung: đặt ô đó trước các từ nằm bên trong khung.</div>' : ''}
    <div class="slot ${slotCls}" id="slot" aria-label="Câu bạn đang ghép">${seq.length ? seq.map((i, k) => `<button class="tile" data-pos="${k}" ${done ? 'disabled' : ''}>${esc(o.tiles[i])}</button>`).join('') : '<span class="ph">Bấm vào các từ bên dưới theo đúng thứ tự…</span>'}</div>
    <div class="bank">${o.tiles.map((t, i) => `<button class="tile ${seq.includes(i) ? 'used' : ''}" data-i="${i}" ${done || seq.includes(i) ? 'disabled' : ''}>${esc(t)}<span class="n">${i + 1}</span></button>`).join('')}</div>
    ${done ? orderResult(o, r) : `<div class="row" style="margin-top:14px">
      <button class="btn primary" id="ocheck" ${full ? '' : 'disabled'}>Kiểm tra</button>
      <button class="btn" id="oreset" ${seq.length ? '' : 'disabled'}>Làm lại</button>
      <button class="btn" id="oshow">Xem đáp án</button></div>`}`;
  bindFlag(o);
  if (done) { const g = $('#oselfok'); if (g) g.onclick = () => { record(o, true, Object.assign(st.res[o.key], {ok: true, self: true})); renderQ(o); };
    $('#oretry').onclick = () => { delete st.res[o.key]; ORD = {key: null, seq: []}; save(); topStats(); render(); }; return; }
  q.querySelectorAll('.bank .tile').forEach(b => b.onclick = () => orderPick(o, +b.dataset.i));
  q.querySelectorAll('.slot .tile').forEach(b => b.onclick = () => { ORD.seq.splice(+b.dataset.pos, 1); renderQ(o); });
  $('#ocheck').onclick = () => orderCheck(o, false);
  $('#oreset').onclick = () => { ORD.seq = []; renderQ(o); };
  $('#oshow').onclick = () => orderCheck(o, true);
}
function orderPick(o, i){
  if (!unlocked()) { openLock(); return; }
  if (st.res[o.key] && st.res[o.key].seq) return;
  if (i < 0 || i >= o.tiles.length || ORD.seq.includes(i)) return;
  ORD.seq.push(i); renderQ(o);
}
function orderCheck(o, reveal){
  const seq = ORD.seq.slice();
  const ok = !reveal && seq.length === o.tiles.length && orderMatches(o, seq);
  record(o, ok, {seq, gaveUp: reveal && seq.length < o.tiles.length});
  renderQ(o);
}
function orderResult(o, r){
  const mine = orderSentence(o, r.seq);
  const v = r.ok ? verdictHtml('ok', r.self ? 'Bạn tự chấm: đúng' : 'Đúng thứ tự rồi!')
    : verdictHtml('bad', r.seq.length < o.tiles.length ? 'Đây là đáp án đúng:' : 'Chưa đúng thứ tự. So sánh với đáp án nhé:');
  return `<div class="result">${v}
    <span class="lb">答案 · Đáp án</span><div class="answer-line">${esc(o.answer)}</div>
    ${!r.ok && r.seq.length === o.tiles.length ? `<div class="ana diff"><span class="lb">Câu bạn ghép (<del>sai chỗ</del> / <ins>đáp án</ins>)</span>${diffHtml(mine, o.answer)}</div>` : ''}
    <div class="row" style="margin-top:12px">${!r.ok && r.seq.length === o.tiles.length ? '<button class="btn" id="oselfok" style="border-color:var(--ok);color:var(--ok)">✓ Câu của mình cũng đúng</button>' : ''}<button class="btn" id="oretry">Làm lại câu này</button></div></div>`;
}

function verdictHtml(kind, msg){
  const face = kind === 'ok' ? panda('cheer') : kind === 'bad' ? panda('sad') : panda('normal');
  const cheer = kind === 'ok' ? pick(CHEER_OK) : kind === 'bad' ? pick(CHEER_BAD) : '看一看';
  return `<div class="verdict ${kind}"><div class="face">${face}</div><div><div class="cheer">${cheer}</div><div class="msg">${esc(msg)}</div></div></div>`;
}
function resultChoice(o, picked){
  if (!o.answer) return `<div class="result">${verdictHtml('neutral', 'Sách không ghi đáp án cho câu này.')}${analysisHtml(o)}</div>`;
  const ok = picked === o.answer;
  return `<div class="result">${verdictHtml(ok ? 'ok' : 'bad', ok ? 'Chính xác!' : `Bạn chọn ${picked}, đáp án đúng là ${o.answer}`)}
    ${o.cat==='choice' && o.options ? `<div class="ans">答案：${o.answer}. ${esc(o.options[o.answer]||'')}</div>` : `<div class="ans">答案：${o.answer}</div>`}
    ${analysisHtml(o)}</div>`;
}
function answerChoice(o, k){
  if (!unlocked()) { openLock(); return; }
  const r = st.res[o.key]; if (r && r.a) return;
  record(o, o.answer ? k === o.answer : true, {a: k});
  renderQ(o);
}

/* --- write-in types (病句 / 填空 / 改写 / 扩写) --- */
const PROMPTS = {
  bingju: ['Câu này sai. Viết lại câu đúng:', 'Gõ câu đã sửa…'],
  fill: ['Điền vào chỗ trống và viết lại cả câu:', 'Gõ cả câu sau khi điền…'],
  rewrite: ['Viết lại câu theo yêu cầu:', 'Gõ câu viết lại…'],
  expand: ['Mở rộng / hoàn thành câu:', 'Gõ câu hoàn chỉnh…'],
};
const norm = s => (s||'').replace(/[\s，。！？、,.!?；;：:“”"'‘’（）()…—\-]/g, '');
function diffHtml(a, b){
  // character-level LCS diff of user answer (a) vs reference (b)
  a = [...norm(a)]; b = [...norm(b)];
  const n = a.length, m = b.length, dp = Array.from({length:n+1}, () => new Int16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i=0, j=0, out='';
  while (i<n && j<m){ if (a[i]===b[j]){ out+=esc(a[i]); i++; j++; } else if (dp[i+1][j] >= dp[i][j+1]) out+=`<del>${esc(a[i++])}</del>`; else out+=`<ins>${esc(b[j++])}</ins>`; }
  while (i<n) out+=`<del>${esc(a[i++])}</del>`; while (j<m) out+=`<ins>${esc(b[j++])}</ins>`;
  return out;
}
function renderWrite(o, q){
  const r = st.res[o.key]; const refs = (o.corrections || o.answers || []);
  const [lead, ph] = PROMPTS[o.cat];
  const shown = r && r.shown;
  let stem = esc(o.stem).replace(/＿＿＿/g, '<span class="blank">&nbsp;</span>');
  q.innerHTML = metaLine(o) + `
    <div class="lead">${lead}</div>
    <div class="stem ${o.cat==='bingju'?'wrong':''}">${o.cat==='bingju'?'✗ ':''}${stem}</div>
    <textarea id="ta" placeholder="${ph}" ${shown?'readonly':''}>${esc(r && r.text || '')}</textarea>
    ${shown ? '' : `<div class="row" style="margin-top:10px"><button class="btn primary" id="check">Kiểm tra</button><button class="btn" id="reveal">Xem đáp án</button><span class="hint">Chấm theo nghĩa: so khớp với câu mẫu trong sách, còn lại bạn tự chấm.</span></div>`}
    <div id="res">${shown ? resultWrite(o, r) : ''}</div>`;
  bindFlag(o);
  const ta = $('#ta');
  if (!shown){
    if (!ta.value && o.cat !== 'expand') ta.value = '';
    $('#check').onclick = () => submitWrite(o, ta.value, false);
    $('#reveal').onclick = () => submitWrite(o, ta.value, true);
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); submitWrite(o, ta.value, false); }});
    setTimeout(() => ta.focus({preventScroll:true}), 30);
  } else bindSelfGrade(o);
}
function submitWrite(o, text, revealOnly){
  const refs = (o.corrections || o.answers || []);
  const match = text.trim() && refs.some(x => norm(x) === norm(text));
  st.res[o.key] = Object.assign(st.res[o.key] || {}, {text, shown: true, auto: match ? true : null});
  if (match) record(o, true, st.res[o.key]); else save();
  renderQ(o);
}
function resultWrite(o, r){
  const refs = (o.corrections || o.answers || []);
  let v;
  if (r.auto) v = verdictHtml('ok', 'Khớp với đáp án trong sách!');
  else if (r.ok === true) v = verdictHtml('ok', 'Bạn tự chấm: đúng');
  else if (r.ok === false) v = verdictHtml('bad', 'Bạn tự chấm: sai. Đọc kỹ lời giải bên dưới nhé.');
  else v = verdictHtml('neutral', r.text && r.text.trim() ? 'Chưa trùng khớp hoàn toàn với câu mẫu. So sánh rồi tự chấm nhé:' : 'Đây là đáp án tham khảo:');
  const best = r.text && r.text.trim() && refs.length && !r.auto ? refs.reduce((a, b) => lcsLen(r.text, b) / Math.max(norm(b).length,1) > lcsLen(r.text, a) / Math.max(norm(a).length,1) ? b : a) : null;
  return `<div class="result">${v}
    <span class="lb">${o.cat==='bingju' ? '正确的句子 · Câu đúng' : '答案 · Đáp án'}</span>
    <ol class="ans">${refs.map(x => `<li>${esc(x)}</li>`).join('') || '<li style="color:var(--muted)">(Sách không có câu mẫu)</li>'}</ol>
    ${best ? `<div class="ana diff"><span class="lb">So với câu mẫu gần nhất (<del>thừa</del> / <ins>thiếu</ins>)</span>${diffHtml(r.text, best)}</div>` : ''}
    ${o.extra && o.extra.length ? `<div class="ana"><span class="lb">另 · Ví dụ thêm</span>${o.extra.map(esc).join('<br>')}</div>` : ''}
    ${analysisHtml(o)}
    ${r.auto || r.ok !== undefined && r.ok !== null ? '' : `<div class="row" style="margin-top:14px"><span class="hint">Tự chấm:</span><button class="btn" id="g-ok" style="border-color:var(--ok);color:var(--ok)">✓ Mình làm đúng</button><button class="btn" id="g-bad" style="border-color:var(--bad);color:var(--bad)">✗ Mình làm sai</button></div>`}
    <div class="row" style="margin-top:10px"><button class="btn" id="retry">Làm lại câu này</button></div>
  </div>`;
}
function lcsLen(a, b){ a=[...norm(a)]; b=[...norm(b)]; let prev=new Array(b.length+1).fill(0);
  for (const x of a){ const cur=[0]; for (let j=0;j<b.length;j++) cur.push(x===b[j]?prev[j]+1:Math.max(prev[j+1],cur[j])); prev=cur; } return prev[b.length]; }
function bindSelfGrade(o){
  const g1 = $('#g-ok'), g2 = $('#g-bad');
  if (g1) g1.onclick = () => { record(o, true, Object.assign(st.res[o.key], {ok:true})); renderQ(o); };
  if (g2) g2.onclick = () => { record(o, false, Object.assign(st.res[o.key], {ok:false})); renderQ(o); };
  $('#retry').onclick = () => { delete st.res[o.key]; save(); topStats(); render(); };
}

/* keyboard */
document.addEventListener('keydown', e => {
  if (!S || !$('#q') || e.target.tagName === 'TEXTAREA' || e.ctrlKey || e.metaKey || e.altKey) return;
  const o = S.list[S.i]; const k = e.key.toUpperCase();
  const map = {'1':'A','2':'B','3':'C','4':'D'};
  if ($('#lockdlg')) { if (e.key === 'Escape') $('#lockdlg').remove(); return; }
  if (o.cat === 'order') {
    if (/^[1-9]$/.test(e.key)) { orderPick(o, +e.key - 1); e.preventDefault(); return; }
    if (e.key === 'Backspace' && ORD.key === o.key && ORD.seq.length && !(st.res[o.key] && st.res[o.key].seq)) { ORD.seq.pop(); renderQ(o); e.preventDefault(); return; }
    if (e.key === 'Enter' && !(st.res[o.key] && st.res[o.key].seq) && ORD.key === o.key && ORD.seq.length === o.tiles.length) { orderCheck(o, false); e.preventDefault(); return; }
  }
  if ((o.cat === 'pos' || o.cat === 'choice') && ('ABCD'.includes(k) && k.length === 1 || map[k])) { answerChoice(o, map[k] || k); e.preventDefault(); }
  else if (e.key === 'ArrowRight' || e.key === 'Enter') { if (S.i < S.list.length-1) go(1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); }
});

async function boot(){
  const raw = document.getElementById('data').textContent.trim();
  try {
    DATA = raw && raw[0] === '{' ? JSON.parse(raw) : await (await fetch('exercises.json')).json();
  } catch (e) {
    app.innerHTML = '<div class="empty">Không tải được dữ liệu bài tập. Hãy tải lại trang.</div>'; return;
  }
  ITEMS = DATA.items; CATS = DATA.cats; LESSONS = DATA.lessons;
  BYKEY = Object.fromEntries(ITEMS.map(o => [o.key, o]));
  document.body.insertAdjacentHTML('afterbegin', PANDA_DEFS);
  $('#logo').outerHTML = `<span class="logo">${panda('normal', {body: false})}</span>`;
  document.body.insertAdjacentHTML('afterbegin', `<div class="grove l">${grove()}</div><div class="grove r">${grove()}</div>`);
  lockLabel();
  showHome();
  initSync();
}
boot();
</script>
