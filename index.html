<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện ngữ pháp tiếng Trung</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: bamboo-grove study room. Rounded paper cards on a pale bamboo mist, a panda mascot
   that greets, cheers and consoles; Chinese set in Kai (textbook handwriting) for readability. */
:root{
  --bg:#eef3e6; --paper:#ffffff; --ink:#1e2a22; --muted:#5d6e61; --line:#d6e2cd;
  --accent:#2f8a4c; --accent-2:#25713d; --accent-soft:#dcefd5; --on-accent:#ffffff;
  --red:#d6453a; --red-soft:#fbe3df; --gold:#d99a1e; --gold-soft:#fbefd2;
  --ok:#2f8a4c; --ok-soft:#dcefd5; --bad:#d6453a; --bad-soft:#fbe3df; --warn:#a46b00;
  --chip:#e4ecdc; --shadow:0 1px 0 rgba(30,60,35,.05),0 8px 24px -8px rgba(30,70,40,.18);
  --t-pos:#dcefd5; --c-pos:#2f8a4c; --t-choice:#fde3d3; --c-choice:#c8582a;
  --t-bingju:#fbe0de; --c-bingju:#c93a30; --t-fill:#d8eeec; --c-fill:#21827a;
  --t-rewrite:#ebe2f5; --c-rewrite:#7a4fb0; --t-expand:#fbefd2; --c-expand:#a56f00; --t-order:#dfeaf7; --c-order:#2f66a8; --t-hsk:#fbe0de; --c-hsk:#c93a30;
  --leaf:#7fb069; --stalk:#9cc47f;
  --zh:"KaiTi","STKaiti","Kaiti SC","Kaiti TC","BiauKai","Noto Serif SC","Songti SC",serif;
  --fun:"ZCOOL KuaiLe","KaiTi","STKaiti",cursive;
  --ui:"Nunito","Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111a14; --paper:#18241c; --ink:#e7eee5; --muted:#9db0a2; --line:#2a3a30;
  --accent:#5cbf7a; --accent-2:#78d394; --accent-soft:#1d3a27; --on-accent:#0d1a11;
  --red:#f07a6e; --red-soft:#3b2420; --gold:#f0c25a; --gold-soft:#3a3018;
  --ok:#5cbf7a; --ok-soft:#1d3a27; --bad:#f07a6e; --bad-soft:#3b2420; --warn:#f0c25a;
  --chip:#22302a; --shadow:0 8px 24px -10px rgba(0,0,0,.6);
  --t-pos:#1d3a27; --c-pos:#78d394; --t-choice:#3b2a1f; --c-choice:#f19a6c;
  --t-bingju:#3b2420; --c-bingju:#f07a6e; --t-fill:#16332f; --c-fill:#6fd0c5;
  --t-rewrite:#2c2438; --c-rewrite:#b896e6; --t-expand:#3a3018; --c-expand:#f0c25a; --t-order:#1a2a3d; --c-order:#8fbbf0; --t-hsk:#3b2420; --c-hsk:#f07a6e;
  --leaf:#3f6b3a; --stalk:#4f7a45; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111a14; --paper:#18241c; --ink:#e7eee5; --muted:#9db0a2; --line:#2a3a30;
  --accent:#5cbf7a; --accent-2:#78d394; --accent-soft:#1d3a27; --on-accent:#0d1a11;
  --red:#f07a6e; --red-soft:#3b2420; --gold:#f0c25a; --gold-soft:#3a3018;
  --ok:#5cbf7a; --ok-soft:#1d3a27; --bad:#f07a6e; --bad-soft:#3b2420; --warn:#f0c25a;
  --chip:#22302a; --shadow:0 8px 24px -10px rgba(0,0,0,.6);
  --t-pos:#1d3a27; --c-pos:#78d394; --t-choice:#3b2a1f; --c-choice:#f19a6c;
  --t-bingju:#3b2420; --c-bingju:#f07a6e; --t-fill:#16332f; --c-fill:#6fd0c5;
  --t-rewrite:#2c2438; --c-rewrite:#b896e6; --t-expand:#3a3018; --c-expand:#f0c25a; --t-order:#1a2a3d; --c-order:#8fbbf0; --t-hsk:#3b2420; --c-hsk:#f07a6e;
  --leaf:#3f6b3a; --stalk:#4f7a45; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--ui);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
/* decorative bamboo grove fixed at the page edges */
.grove{position:fixed;bottom:0;width:150px;height:min(70vh,520px);pointer-events:none;z-index:0;opacity:.55}
.grove.l{left:0} .grove.r{right:0;transform:scaleX(-1)}
@media (max-width:1180px){.grove{opacity:.22}}
@media (max-width:760px){.grove{display:none}}

header.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--fun);font-size:22px;cursor:pointer;white-space:nowrap}
.brand .logo{width:44px;flex:none;display:block}
.pd{display:block;width:100%;height:auto}
.brand small{font-family:var(--ui);font-weight:700;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 9px}
.top .stats{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap;font-weight:600}
.sync{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--chip);color:var(--muted);white-space:nowrap;font-weight:600}
.sync[data-state="synced"]{background:var(--ok-soft);color:var(--ok)}
.sync[data-state="slow"]{color:var(--warn)}
.iconbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
#lockbtn{white-space:nowrap}
#lockbtn[data-on="1"]{color:var(--ok);border-color:var(--ok)}
#copybox{display:block;width:100%;min-height:120px;margin-top:10px;font:13px/1.5 var(--ui)}

/* hero: the panda greets you */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin-top:22px;padding:18px 22px;background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .mascot{width:108px}
.hero .bubble{position:relative;background:var(--accent-soft);border-radius:18px;padding:12px 16px;min-width:0}
.hero .bubble::before{content:"";position:absolute;left:-9px;top:26px;border:9px solid transparent;border-right-color:var(--accent-soft);border-left:0}
.hero .hi{font-family:var(--ui);font-weight:800;font-size:21px;color:var(--accent-2);line-height:1.25}
.zhf{font-family:var(--fun);font-weight:400;font-size:1.15em;margin-right:6px}
.hero .say{font-weight:600;margin-top:2px;text-wrap:balance}
.hero .say b{color:var(--accent-2)}
.hero .row{margin-top:10px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--chip)} .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .6s ease}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring .lbl b{font-size:22px;font-variant-numeric:tabular-nums}
.ring .lbl span{font-size:11px;color:var(--muted);font-weight:700}

h2{display:flex;align-items:center;gap:8px;font-size:14px;margin:28px 0 12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
h2 .zh{font-family:var(--fun);font-size:20px;text-transform:none;letter-spacing:0;color:var(--accent-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;transition:border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.lessonname{font-family:var(--zh);font-size:17px;margin:10px 0 0;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:18px 18px 16px;box-shadow:var(--shadow);text-align:left;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-content:start;transition:transform .18s cubic-bezier(.3,1.6,.6,1),border-color .15s}
.card:hover{transform:translateY(-3px) rotate(-.4deg);border-color:var(--cc)}
.card .ico{grid-row:span 2;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-family:var(--fun);font-size:30px;background:var(--tt);color:var(--cc)}
.card .zh{font-family:var(--fun);font-size:24px;line-height:1.2;align-self:end}
.card .vi{font-weight:800;align-self:start}
.card .desc{grid-column:1 / -1;color:var(--muted);font-size:13px;margin-top:6px}
.card .bar{grid-column:1 / -1;margin-top:8px}
.card .meta{grid-column:1 / -1}
.card .done-badge{position:absolute;top:12px;right:14px;font-size:12px;font-weight:800;color:var(--cc)}
.bar{height:8px;background:var(--chip);border-radius:9px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)} .bar .bad{background:var(--bad)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;font-weight:800;transition:transform .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-2)}
.btn.primary:active{box-shadow:0 1px 0 var(--accent-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.iconbtn:focus-visible,.opt:focus-visible,.mk:focus-visible,.chip:focus-visible,.card:focus-visible,.dot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0 12px}
.toolbar .title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin-right:auto}
.toolbar .title .ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-family:var(--fun);font-size:22px;background:var(--tt,var(--accent-soft));color:var(--cc,var(--accent))}
.toolbar .title .zh{font-family:var(--fun);font-size:22px;font-weight:400}
label.tog{font-size:13px;display:flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer;font-weight:700}
label.tog input{accent-color:var(--accent);width:16px;height:16px}
.qcard{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:22px 24px 20px;box-shadow:var(--shadow)}
.qmeta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-weight:700}
.qmeta .tag{background:var(--chip);border-radius:999px;padding:1px 10px}
.qmeta .flag{margin-left:auto;border:0;background:none;color:var(--muted);font-size:12px;font-weight:700}
.qmeta .flag.on{color:var(--warn)}
.lead{font-size:13px;color:var(--muted);font-weight:700;margin:0 0 4px}
.stem{font-family:var(--zh);font-size:25px;line-height:1.95;letter-spacing:.03em;word-break:break-all}
.stem.wrong{color:var(--bad)}
.stem .blank{display:inline-block;min-width:3.2em;border-bottom:2.5px dashed var(--accent);text-align:center;color:var(--accent);font-weight:700;margin:0 3px}
.mk{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;border-radius:50%;border:2px solid var(--c-choice);color:var(--c-choice);font:800 14px/1 var(--ui);margin:0 3px;vertical-align:4px;background:var(--paper);transition:transform .12s}
button.mk{cursor:pointer}
button.mk:hover{transform:scale(1.15)}
.mk.sel{background:var(--c-choice);color:#fff}
.mk.ok{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.mk.bad{background:var(--bad);border-color:var(--bad);color:#fff;text-decoration:line-through}
.ins{color:var(--ok);font-weight:700;background:var(--ok-soft);border-radius:6px;padding:0 3px}
.word{display:inline-flex;gap:10px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted);font-weight:700}
.word b{font-family:var(--zh);font-size:24px;color:var(--ink);background:var(--gold-soft);border:1.5px dashed var(--gold);border-radius:12px;padding:0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.opt{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--paper);text-align:left;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt .k{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--chip);font-weight:800;color:var(--muted);flex:none}
.opt .v{font-family:var(--zh);font-size:21px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .k{background:var(--ok);color:var(--on-accent)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
textarea{width:100%;min-height:88px;margin-top:16px;border:2px solid var(--line);border-radius:16px;padding:12px 16px;background:var(--bg);color:var(--ink);font:22px/1.6 var(--zh);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent);background:var(--paper)}
.hint{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}

/* result: panda reacts */
.result{margin-top:20px;border-top:2px dashed var(--line);padding-top:16px}
.verdict{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.verdict .face{width:54px;flex:none}
.verdict .cheer{font-family:var(--fun);font-size:26px;line-height:1.1}
.verdict .msg{font-weight:700;font-size:14px}
.verdict.ok .cheer{color:var(--ok)} .verdict.bad .cheer{color:var(--bad)} .verdict.neutral .cheer{color:var(--warn)}
.verdict.ok .face{animation:hop .6s cubic-bezier(.3,1.8,.5,1)}
.verdict.bad .face{animation:wob .5s ease}
@keyframes hop{0%{transform:translateY(8px) scale(.9)}60%{transform:translateY(-6px) scale(1.05)}100%{transform:none}}
@keyframes wob{0%,100%{transform:none}30%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}}
.ans{font-family:var(--zh);font-size:21px;line-height:1.8}
.ans li{margin:2px 0}
.ana{background:var(--bg);border-radius:16px;padding:12px 16px;margin-top:12px;font-family:var(--zh);font-size:18px;line-height:1.85;border-left:4px solid var(--stalk)}
.ana .lb,.lb{font:800 12px var(--ui);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}
.diff del{color:var(--bad);text-decoration:none;background:var(--bad-soft);border-radius:3px}
.diff ins{color:var(--ok);text-decoration:none;background:var(--ok-soft);border-radius:3px}
.nav{display:flex;align-items:center;gap:10px;margin-top:16px}
.nav .pos{margin:0 auto;color:var(--muted);font-size:13px;font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px;max-height:136px;overflow:auto;padding:3px}
.dot{width:32px;height:28px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-size:11px;font-weight:700;color:var(--muted)}
.dot.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dot.cur{outline:2.5px solid var(--gold);outline-offset:1px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .pd{width:110px}
kbd{font:11px var(--ui);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--paper)}
.foot{color:var(--muted);font-size:12px;margin:30px 0 40px;line-height:1.7}
.hide{display:none!important}

/* search */
.searchbox{position:relative;margin-top:16px}
.searchbox input{width:100%;font:16px/1.4 var(--ui);padding:12px 16px 12px 44px;border:2px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.searchbox input:focus{outline:none;border-color:var(--accent)}
.searchbox::before{content:"🔍";position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.searchbox kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%)}
.sres{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.hit{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 16px;border-radius:18px;border:1.5px solid var(--line);background:var(--paper);box-shadow:var(--shadow)}
.hit:hover{border-color:var(--accent)}
.hit .src{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);font-weight:700}
.hit .txt{font-family:var(--zh);font-size:19px;line-height:1.6;word-break:break-all}
.hit .more{font-size:13px;color:var(--muted);line-height:1.5}
.hit .more b{font:800 11px var(--ui);text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
mark{background:var(--gold-soft);color:inherit;border-radius:4px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--gold)}
.st-ok{color:var(--ok)} .st-bad{color:var(--bad)}
.scount{font-size:13px;color:var(--muted);font-weight:700;margin-top:10px}

/* word order */
.slot{min-height:64px;margin-top:16px;padding:10px;border:2px dashed var(--c-order);border-radius:18px;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.slot .ph{color:var(--muted);font-size:13px;font-weight:700;padding:0 6px}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:44px}
.tile{font-family:var(--zh);font-size:21px;line-height:1.2;padding:7px 14px;border-radius:14px;border:2px solid var(--line);background:var(--paper);box-shadow:0 2px 0 var(--line);transition:transform .1s}
.tile:hover:not(:disabled){transform:translateY(-2px);border-color:var(--c-order)}
.tile .n{font:800 10px var(--ui);color:var(--muted);vertical-align:super;margin-left:3px}
.slot .tile{background:var(--t-order);border-color:var(--c-order);box-shadow:0 2px 0 var(--c-order)}
.tile:disabled{cursor:default}
.bank .tile.used{display:none}
.answer-line{font-family:var(--zh);font-size:22px;line-height:1.7}
.exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.exam{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px 16px;border-radius:20px;border:1.5px solid var(--line);background:var(--paper);box-shadow:var(--shadow);text-align:left}
.exam:hover{border-color:var(--c-hsk)}
.exam b{font-family:var(--fun);font-size:22px;font-weight:400;color:var(--c-hsk)}
.exam .bar{width:100%}

/* lock */
.lockbar{display:flex;align-items:center;gap:12px;margin-top:18px;padding:8px 10px 8px 12px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;box-shadow:var(--shadow);width:fit-content;max-width:100%}
.lockbar .mascot{width:40px;flex:none}
.lockbar .txt{font-weight:800;font-size:15px;min-width:0}
.btn.sm{padding:5px 12px;font-size:13px}
.lockbar .btn,.lockbox .btn{white-space:nowrap}
.lockbox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px;padding:8px 8px 8px 14px;border-radius:999px;background:var(--gold-soft);font-size:13px;font-weight:800;color:var(--warn)}
.lockdlg{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,#0b120d 45%,transparent)}
.lockcard{width:min(300px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;align-items:stretch}
.lockcard .face{width:64px;align-self:center}

<script id="data" type="application/json">{"cats":[{"id":"pos","zh":"选择位置","vi":"Chọn vị trí đặt từ","desc":"Đặt từ cho sẵn vào đúng vị trí A, B, C hoặc D trong câu."},{"id":"choice","zh":"选词填空","vi":"Chọn từ điền chỗ trống","desc":"Chọn 1 trong 4 phương án A–D để hoàn thành câu."},{"id":"bingju","zh":"病句分析","vi":"Sửa câu sai","desc":"Tìm lỗi ngữ pháp và viết lại câu cho đúng."},{"id":"fill","zh":"填空","vi":"Tự điền vào chỗ trống","desc":"Tự điền từ, bổ ngữ, hình thức lặp… không có phương án gợi ý."},{"id":"rewrite","zh":"改写句子","vi":"Viết lại câu","desc":"Chuyển câu sang cấu trúc yêu cầu: 把/被, 是…的, câu phản vấn…"},{"id":"expand","zh":"扩写 / 完成句子","vi":"Mở rộng & hoàn thành câu","desc":"Dùng từ cho sẵn mở rộng câu, hoặc viết tiếp cho trọn câu."}],"lessons":{"1":"“的、地、得”分析","2":"“了、着、过”分析","3":"“是、有”分析","4":"“把、被”分析","5":"结果、趋向、可能补语分析","6":"程度(情态)、介宾补语分析","7":"时量、动量、数量补语分析","8":"兼语句、连动句、存现句分析","9":"比较句分析","10":"反问句、疑问代词活用分析","11":"复合趋向补语的引申用法分析","12":"名词、动词、形容词分析","13":"数量词语分析","14":"综合测验","15":"摸底测验"},"items":[{"lesson":1,"num":1,"stem":"在朋友A帮助B下，我终于克服了困难C，取得了十分D理想的成绩。","word":"的","options":null,"answer":"A","analysis":"看到“的”以后，首先应该在句子里找名词，“理想”只是形容词，因为前边有“十分”，当然不能加“的”。“在……下”是介词结构，中间应该是名词，但“帮助”是动词，只有把“的”放在A处，“帮助”才能具有名词的性质。","id":"q0001","cat":"pos","section":"语词分析","bookPage":9,"key":"yuci-1--1"},{"lesson":1,"num":2,"stem":"他是A我们学校去年B评出的C汉语D教师。","word":"优秀的","options":null,"answer":"C","analysis":"“优秀的”应该放在名词之前，但“汉语”与“教师”之间一般不再插入其他成分。C是唯一正确的位置。","id":"q0002","cat":"pos","section":"语词分析","bookPage":9,"key":"yuci-1--2"},{"lesson":1,"num":3,"stem":"到A中国以后你B已经C几次D病了，一定要注意锻炼身体。","word":"得","options":null,"answer":"C","analysis":"“得”除了做助词，还可以做动词。“得”的普通动词的用法最适合这个句子的情况，结构助词与能愿动词都不合适。(“几次”作动量补语应该在动词“得”之后，因此，C是唯一正确的答案。","id":"q0003","cat":"pos","section":"语词分析","bookPage":9,"key":"yuci-1--3"},{"lesson":1,"num":4,"stem":"北方A人B总是不喜欢C南方人D习惯一—先喝汤后吃饭。","word":"的","options":null,"answer":"D","analysis":"“的”一般应该位于名词之前，因此，有的学生选择A作为正确答案，但是，与后边的“南方人”一样，“北方人”也应该是一个不可分的整体，那么，选择A当然是错误的。D是正确的答案。","id":"q0004","cat":"pos","section":"语词分析","bookPage":9,"key":"yuci-1--4"},{"lesson":1,"num":5,"stem":"临行前，妈妈把她为我A准备的干粮B一袋一袋C放在我的D旅行袋里。","word":"地","options":null,"answer":"C","analysis":"“地”在句子中必须用在动词之前，而句子中A、C、D后边都是动词，这很可能会让同学们觉得不容易。其实，D后边的“旅行”与“袋”是一个不能分开的名词，前边的“我的”是它们的定语；A前边的“为我”是“准备”的状语，同样不能插入“地”，因此只有C才是唯一正确的答案。","id":"q0005","cat":"pos","section":"语词分析","bookPage":10,"key":"yuci-1--5"},{"lesson":1,"num":6,"stem":"上大学A时，晚上在教室里B学习C学生总能取得好D成绩。","word":"的","options":null,"answer":"C","analysis":"A是错误的选择，因为“…时”、“.…的时候”才是正确的格式。D不能用“的”，因为单音节形容词修饰名词不用“的”。只有C的前后才符合使用“的”的要求。","id":"q0006","cat":"pos","section":"语词分析","bookPage":10,"key":"yuci-1--6"},{"lesson":1,"num":7,"stem":"中国建成了A世界上B高速铁路网，C已经取代了D日本。","word":"最大的","options":null,"answer":"B","analysis":"“世界”只有一个，“日本”同样只有一个，都不能用“大、小”来加以区别，当然就不能用“最大的”来修饰。“高速铁路网”却可以有很多个，因此，B是唯一正确的选择。","id":"q0007","cat":"pos","section":"语词分析","bookPage":10,"key":"yuci-1--7"},{"lesson":1,"num":8,"stem":"获得1999年A德国柏林B金熊奖C中国导演D张艺谋，开辟了中国电影进军欧洲市场的新局面。","word":"的","options":null,"answer":"C","analysis":"从表面上看，A、B、C、D四个地方都可以用“的”，但仔细分析你会发现，只有C才是最应该用“的”的地方。因为前边的“获得……金熊奖”是动宾结构，做后边“中国导演张艺谋”的定语。","id":"q0008","cat":"pos","section":"语词分析","bookPage":10,"key":"yuci-1--8"},{"lesson":1,"num":9,"stem":"你们看A，马海亮B今天穿得漂漂亮亮C，准是又有什么D喜事了。","word":"的","options":null,"answer":"C","analysis":"汉语双音节形容词重叠以后，在句子中做定语、补语或谓语时，后边一般应该加“的”。请参考第十二课的介绍。正确答案当然是C。","id":"q0009","cat":"pos","section":"语词分析","bookPage":10,"key":"yuci-1--9"},{"lesson":1,"num":10,"stem":"我要买A一条B跟你那条颜色C一样D裙子。","word":"的","options":null,"answer":"D","analysis":"句子中“跟…一样”是比较的形式，属于介宾结构，做“裙子”的定语时，它们之间应该加“的”。其他位置不合适。","id":"q0010","cat":"pos","section":"语词分析","bookPage":10,"key":"yuci-1--10"},{"lesson":1,"num":11,"stem":"根据国家统计局所做＿＿＿统计，2010年北京的人均GDP已经达到了8000美元。","word":null,"options":{"A":"的","B":"地","C":"得","D":"过"},"answer":"A","analysis":"介词“根据”与动词“统计”组成介宾词组在句子中做状语，但汉语语法要求介词的宾语一般应该是名词，“的”恰恰起到了让动词变成名词的作用。","id":"q0011","cat":"choice","section":"语词分析","bookPage":11,"key":"yuci-1--11"},{"lesson":1,"num":12,"stem":"一个30多岁的妇女被关在终日不见阳光的小木屋里，＿＿＿到了非人的待遇。","word":null,"options":{"A":"由","B":"受","C":"得","D":"遇"},"answer":"B","analysis":"该是具体的东西或“帮助、支持、称赞”一类比较积极的词语，不能是“非人的待遇”。“受到”的宾语既可以是比较积极的，如“表扬、称赞、欢迎”等，也可以是比较消极的，如“打击、批评”等。正确答案是B。","id":"q0012","cat":"choice","section":"语词分析","bookPage":11,"key":"yuci-1--12"},{"lesson":1,"num":13,"stem":"唉，你这套西装真是与众不同，可以告诉我在哪个商店买＿＿＿吗？","word":null,"options":{"A":"的","B":"了","C":"地","D":"过"},"answer":"A","analysis":"汉语“是…·的”结构常常可以不用“是”而只用“的”。其他三个词语都不能表达这个意思。有的同学喜欢用“了”，这是不对的！请记住：汉语表示强调的“是……的”结构句中，一定不能出现“了”！","id":"q0013","cat":"choice","section":"语词分析","bookPage":11,"key":"yuci-1--13"},{"lesson":1,"num":14,"stem":"那位朋友说＿＿＿好听的话让我心里特别舒服。","word":null,"options":{"A":"的","B":"地","C":"得","D":"了"},"answer":"A","analysis":"这个句子想告诉我们的是“说的话”，不是“说得好听”。因此，“的”才是唯一正确的选择。","id":"q0014","cat":"choice","section":"语词分析","bookPage":11,"key":"yuci-1--14"},{"lesson":1,"num":15,"stem":"谁说从山沟里走出来，＿＿＿孩子成不了才？","word":null,"options":{"A":"的","B":"得","C":"了","D":"地"},"answer":"A","analysis":"动词结构“走出来”做“孩子”的定语，因此正确答案应该是“的”。","id":"q0015","cat":"choice","section":"语词分析","bookPage":11,"key":"yuci-1--15"},{"lesson":2,"num":1,"stem":"火车快要A到B，你们赶快准备C准备D吧，不然就来不及了。","word":"了","options":null,"answer":"B","analysis":"“快要…了”是汉语中一个比较固定的表达即将发生的事情的语法形式。C和D两个位置从语气和语法上都不可以。B是唯一恰当的答案。","id":"q0016","cat":"pos","section":"语词分析","bookPage":18,"key":"yuci-2--1"},{"lesson":2,"num":2,"stem":"在茶馆儿里喝A茶B一边听音乐C，那多有D意思呀！","word":"着","options":null,"answer":"A","analysis":"“一边….一边.”这个语法形式，表示的是同时进行的两个动作，也可以把前一个动作当作后一个动作的伴随状态。因此，“喝着茶听音乐”最符合这个句子的表达形式。正确的答案只能是A。","id":"q0017","cat":"pos","section":"语词分析","bookPage":18,"key":"yuci-2--2"},{"lesson":2,"num":3,"stem":"昨天，我和他谈A谈B去C东京参加研讨会的情况D。","word":"了","options":null,"answer":"A","analysis":"“昨天”发生的事情，“谈谈”应该用“谈了谈”，关于动词重叠的具体用法，本教材将在第十二课中介绍。句子中在前边有“谈谈”的时候，B、D的位置上都不能用“了”。","id":"q0018","cat":"pos","section":"语词分析","bookPage":18,"key":"yuci-2--3"},{"lesson":2,"num":4,"stem":"楼里的垃圾堆A在那儿已经好几天B，始终没人打扫C，这是为什么D！","word":"了","options":null,"answer":"B","analysis":"“已经…了”的搭配，应该认真理解并掌握。A处不可以用“了”，因为“堆”与“在·”是动词与介宾补语的关系，在这种关系中，动词与介词常常结合得像一个词语一样，不能分开。C处不能用“了”，因为不能出现“没+动词+了”的形式。","id":"q0019","cat":"pos","section":"语词分析","bookPage":18,"key":"yuci-2--4"},{"lesson":2,"num":5,"stem":"他们去A找B我弟弟的时候，他正坐C在教室里上D课呢。","word":"着","options":null,"answer":"D","analysis":"一样，不可以插入其他词语；“去找…”是一个还没有结果的形式，加上“着”就破坏了句子的意思。“上着课呢”是唯一正确的表达形式。","id":"q0020","cat":"pos","section":"语词分析","bookPage":19,"key":"yuci-2--5"},{"lesson":2,"num":6,"stem":"今天我有A事B，不能跟你一起去C长城D。","word":"了","options":null,"answer":"D","analysis":"句子中有“不”这个否定副词时，“了”在句尾表示变化，原来应该是打算跟“你”去长城。其他位置都不可以。","id":"q0021","cat":"pos","section":"语词分析","bookPage":19,"key":"yuci-2--6"},{"lesson":2,"num":7,"stem":"你去A人民剧场B看C京剧D吗？来天餐 过","word":"过","options":null,"answer":"C","analysis":"与“了”一样，“过”作为动态助词，在连动句中只能放在第二个动词之后，不能放在第一个动词之后。","id":"q0022","cat":"pos","section":"语词分析","bookPage":19,"key":"yuci-2--7"},{"lesson":2,"num":8,"stem":"这本书我看A一个多星期B才看C完D。","word":"了","options":null,"answer":"A","analysis":"有的学生可能会选择D，但是这样做是错误的。因为，在汉语表达中，表示时间晚、慢的“才”的句子的句尾一般不用“了”。A才是最恰当的位置。","id":"q0023","cat":"pos","section":"语词分析","bookPage":19,"key":"yuci-2--8"},{"lesson":2,"num":9,"stem":"我在A北京看B两次C中国青年美术家的画展D。","word":"过","options":null,"answer":"B","analysis":"动态助词应该放在动词之后，这是非常清楚的事情。","id":"q0024","cat":"pos","section":"语词分析","bookPage":19,"key":"yuci-2--9"},{"lesson":2,"num":10,"stem":"参观A完展览，我们又去B小卖部C买D点东西。","word":"了","options":null,"answer":"D","analysis":"同样是连动句的问题。还应该注意：“了、过”在句子中间不能用在名词之后。A的位置同样不可以用“了”，因为，“参观完”是动补结构，它们中间不能插入其他成分。","id":"q0025","cat":"pos","section":"语词分析","bookPage":19,"key":"yuci-2--10"},{"lesson":2,"num":11,"stem":"很多少数民族的情歌特别是山歌，男女在唱歌的同时，还要做＿＿＿各种有趣的动作。","word":null,"options":{"A":"过","B":"着","C":"了","D":"得"},"answer":"B","analysis":"伴随“唱歌”出现的是“做着各种有趣的动作”。其他词语不能表达这样的意思。","id":"q0026","cat":"choice","section":"语词分析","bookPage":19,"key":"yuci-2--11"},{"lesson":2,"num":12,"stem":"“入世”以后，中国的市场经济迅速地发展，＿＿＿人们再一次看到了曙光。","word":null,"options":{"A":"着","B":"来着","C":"过","D":"的"},"answer":"A","analysis":"“入世”即“加入世界贸易组织(WTO)”从入世至今，再到永远，中国的经济都应该不断发展，只有A能够清楚地表达这样的意思。如果用“过”，完全不符合句子的意思，因为“过”指的是曾经发生的事情。","id":"q0027","cat":"choice","section":"语词分析","bookPage":20,"key":"yuci-2--12"},{"lesson":2,"num":13,"stem":"虽然是数九寒冬，但好像是春天＿＿＿，大街上很多姑娘都穿上裙子了。","word":null,"options":{"A":"的","B":"了","C":"着","D":"来"},"answer":"B","analysis":"“好像是春天了”说的是心理感觉上的变化，符合“了”的语法要求和意义。有的学习者用“来”构成“春天来”，但即使如此，也应该用“了”，即“好像是春天来了”。","id":"q0028","cat":"choice","section":"语词分析","bookPage":20,"key":"yuci-2--13"},{"lesson":2,"num":14,"stem":"我好像从来没有看见＿＿＿这么美丽的景色。","word":null,"options":{"A":"了","B":"着","C":"过","D":"地"},"answer":"C","analysis":"“从来没…”格式中动词之后一般应该用“过”，强调的是以前没有经历过的事情。“从来”这个词语我们将在下册介绍。","id":"q0029","cat":"choice","section":"语词分析","bookPage":20,"key":"yuci-2--14"},{"lesson":2,"num":15,"stem":"那天，我们是跟几个朋友一起走＿＿＿回学校的。","word":null,"options":{"A":"了","B":"着","C":"过","D":"的"},"answer":"B","analysis":"“走着”是“回学校”的方式，这是“着”的一项语法功能。","id":"q0030","cat":"choice","section":"语词分析","bookPage":20,"key":"yuci-2--15"},{"lesson":3,"num":1,"stem":"A富裕起来的农民B想到的第一件事C要改善D他们祖祖辈辈的生活环境。","word":"就是","options":null,"answer":"C","analysis":"这是一个比较复杂的判断句，因此，只有找到了主语、动词和宾语，才能给“就是”找到合适的位置。主语是“事”，宾语是“改善生活环境”，C是最恰当的位置。","id":"q0031","cat":"pos","section":"语词分析","bookPage":27,"key":"yuci-3--1"},{"lesson":3,"num":2,"stem":"降低关税以后A大量优质的商品B涌进国内市场，对消费者C十分D有利的。","word":"是","options":null,"answer":"C","analysis":"这个句子是用“是…·的”格式来表示说话者的观点，因此，只有C才能够表示这个意思。","id":"q0032","cat":"pos","section":"语词分析","bookPage":27,"key":"yuci-3--2"},{"lesson":3,"num":3,"stem":"自打A禁放鞭炮以后，B几个城市C过节的气氛像过去D那么热闹了。","word":"没有","options":null,"answer":"B","analysis":"“有、没有”在表示“比较、估计”的用法中，一般应该放在主语之前，如“有谁像你这么忙？”“没有什么地方比这儿好玩儿！”等。","id":"q0033","cat":"pos","section":"语词分析","bookPage":27,"key":"yuci-3--3"},{"lesson":3,"num":4,"stem":"这件事非常严重，A我们应该B征求一下C大家的意见再决定D？","word":"是不是","options":null,"answer":"D","analysis":"“是不是”表示疑问，在句子中的位置是主语之前、主语后谓语前、句子之后，分别问主语、谓语和全句。应该注意的是，问主语时，一般是问动作的发出者本身，如果主语比较长时，一般不会用在句首。这个句子就是这样，只能放在句尾。因此，D是唯一恰当的选择。","id":"q0034","cat":"pos","section":"语词分析","bookPage":28,"key":"yuci-3--4"},{"lesson":3,"num":5,"stem":"张老师见人就A说玛丽B聪明伶俐，活泼可爱，C很有前途的D好学生。","word":"是","options":null,"answer":"C","analysis":"有的学习者会选择A，也有人会选择B，但是，都错了，正确的选择应该是C。为什么呢？“玛丽聪明伶俐，活泼可爱”与“玛丽是很有前途的好学生”这两个句子共用一个主语，按照汉语语法要求，第二个句子可以承前省略主语“玛丽”，这就有了上面的句子。B处可以用“是”，但也可以不用，而C是必须用“是”的地方。只能选择C。","id":"q0035","cat":"pos","section":"语词分析","bookPage":28,"key":"yuci-3--5"},{"lesson":3,"num":6,"stem":"每个人都会对自己的故乡和母校＿＿＿十分深厚的感情。","word":null,"options":{"A":"怀有","B":"占有","C":"拥有","D":"具有"},"answer":"A","analysis":"与“十分深厚的感情”搭配的应该是“怀有”。“占有、拥有、具有”在这个句子中都不合适，因为“占有”是把别人的东西据为己有，“拥有”的宾语则是比较重大的事物，“具有”的宾语多是“风格、特色、性质”一类词语。","id":"q0036","cat":"choice","section":"语词分析","bookPage":28,"key":"yuci-3--6"},{"lesson":3,"num":7,"stem":"这份报告尖锐＿＿＿尖锐，可是对我们以后改善管理制度大有帮助。","word":null,"options":{"A":"一","B":"是","C":"了","D":"不"},"answer":"B","analysis":"D“A是A，可是…”是一个比较固定的句子形式，而且也十分口语化。记住这个形式会非常有用。人就应该知道如何面对自己的生活。A.在 B.什么C.有 D.是句子中似乎可以用“什么”和“有”，但是，无论从语气还是从语法上分析，都只能用“是”，因为只有“是”在这个句子里才能有“只要是”或“凡是”的意思，后面的“就”与“是”搭配表达意思。","id":"q0037","cat":"choice","section":"语词分析","bookPage":28,"key":"yuci-3--7"},{"lesson":3,"num":8,"stem":"＿＿＿人就应该知道如何面对自己的生活。","word":null,"options":{"A":"在","B":"什么","C":"有","D":"是"},"answer":"D","analysis":"句子中似乎可以用“什么”和“有”，但是，无论从语气还是从语法上分析，都只能用“是”，因为只有“是”在这个句子里才能有“只要是”或“凡是”的意思，后面的“就”与“是”搭配表达意思。","id":"q0038","cat":"choice","section":"语词分析","bookPage":28,"key":"yuci-3--8"},{"lesson":3,"num":9,"stem":"张老师，听说学校门口＿＿＿位老同学在等着您，快去看看吧。","word":null,"options":{"A":"一","B":"有","C":"是","D":"几"},"answer":"B","analysis":"与上面的句子比较接近，似乎“一、几”都可以用在句子中，但是，只有“有”才符合语法要求，即“有”构成的兼语句。","id":"q0039","cat":"choice","section":"语词分析","bookPage":28,"key":"yuci-3--9"},{"lesson":3,"num":10,"stem":"这种家具便宜金便宜，可是已经过时了。c. 一 D.是＿＿＿。","word":null,"options":{"A":"不","B":"了","C":"二","D":"是"},"answer":"D","analysis":"请参考第(7)题的分析。","id":"q0040","cat":"choice","section":"语词分析","bookPage":29,"key":"yuci-3--10"},{"lesson":4,"num":1,"stem":"你看A他说的，简直B大家的鼻子C都D气歪了！","word":"把","options":null,"answer":"B","analysis":"“把”的宾语一般应该是名词，而C、D的后边都不是名词，当然不符合语法要求，A处虽然符合语法，但是句子的意思不明确。正确的答案只能是B。","id":"q0041","cat":"pos","section":"语词分析","bookPage":34,"key":"yuci-4--1"},{"lesson":4,"num":2,"stem":"玛丽A昨天B又C约翰D气哭了。","word":"被","options":null,"answer":"C","analysis":"“被”同样应该放在名词之前，只有C符合语法和语义的要求。","id":"q0042","cat":"pos","section":"语词分析","bookPage":34,"key":"yuci-4--2"},{"lesson":4,"num":3,"stem":"你A怎么B把自行车C还给人家呀？要是耽误了人家D用该怎么办？","word":"没","options":null,"answer":"B","analysis":"按照汉语语法要求，在“把”字句中，否定副词和能愿动词都应该用在“把”字之前，因此，B是唯一恰当的选择。","id":"q0043","cat":"pos","section":"语词分析","bookPage":35,"key":"yuci-4--3"},{"lesson":4,"num":4,"stem":"你A出的这个字谜B早就已经C猜D出来了。","word":"被我","options":null,"answer":"C","analysis":"“被我”已经构成介宾的形式，在句子中就应该找与它们搭配的动词，C是最合适的位置。","id":"q0044","cat":"pos","section":"语词分析","bookPage":35,"key":"yuci-4--4"},{"lesson":4,"num":5,"stem":"任何人都不能以自己A中心，B不顾C别人的D反对与否。","word":"为","options":null,"answer":"A","analysis":"“以……为”是汉语中“把”字句的另一种书面表达形式，应该记住这个形式，这样，在需要的时候就会得心应手。","id":"q0045","cat":"pos","section":"语词分析","bookPage":35,"key":"yuci-4--5"},{"lesson":4,"num":6,"stem":"实行股份制以后，大刘仍然不是迟到就是早退，＿＿＿经理批评了一顿。","word":null,"options":{"A":"把","B":"为","C":"叫","D":"受"},"answer":"C","analysis":"主语大刘是“批评”的对象，即被动者。能够表示被动意义的词语是B、C、D，但符合语法要求的只有“叫”。因为“为…所……”是固定的格式，“受”后面的动词不能带补语。","id":"q0046","cat":"choice","section":"语词分析","bookPage":35,"key":"yuci-4--6"},{"lesson":4,"num":7,"stem":"12月5日是人们用自己的行动表示爱心的日子，＿＿＿称作“志愿者日”","word":null,"options":{"A":"被","B":"受","C":"让","D":"把"},"answer":"A","analysis":"“把、让”不能直接放在动词之前，“受”后的动词不能带宾语。A是唯一正确的选择。","id":"q0047","cat":"choice","section":"语词分析","bookPage":35,"key":"yuci-4--7"},{"lesson":4,"num":8,"stem":"为了保证游客的合法权益不＿＿＿侵害，国家旅游局决定取消团进团出游。","word":null,"options":{"A":"把","B":"让","C":"由","D":"受"},"answer":"D","analysis":"A、B、C三个介词都不能直接用在动词之前，只有D符合语法要求。","id":"q0048","cat":"choice","section":"语词分析","bookPage":35,"key":"yuci-4--8"},{"lesson":4,"num":9,"stem":"她总是喜欢＿＿＿她认为重要的内容用七彩的颜色标记出来。","word":null,"options":{"A":"让","B":"在","C":"把","D":"给"},"answer":"C","analysis":"“在”后应该是时间或处所，“给”后一般是表示人的词语，“让”组成的应该是被动句，都不符合句子的要求。只有“把”最恰当。","id":"q0049","cat":"choice","section":"语词分析","bookPage":35,"key":"yuci-4--9"},{"lesson":4,"num":10,"stem":"在那次客机坠毁的事故中，有数百人＿＿＿夺去了生命，损失极为惨重。","word":null,"options":{"A":"让","B":"把","C":"叫","D":"被"},"answer":"D","analysis":"只有“被”可以直接用在动词之前，其他词语没有这个功能。","id":"q0050","cat":"choice","section":"语词分析","bookPage":36,"key":"yuci-4--10"},{"lesson":4,"num":11,"stem":"学生的期中和期末考试大都＿＿＿课本的内容为基础，HSK则不是这样。","word":null,"options":{"A":"把","B":"用","C":"以","D":"拿"},"answer":"C","analysis":"是汉语“把”字句的另外一种表达形式，必须记住。","id":"q0051","cat":"choice","section":"语词分析","bookPage":36,"key":"yuci-4--11"},{"lesson":4,"num":12,"stem":"看完这部电影，我们全班同学都＿＿＿深深地感动了。","word":null,"options":{"A":"让","B":"叫","C":"被","D":"把"},"answer":"C","analysis":"“让、叫、被”的意义相同，但在用法上却有不同之处，即“让、叫”作介词时后边必须有名词，而“被”却可以直接用在动词之前。","id":"q0052","cat":"choice","section":"语词分析","bookPage":36,"key":"yuci-4--12"},{"lesson":4,"num":13,"stem":"我今天上午刚刚买来的一辆新自行车就个借走了。","word":null,"options":{"A":"被","B":"把","C":"让","D":"为"},"answer":"A","analysis":"同样是“被”与其他介词在用法上的不同。“借”是动词，能够直接用在它前边的只能是“被”。偷走了。","id":"q0053","cat":"choice","section":"语词分析","bookPage":36,"key":"yuci-4--13"},{"lesson":4,"num":14,"stem":"有一次坐公共汽车时，我的钱包不知道什么时候＿＿＿偷走了。","word":null,"options":{"A":"叫","B":"被","C":"使","D":"把"},"answer":"B","analysis":"参考前边句子的分析。","id":"q0054","cat":"choice","section":"语词分析","bookPage":36,"key":"yuci-4--14"},{"lesson":4,"num":15,"stem":"不知到底过了多久，他＿＿＿一阵远处的雷声所惊醒。","word":null,"options":{"A":"把","B":"让","C":"被","D":"使"},"answer":"C","analysis":"“被……所”是比较固定的被动形式。另外，在这个句子中，“他”是被动的，其他词语都没有被动的意义。","id":"q0055","cat":"choice","section":"语词分析","bookPage":36,"key":"yuci-4--15"},{"lesson":5,"num":1,"stem":"妈妈从A我们姐妹俩抹B的废纸中认真C地挑出可以再次利用D的钉成本子给我们用。","word":"来","options":null,"answer":"B","analysis":"有的同学可能选择A，组成“从来”，但“从来”的后边应该是动词性词语，而且还应该有“没、不”跟它搭配，因此不合适。","id":"q0056","cat":"pos","section":"语词分析","bookPage":43,"key":"yuci-5--1"},{"lesson":5,"num":2,"stem":"再A回B去C的时候，我一定给父母带些这里D的特产。","word":"广州","options":null,"answer":"B","analysis":"句子中动词既有宾语又有趋向补语，而宾语是处所词语时，宾语必须放在“来、去”之前。这是汉语语法不变的规则。","id":"q0057","cat":"pos","section":"语词分析","bookPage":43,"key":"yuci-5--2"},{"lesson":5,"num":3,"stem":"哎，张同，你买A的那本书B我已经给你放回C书架上D了。","word":"来","options":null,"answer":"A","analysis":"C、D都是错误的选择，即使D处可以用一个表示趋向的词语，也应该是“去”而不是“来”。“买”的结果或趋向应该是“来”。","id":"q0058","cat":"pos","section":"语词分析","bookPage":43,"key":"yuci-5--3"},{"lesson":5,"num":4,"stem":"在国内我A学过几年汉语，听B懂的地方我C看字幕就D可以了。","word":"不","options":null,"answer":"B","analysis":"A处不能用“不”，因为“学过”的否定形式只能是“没”。C、D同样不能加上“不”，因为那样会破坏句子真实意思的表达。","id":"q0059","cat":"pos","section":"语词分析","bookPage":43,"key":"yuci-5--4"},{"lesson":5,"num":5,"stem":"要把这些东西搬A进去，我一个人搬B不动，你C帮帮D我。","word":"得","options":null,"answer":"C","analysis":"A不可以，因为在“把”字句中动词不能带可能补语。B、D同样不能放“得”。其实，“得”这里是能愿动词，即“应该”。","id":"q0060","cat":"pos","section":"语词分析","bookPage":44,"key":"yuci-5--5"},{"lesson":5,"num":6,"stem":"咱们已经爬了三个小时了，我都快要爬不＿＿＿了，歇会儿吧。","word":null,"options":{"A":"上","B":"起","C":"动","D":"去"},"answer":"C","analysis":"“爬了三个小时”的结果是太累了，而“累”同时又是“爬不动”的原因。","id":"q0061","cat":"choice","section":"语词分析","bookPage":44,"key":"yuci-5--6"},{"lesson":5,"num":7,"stem":"在全世界范围内抵御金融风暴，＿＿＿各个国家的密切合作。","word":null,"options":{"A":"不离开","B":"没离开","C":"离不开","D":"能离不开"},"answer":"C","analysis":"“离开”的可能补语的否定形式只能是“离不开”，而“没离开”只是“离开”的一般否定形式，不符合句子本身的意思。","id":"q0062","cat":"choice","section":"语词分析","bookPage":44,"key":"yuci-5--7"},{"lesson":5,"num":8,"stem":"今年冬天一场雪都没有下，让人怎么能够＿＿＿呢！","word":null,"options":{"A":"兴奋不起来","B":"兴奋得起来","C":"兴奋得出来","D":"兴奋的上来"},"answer":"B","analysis":"句子中的“怎么…呢？”是反问句的形式，表示的是否定的意思，因此，应该用可能补语的肯定形式。关于反问句可以参考第十课的介绍。另外，“起来”表示的是“兴奋”开始并继续的意思，“出来”不能表达这样的效果。","id":"q0063","cat":"choice","section":"语词分析","bookPage":44,"key":"yuci-5--8"},{"lesson":5,"num":9,"stem":"两年的朝夕相处，我渐渐地爱＿＿＿了他，可我怎么跟他开口呢？","word":null,"options":{"A":"着","B":"过","C":"开","D":"上"},"answer":"D","analysis":"“爱上他”是对他产生了“爱”的结果，其他词语不能表达相同的意思。","id":"q0064","cat":"choice","section":"语词分析","bookPage":44,"key":"yuci-5--9"},{"lesson":5,"num":10,"stem":"任何动植物的生长都＿＿＿空气、阳光和水，人当然也不例外。","word":null,"options":{"A":"不离开","B":"能不离开","C":"能离不开","D":"离不开"},"answer":"D","analysis":"这个句子与第(7)个句子相同，只能用“离不开”。","id":"q0065","cat":"choice","section":"语词分析","bookPage":44,"key":"yuci-5--10"},{"lesson":5,"num":11,"stem":"这次考试有几个问题我＿＿＿，恐怕很难通过了。","word":null,"options":{"A":"回答没对","B":"没回答对","C":"不回答对","D":"回不答对"},"answer":"B","analysis":"“回答对”是结果补语的表达形式，对结果补语进行否定，只能在结果补语前加“没”，因为这个结果是已经存在的事情。","id":"q0066","cat":"choice","section":"语词分析","bookPage":44,"key":"yuci-5--11"},{"lesson":5,"num":12,"stem":"我们班的教室不大，一下子来这么多听课的人恐怕坐不＿＿＿。","word":null,"options":{"A":"起","B":"进","C":"住","D":"下"},"answer":"D","analysis":"“坐不下”是“不能容纳”的意思。其他词语不能清楚地表达这个意思。","id":"q0067","cat":"choice","section":"语词分析","bookPage":45,"key":"yuci-5--12"},{"lesson":5,"num":13,"stem":"他很喜欢中国的山水画儿、人物画儿，打算买几幅带＿＿＿。","word":null,"options":{"A":"出来","B":"进去","C":"过来","D":"回去"},"answer":"D","analysis":"根据句子意思分析，“他”应该是外国人，在中国生活，因此，在中国买了东西当然应该是“带回去”。动作的趋向离开说话人应该用“…去”","id":"q0068","cat":"choice","section":"语词分析","bookPage":45,"key":"yuci-5--13"},{"lesson":5,"num":14,"stem":"他的包不知道什么时候从自行车上掉＿＿＿了。","word":null,"options":{"A":"出来","B":"起来","C":"出去","D":"下来"},"answer":"D","analysis":"到外或从外到里，不符合句子的意思。“起来”表示向上，更不能与“掉”搭配使用。","id":"q0069","cat":"choice","section":"语词分析","bookPage":45,"key":"yuci-5--14"},{"lesson":5,"num":15,"stem":"我们都说不喝了，他把最后一口啤酒喝＿＿＿了。","word":null,"options":{"A":"下来","B":"下去","C":"进来","D":"起来"},"answer":"B","analysis":"“喝”这个动作表示从口腔到肚子里的过程，应该是向“下”的趋向，因此，只有“喝下去”才符合语法要求。“进来”如果是“进去”，在句子中也同样可以表达清楚意思。","id":"q0070","cat":"choice","section":"语词分析","bookPage":45,"key":"yuci-5--15"},{"lesson":6,"num":1,"stem":"A每天B早晚刷牙有利C口腔健康，应该养成D这种良好的习惯。","word":"于","options":null,"answer":"C","analysis":"利”。类似的用法还有“有益于、有害于、有助于、有损于”等。","id":"q0071","cat":"pos","section":"语词分析","bookPage":51,"key":"yuci-6--1"},{"lesson":6,"num":2,"stem":"坐落A北五环B路上的奥海大厦，是为C2008年奥运会专门设计D建筑的。","word":"在","options":null,"answer":"A","analysis":"“坐落”与“北五环路上”之间必须有一个介词才能清楚地表达意思，因此，A是唯一恰当的选择。C不可以。","id":"q0072","cat":"pos","section":"语词分析","bookPage":52,"key":"yuci-6--2"},{"lesson":6,"num":3,"stem":"今年2月14日，当我接A到男朋友B送给我的玫瑰花时，我都C高兴D不知道怎么办了。","word":"得","options":null,"answer":"D","analysis":"是谓语与程度补语的标志。A处不能用“得”，因为那样将组成可能补语，与句子所要表达的意思不符。","id":"q0073","cat":"pos","section":"语词分析","bookPage":52,"key":"yuci-6--3"},{"lesson":6,"num":4,"stem":"她对你买的这件衣服A喜欢得B，你又是她C好朋友，送给她D好吧？","word":"很","options":null,"answer":"B","analysis":"A、C、D似乎都可以用“很”，但是，只有“喜欢得”后边才必须加上“很”，否则句子不能清楚地表达意思。“喜欢得很”，就是“很喜欢”的意思。","id":"q0074","cat":"pos","section":"语词分析","bookPage":52,"key":"yuci-6--4"},{"lesson":6,"num":5,"stem":"我是A南方来到B北京的，刚来C这里时D不太习惯。","word":"从","options":null,"answer":"A","analysis":"“从”后边应该有时间或处所名词，再后边的动词常常是“来、去、到、买来、带来”等动词，因此，只有A最合适。","id":"q0075","cat":"pos","section":"语词分析","bookPage":52,"key":"yuci-6--5"},{"lesson":6,"num":6,"stem":"木村小姐正站＿＿＿树下等咱们呢，咱们赶快过去吧。","word":null,"options":{"A":"着","B":"立","C":"住","D":"在"},"answer":"D","analysis":"句子中“站”与“树下”之间只能加一个介词，而四个备选答案中只有“在”符合这个标准，其他词语都不合适。","id":"q0076","cat":"choice","section":"语词分析","bookPage":52,"key":"yuci-6--6"},{"lesson":6,"num":7,"stem":"你看，他高兴得＿＿＿不知道是上楼好还是下楼好了。","word":null,"options":{"A":"才","B":"还","C":"都","D":"就"},"answer":"C","analysis":"句子中“高兴”的程度很高，高到“已经不知道……好了”。只有“都”具有“已经”的意思，同时可以表示程度高，其他词语都不合适。","id":"q0077","cat":"choice","section":"语词分析","bookPage":52,"key":"yuci-6--7"},{"lesson":6,"num":8,"stem":"北京的房价越来越贵，贵＿＿＿简直让人不敢相信了。","word":null,"options":{"A":"的","B":"得","C":"了","D":"地"},"answer":"B","analysis":"“让人不敢相信”是句子中“房价贵”的程度和结果，因此，只能选择连接谓语与补语的“得”。","id":"q0078","cat":"choice","section":"语词分析","bookPage":53,"key":"yuci-6--8"},{"lesson":6,"num":9,"stem":"竞选双方的矛盾异常激烈，已经处＿＿＿一触即发的状态。","word":null,"options":{"A":"自","B":"在","C":"从","D":"向"},"answer":"B","analysis":"介词“从”不能用在动词“处”的后边，“自、向”后边一般跟时间和处所词语，只有“在”可以跟比较抽象的词语“状态”等。","id":"q0079","cat":"choice","section":"语词分析","bookPage":53,"key":"yuci-6--9"},{"lesson":6,"num":10,"stem":"本公司产品不仅享誉全国，还销＿＿＿欧美数十个国家。","word":null,"options":{"A":"自","B":"于","C":"在","D":"往"},"answer":"D","analysis":"备选的四个词语后都可以是“欧美…·国家”，而句子中的动词“销”后只能跟具有动态性质的介词“往”才符合句子的意思。","id":"q0080","cat":"choice","section":"语词分析","bookPage":53,"key":"yuci-6--10"},{"lesson":7,"num":1,"stem":"西直门A向北十B公里C处，有一片D新建的住宅，那就是回龙观社区。","word":"多","options":null,"answer":"B","analysis":"“十多公里”是11～19公里，是一个大概的数量。如果用“十公里多”范围较小，不符合实际情况。因此正确位置只能是B。","id":"q0081","cat":"pos","section":"语词分析","bookPage":59,"key":"yuci-7--1"},{"lesson":7,"num":2,"stem":"为了学习汉语、了解中国，我们A已经B来C北京D了。","word":"两年半","options":null,"answer":"D","analysis":"与一般动词带时量补语不同，“来、去”带时量补语同时又有处所宾语时，宾语应该放在时量补语之前。其他动词带时量补语再带宾语时，除个别代词宾语外，宾语都应该位于时量补语之后。例如“学了两年汉语”、“看了一个小时电视”、“等了他二十分钟”。","cat":"pos","section":"语词分析","bookPage":59,"key":"yuci-7--2"},{"lesson":7,"num":3,"stem":"这篇文章里不懂A的词语太多了，我读B了20C遍才读D懂。","word":"来","options":null,"answer":"C","analysis":"“来”与“多、几”在表示大概的数量时的用法基本相同，常常可以用在表示整体数量的“十、百、千、万、亿”等词语之后，量词之前。","id":"q0082","cat":"pos","section":"语词分析","bookPage":60,"key":"yuci-7--3"},{"lesson":7,"num":4,"stem":"今天A我B来C找了你D，你都不在宿舍。","word":"三趟","options":null,"answer":"D","analysis":"动量补语“三趟”应该放在代词宾语“你”之后。其他位置都是错误的。","id":"q0083","cat":"pos","section":"语词分析","bookPage":60,"key":"yuci-7--4"},{"lesson":7,"num":5,"stem":"刚才我A只吃了十B个C饺子，现在还有D点儿饿。","word":"几","options":null,"answer":"B","analysis":"请参考上面“多、来”的分析。另外，“几”不像“多、来”那样，可以在表示零数时放在量词之后，如“三块多钱，四个来月”，而只能用在表示整体数量的“十、百、千”等词语之后，量词之前。","id":"q0084","cat":"pos","section":"语词分析","bookPage":60,"key":"yuci-7--5"},{"lesson":7,"num":6,"stem":"你们究竟去哪儿了？小王已经A在这儿B等了C你们D了。","word":"半个多小时","options":null,"answer":"D","analysis":"在句子中，表示时段的时间词语一般在句子中动词之后作时量补语，但应该注意的是，如果动词带代词宾语时，时量补语一般应该放在代词宾语之后。句子中只有D符合语法的要求。","id":"q0085","cat":"pos","section":"语词分析","bookPage":60,"key":"yuci-7--6"},{"lesson":7,"num":7,"stem":"王小丽A决定每星期B都要跟朋友们一起去C吃D饭。","word":"一次","options":null,"answer":"D","analysis":"“一次”在句子中作动量补语，同样应该放在动词之后，宾语之前。D是唯一恰当的位置。B和C是不少学习者喜欢的位置，但是不正确。","id":"q0086","cat":"pos","section":"语词分析","bookPage":60,"key":"yuci-7--7"},{"lesson":7,"num":8,"stem":"当时，这个小城市只有十四A万人，二十个B企业单位，居民对粮食的需求量是每年两千五百C万公斤D。","word":"多","options":null,"answer":"C","analysis":"汉语中表示概数的“多、来、几”一般应该放在“十、百、千、万”等词语之后。但是，句子中“万”其实是作为一个量词出现的，而且在“万”的后面也没有可以选择的位置，因此，只有C才是最正确的位置。","id":"q0087","cat":"pos","section":"语词分析","bookPage":60,"key":"yuci-7--8"},{"lesson":7,"num":9,"stem":"我看你们两个A还是应该B互相作C让步D。","word":"一些","options":null,"answer":"C","analysis":"句子中“作让步”是动宾结构，数量补语“一些”应该放在动补之间。如果选择D则是错误的，因为“让步”是一个离合词语，即使“一些”可以作它们的补语，也应该放在它们之间，而不是它们的后边。","id":"q0088","cat":"pos","section":"语词分析","bookPage":60,"key":"yuci-7--9"},{"lesson":7,"num":10,"stem":"经理让A小赵明天早上尽快到B公司C拿D资料。","word":"一下","options":null,"answer":"D","analysis":"之后，不能放在第一个动作的动词之后。","id":"q0089","cat":"pos","section":"语词分析","bookPage":61,"key":"yuci-7--10"},{"lesson":7,"num":11,"stem":"每天晚饭以后我都要和老伴儿出去＿＿＿，生命在于运动嘛！","word":null,"options":{"A":"散步一会儿","B":"散散一会儿步","C":"散一会儿步","D":"一会儿散步"},"answer":"C","analysis":"在离合动词带时量补语时，离合动词跟动宾词组一样，一般应该分开，即时量补语应该在离合动词之间。其他用法都是错误的。","id":"q0090","cat":"choice","section":"语词分析","bookPage":61,"key":"yuci-7--11"},{"lesson":7,"num":12,"stem":"他仔细辨认了＿＿＿，终于认出那就是他丢失多年的古董。","word":null,"options":{"A":"一趟","B":"一阵","C":"一顿","D":"一些"},"answer":"B","analysis":"“一阵”可以表示比较短而快的时间，如“一阵风、一阵雨”，也可以表示比较长甚至很长的时间，如“年轻时我在北京生活过一阵”。上面句子中的“一阵”表示的是比较长的时间，句子后边的“终于”也说明了这一点。其他几个词中“一些”是数量，不说明时间的长短；“一顿”则常常与“吃饭、挨打、吵架”相关联；“一趟”只与“来、去、走”等搭配。","id":"q0091","cat":"choice","section":"语词分析","bookPage":61,"key":"yuci-7--12"},{"lesson":7,"num":13,"stem":"他的个头只比你大＿＿＿你们两个搭配挺合适的。","word":null,"options":{"A":"一次","B":"一天","C":"一点","D":"一遍"},"answer":"C","analysis":"在比较句里，时量补语可以是比较具体的数量，也可以是比较模糊的数量，一点”就是比较模糊的数量。其他几个词语都不能用在这个句子中。","id":"q0092","cat":"choice","section":"语词分析","bookPage":61,"key":"yuci-7--13"},{"lesson":7,"num":14,"stem":"我只不过是轻轻碰了他，＿＿＿没想到他竟然发那么大火儿。","word":null,"options":{"A":"一头","B":"一下","C":"一脚","D":"一把"},"answer":"B","analysis":"“轻轻地碰一下”是最好的搭配，而“一头、一脚、一把”虽然也都可以作为临对的动量补语，但在这个句子中都不能清楚地表达意思。","id":"q0093","cat":"choice","section":"语词分析","bookPage":61,"key":"yuci-7--14"},{"lesson":7,"num":15,"stem":"在这里我们只有＿＿＿同事，还不能顺利开展工作。","word":null,"options":{"A":"十个多","B":"十多个","C":"十个来","D":"十个几"},"answer":"B","analysis":"“同事”作为人，是不可分的，因此不能用“十个多”，只能用“十多个”“十个来”和“十个几”都不是正确的形式，同样不可能清楚地表达意思。","id":"q0094","cat":"choice","section":"语词分析","bookPage":61,"key":"yuci-7--15"},{"lesson":8,"num":1,"stem":"许多人由于A喝水少B而C身体D积累了过多的脂肪。","word":"使","options":null,"answer":"C","analysis":"看到这样的句子，首先应该很快找到“使”能够放的位置。按照汉语语法要“使”的位置应该在名词之前，因为无论在一般的句子中，还是在兼语句中，“使”应该用在表示人或事物的词语前。而这个句子中，只有C才是恰当的位置，其他位置府合要求。","id":"q0095","cat":"pos","section":"语词分析","bookPage":69,"key":"yuci-8--1"},{"lesson":8,"num":2,"stem":"现在我A给大家介绍B一下C这尊雕像的来历，请大家D安静。","word":"来","options":null,"answer":"A","analysis":"“来”在这个句子中没有实在的意义，即使不用，也不会影响我们对句子的理在汉语口语表达中，人们常常在表示人的主语之后加上“来”，以便使语言显得柔从而避免生硬。如“你来给大家谈谈”、“下面请张老师来介绍一下期末考试的情况”等。","id":"q0096","cat":"pos","section":"语词分析","bookPage":69,"key":"yuci-8--2"},{"lesson":8,"num":3,"stem":"你A这样做太B人失望了，以后C朋友们还怎么跟你D打交道啊！","word":"令","options":null,"answer":"B","analysis":"与“使”的用法一样，“令”的后边也应该是表示人的词语，而且与这个人相关的动词、形容词则常常是“高兴、失望、生气、紧张、感兴趣”等。","id":"q0097","cat":"pos","section":"语词分析","bookPage":70,"key":"yuci-8--3"},{"lesson":8,"num":4,"stem":"新房里的东西A非常整洁漂亮，墙上B有几幅画，床头C新郎新娘的大幅D婚纱照。","word":"摆着","options":null,"answer":"C","analysis":"存现句的动词之前一定是表示处所的词语，动词之后是存在的事物，句子中符合这两个条件的只有C。","id":"q0098","cat":"pos","section":"语词分析","bookPage":70,"key":"yuci-8--4"},{"lesson":8,"num":5,"stem":"我们都曾经坐A飞机去B海南旅行C一个星期D。","word":"过","options":null,"answer":"C","analysis":"这个句子中，会有同学被迷惑而选择A，因为在“了、着、过”一课中我们介绍过，句子中有状语“曾经”时，后边的动词一般应该带“过”。但是，必须注意，这个句子中，“坐飞机”并不是最主要的动作，只是“去海南旅行”的方式状语，当然不能用“过”。也有同学会选择B，但同样应该注意的是，连动句的第一个动词不能带“了、过”，这两个词语只能放在连动句的后一个动词之后。因此，正确答案只能是C。","id":"q0099","cat":"pos","section":"语词分析","bookPage":70,"key":"yuci-8--5"},{"lesson":8,"num":6,"stem":"科学的管理方法和先进的技术，＿＿＿我们公司很快发生了转机。","word":null,"options":{"A":"叫","B":"使","C":"把","D":"为"},"answer":"B","analysis":"在兼语句中，“请、让、叫”的主语多是人，而“使、令”的主语既可以是人，也可以是表示事、物的词语。备选答案中其他几个词语都不符合句子的意义和语法要求。","id":"q0100","cat":"choice","section":"语词分析","bookPage":70,"key":"yuci-8--6"},{"lesson":8,"num":7,"stem":"春节将至，不少商家纷纷打折促销，这既让商家得到了利益，也＿＿＿消费者得到了实惠。","word":"消费者得到","options":{"A":"使","B":"为","C":"给","D":"向"},"answer":"A","analysis":"句子中“打折促销”是“让商家得到利益，消费者得到实惠”的根本。而复句结构“既……也.…”要求前后两个格式相同，前边是“….让.…”，后边只能选择“…使……”，因为“让、使”都可以用在兼语句中。其他几个不能有这样的搭配。","id":"q0101","cat":"choice","section":"语词分析","bookPage":70,"key":"yuci-8--7"},{"lesson":8,"num":8,"stem":"前不久发生的那场无情的大火，有几十个年轻人＿＿＿夺去了生命。","word":null,"options":{"A":"叫","B":"让","C":"使","D":"被"},"answer":"D","analysis":"备选答案中“让、叫、使”不管是动词还是介词，其后都必须有名词性词语与之配合，而句子中的“夺去”是动词，因此，正确答案只能是“被”，因为“被”既可以引出动作的发出者，也可以直接用在动词之前。","id":"q0102","cat":"choice","section":"语词分析","bookPage":70,"key":"yuci-8--8"},{"lesson":8,"num":9,"stem":"每当遇到这种事情的时候，总会＿＿＿人感到无所适从。","word":null,"options":{"A":"给","B":"被","C":"让","D":"请"},"answer":"C","analysis":"这明显是一个兼语句，因此A、B都不合适。“请”在兼语句中多表示比较客气的语气，而这个句子没有任何客气的意思。唯一正确的答案是C。","id":"q0103","cat":"choice","section":"语词分析","bookPage":71,"key":"yuci-8--9"},{"lesson":8,"num":10,"stem":"北京大学在清华大学的西边，她后边＿＿＿圆明园遗址公园。","word":null,"options":{"A":"有","B":"在","C":"是","D":"放着"},"answer":"C","analysis":"四个备选答案都可以用在表示存在的句子中，但是它们的分工不同。“有”的宾语常常是不确定的事物；“在”组成的句子的结构形式与“是、有”正好相反，即事物在前，处所在后；句子中的“圆明园遗址公园”不能随意被“放”在什么地方。因此，正编答案只能是C，“是”的宾语应该是确定的事物。","id":"q0104","cat":"choice","section":"语词分析","bookPage":71,"key":"yuci-8--10"},{"lesson":8,"num":11,"stem":"经常发生这样的事情，简直太＿＿＿人失望了。","word":null,"options":{"A":"让","B":"被","C":"给","D":"向"},"answer":"A","analysis":"备选项中只有“让”具有祈使意义，和“令”一样，“让”的后边应该跟“人”或表示人的词语。而“令人高兴”和“让人高兴”都是比较常见的表达形式。","id":"q0105","cat":"choice","section":"语词分析","bookPage":71,"key":"yuci-8--11"},{"lesson":8,"num":12,"stem":"我刚进家门，母亲就＿＿＿我去买东西。","word":null,"options":{"A":"让","B":"由","C":"被","D":"把"},"answer":"A","analysis":"“把、被”都不符合这个句子的意义，“由”有“让什么人做什么事”的用三，但不能构成兼语句。“让”才是最佳的选择。","id":"q0106","cat":"choice","section":"语词分析","bookPage":71,"key":"yuci-8--12"},{"lesson":8,"num":13,"stem":"这个结论不光是他本人，而且＿＿＿所有了解这一事件的人都难以接受。","word":null,"options":{"A":"把","B":"令","C":"被","D":"给"},"answer":"B","analysis":"同样是兼语句，同样应该使用具有使令意义的词语“令”。应该注意的是，让、叫”等词语在句子中的主语既可以是人，也可以是事物，而“令、使”的主语多为事物。","id":"q0107","cat":"choice","section":"语词分析","bookPage":71,"key":"yuci-8--13"},{"lesson":8,"num":14,"stem":"你快去＿＿＿小钱把那份合同送过来，越快越好。","word":null,"options":{"A":"要","B":"给","C":"使","D":"叫"},"answer":"D","analysis":"“叫、使”同样可以用在兼语句中，但“使”的主语多为事物，“叫”的主语一般应该是人，而且比较口语化。","id":"q0108","cat":"choice","section":"语词分析","bookPage":71,"key":"yuci-8--14"},{"lesson":8,"num":15,"stem":"你的话＿＿＿我想起了许多事情，特别是在海外留学那三年。","word":null,"options":{"A":"是","B":"由","C":"使","D":"给"},"answer":"C","analysis":"四个备选项中，只有“使”符合兼语句的要求。如何确定这个句子是兼语句，看看“我”后的“想”就可以了，因为“我”是“想”的主语。其他几个词语都不合适。","id":"q0109","cat":"choice","section":"语词分析","bookPage":72,"key":"yuci-8--15"},{"lesson":9,"num":1,"stem":"现在的工作A比以前B忙，所以C有时间D搞研究。","word":"不","options":null,"answer":"A","analysis":"在比较句中，否定词语应该放在“比”字前，不能放在表示区别的词语之前。还应该注意的是，有的学习者喜欢把“不”放在“有”前，构成“不有”，这是错误的。一定要记住：汉语中“有”的否定形式只能是“没有”，同时也要记住，“是”的否定形式只能是“不是”。","id":"q0110","cat":"pos","section":"语词分析","bookPage":78,"key":"yuci-9--1"},{"lesson":9,"num":2,"stem":"谁能想到，A三九天B比开春C还要暖和，这天气D怎么了？","word":"倒","options":null,"answer":"B","analysis":"副词“倒”强调与实际情况相反，应该放在“比”字前。关于“倒”的具体用法，我们还将在下册第三、四课介绍。","id":"q0111","cat":"pos","section":"语词分析","bookPage":79,"key":"yuci-9--2"},{"lesson":9,"num":3,"stem":"我也想A买一件B你C一样的毛衣，告诉我D你是在哪儿买的。","word":"跟","options":null,"answer":"B","analysis":"“跟…一样”中间应该有比较的内容，即名词性词语，“你的毛衣”中间不能插入其他成分，B是最正确的答案。","id":"q0112","cat":"pos","section":"语词分析","bookPage":79,"key":"yuci-9--3"},{"lesson":9,"num":4,"stem":"真没想到，你们俩，A弟弟B比C哥哥高D。","word":"倒","options":null,"answer":"B","analysis":"“倒”是副词，在句子中应该放在介词“比”之前。","id":"q0113","cat":"pos","section":"语词分析","bookPage":79,"key":"yuci-9--4"},{"lesson":9,"num":5,"stem":"随着社会的进步，人们的物质生活水平也＿＿＿高了。","word":null,"options":{"A":"很多","B":"越来越","C":"一些","D":"很大"},"answer":"B","analysis":"“越来越”有随时间的变化而变化的意义，相当于“一天比一天”，符合句子语法要求。A、C、D在这个句子中都不能做“高”的状语。","id":"q0114","cat":"choice","section":"语词分析","bookPage":79,"key":"yuci-9--5"},{"lesson":9,"num":6,"stem":"想不到这个男人＿＿＿比自己还细心，这让花嫂挺不好意思的。","word":null,"options":{"A":"都","B":"还","C":"很","D":"竞"},"answer":"D","analysis":"副词“竟”有“没想到”的意思，在句子中一般用在谓语之前，在比较句中，应该用在“比”字之前。其他词语都不符合语法要求。","id":"q0115","cat":"choice","section":"语词分析","bookPage":79,"key":"yuci-9--6"},{"lesson":9,"num":7,"stem":"结婚以后的她，每天就＿＿＿被关在笼子里的小鸟一样，根本没有自由。","word":null,"options":{"A":"有","B":"是","C":"比","D":"像"},"answer":"D","analysis":"“像…一样”是比较固定的搭配，其他词语不能与“一样”搭配。有的学生选择“是”，以为“就是……”，这是错误的。","id":"q0116","cat":"choice","section":"语词分析","bookPage":79,"key":"yuci-9--7"},{"lesson":9,"num":8,"stem":"以我看呀，王娜的嗓子＿＿＿你的好不了多少。","word":null,"options":{"A":"比","B":"与","C":"不比","D":"同"},"answer":"A","analysis":"“与、同”的意义和用法基本相同，不能选择其中的任何一个。“不比”之后一般不用带有否定形式的词语。正确答案只能是“比”。","id":"q0117","cat":"choice","section":"语词分析","bookPage":79,"key":"yuci-9--8"},{"lesson":9,"num":9,"stem":"我总想找出妻子＿＿＿我的地方，可是一直也找不到。","word":null,"options":{"A":"不比","B":"没有比","C":"不如","D":"一样"},"answer":"C","analysis":"四个备选答案中，只有“不如”符合语法要求，即“妻子不如我”。如果选择“不比”，句子中“我”后面就应该用比较的差别，。“没有比、一样”都不能用在这样的格式中。","id":"q0118","cat":"choice","section":"语词分析","bookPage":80,"key":"yuci-9--9"},{"lesson":9,"num":10,"stem":"老张退休以后一点儿也没有失落感，＿＿＿和往常一样，生活得很充实。","word":null,"options":{"A":"仍然","B":"总是","C":"从来","D":"常常"},"answer":"A","analysis":"句子中的“往常”指的是以前的时间，“和以前一样”的事情，应该是“仍然”。“总是、常常”有比较接近的用法；“从来”之后常常应该是否定性的词语。正确答案只能是“仍然”。","id":"q0119","cat":"choice","section":"语词分析","bookPage":80,"key":"yuci-9--10"},{"lesson":10,"num":1,"stem":"前天进A城我们B买了一大堆C橘子、苹果、香蕉D，根本就吃不完。","word":"什么的","options":null,"answer":"D","analysis":"“什么”在表示列举时，既可以用在所列举的事物之前，也可以用在所列举事物之后，但在形式上有所区别：在后边应该用“什么的”，在前边时，所列举的事物词语后多加“.…啊、…·啊”。","id":"q0120","cat":"pos","section":"语词分析","bookPage":87,"key":"yuci-10--1"},{"lesson":10,"num":2,"stem":"A大家都喜欢听笑话，有的人B笑笑就完了，C有的人却还要问一个D。","word":"为什么","options":null,"answer":"D","analysis":"句子中“一个”的后边应该有一个名词性的词语，否则句子就显得不完整，那么，这个“为什么”是最好的选择。其他几个地方似乎都可以用“为什么”，但是只有D是必须用的地方。","id":"q0121","cat":"pos","section":"语词分析","bookPage":88,"key":"yuci-10--2"},{"lesson":10,"num":3,"stem":"A你把三岁的小宝B自己C锁在家里了D！","word":"难道","options":null,"answer":"A","analysis":"“难道”在反问句中的位置既可以是主语之前，也可以是主语之后，谓语之前，其他位置都不可以。","id":"q0122","cat":"pos","section":"语词分析","bookPage":88,"key":"yuci-10--3"},{"lesson":10,"num":4,"stem":"A主机呀，硬盘哪，软驱呀B，他说了一大堆C，我一点儿D也听不懂。","word":"什么","options":null,"answer":"A","analysis":"请参考第(1)个句子的分析。","id":"q0123","cat":"pos","section":"语词分析","bookPage":88,"key":"yuci-10--4"},{"lesson":10,"num":5,"stem":"我A给你们B讲一个笑话，你们就C知道外国人是D看待中国文化的了。","word":"如何","options":null,"answer":"D","analysis":"A、B、C都不合适，因为“我讲笑话”当然知道“如何”讲，“就知道”中间不能插入其他词语。“如何”是“怎样”的意思，讲笑话的目的就是让人们知道“外国人怎样看待中国文化”。因此，正确答案应该是D。","id":"q0124","cat":"pos","section":"语词分析","bookPage":88,"key":"yuci-10--5"},{"lesson":10,"num":6,"stem":"逛了一上午商店，衣服、帽子、鞋、袜子＿＿＿的买了一大堆。","word":null,"options":{"A":"等","B":"什么","C":"怎么","D":"一些"},"answer":"B","analysis":"“什么”与句子中的“的”构成“什么的”，正好符合“什么”表示列举的要求。有人会选择“等”，但是句子中的“的”决定了应该用“什么”。","id":"q0125","cat":"choice","section":"语词分析","bookPage":88,"key":"yuci-10--6"},{"lesson":10,"num":7,"stem":"不论＿＿＿跟她开玩笑，她都不生气。","word":null,"options":{"A":"大家","B":"每个人","C":"谁","D":"人们"},"answer":"C","analysis":"按照复句关系“不论……都…”的要求，“不论、无论、不管”之后应该是表示疑问的形式，因此，四个备选项目中，只有“谁”符合要求。","id":"q0126","cat":"choice","section":"语词分析","bookPage":88,"key":"yuci-10--7"},{"lesson":10,"num":8,"stem":"三年以后的事，我怎么会知道＿＿＿？","word":null,"options":{"A":"吧","B":"吗","C":"呢","D":"了"},"answer":"C","analysis":"反问句的形式，其中之一就是“怎么…·呢”。应该特别注意，“怎么”一般不能与“吗”搭配使用。","id":"q0127","cat":"choice","section":"语词分析","bookPage":88,"key":"yuci-10--8"},{"lesson":10,"num":9,"stem":"我到教室的时候已经八点多了，＿＿＿教室里一个人也没有！","word":null,"options":{"A":"谁知道","B":"看不见","C":"就知道","D":"看得见"},"answer":"A","analysis":"“谁知道……”是“没想到”的意思，符合句子前后的语义关系。其他几个备选项目都不能表达这样的意思。","id":"q0128","cat":"choice","section":"语词分析","bookPage":89,"key":"yuci-10--9"},{"lesson":10,"num":10,"stem":"下课以后大家七嘴八舌，说＿＿＿的都有。","word":null,"options":{"A":"全部","B":"怎么","C":"哪儿","D":"什么"},"answer":"D","analysis":"“什么”一般用在动词之后做宾语，用在名词之前做定语，就是说，“什么”之后常常是名词，“什么”之前常常是动词。“怎么”之后则常常应该是动词。句子中的“七嘴八舌”是随便议论的意思。","id":"q0129","cat":"choice","section":"语词分析","bookPage":89,"key":"yuci-10--10"},{"lesson":10,"num":11,"stem":"对你们的看法我没＿＿＿可说的。","word":null,"options":{"A":"怎么","B":"那么","C":"多么","D":"什么"},"answer":"D","analysis":"“可说的”是“的”字结构，具有名词的性质，因此，它的前边只能用“什么”。“多么、那么”后常常用形容词，“怎么”后常常是动词。","id":"q0130","cat":"choice","section":"语词分析","bookPage":89,"key":"yuci-10--11"},{"lesson":10,"num":12,"stem":"你跑得那么快都赶不上他，＿＿＿我本来就跑得慢呢？","word":null,"options":{"A":"可是","B":"并且","C":"况且","D":"何况"},"answer":"D","analysis":"备选项目中只有“何况”可以用在反问句中，而且一般用在主语之前。此外应该注意，“何况”常常具有表示比较的意义，句子中正是拿“你”和“我”做比较。","id":"q0131","cat":"choice","section":"语词分析","bookPage":89,"key":"yuci-10--12"},{"lesson":10,"num":13,"stem":"比这大的困难我们都克服了，＿＿＿这么点儿小事呢？","word":null,"options":{"A":"怎么","B":"何不","C":"何必","D":"何况"},"answer":"D","analysis":"同样是表示比较的反问句，当然应该用“何况”“何必”有“为什么”的意，带有否定的意味；“何不”就是“何必不”；“何苦”与“何必”有相同的意义和用法。","id":"q0132","cat":"choice","section":"语词分析","bookPage":89,"key":"yuci-10--13"},{"lesson":10,"num":14,"stem":"刚才你干什么＿＿＿，怎么不接电话呢？","word":null,"options":{"A":"来着","B":"过","C":"着","D":"吧"},"answer":"A","analysis":"“来着”一般用在句尾，表示句子中所说的动作在过去的某个时间进行。应注意的是，虽然“着”也同样可以表示过去进行的动作，但是一般只能用在动词之后，而“来着”则可以用在宾语之后。","id":"q0133","cat":"choice","section":"语词分析","bookPage":89,"key":"yuci-10--14"},{"lesson":10,"num":15,"stem":"每个人都有自己的想法，说去＿＿＿的都有。","word":null,"options":{"A":"谁","B":"怎么","C":"哪儿","D":"什么0"},"answer":"C","analysis":"“哪儿”在句子中一般应该放在动词“来、去、到”或介词“从、在”等之后。其他几个备选词语都不合适。","id":"q0134","cat":"choice","section":"语词分析","bookPage":90,"key":"yuci-10--15"},{"lesson":11,"num":1,"stem":"这首歌学＿＿＿并不难，可要想表演好就不那么容易了。","word":null,"options":{"A":"过来","B":"下来","C":"起来","D":"出来"},"answer":"C","analysis":"“学起来”的意思是“学的时候”，与后边的“表演”相对。有人可能会选择“下来”，但是“下来”不能清楚地表达说话者所要表达的意思。","id":"q0135","cat":"choice","section":"语词分析","bookPage":99,"key":"yuci-11--1"},{"lesson":11,"num":2,"stem":"请王主任接着讲，＿＿＿讲完以后咱们大家再讨论。","word":null,"options":{"A":"起来","B":"下来","C":"下去","D":"过去"},"answer":"C","analysis":"与“接着、继续”等搭配的只能是“下去”，它们共同表示或强调动作继续进行的意思。","id":"q0136","cat":"choice","section":"语词分析","bookPage":99,"key":"yuci-11--2"},{"lesson":11,"num":3,"stem":"大家都觉得过节没有鞭炮热闹不＿＿＿，可放鞭炮既危险又污染环境。","word":null,"options":{"A":"上来","B":"起来","C":"回来","D":"上去"},"answer":"B","analysis":"“起来”除了有开始并继续的意思以外，还可以表示场面热烈、气氛活跃等，因此，B是唯一正确的选择。","id":"q0137","cat":"choice","section":"语词分析","bookPage":99,"key":"yuci-11--3"},{"lesson":11,"num":4,"stem":"照片上的人我肯定在哪儿见过，可是一时怎么也想不＿＿＿他是谁了。","word":null,"options":{"A":"出来","B":"起来","C":"回来","D":"下来"},"answer":"B","analysis":"“起来”有招回记忆的意义，而“想不起来”恰好是不能招回自己的记忆，其他词语不能表达这样的意思。","id":"q0138","cat":"choice","section":"语词分析","bookPage":99,"key":"yuci-11--4"},{"lesson":11,"num":5,"stem":"南极上空的臭氧层已遭到严重破坏，其发展＿＿＿，将威胁到整个人类。","word":null,"options":{"A":"起来","B":"下去","C":"下来","D":"过去"},"answer":"B","analysis":"“发展下去”是继续发展的意思，也正是句子所要表达的真正意思。","id":"q0139","cat":"choice","section":"语词分析","bookPage":99,"key":"yuci-11--5"},{"lesson":11,"num":6,"stem":"请把下面句子中写错的汉字改，＿＿＿然后再各造一个句子。","word":null,"options":{"A":"出来","B":"下来","C":"回来","D":"过来"},"answer":"D","analysis":"“改过来”是把不好的事情改到正确的方面来，符合“过来”表示的从不好的状态向好的状态转变的用法。","id":"q0140","cat":"choice","section":"语词分析","bookPage":100,"key":"yuci-11--6"},{"lesson":11,"num":7,"stem":"目前中国的人口比所有欧洲国家的人口加＿＿＿还要多得多！","word":null,"options":{"A":"下来","B":"上来","C":"出来","D":"起来"},"answer":"D","analysis":"这个句子中“加”的结果只能是“起来”，而不能是“出来”，因为“起来”表示的是集中，而“出来”表示的只是从无到有。","id":"q0141","cat":"choice","section":"语词分析","bookPage":100,"key":"yuci-11--7"},{"lesson":11,"num":8,"stem":"我总算想＿＿＿了，三年前我们在上海见过面。","word":null,"options":{"A":"出来","B":"上来","C":"进来","D":"起来"},"answer":"D","analysis":"法、注意、计划等。","id":"q0142","cat":"choice","section":"语词分析","bookPage":100,"key":"yuci-11--8"},{"lesson":11,"num":9,"stem":"你放心，电话号码和地址我都在本子上记＿＿＿了。","word":null,"options":{"A":"起来","B":"下来","C":"下去","D":"上去"},"answer":"B","analysis":"“记下来”是把应该记录的内容写在本子上，或者是把应该记住的东西记在自已的头脑里，也就是“下来”表示动作使宾语停留在某处的意义。其他词语不能表示这样的意思。","id":"q0143","cat":"choice","section":"语词分析","bookPage":100,"key":"yuci-11--9"},{"lesson":11,"num":10,"stem":"经过医生的努力，他终于从昏迷中醒＿＿＿。","word":null,"options":{"A":"起来了","B":"回来了","C":"过来了","D":"出来了"},"answer":"C","analysis":"“动词+过来”表示的是从非正常状态到正常状态的变化，常常使用的动词是“醒、清醒、苏醒、活、救、抢救、明白、恢复”等。","id":"q0144","cat":"choice","section":"语词分析","bookPage":100,"key":"yuci-11--10"},{"lesson":11,"num":11,"stem":"我们俩十年没见了，可一见面，我就＿＿＿了。","word":null,"options":{"A":"看出他来","B":"看出来他","C":"认出他来","D":"认出来他"},"answer":"C","analysis":"“动词+出来”除了表示从无到有以外，最重要的是表示“辨认清楚”的意思。这种意义中常常使用的动词有“看、听、闻、尝、挑、认、瞧、找、查”等等。动词如果有宾语，常常使用这样的格式，即“动+出+宾+来”。","id":"q0145","cat":"choice","section":"语词分析","bookPage":100,"key":"yuci-11--11"},{"lesson":11,"num":12,"stem":"我似乎在哪儿见过他，可想了半天，也＿＿＿。","word":null,"options":{"A":"不想出来","B":"不想起来","C":"想不出来","D":"想不起来"},"answer":"D","analysis":"回到记忆中来。“不想起来”如果用“没想起来”是可以的。应该注意，汉语中对表示结果的补语的否定一般应该用“没”而不用“不”。","id":"q0146","cat":"choice","section":"语词分析","bookPage":101,"key":"yuci-11--12"},{"lesson":11,"num":13,"stem":"我学什么东西都一样，开始以后总是坚持不＿＿＿。","word":null,"options":{"A":"成","B":"完","C":"起来","D":"下去"},"answer":"D","analysis":"“坚持下去”的意思是继续做某事，而“坚持不下去”的意思则是不能继续做某事。其他词语与“坚持”搭配不能表达这样的意思。","id":"q0147","cat":"choice","section":"语词分析","bookPage":101,"key":"yuci-11--13"},{"lesson":11,"num":14,"stem":"几个月试验＿＿＿，最后的统计结果大大出乎家长和学校的预料。","word":null,"options":{"A":"下去","B":"下来","C":"起来","D":"上来"},"answer":"B","analysis":"句子中有“最后的统计结果”，这表明事情已经完成，因此，动词实验之后应该用“下来”，因为“下来”表示的是动作持续至今。","id":"q0148","cat":"choice","section":"语词分析","bookPage":101,"key":"yuci-11--14"},{"lesson":11,"num":15,"stem":"这些蔬菜＿＿＿很新鲜，其实已经被超标准的农药和化肥污染了。","word":null,"options":{"A":"看出来","B":"看得出","C":"看下去","D":"看上去"},"answer":"D","analysis":"汉语中“看上去、看起来、看样子、看来”有相同的意义和用法，即在句子中微插入语，表示的是说话人的主观猜测和估计等。备选项目中的“看出来、看得出”的意义和用法比较接近，不能选择其中之一。","id":"q0149","cat":"choice","section":"语词分析","bookPage":101,"key":"yuci-11--15"},{"lesson":12,"num":1,"stem":"我们在A这里人生地不熟，应该先多找B人了解一下C情况，然后再D进行下一步工作。","word":"当地","options":null,"answer":"B","analysis":"有人会觉得B和C都很合适，其实，“我们”已经“在这里”了，当然应该是我“当地人”了解情况，如果是“了解当地情况”，那么找的人就有可能不是“当地”了。按照句子前后的意思，只能选择B。","id":"q0150","cat":"pos","section":"语词分析","bookPage":109,"key":"yuci-12--1"},{"lesson":12,"num":2,"stem":"A汉语文化周联欢会上B看到C表演节目了D吧？","word":"同学们","options":null,"answer":"C","analysis":"B是错误的选择，因为“同学们”在这里是“表演节目”的人，而不是“看表演节目”的人。为什么呢？因为这个句子的说话者与听话者都不是“同学们”，而是师或其他人。","id":"q0151","cat":"pos","section":"语词分析","bookPage":109,"key":"yuci-12--2"},{"lesson":12,"num":3,"stem":"我们公司A一直接收B网络信息方面的高才生C，今后D也将如此。","word":"近几年","options":null,"answer":"A","analysis":"“近几年”是时间词，而汉语的时间词做状语时，一般应该用在主语前或主后谓语前。其他位置都不合适。","id":"q0152","cat":"pos","section":"语词分析","bookPage":110,"key":"yuci-12--3"},{"lesson":12,"num":4,"stem":"大家觉得，A像您B这样的好心人，天下C有D几个呀！","word":"能","options":null,"answer":"C","analysis":"汉语的能愿动词一般应该放在普通动词之前，反过来说，汉语的能愿动词后，一般应该直接跟动词。","id":"q0153","cat":"pos","section":"语词分析","bookPage":110,"key":"yuci-12--4"},{"lesson":12,"num":5,"stem":"听了她暖暖A的几句话，我B的心里热热C的非常舒服D。","word":"乎乎","options":null,"answer":"C","analysis":"汉语与“暖暖”连用的应该是“和和”，即“暖和”的重叠形式。这个句子应该是“热乎”的重叠形式。正确答案应该是C。","id":"q0154","cat":"pos","section":"语词分析","bookPage":110,"key":"yuci-12--5"},{"lesson":12,"num":6,"stem":"A一年前，B我才C学汉语，所以水平还D不高。","word":"开始","options":null,"answer":"C","analysis":"“开始”这个动词一般要求动词做宾语，因此，“开始”应该放在动词之前句子中只有C符合这一要求。","id":"q0155","cat":"pos","section":"语词分析","bookPage":110,"key":"yuci-12--6"},{"lesson":12,"num":7,"stem":"你只要A看B看，C就会弄D懂他的意思了。","word":"一","options":null,"answer":"B","analysis":"“V一V”是动词重叠形式的一种，因此，B是最恰当的位置。如果没有第二个“看”，A也可以用“一”，那是“一…就…”的格式，我们将在复句中进行分析。","id":"q0156","cat":"pos","section":"语词分析","bookPage":110,"key":"yuci-12--7"},{"lesson":12,"num":8,"stem":"在创作过程中，他经常在自己的房间里＿＿＿的，有时我都为他着急。","word":null,"options":{"A":"走东走西","B":"走来走去","C":"走上走下","D":"走前走后"},"answer":"B","analysis":"“V来V去”是汉语动词重叠的一种形式，表示的是动作的反复进行。而其他几个形式都不能表达这样的意思，也不符合句子中所描写的环境状况。","id":"q0157","cat":"choice","section":"语词分析","bookPage":110,"key":"yuci-12--8"},{"lesson":12,"num":9,"stem":"程教授从50年代起就＿＿＿对外汉语教学工作，直到生命的最后。","word":null,"options":{"A":"进行","B":"弄","C":"从事","D":"在"},"answer":"C","analysis":"“从事··工作”是书面语表达的正确搭配形式，中间一般应该插入与某一工性质有关的词语，如“教学、新闻、医疗、地质、体育”等等。这种表达形式在口语中常用“搞…工作”。“弄”是指用手的动作，而且常常是破坏性的，如“弄脏、弄丢、弄坏、弄碎”等，即使是“弄好、弄干净”等，一般也难登大雅。“进行”的宾语一最应该是双音节动词，但多是“研究、比较、讨论、商、协调”等词语。","id":"q0158","cat":"choice","section":"语词分析","bookPage":110,"key":"yuci-12--9"},{"lesson":12,"num":10,"stem":"这次去澳大利亚进修的机会十分＿＿＿，你可千万不要轻易错过。","word":null,"options":{"A":"困难","B":"难得","C":"难怪","D":"为难"},"answer":"B","analysis":"与“机会”搭配的动词应该是“难得”，其他词语不能表达相同的意思。","id":"q0159","cat":"choice","section":"语词分析","bookPage":111,"key":"yuci-12--10"},{"lesson":12,"num":11,"stem":"今天他感冒了，不二＿＿＿和你们去游泳了。","word":null,"options":{"A":"可以","B":"会","C":"要","D":"能"},"answer":"D","analysis":"“感冒”是“不能去游泳”的原因。因为感冒，所以没有能力去游泳。“能”表示“能力”的意义，也可以表示“允许”。尽管“可以”也有类似的作用，但是，这句子中只有“能”才最合适。","id":"q0160","cat":"choice","section":"语词分析","bookPage":111,"key":"yuci-12--11"},{"lesson":12,"num":12,"stem":"动物园里有很多常见的动物，也有很多＿＿＿的动物。","word":null,"options":{"A":"珍奇","B":"高贵","C":"珍惜","D":"高雅"},"answer":"A","analysis":"“珍奇”是珍贵而神奇的意思，在句子中常做定语。“珍惜”是动词，在句子常做谓语，如“珍惜时间，珍惜生命”等。其他词语都不能修饰“动物”。","id":"q0161","cat":"choice","section":"语词分析","bookPage":111,"key":"yuci-12--12"},{"lesson":12,"num":13,"stem":"他本来打算跟我一起去旅行，可现在又＿＿＿主意了。","word":null,"options":{"A":"变化","B":"修改","C":"改变","D":"改正"},"answer":"C","analysis":"“变化”一般做名词用，做动词时不能带宾语，因此在句子中不合适。“修”的常常是“计划、方案、路线、图纸、作业”一类与写和画有关的东西；“改正”的常常是“缺点、错误”等词语。“改变”常常是因为某种外部或客观原因而使原有的“划、打算、主意、态度、观点”等发生变化。","id":"q0162","cat":"choice","section":"语词分析","bookPage":111,"key":"yuci-12--13"},{"lesson":12,"num":14,"stem":"我＿＿＿改正自己的错误，您原谅我这一次吧。","word":null,"options":{"A":"决定","B":"坚定","C":"决心","D":"确定"},"answer":"C","analysis":"“决心”在句子中是名词做状语，强调改正错误的坚定意志。“决定”做动词乎可以放在句子中的位置上，但意义不够明确。其他两个词语都不能表达“决心”所能够表达的意思。","id":"q0163","cat":"choice","section":"语词分析","bookPage":111,"key":"yuci-12--14"},{"lesson":12,"num":15,"stem":"他做中国菜的水平高得＿＿＿再高了。","word":null,"options":{"A":"不会","B":"不能","C":"不行","D":"不要"},"answer":"B","analysis":"“A得不能再A了”是汉语表达中强调程度高的一种特殊而固定的形式，如“好得不能再好了，忙得不能再忙了，热得不能再热了，舒服得不能再舒服了”等等。其他词语不能表达这样的意思。","id":"q0164","cat":"choice","section":"语词分析","bookPage":112,"key":"yuci-12--15"},{"lesson":13,"num":1,"stem":"我A很生他的气B，一连C没有给他打电话D了。","word":"三个月","options":null,"answer":"C","analysis":"由“一连”组成的句子形式有两种，一是“一连+动词+数量词语+宾语”，如“一连下了三天雨”，“一连吃了两个面包”等；二是“一连+数量词语+没／不+动词+宾语”，如“一连三天没说话”，“一连两个星期没下雨”，“一连几天不吃饭怎么行？”“一连”的具体用法可以参考本教材下册的介绍。","id":"q0165","cat":"pos","section":"语词分析","bookPage":121,"key":"yuci-13--1"},{"lesson":13,"num":2,"stem":"A你B这C蓝色D衣服的拉锁怎么都坏了？","word":"两件","options":null,"answer":"C","analysis":"“这+量词+名词”是比较固定的形式，名词前有形容词或其他表示区别意义的词语时，数量词应该在形容词等之前。","id":"q0166","cat":"pos","section":"语词分析","bookPage":121,"key":"yuci-13--2"},{"lesson":13,"num":3,"stem":"A“知识就是力量”B来自西方思想家的名言，C一直鼓励着我们D奋斗。","word":"这句","options":null,"answer":"B","analysis":"“这”是代词，常常代替前边出现过的人、事、物等。“这句名言”符合“这量词+名词”的格式，“名言”之前有其他定语时，量词放在定语前。关于“这、那”等代词的用法同样可以参考本教材下册的介绍。","id":"q0167","cat":"pos","section":"语词分析","bookPage":121,"key":"yuci-13--3"},{"lesson":13,"num":4,"stem":"王老师为我们A做了B菜，还请来C几个朋友D陪我们。","word":"一桌子","options":null,"answer":"B","analysis":"临时借用的量词“桌子”应该放在“菜”之前，形容老师做的菜很多。","id":"q0168","cat":"pos","section":"语词分析","bookPage":121,"key":"yuci-13--4"},{"lesson":13,"num":5,"stem":"听了A刘教授的报告，B同学们C都表示今后D要更加努力学习。","word":"个个","options":null,"answer":"C","analysis":"B是错误的选择，因为“个个”是每一个的意思，其后不能是表示集体的名词“同学们”，反过来才符合汉语的表达要求。正确答案是C。类似的句子还有：“我们大个个都很认真”，“他们几个人个个都十分能干”。","id":"q0169","cat":"pos","section":"语词分析","bookPage":121,"key":"yuci-13--5"},{"lesson":13,"num":6,"stem":"三十A年B来，他C教过的学生有上千D人。","word":"多","options":null,"answer":"A","analysis":"汉语中表示概数的词语“多、来、几”一般可以放在整数词语“十、百、千、”等之后。D之前有“上千”，因此不能用“多”。","id":"q0170","cat":"pos","section":"语词分析","bookPage":121,"key":"yuci-13--6"},{"lesson":13,"num":7,"stem":"他们每天A工作B十C几个小时，够D辛苦的。","word":"好","options":null,"answer":"C","analysis":"“几”加整数词语“十、百、千”等和一般量词后，它的前边可以加上“好”表示数量多。比如，“几个”可以是多于“二”少于“十”的所有数量，但是，加上“好”以后，一般应该指多于“五”少于“十”的数量。D不可以，因为“够…的”是一个十分固定的表示程度的结构。","id":"q0171","cat":"pos","section":"语词分析","bookPage":122,"key":"yuci-13--7"},{"lesson":13,"num":8,"stem":"伦敦终于争取到了四年一＿＿＿的2012年奥林匹克运动会的主办权。","word":null,"options":{"A":"趟","B":"场","C":"遍","D":"次"},"answer":"D","analysis":"A、B、C都不合适，因为“趟”过于口语化；“场”虽然可以与“运动会”搭配，但在这个句子中“运动会”并不指某一场，而是将持续很长时间的综合性的比赛；“遍”是指从头到尾的全过程。正确答案只能是D。建于数百年前的石拱桥，至今仍完好无损。","id":"q0172","cat":"choice","section":"语词分析","bookPage":122,"key":"yuci-13--8"},{"lesson":13,"num":9,"stem":"北京颐和园的玉带桥是一＿＿＿建于数百年前的石拱桥，至今仍完好无损。","word":null,"options":{"A":"条","B":"支","C":"坐","D":"座"},"answer":"D","analysis":"与量词“座”搭配的名词包括“山、楼、桥、工厂”等，多是比较高大的事物。不能用“条”，尽管今天的“桥”可能是比较长的，但当初的桥多是由石头堆砌而成。“坐”是动词，当然不能用做量词。","id":"q0173","cat":"choice","section":"语词分析","bookPage":122,"key":"yuci-13--9"},{"lesson":13,"num":10,"stem":"那＿＿＿饭店广东厨师的几个拿手菜都很有特色，颇受欢迎。","word":null,"options":{"A":"座","B":"家","C":"所","D":"里    商"},"answer":"B","analysis":"与“饭店”搭配的量词应该是“家”，这恰好与我们经常在饭店看到的成语“宾至如归”相吻合。“宾至如归”的意思是：吃饭的客人来到饭店，就像回到自己的家里一样。","id":"q0174","cat":"choice","section":"语词分析","bookPage":122,"key":"yuci-13--10"},{"lesson":13,"num":11,"stem":"昨天下午我在商场买了一＿＿＿漂亮的衣服。","word":null,"options":{"A":"条","B":"件","C":"个","D":"块"},"answer":"B","analysis":"汉语中用“件”作量词的名词有“衣服(包括各种上衣)、事情(包括各种事情)、礼物(包括各种礼物)”这三个词语。","id":"q0175","cat":"choice","section":"语词分析","bookPage":122,"key":"yuci-13--11"},{"lesson":13,"num":12,"stem":"夏天到了，这儿常常下雨，你应该准备一＿＿＿雨伞。","word":null,"options":{"A":"支","B":"张","C":"把","D":"件"},"answer":"C","analysis":"汉语中凡是带“把儿”的工具一般都用“把”作量词，比如“刀子、勺子、叉子、铁锹、雨伞、铲子、锤子”等。用“张”作量词的事物常常强调平面的性质，如“报、床、纸、桌子”等。","id":"q0176","cat":"choice","section":"语词分析","bookPage":122,"key":"yuci-13--12"},{"lesson":13,"num":13,"stem":"那画着齐白石的画儿的瓷器又好看又便宜。","word":null,"options":{"A":"支","B":"张","C":"套","D":"条立四"},"answer":"C","analysis":"如果你只看句子中前边的几个词，你会马上选择“张”这个量词，但是，你又被迷惑了。“瓷器”才是“这”要修饰的真正的名词，因此，只能用“套”，而不能用其他的量词。“套”这个量词常常表示成组出现的事物，如“餐具、茶具、炊具、西装、话”等。","id":"q0177","cat":"choice","section":"语词分析","bookPage":123,"key":"yuci-13--13"},{"lesson":13,"num":14,"stem":"几年前过生日的时候，朋友送了我一＿＿＿围巾，至今我仍戴着。","word":null,"options":{"A":"个","B":"件","C":"张","D":"条"},"answer":"D","analysis":"“围巾”是比较细长而且软的东西，因此应该用“条”这个量词。类似的词语还有“皮带、领带、裤子、裙子、江、河、道、路”等。应该注意“条”与“支、根”这两个量词的区别。","id":"q0178","cat":"choice","section":"语词分析","bookPage":123,"key":"yuci-13--14"},{"lesson":13,"num":15,"stem":"打了一个多小时的网球，又洗了＿＿＿热水澡，浑身上下舒服极了。","word":null,"options":{"A":"下","B":"个","C":"身","D":"趟"},"answer":"B","analysis":"“洗澡”是一个离合词，“澡”可以看成是“洗”的宾语。四个备选答案中，“个”是唯一正确的答案。应该注意的是，汉语中“二”加“量词”可以省略“二”，这三前边的分析中已经介绍过了。其他词语不合适。","id":"q0179","cat":"choice","section":"语词分析","bookPage":123,"key":"yuci-13--15"},{"lesson":1,"num":1,"stem":"刚才你说谁同学是法国人？","analysis":"本课我们学的是“的、地、得”的用法，此句中“谁”与“同学”之间应该用“的”，即“谁的同学”。正确的句子应该是：","corrections":["刚才你说谁的同学是法国人？","刚才你说哪个同学是法国人？"],"extra":[],"id":"q0180","cat":"bingju","section":"病句分析","bookPage":140,"key":"bingju-1--1"},{"lesson":1,"num":2,"stem":"昨天玛丽买了一件非常漂亮衬衣。","analysis":"句子中如果只有“漂亮”与“衬衣”，那么，它们中间既可以用“的”，也可以不用“的”，但在“漂亮”前边有“非常”这样的程度副词时，“漂亮”与“衬衣”之间必须用“的”。正确的句子应该是：","corrections":["昨天玛丽买了一件非常漂亮的衬衣。"],"extra":[],"id":"q0181","cat":"bingju","section":"病句分析","bookPage":140,"key":"bingju-1--2"},{"lesson":1,"num":3,"stem":"我想去学校门口买一张《北京的晚报》。","analysis":"《北京晚报》是专有名词，而且“北京”与“晚报”又都是名词，在不表示领属关系的名词与名词之间不用“的”，因此，句子中的“的”是多余的。正确的句子应该是：","corrections":["我想去学校门口买一张《北京晚报》。"],"extra":[],"id":"q0182","cat":"bingju","section":"病句分析","bookPage":140,"key":"bingju-1--3"},{"lesson":1,"num":4,"stem":"跟你最好那个中国的同学来找你了。","analysis":"句子中“最好”是“那个中国同学”的定语，“好”的前边出现“很、最、非常”等程度副词时，它们与所修饰的名词之间一定要加“的”。而“中国”与“同学”之间则完全可以不用“的”。“那个”是指示代词，它的位置可以比较灵活。正确的句子应该是：","corrections":["跟你最好的那个中国同学来找你了。","那个跟你最好的中国同学来找你了。"],"extra":[],"id":"q0183","cat":"bingju","section":"病句分析","bookPage":140,"key":"bingju-1--4"},{"lesson":1,"num":5,"stem":"他是我最好朋友的。","analysis":"这个句子中出现的是不少学生容易产生的错误，即应该用“的”的地方没有用，而不该用“的”的地方反而用了“的”。句中最后的“的”是不应该出现的，而“最好”与“朋友”之间应该有的“的”却丢掉了。不少同学应该注意，不能一见到“是”，就在句尾加“的”。正确的句子应该是：","corrections":["他是我最好的朋友。","他是我的好朋友。"],"extra":[],"id":"q0184","cat":"bingju","section":"病句分析","bookPage":140,"key":"bingju-1--5"},{"lesson":1,"num":6,"stem":"我们大家都很认真学习。","analysis":"和“的”的用法基本相同，形容词做状语时，与谓语动词之间一般可以用“地”，也可以不用“地”，但是，当形容词前加上程度副词以后再做状语，这时，则必须使用“地”。句子中“很认真”与“学习”之间应该加上“地”。正确的句子应该是：","corrections":["我们大家都很认真地学习(着)。","我们大家学习都很认真。"],"extra":[],"id":"q0185","cat":"bingju","section":"病句分析","bookPage":141,"key":"bingju-1--6"},{"lesson":1,"num":7,"stem":"他从小就非常地喜欢游泳。","analysis":"“喜欢”是表示心理活动的动词，在用法上和形容词十分接近，可以用程度副词直接修饰，因此，句子中的“地”不能用。当然，当汉语学习到一定的程度以后，你会知道，“非常”还可以有“不是一般的”的意思，即“非+常”。在这种情况下，“非常”的后边可以加“的”，然后再修饰名词。不过，这种用法比较少见。正确的句子应该是：","corrections":["他从小就非常喜欢游泳。"],"extra":["他是个非常的人物。","这是一个非常的问题。"],"id":"q0186","cat":"bingju","section":"病句分析","bookPage":141,"key":"bingju-1--7"},{"lesson":1,"num":8,"stem":"多地听，多地说，就一定能学好汉语。","analysis":"单音节形容词做定语和做状语是一样的，即可以直接修饰中心词语。因此，句子中的两个“地”都不能用。类似的形式还有“快走、慢走，快吃、慢吃，少说话、多做事”等等。正确的句子应该是：","corrections":["多听，多说，就一定能学好汉语。","多听多说一定能学好汉语。"],"extra":[],"id":"q0187","cat":"bingju","section":"病句分析","bookPage":141,"key":"bingju-1--8"},{"lesson":1,"num":9,"stem":"我汉语说得不够流利，还差地很远。","analysis":"句子中“很远”是“差”的程度补语，而谓语与程度补语之间应该用“得”而不是“地”。正确的句子应该是：","corrections":["我汉语说得不够流利，还差得很远。","我说汉语说得不够流利，还差得很远。"],"extra":[],"id":"q0188","cat":"bingju","section":"病句分析","bookPage":141,"key":"bingju-1--9"},{"lesson":1,"num":10,"stem":"他跟我一说，我就很痛快答应他了。","analysis":"句子中“很痛快”与动词“答应”之间是修饰与被修饰的关系，即状语与中心语的关系，它们之间的结构关系只能由“地”来反映，而句子中恰恰缺少了这个“地”。正确的句子应该是：","corrections":["他跟我一说，我就很痛快地答应他了。","他一跟我说，我就很痛快地答应他了。"],"extra":[],"id":"q0189","cat":"bingju","section":"病句分析","bookPage":141,"key":"bingju-1--10"},{"lesson":1,"num":11,"stem":"我们班同学都积极得参加了学校的运动会。","analysis":"和上一个句子一样，状语“积极”与动词“参加”之间应该用“地”而不是“得”。正确的句子应该是：","corrections":["我们班同学都积极地参加了学校的运动会。滨人大强"],"extra":[],"id":"q0190","cat":"bingju","section":"病句分析","bookPage":141,"key":"bingju-1--11"},{"lesson":1,"num":12,"stem":"开始的时候，玛丽写汉字得很慢。撇的寞心","analysis":"“得”是汉语中程度补语和可能补语的标志，它必须用在动词或形容词之后，不能用在名词之后。如果句子中的动词有宾语的时候，“得”可以用在重复的动词之后，或者把宾语提前。因此，句子中“得”的位置不对。正确的句子应该是：","corrections":["开始的时候，玛丽写汉字写得很慢。","开始的时候，玛丽汉字写得很慢。"],"extra":[],"id":"q0191","cat":"bingju","section":"病句分析","bookPage":141,"key":"bingju-1--12"},{"lesson":1,"num":13,"stem":"听了妈妈的话，她高兴地不知道说什么了。","analysis":"看到这个句子，我们首先应该弄清楚句子中说的是什么，也就是什么是主要的“她高兴”是这个句子的主要内容。因此，“不知道说什么”是“高兴”的程度，即补充说明“高兴”所达到的状态，是“高兴”的补语。这样，“地”就应该改为“得”。正确的句子应该是：","corrections":["听了妈妈的话，她高兴得不知道说什么了。","听了妈妈的话，她高兴得不知道说什么才好了。"],"extra":[],"id":"q0192","cat":"bingju","section":"病句分析","bookPage":142,"key":"bingju-1--13"},{"lesson":1,"num":14,"stem":"我们班有23个学生，山本学地最好。","analysis":"这个句子中“最好”应该是“学”的补语，因此，句子中的“de”一般应该用“得”而不是“地”或“的”。正确的句子应该是：","corrections":["我们班有23个学生，山本学得最好。","我们班有23个学生，山本的学习最好。","我们班有23个学生，山本学习最好。"],"extra":[],"id":"q0193","cat":"bingju","section":"病句分析","bookPage":142,"key":"bingju-1--14"},{"lesson":1,"num":15,"stem":"她是个快乐的人，每天总是高高兴兴得。","analysis":"汉语中的双音节形容词重叠以后常常要加上“的”，这在“的”的讲解中已经介绍过了。因此，正确的句子应该是：","corrections":["她是个快乐的人，每天总是高高兴兴的。"],"extra":[],"id":"q0194","cat":"bingju","section":"病句分析","bookPage":142,"key":"bingju-1--15"},{"lesson":2,"num":1,"stem":"我在国内学习的时候常常参加了足球比赛。","analysis":"汉语句子中动词后的“了”表示动作的完成，即动作已经结束。但是当我们介绍某一天的活动或介绍经常性动作时，一般在动词后不用“了”。那么，上面的句子中恰恰有“常常”这个词语，因此，动词“参加”后就不应该用“了”。正确的句子应该是：","corrections":["我在国内学习的时候常常参加足球比赛。","我在国内学习的时候常参加足球比赛。"],"extra":[],"id":"q0195","cat":"bingju","section":"病句分析","bookPage":147,"key":"bingju-2--1"},{"lesson":2,"num":2,"stem":"你一定要记住了这些生词。","analysis":"通过分析我们知道，这个句子是劝别人应该怎么做。句子中的“要”既有“应该”的意思，也有表示“将来”的意思，“记住这些生词”是还没有发生的动作，因此，句子中就不应该用“了”。正确的句子应该是：","corrections":["你一定要记住这些生词。"],"extra":[],"id":"q0196","cat":"bingju","section":"病句分析","bookPage":147,"key":"bingju-2--2"},{"lesson":2,"num":3,"stem":"我们每天都要复习了一个小时旧课。","analysis":"这个句子中的“每天”与第一个句子中的“常常”是一样的，表示经常性的动作。“复习一个小时旧课”不但是以前的事情，以后也同样会是这样的。因此，句子中的“了”就不应该出现了。正确的句子应该是：","corrections":["我们每天都要复习一个小时旧课。"],"extra":[],"id":"q0197","cat":"bingju","section":"病句分析","bookPage":147,"key":"bingju-2--3"},{"lesson":2,"num":4,"stem":"上星期天小王去了历史博物馆参观。","analysis":"汉语语法规定，在连动句中，第一个动词(多是“来、去、到”等)的后面不能用“了”，“了”应该放在第二个动词或句子之后。正确的句子应该是：","corrections":["上星期天小王去历史博物馆参观了。","上星期天小王去历史博物馆了，在那儿参观了一天。","上星期天小王去了一次历史博物馆。"],"extra":[],"id":"q0198","cat":"bingju","section":"病句分析","bookPage":147,"key":"bingju-2--4"},{"lesson":2,"num":5,"stem":"昨天玛丽没有跟我们一起去长城了。","analysis":"汉语的“了”我们介绍了三种用法，除了表示变化的第三种“了”可以出现在带有否定词语的句子中以外，其他的“了”都不能这样用。上面的句子中的“了”表示的是过去的事情，那么，在前边有了“没有”这个否定词语后，就不应该再用“了”。正确的句子应该是：","corrections":["昨天玛丽没有跟我们一起去长城。"],"extra":["明天玛丽不跟我们一起去长城了。","我这儿已经没有你要的东西了。"],"id":"q0199","cat":"bingju","section":"病句分析","bookPage":147,"key":"bingju-2--5"},{"lesson":2,"num":6,"stem":"我以前也曾经在中学教着书。","analysis":"“着”在句子中一般表示的是正在进行的动作，或者表示持续的状态。而这个句子中前边有“以前”和“曾经”两个词语，它们后边的动词都应该是表示过去发生或经历过的动作。因此，句子中的“着”使用错误，应该用“过”。应该记住：句子中有“已经”的时候，动词或整个句子的后边常常用“了”，而句子中用“曾经”的时候，动词后一般应该用“过”。如果句子中出现了“正、在、正在、呢”，动词后边常常会用“着”。正确的句子应该是：","corrections":["我以前也曾经在中学教过书。"],"extra":["王老师已经回家了。","他们正上着课呢。"],"id":"q0200","cat":"bingju","section":"病句分析","bookPage":148,"key":"bingju-2--6"},{"lesson":2,"num":7,"stem":"中国实行改革开放以后，人民的生活水平提高过。","analysis":"汉语中的动态助词“过”表示的是曾经的经历，它前边的动词所表示的动作应该是以前发生的，现在已经不继续了。比如：“我去过长城”，一“我吃过烤鸭”，“我踢过足球”等等。按照这样的意思去理解，上边句子中在“提高”后边用了“过”，意思就是：“今天人民的生活水平又降低了”，因为是“人民的生活水平提高过”。只有用“了”才可以表示动作持续到了现在，如：“他去上海了”，“我来北京了”等等。正确的句子应该是：","corrections":["中国实行改革开放以后，人民的生活水平提高了。    京中干国"],"extra":[],"id":"q0201","cat":"bingju","section":"病句分析","bookPage":148,"key":"bingju-2--7"},{"lesson":2,"num":8,"stem":"今天早上还下雪着，我们就出发去颐和园了。","analysis":"动态助词“了、着、过”只能用在句子中的动词之后，不能用在宾语之后，这一点一定要牢牢记住！特别是有些离合动词和动宾词组，如“见面、毕业、结婚、吃饭、睡觉、散步”等等，都很容易被同学们用错。句子中的“着”只能用在“下”与“雪”之间。正确的句子应该是：","corrections":["今天早上还下着雪，我们就出发去颐和园了。"],"extra":["以前我们见过面，所以我认识他。","他还睡着觉呢，别打扰他。","他吃了饭就出去了。"],"id":"q0202","cat":"bingju","section":"病句分析","bookPage":148,"key":"bingju-2--8"},{"lesson":2,"num":9,"stem":"我昨天在那儿等着你们半个多小时。","analysis":"“着”表示动作的持续，但并不强调动作持续了多长时间，也就是说，动词加“着”不能与时量补语同时用。另外，这个句子中，“等”这个动作明显是在过去的时间里进行的，因此，句子中的动态助词应该用“了”而不是“着”。还要注意的是，句子中的“你们”是表示人的代词，可以放在时量补语之前，如果是名词，则应该放在时量补语之后。这一点在补语中我们还会进行分析。正确的句子应该是：","corrections":["我昨天在那儿等了你们半个多小时。"],"extra":["昨天我看了两个小时电影。","刚才我睡了一会儿觉。"],"id":"q0203","cat":"bingju","section":"病句分析","bookPage":148,"key":"bingju-2--9"},{"lesson":2,"num":10,"stem":"她翻一本画报给孩子讲故事。“讲故事”的伴随动作，在句子中应该做“讲故事”的状语。既然如此，按照汉语语法的要求，伴随的动作动宾之间应该加上“着”。正确的句子应该是：她翻着一本画报给孩子讲故事。另：我骑着自行车去颐和园。他喜欢躺着看书。他常常唱着歌洗澡。另外，如果从连动句的角度去分析，句子中的两个动作存在前后的顺序关系，但是它们之间没有主次关系，这时，“着”可以换成表示结果的“开”：她翻开一本画报给孩子讲故事。","analysis":"这个句子中“翻画报”与“讲故事”存在着主与次的关系，即“翻画报”是“讲故事”的伴随动作，在句子中应该做“讲故事”的状语。既然如此，京按照汉语语法的要求，伴随的动作动宾之间应该加上“着”。正确的句子应该是：她翻着一本画报给孩子讲故事。另：我骑着自行车去颐和园。他喜欢躺着看书。他常常唱着歌洗澡。另外，如果从连动句的角度去分析，句子中的两个动作存在前后的顺序关系，但是它们之间没有主次关系，这时，“着”可以换成表示结果的“开”","corrections":["她翻开一本画报给孩子讲故事。"],"extra":[],"id":"q0204","cat":"bingju","section":"病句分析","bookPage":148,"key":"bingju-2--10"},{"lesson":2,"num":11,"stem":"在北京学习这半年多的时间里，我们有过不少进步。","analysis":"动态助词“过”表示的是曾经的经历，而汉语在表示经历时，句子中可以不用任何时间词(如“我去过上海。”)，也可以用比较确定的时间词语(如“去年我来过北京。”“上星期我看过一次电影。”)，还可以用时间词“以前、过去”和表示时间的副词“曾经、曾、已经”等，但是不能用表示经常性的词语或不确定的时间词如“常常、经常、每天、有时候、有一天、有一年”等。上边句子中，“我们有不少进步”是在“这半年多的时间里”，其实并不遥远，当然没有必要用表示经历的“过”，用“了”完全可以清楚地表达意思。也可以什么都不用。正确的句子应该是：","corrections":["在北京学习这半年多的时间里，我们有了不少进步。","在北京这半年多的时间里，我们有不少进步。"],"extra":[],"id":"q0205","cat":"bingju","section":"病句分析","bookPage":149,"key":"bingju-2--11"},{"lesson":2,"num":12,"stem":"这个星期我游泳过三次。","analysis":"“游泳”是离合动词，这样的词语在有“了、过”或时量补语、动量补语时，一般应该“离”，而不应该“合”。比较特殊的词语(如“注意、关心”等)除外。正确的句子应该是：","corrections":["这个星期我游过三次泳。"],"extra":["今天我游了两个小时泳。","我们见过两次面。","他结过三次婚。","你睡了几个小时觉？","他从来没有关心过我们。","我从来没有注意过你。"],"id":"q0206","cat":"bingju","section":"病句分析","bookPage":149,"key":"bingju-2--12"},{"lesson":2,"num":13,"stem":"服务员每天只给我们打扫过一次房间。","analysis":"在第(3)和第(11)个句子的分析中我们已经分析了，句子中用“每天”时，动词后边不能用“过”，如果用“过”就不应该用“每天”等词语。正确的句子应该是：","corrections":["服务员每天只给我们打扫一次房间。","服务员只给我们打扫过一次房间。"],"extra":[],"id":"q0207","cat":"bingju","section":"病句分析","bookPage":149,"key":"bingju-2--13"},{"lesson":2,"num":14,"stem":"以前我来过北京旅行一次。","analysis":"与“了”的语法要求相同，在连动句中，“过”不能用在第一个动词之后，只能用在第二个动词的后边。正确的句子应该是：","corrections":["以前我来北京旅行过一次。"],"extra":[],"id":"q0208","cat":"bingju","section":"病句分析","bookPage":149,"key":"bingju-2--14"},{"lesson":2,"num":15,"stem":"以前我知道过这件事情。","analysis":"“知道”在汉语中是一个比较特殊的动词，它本身就含有结果的意思，因此一般不带表示结果的后续成分，如“知道到、知道过”等，也不能用“没”来加以否定。上边的句子中虽然使用了“以前”，但是，“知道”后照样不能用“过”。正确的句子应该是：","corrections":["以前我知道这件事情。","以前我听说过这件事。"],"extra":[],"id":"q0209","cat":"bingju","section":"病句分析","bookPage":150,"
